services:
  learning-platform:
    build: .
    ports:
      - "8080:8080"
    environment:
      ELP_HOST: 0.0.0.0
      ELP_PORT: 8080
      ELP_COURSE_PATHS: /app/courses
      ELP_WEB_DIST: /app/web
      ELP_RUNTIME_TIMEOUT_SECONDS: 5
      ELP_MAX_RESULT_BYTES: 8388608
    volumes:
      - ./courses:/app/courses:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
