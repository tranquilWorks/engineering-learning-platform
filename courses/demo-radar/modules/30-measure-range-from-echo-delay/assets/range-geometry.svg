<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Monostatic radar round-trip range geometry</title>
  <desc id="desc">A radar sends a pulse a distance R to a target and receives it after the pulse travels distance R back.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7daeff"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="860" height="190" rx="22" fill="#101827" stroke="#2d3a52"/>
  <g fill="none" stroke="#7daeff" stroke-width="5" marker-end="url(#arrow)">
    <path d="M170 85 C340 35, 560 35, 725 85"/>
    <path d="M725 145 C550 195, 340 195, 175 145"/>
  </g>
  <g fill="#f3f6fc" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="82" width="100" height="70" rx="13" fill="#1a2840" stroke="#7daeff"/>
    <text x="120" y="113" font-size="18" font-weight="700">RADAR</text>
    <text x="120" y="136" font-size="13" fill="#9aa8bf">TX + RX</text>
    <path d="M760 82 L810 117 L760 152 Z" fill="#293752" stroke="#a98dff" stroke-width="3"/>
    <text x="785" y="180" font-size="15">TARGET</text>
    <text x="448" y="58" font-size="16" fill="#bdc7db">outbound distance R</text>
    <text x="448" y="196" font-size="16" fill="#bdc7db">return distance R</text>
    <text x="450" y="121" font-size="22" font-weight="700">cτ = 2R</text>
    <text x="450" y="147" font-size="17" fill="#7daeff">R = cτ / 2</text>
  </g>
</svg>
