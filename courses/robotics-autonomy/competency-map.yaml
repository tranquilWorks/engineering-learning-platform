  evidence: Factor residual, gauge handling, robust loop closure, smoothing, map consistency, and held-out
    alignment checks.
- id: A-PLANNING
  type: cumulative
  competency_ids:
  - GLOBAL-MOTION-PLANNING
  - LOCAL-KINODYNAMIC-PLANNING
  evidence: Completeness boundary, collision clearance, cost improvement, dynamic feasibility, prediction,
    and fallback checks.
- id: A-AUTONOMY
  type: cumulative
  competency_ids:
  - TASK-AUTONOMY
  evidence: Behavior, state, task-and-motion, multi-agent contract, failure propagation, and recovery
    evidence.
- id: A-MANIPULATION
  type: cumulative
  competency_ids:
  - MANIPULATION
  evidence: Force closure, pose uncertainty, reachability, collision, contact, grasp, placement, and recovery
    evidence.
- id: A-SAFETY
  type: cumulative
  competency_ids:
  - REALTIME-SAFETY
  evidence: Timing, data age, monitor coverage, bounded fallback, fault injection, pass/fail, and non-certification
    boundaries.
