count_derivation:
  planned_module_count: 69
  source: len(modules)
  rationale: The retained 24-item source-bound arc is deepened in place. Forty-five additions are the
    smallest reviewed set that gives every issue-440 competency a distinct executable model, preserves
    prerequisite separation across seven coherent expansion batches, and provides both mobile-autonomy
    and manipulation capstones. The result is intentionally not normalized to DSP/Radar's 84 or Controls/GNC's
    68.
