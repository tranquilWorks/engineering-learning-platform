assessments:
- id: A-GEOMETRY
  type: cumulative
  competency_ids:
  - RIGID-BODY-GEOMETRY
  - MOBILE-KINEMATICS
  evidence: Frame round trips, group closure, adjoint duality, constraint residuals, and convention checks.
- id: A-KINEMATICS
  type: cumulative
  competency_ids:
  - MANIPULATOR-KINEMATICS
  evidence: Forward/inverse residuals, branch choices, Jacobian finite differences, singular values, and
    null-space invariants.
- id: A-DYNAMICS
  type: cumulative
  competency_ids:
  - ROBOT-DYNAMICS
  evidence: Energy, symmetry, skew-property, statics, inverse-dynamics residual, identification, and underactuation
    checks.
- id: A-CONTROL
  type: cumulative
  competency_ids:
  - ACTUATION-JOINT-CONTROL
  - PHYSICAL-INTERACTION
  evidence: Tracking, effort, gravity, interaction energy, force error, passivity, delay, saturation,
    and recovery checks.
- id: A-PERCEPTION
  type: cumulative
  competency_ids:
  - VISION-PERCEPTION
  - RANGE-PERCEPTION
  - SENSOR-MODELING-CALIBRATION
  evidence: Projection, reprojection, distortion, repeatability, inlier, depth, pose, occupancy, and registration
    residuals.
- id: A-ESTIMATION
  type: cumulative
  competency_ids:
