evidence_plan:
- claim_id: CLAIM-P01-P24-DEPTH
  origin: alternative_algorithm
  independent: true
  method: Retain the source-bound independent references and scenario evidence while adding reviewed derivations,
    conventions, limiting comparisons, practical failures, formative checks, and cross-course boundaries.
  tolerance: Per-module absolute and scale-aware relative tolerances retained in the source conversion
