schema_version: 1
course:
  id: robotics-autonomy
  title: Robotics and Autonomy Laboratory
  authority: tranquilWorks/portfolio-control#440
  baseline: ce2c130fd25571913f427d5ae3ad5d6c1b64e585
scope:
  target_learners:
  - Engineers or graduate students with calculus, linear algebra, differential equations, probability fundamentals, feedback
    basics, and Python literacy.
  prerequisites:
  - Vectors, matrices, eigenvalues, numerical integration, gradients, probability distributions, and elementary feedback.
  - Ability to read Python and interpret trajectories, images, maps, covariance, timing, and force/motion plots.
  outcomes:
  - Represent mobile and articulated robots with explicit configuration, frame, twist, wrench, kinematic, dynamic, and actuation
    conventions.
  - Design and diagnose joint, task, inverse-dynamics, operational-space, impedance, admittance, force, and underactuated
    controllers.
  - Build camera/range perception, calibration, state-estimation, registration, factor-graph SLAM, loop-closure, and map-audit
    pipelines.
  - Plan and replan geometric, sampling-based, optimized, kinodynamic, task-and-motion, manipulation, and multi-agent behavior
    with bounded fallback.
  - Integrate perception, estimation, planning, control, timing, safety, logging, replay, faults, and recovery in two cumulative
    software capstones.
  exclusions:
  - General feedback, state-space, optimal-control, navigation-filter, and guidance theory belongs to Controls/GNC; Robotics
    applies those tools to robot embodiments and autonomy stacks.
  - Deep learning architectures, training infrastructure, dataset governance, and foundation-model robotics are outside this
    classical, deterministic computational boundary.
  - Detailed vehicle tire/aero dynamics belongs to Vehicle Dynamics; detailed circuit/power electronics belongs to Power Electronics
    and Embedded Systems.
  - Production ROS 2 middleware administration, DDS security, cloud fleet operations, and vendor driver qualification are
    interface handoffs rather than claimed competencies.
  - Physical HIL, hardware operation, safety certification, production deployment, MATLAB runtime equivalence, accessibility
    validation, and learner-effectiveness validation are not claimed.
  cross_course_handoffs:
  - 'controls-gnc-learning: general stability, loop shaping, state feedback, optimal control, stochastic estimation, navigation,
    and guidance foundations.'
  - 'dsp-radar-learning: sampled signals, spectral analysis, detection, estimation, arrays, radar propagation, and sensor-signal
    depth.'
  - 'vehicle-dynamics-learning: tire, road-load, handling, ride, braking, powertrain, and ground-vehicle-specific control
    depth.'
  - 'embedded-rt-hil-learning and hwil-systems-learning: target scheduling, buses, drivers, benches, physical I/O, and qualification.'
  - 'computer-vision/deep-learning curricula: learning-based perception, training, dataset shift, and model lifecycle beyond
    the classical vision pipeline here.'
