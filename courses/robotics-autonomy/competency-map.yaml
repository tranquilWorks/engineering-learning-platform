assessments:
- id: A-GEOMETRY
  type: cumulative
  competency_ids:
  - RIGID-BODY-GEOMETRY
  - MOBILE-KINEMATICS
  evidence: Frame round trips, group closure, adjoint duality, constraint residuals, and convention checks.
- id: A-KINEMATICS
  type: cumulative
  competency_ids:
  - MANIPULATOR-KINEMATICS
  evidence: Forward/inverse residuals, branch choices, Jacobian finite differences, singular values, and null-space invariants.
- id: A-DYNAMICS
  type: cumulative
  competency_ids:
  - ROBOT-DYNAMICS
  evidence: Energy, symmetry, skew-property, statics, inverse-dynamics residual, identification, and underactuation checks.
- id: A-CONTROL
  type: cumulative
  competency_ids:
  - ACTUATION-JOINT-CONTROL
  - PHYSICAL-INTERACTION
  evidence: Tracking, effort, gravity, interaction energy, force error, passivity, delay, saturation, and recovery checks.
- id: A-PERCEPTION
  type: cumulative
  competency_ids:
  - VISION-PERCEPTION
  - RANGE-PERCEPTION
  - SENSOR-MODELING-CALIBRATION
  evidence: Projection, reprojection, distortion, repeatability, inlier, depth, pose, occupancy, and registration residuals.
- id: A-ESTIMATION
  type: cumulative
  competency_ids:
  - STATE-ESTIMATION
  evidence: Covariance, innovation, gate, particle, observability, multi-rate, and consistency evidence.
- id: A-SLAM
  type: cumulative
  competency_ids:
  - SLAM-MAPPING
  evidence: Factor residual, gauge handling, robust loop closure, smoothing, map consistency, and held-out alignment checks.
- id: A-PLANNING
  type: cumulative
  competency_ids:
  - GLOBAL-MOTION-PLANNING
  - LOCAL-KINODYNAMIC-PLANNING
  evidence: Completeness boundary, collision clearance, cost improvement, dynamic feasibility, prediction, and fallback checks.
- id: A-AUTONOMY
  type: cumulative
  competency_ids:
  - TASK-AUTONOMY
  evidence: Behavior, state, task-and-motion, multi-agent contract, failure propagation, and recovery evidence.
- id: A-MANIPULATION
  type: cumulative
  competency_ids:
  - MANIPULATION
  evidence: Force closure, pose uncertainty, reachability, collision, contact, grasp, placement, and recovery evidence.
- id: A-SAFETY
  type: cumulative
  competency_ids:
  - REALTIME-SAFETY
  evidence: Timing, data age, monitor coverage, bounded fallback, fault injection, pass/fail, and non-certification boundaries.
- id: A-CAP-MOBILE
  type: capstone
  competency_ids:
  - SYSTEM-INTEGRATION
  - SLAM-MAPPING
  - LOCAL-KINODYNAMIC-PLANNING
  evidence: Reused perception, mapping, localization, replanning, local avoidance, monitoring, replay, and recovery artifacts.
- id: A-CAP-MANIP
  type: capstone
  competency_ids:
  - SYSTEM-INTEGRATION
  - MANIPULATION
  - PHYSICAL-INTERACTION
  evidence: Reused camera, pose, grasp, kinematics, dynamics, contact, control, timing, and recovery artifacts.
capstones:
- id: CAP-MOBILE-AUTONOMY
  module_ids:
  - P68
  competency_ids:
  - SYSTEM-INTEGRATION
  - SLAM-MAPPING
  - LOCAL-KINODYNAMIC-PLANNING
