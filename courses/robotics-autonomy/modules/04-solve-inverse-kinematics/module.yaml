schema_version: 1
id: 04-solve-inverse-kinematics
number: 4
title: Solve Inverse Kinematics
summary: Solve both geometric branches of planar two-link inverse kinematics and expose reachability.
guiding_question: What inputs, observable effects, and failure modes matter when you solve Inverse Kinematics?
status: implemented
tags:
- robotics-autonomy
- kinematics
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
