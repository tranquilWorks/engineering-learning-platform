- id: target_y_m
  type: slider
  label: Target y
  default: 0.4
  unit: m
  minimum: -1.5
  maximum: 1.5
  step: 0.05
- id: link1_m
  type: slider
  label: Link 1 length
  default: 0.8
  unit: m
  minimum: 0.2
  maximum: 1.2
  step: 0.05
- id: link2_m
  type: slider
  label: Link 2 length
  default: 0.7
  unit: m
  minimum: 0.2
  maximum: 1.2
  step: 0.05
- id: elbow_up
  type: toggle
  label: Use elbow-up branch
  default: false
- id: broken_mode
