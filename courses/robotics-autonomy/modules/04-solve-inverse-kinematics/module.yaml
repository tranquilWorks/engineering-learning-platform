  label: Omit shoulder correction
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A reachable target generally has two mirror-image elbow branches with the same tool position.
  reveal: Disable the omitted-shoulder-correction mode and include the link-triangle angle in the shoulder solution.
