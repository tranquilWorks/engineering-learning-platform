schema_version: 1
id: 40-swing-up-and-balance-an-underactuated-robot
number: 40
title: Swing Up and Balance an Underactuated Robot
summary: Build a deterministic numerical laboratory to swing up and balance an underactuated robot, expose its governing
  relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make swing up and balance an underactuated robot defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: energy_gain_per_s
  type: slider
  label: Energy-shaping gain
  default: 1.4
  minimum: 0.1
  maximum: 4.0
  step: 0.1
  unit: 1/s
- id: torque_limit_n_m
  type: slider
  label: Actuator torque limit
  default: 2.2
  minimum: 0.2
  maximum: 6.0
  step: 0.1
  unit: N*m
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Energy shaping must add energy below the upright target, remove it above target, and hand off to balancing
    only inside a reachable capture region.
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
