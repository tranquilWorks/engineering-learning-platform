schema_version: 1
id: 40-swing-up-and-balance-an-underactuated-robot
number: 40
title: Swing Up and Capture a Reaction-Wheel Pendulum
summary: Swing up and attempt to balance a two-coordinate reaction-wheel pendulum with one internal motor torque.
  Retain actual capture or no-capture outcomes and explicit unregulated wheel limits.
guiding_question: What makes this plant underactuated, and why is a captured body insufficient to claim a practical
  balanced robot?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: energy_gain_per_s
  type: slider
  label: Energy-shaping gain
  default: 1.4
  minimum: 0.1
  maximum: 4.0
  step: 0.1
  unit: 1/s
- id: torque_limit_n_m
  type: slider
  label: Actuator torque limit
  default: 2.2
  minimum: 0.2
  maximum: 6.0
  step: 0.1
  unit: N*m
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict why reversing the energy-pumping sign prevents the default pendulum from reaching the capture
    region.
  reveal: Two rotational coordinates share one equal-and-opposite internal motor torque. Capturing the body
    can leave substantial wheel motion; the model lacks wheel-speed and momentum limits, so body tracking alone
    cannot establish actuator feasibility.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
- type: markdown
  title: Course checkpoint
  source: assessment.md
