governing_equations:
- n=[-sin(theta),cos(theta)]; t=[cos(theta),sin(theta)]
- P_force=n n^T; P_motion=I-P_force
- F=600 max(n^T x,0); xdot=P_motion(v_t+5(x_goal-x))+n*0.012(F_goal-F)
signature:
- field: force_error
  unit: N
- field: motion_leakage
  unit: m/s
- field: selection_frame_error
  unit: '1'
teaching_invariant: Predict whether two perfectly orthogonal projectors can still be wrong for a tilted contact
  surface.
limiting_cases:
- At zero surface angle world vertical and the physical normal coincide, so both modes agree.
- At zero force goal the unilateral contact may open in faulty mode. This ideal velocity-servo example omits
  impacts, robot inertia, sensor delay and actuator constraints.
