- type: prediction
  title: Predict before running
  text: Predict whether two perfectly orthogonal projectors can still be wrong for a tilted contact surface.
  reveal: Orthogonality describes the relation between the two chosen subspaces, not their alignment with the
    environment. World-axis projectors are internally orthogonal but mix real normal and tangential directions
    on a tilted surface.
