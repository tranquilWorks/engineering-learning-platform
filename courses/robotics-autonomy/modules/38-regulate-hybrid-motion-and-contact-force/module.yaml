  unit: deg
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Hybrid control must assign complementary motion and force subspaces so normal force regulation does not
