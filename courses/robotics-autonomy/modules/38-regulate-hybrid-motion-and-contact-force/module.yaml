number: 38
title: Regulate Tangential Motion and Normal Contact Force
summary: The normal force comes from actual spring penetration. Both projector pairs remain orthogonal; the
  failure is their alignment with the physical surface, measured separately.
guiding_question: How can the projector algebra pass while hybrid motion and force regulation is still wrong?
