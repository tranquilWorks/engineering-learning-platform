schema_version: 1
id: 38-regulate-hybrid-motion-and-contact-force
number: 38
title: Regulate Hybrid Motion and Contact Force
summary: Build a deterministic numerical laboratory to regulate hybrid motion and contact force, expose its governing
  relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make regulate hybrid motion and contact force defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
