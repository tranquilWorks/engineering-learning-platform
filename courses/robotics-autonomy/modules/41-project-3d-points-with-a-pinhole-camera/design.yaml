schema_version: 1
item_id: P41
module: 41-project-3d-points-with-a-pinhole-camera
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- p_camera=R^T(p_world-camera_origin)
- u=f X/Z; v=f Y/Z, accepted only when Z>0.05 m
- depth_sensitivity=f sqrt(X²+Y²)/Z²
signature:
- field: image_radius
  unit: px
- field: depth_sensitivity
  unit: px/m
- field: behind_camera_count
  unit: count
teaching_invariant: Predict why a positive world height is insufficient to decide whether a point lies in front
  of a rotated camera.
limiting_cases:
- At an empty accepted set, zero-valued projection summaries are unavailable sentinels, not visible on-axis
  points.
- A far cloud may hide the faulty visibility count while retaining wrong pixels. The model excludes lens distortion,
  occlusion, image bounds, calibration uncertainty and camera noise.
scenarios:
