- type: prediction
  title: Predict before running
  text: Predict why a positive world height is insufficient to decide whether a point lies in front of a rotated
    camera.
  reveal: All points may genuinely lie in front of the camera while the omitted translation and rotation still
    change their ray directions and pixels. Visibility is only one condition; coordinate transformation and
    reprojection agreement must also be checked.
