number: 41
title: Transform and Project Points Through a Pinhole Camera
summary: 70 of 121 selected points are accepted; 0 accepted rays violate the physical camera near plane. A
  zero pixel metric with no accepted rays means unavailable projection, not perfect accuracy.
guiding_question: Why can the faulty projection report zero invalid accepted rays and still be wrong?
