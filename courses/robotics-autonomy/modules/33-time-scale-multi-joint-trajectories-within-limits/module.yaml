schema_version: 1
id: 33-time-scale-multi-joint-trajectories-within-limits
number: 33
title: Time-Scale Two Joint Cubics Under Speed and Acceleration Limits
summary: The minimum duration is within the declared rest-to-rest cubic family, using both the exact 1.5 velocity
  peak and the 6/T² acceleration peak. It is not a global time-optimal trajectory.
guiding_question: Why can increasing the allowed speed cease to shorten the move?
status: implemented
