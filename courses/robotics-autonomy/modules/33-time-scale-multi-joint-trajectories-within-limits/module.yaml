- type: prediction
  title: Predict before running
  text: Predict why distance divided by the speed limit is too short for a rest-to-rest cubic trajectory.
  reveal: The acceleration requirement then sets the shared duration. For the fixed cubic, speed scales as
    1/T while acceleration scales as 1/T²; both constraints must be satisfied, and the larger required time
    wins.
