schema_version: 1
id: 36-control-motion-in-operational-space
number: 36
title: Control Motion in Operational Space
summary: Build a deterministic numerical laboratory to control motion in operational space, expose its governing
  relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make control motion in operational space defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: task_inertia_kg
  type: slider
  label: Task-space inertia
  default: 2.0
  minimum: 0.3
  maximum: 8.0
  step: 0.1
  unit: kg
- id: jacobian_condition
  type: slider
  label: Jacobian condition
  default: 5.0
  minimum: 1.0
  maximum: 30.0
  step: 1.0
  unit: '1'
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Operational-space control must use dynamically consistent task inertia and a null torque that does not disturb
    the commanded task.
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
