- type: prediction
  title: Predict before running
  text: Predict whether a torque in the Euclidean null space of J necessarily produces zero task acceleration.
  reveal: Torque is converted to joint acceleration through M inverse. At zero velocity the task effect is
    J M inverse tau_secondary, so a torque projector must cancel that quantity. The Euclidean null condition
    applies directly to joint velocity, not arbitrary torque.
