schema_version: 1
id: 36-control-motion-in-operational-space
number: 36
title: Compute Operational Inertia and Dynamically Consistent Torque
summary: This local zero-velocity calculation uses physical link mass/inertia and actual J M⁻¹ τ. The geometry
  control determines elbow configuration; the measured Jacobian condition is 14.060. Gravity is assumed exactly
  compensated.
guiding_question: Why is J times secondary torque equal to zero the wrong condition for preserving task acceleration?
