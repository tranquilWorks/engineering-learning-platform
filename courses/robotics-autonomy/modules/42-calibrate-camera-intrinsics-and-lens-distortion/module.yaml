schema_version: 1
id: 42-calibrate-camera-intrinsics-and-lens-distortion
number: 42
title: Fit Camera Intrinsics with Known Calibration Poses
summary: Fit focal length, principal point and radial distortion from known board poses, then test independent
  held-out projections.
guiding_question: Why can a low training error and an apparently sensible focal length still fail to establish
  a calibrated camera?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: radial_k1
  type: slider
  label: Radial distortion k1
  default: -0.18
  minimum: -0.5
  maximum: 0.3
  step: 0.02
  unit: '1'
- id: calibration_views
  type: slider
  label: Known board poses
  default: 18.0
  minimum: 4.0
  maximum: 60.0
  step: 1.0
  unit: count
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict whether adding more board views can eliminate held-out bias when the fitted model omits real
    radial distortion.
  reveal: An omitted radial term can be absorbed partly into focal length and principal point over the training
    geometry. Held-out rays, especially away from the optical centre, reveal the wrong spatial dependence;
    rank and coverage must also be checked.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
