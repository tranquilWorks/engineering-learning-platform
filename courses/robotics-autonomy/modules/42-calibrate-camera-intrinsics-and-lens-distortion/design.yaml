schema_version: 1
item_id: P42
module: 42-calibrate-camera-intrinsics-and-lens-distortion
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- u=f x+f k1 x(x²+y²)+cx; v=f y+f k1 y(x²+y²)+cy
- beta=[f,f*k1,cx,cy]; beta_hat=argmin ||A beta-pixels||²
- heldout_RMS=sqrt(mean(||predicted_pixel-true_pixel||²))
signature:
- field: heldout_reprojection_rms
  unit: px
- field: focal_bias_percent
  unit: '%'
- field: outer_reprojection_rms
  unit: px
teaching_invariant: Predict whether adding more board views can eliminate held-out bias when the fitted model
  omits real radial distortion.
limiting_cases:
- Known board poses and coordinates are exact; this does not perform joint pose/intrinsic calibration, feature
  extraction or real lens calibration.
- At zero radial distortion the omitted-column fault may be hidden. Deterministic noise, finite pose coverage,
  and conditioning limit generalization; more views do not guarantee monotonically smaller error.
scenarios:
  baseline: &id001
    radial_k1: -0.18
    calibration_views: 18.0
    broken_mode: false
  sweep_1:
    radial_k1: 0.3
    calibration_views: 18.0
    broken_mode: false
  sweep_2:
    radial_k1: -0.18
    calibration_views: 60.0
    broken_mode: false
  broken:
