schema_version: 1
id: 50-associate-measurements-with-gating-and-robust-losses
number: 50
title: Associate Measurements with Gating and Robust Losses
summary: Whiten innovations, gate incompatible candidates, and apply a Huber loss only after association so one outlier
  cannot commandeer the state update.
guiding_question: Why are covariance gating and robust loss complementary defenses rather than interchangeable tuning
  knobs?
status: implemented
tags:
- robotics-autonomy
- native-python
- slam
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: gate_sigma
  type: slider
  label: Association gate
  default: 3.0
  minimum: 0.5
  maximum: 8.0
  step: 0.1
  unit: sigma
- id: outlier_sigma
  type: slider
  label: Outlier magnitude
  default: 5.0
  minimum: 0.5
  maximum: 12.0
  step: 0.1
  unit: sigma
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Association must gate with predicted uncertainty before a robust loss limits the influence of accepted residuals.
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
