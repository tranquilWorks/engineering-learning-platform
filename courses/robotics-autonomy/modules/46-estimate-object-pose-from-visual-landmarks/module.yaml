schema_version: 1
id: 46-estimate-object-pose-from-visual-landmarks
number: 46
title: Solve a Local Six-Degree-of-Freedom Landmark Pose
summary: Solve a local six-degree-of-freedom pose from projected 3D landmarks with explicit calibration and
  convergence assumptions.
guiding_question: Why can a low pixel residual coexist with a biased translation estimate?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: landmark_noise_px
  type: slider
  label: Deterministic pixel-noise amplitude
  default: 1.2
  minimum: 0.0
  maximum: 8.0
  step: 0.2
  unit: px
- id: visible_landmarks
  type: slider
  label: Visible landmarks
  default: 12.0
  minimum: 4.0
  maximum: 40.0
  step: 1.0
  unit: count
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict whether more visible landmarks can repair a focal-calibration error, and distinguish residual
    fit from actual pose accuracy.
  reveal: Pose can compensate partly for incorrect focal calibration, and noisy data are fitted within the
    assumed model. Residual consistency is different from agreement with independent metric truth; inspect
    calibration, geometry and the full transform.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
- type: markdown
  title: Course checkpoint
  source: assessment.md
