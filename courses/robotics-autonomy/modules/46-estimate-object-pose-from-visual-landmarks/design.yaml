schema_version: 1
item_id: P46
module: 46-estimate-object-pose-from-visual-landmarks
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- pixel_i=project(R*landmark_i+t); R in SO(3), t in metres
- delta=argmin ||J*delta+pixel_residual||²
- R_next=exp([delta_rotation]x)*R; t_next=t+delta_translation
signature:
- field: translation_error
  unit: m
- field: rotation_error
  unit: deg
- field: reprojection_rms
  unit: px
teaching_invariant: Predict whether more visible landmarks can repair a focal-calibration error, and distinguish
  residual fit from actual pose accuracy.
limiting_cases:
- This solves a local six-degree-of-freedom pose from a near initializer and a synthetic noncoplanar object;
  it makes no global PnP uniqueness or arbitrary-initialization claim.
- The noise sequence is deterministic, visible points are selected by a fixed rule, and solver budget or stalling
  status remains meaningful even when two independent estimates agree closely.
scenarios:
  baseline: &id001
    landmark_noise_px: 1.2
    visible_landmarks: 12.0
    broken_mode: false
  sweep_1:
    landmark_noise_px: 8.0
    visible_landmarks: 12.0
    broken_mode: false
  sweep_2:
    landmark_noise_px: 1.2
    visible_landmarks: 40.0
    broken_mode: false
  broken:
    landmark_noise_px: 1.2
    visible_landmarks: 12.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
