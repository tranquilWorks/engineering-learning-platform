module: 46-estimate-object-pose-from-visual-landmarks
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- z_i=pi(K T_co X_i)
- min_T sum rho(||z_i-pi(T X_i)||^2)
- T in SE(3)
signature:
- field: translation_error
  unit: m
- field: rotation_error
  unit: deg
- field: inlier_count
  unit: count
teaching_invariant: Pose estimation must keep the solution on SE(3), use nondegenerate landmarks, and report geometric
  residuals plus inlier support.
limiting_cases:
- With exact nondegenerate landmarks and calibration, pose residual tends to zero.
- Four coplanar points can support planar pose but weak depth geometry increases ambiguity.
scenarios:
  baseline: &id001
    landmark_noise_px: 1.2
