teaching_invariant: A full-rank grasp is force closing only when its friction-cone wrench generators also admit a strictly positive self-equilibrating combination.
limiting_cases:
- Zero friction collapses each contact cone to a normal ray and removes the tangential moment authority needed for planar force closure.
- Perfect antipodal contacts make the positive equilibrium symmetric, while large angular misalignment reduces the smallest positive coefficient.
