schema_version: 1
item_id: P52
module: 52-detect-loop-closures-and-reject-false-matches
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- objective=0.5*sum(||position_j-position_i-odometry_ij||²/sigma_odom²)+score*Huber(||closure_residual||/sigma_closure)
- Huber_weight=min(1,delta/||closure_residual||)
- position_0=[0,0]; appearance>=0.70 and innovation<=0.30 m admit a normal loop
signature:
- field: closure_influence
  unit: '1'
- field: graph_objective
  unit: '1'
- field: maximum_map_shift
  unit: m
teaching_invariant: Predict whether a high appearance score is enough to justify moving a map, and distinguish
  rejecting a loop from reducing the influence of an accepted loop.
limiting_cases:
- This is an anchored two-dimensional translation graph with an externally supplied appearance score, not full
  rotational SLAM or image-based loop recognition.
- Rejected factors and zero innovation leave the baseline unchanged. A robust loss limits damage but does not
  prove that an accepted factor identifies the correct physical place.
scenarios:
  baseline: &id001
    descriptor_score: 0.78
    geometric_residual_m: 0.12
    broken_mode: false
  sweep_1:
    descriptor_score: 1.0
    geometric_residual_m: 0.12
    broken_mode: false
  sweep_2:
    descriptor_score: 0.78
    geometric_residual_m: 2.0
    broken_mode: false
  broken:
    descriptor_score: 0.78
    geometric_residual_m: 0.12
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
