number: 52
title: Gate a Loop Candidate and Optimize an Anchored Position Graph
summary: Gate a loop candidate and solve an anchored translation graph with robust or quadratic factor influence.
guiding_question: Why are geometric rejection and a robust loss complementary rather than interchangeable?
