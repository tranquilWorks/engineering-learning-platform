schema_version: 1
id: 52-detect-loop-closures-and-reject-false-matches
number: 52
title: Detect Loop Closures and Reject False Matches
summary: Separate appearance-based place proposals from geometric verification, then bound the influence of the accepted
  closure factor before it can deform the map.
guiding_question: What independent evidence is required before a visually plausible revisit is allowed to constrain the
  pose graph?
status: implemented
tags:
- robotics-autonomy
- native-python
- slam
