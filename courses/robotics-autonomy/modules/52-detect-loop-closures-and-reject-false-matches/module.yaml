  label: Loop descriptor score
  default: 0.78
  minimum: 0.0
  maximum: 1.0
  step: 0.02
  unit: '1'
- id: geometric_residual_m
  type: slider
  label: Geometric residual
  default: 0.12
  minimum: 0.0
  maximum: 2.0
  step: 0.02
  unit: m
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
