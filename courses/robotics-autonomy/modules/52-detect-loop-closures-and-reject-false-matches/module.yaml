blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict whether a high appearance score is enough to justify moving a map, and distinguish rejecting
    a loop from reducing the influence of an accepted loop.
  reveal: A gate decides whether a factor enters the graph at all; a robust loss controls how an inserted factor
    influences the fitted states. Neither alone proves place identity, and a high appearance score cannot replace
    geometric consistency.
