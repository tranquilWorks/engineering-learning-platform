schema_version: 1
id: 44-reject-outliers-in-visual-correspondences
number: 44
title: Fit Translation Consensus from Corrupted Image Matches
summary: Fit and refit actual translation consensuses while inspecting residual support and false acceptance.
guiding_question: Why is a large consensus insufficient to prove that the recovered image motion is correct?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: outlier_fraction
  type: slider
  label: Match outlier fraction
  default: 0.35
  minimum: 0.0
  maximum: 0.85
  step: 0.05
  unit: '1'
- id: ransac_threshold_px
  type: slider
  label: Consensus threshold
  default: 2.0
  minimum: 0.3
  maximum: 8.0
  step: 0.1
  unit: px
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict why a low average residual over selected correspondences is insufficient without checking support
    and known synthetic model error.
  reveal: A wrong but coherent group can be larger than the genuine group, and an overly broad threshold can
    count incompatible displacements as support. Inspect the model family, residuals and independent truth
    or validation, not just the accepted fraction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
- type: markdown
  title: Course checkpoint
  source: assessment.md
