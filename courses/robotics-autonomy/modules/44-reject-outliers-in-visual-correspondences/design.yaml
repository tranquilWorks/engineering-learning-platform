schema_version: 1
item_id: P44
module: 44-reject-outliers-in-visual-correspondences
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- displacement_i=target_i-source_i; residual_i=||displacement_i-t_hat||
- 'consensus(t)={i: residual_i<=threshold}; t_refit=mean(displacement_consensus)'
- false_acceptance=accepted_true_outliers/true_outlier_count
signature:
- field: accepted_fraction
  unit: '1'
- field: translation_error
  unit: px
- field: false_acceptance
  unit: '1'
teaching_invariant: Predict why a low average residual over selected correspondences is insufficient without
  checking support and known synthetic model error.
limiting_cases:
- The fitted motion is a two-dimensional translation and the search is exhaustive, not random RANSAC or general
  epipolar estimation.
- Zero outliers can hide the selection fault. Coherent wrong clusters, model mismatch and threshold choice
  can defeat consensus; the synthetic contamination fraction alone does not define a guarantee.
scenarios:
  baseline: &id001
    outlier_fraction: 0.35
    ransac_threshold_px: 2.0
    broken_mode: false
  sweep_1:
    outlier_fraction: 0.85
    ransac_threshold_px: 2.0
    broken_mode: false
  sweep_2:
    outlier_fraction: 0.35
    ransac_threshold_px: 8.0
    broken_mode: false
  broken:
    outlier_fraction: 0.35
    ransac_threshold_px: 2.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
