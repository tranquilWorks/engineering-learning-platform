schema_version: 1
item_id: P44
module: 44-reject-outliers-in-visual-correspondences
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- N=log(1-p)/log(1-w^s)
- r_i=distance(z_i,model)
- inlier iff r_i<t
signature:
- field: inlier_ratio
  unit: '1'
- field: model_error
  unit: px
- field: false_acceptance
  unit: '1'
teaching_invariant: Robust correspondence fitting must recover a consensus model from the declared inlier ratio
  and verify it on residuals not used to hypothesize the model.
limiting_cases:
- At zero outliers, robust and ordinary least squares agree in the noiseless limit.
- As the inlier ratio falls, required RANSAC trials grow rapidly.
scenarios:
  baseline: &id001
    outlier_fraction: 0.35
    ransac_threshold_px: 2.0
    broken_mode: false
  sweep_1:
    outlier_fraction: 0.85
    ransac_threshold_px: 2.0
    broken_mode: false
  sweep_2:
    outlier_fraction: 0.35
    ransac_threshold_px: 8.0
    broken_mode: false
  broken:
    outlier_fraction: 0.35
    ransac_threshold_px: 2.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic Python software evidence only; no MATLAB runtime, learner, browser/accessibility,
  physical HIL/hardware, certification, release, deployment, or production claim.
