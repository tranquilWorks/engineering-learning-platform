schema_version: 1
id: 35-apply-computed-torque-and-gravity-compensation
number: 35
title: Integrate Computed Torque with Gravity Error and Saturation
summary: The plant integrates coupled inertia, Coriolis and gravity dynamics. Selected model error scales the
  controller model; actual torques saturate at ±20 N·m. Nominal error dynamics apply only without mismatch
  or saturation.
guiding_question: Why can exact parameters still fail to produce the nominal critically damped tracking error?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
