blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict why increasing feedback bandwidth may not reduce tracking error when requested torques exceed
    actuator limits.
  reveal: The derivation assumes the requested torque reaches the plant. Clipping changes that input and leaves
    an uncompensated acceleration. Compare requested and applied torque along the actual trajectory before
    applying the linear error equation.
