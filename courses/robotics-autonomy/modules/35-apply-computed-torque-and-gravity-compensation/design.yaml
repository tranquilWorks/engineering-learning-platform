limiting_cases:
- At zero mismatch and without saturation, computed torque yields the derived linear error equation.
- At a pose with zero gravity contribution the sign fault is locally hidden; along a trajectory it can reappear.
  Torque clipping invalidates exact cancellation even with an otherwise correct model.
