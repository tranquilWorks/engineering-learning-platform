schema_version: 1
id: 53-smooth-trajectories-and-audit-map-consistency
number: 53
title: Smooth Trajectories and Audit Map Consistency
summary: Run a constant-velocity Kalman filter and Rauch-Tung-Striebel backward pass, propagate covariance, and test the
  result against withheld absolute-position fixes.
guiding_question: How can a smoother lower trajectory error while still failing a covariance or held-out map-consistency
  audit?
status: implemented
