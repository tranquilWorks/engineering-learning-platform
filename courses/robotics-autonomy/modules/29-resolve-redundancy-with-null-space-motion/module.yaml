schema_version: 1
id: 29-resolve-redundancy-with-null-space-motion
number: 29
title: Separate Damped Task Motion from Exact Null-Space Motion
summary: A damped primary inverse and an exact Moore-Penrose null projector have different roles. Normal secondary
  posture velocity has negligible task leakage; bypassing the projector changes the actual task velocity. This
  is an instantaneous calculation at one configuration, not integrated motion or a joint-limit guarantee.
guiding_question: Why can the total task residual be nonzero while secondary leakage is essentially zero?
