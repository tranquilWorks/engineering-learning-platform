- type: prediction
  title: Predict before running
  text: Predict whether primary damping requires secondary posture motion to leak into the task when an exact
    null projector is used.
  reveal: The damped primary inverse trades tracking accuracy against joint speed. An exact null projector
    preserves that primary task velocity when posture motion is added; it does not undo the original damping
    residual.
