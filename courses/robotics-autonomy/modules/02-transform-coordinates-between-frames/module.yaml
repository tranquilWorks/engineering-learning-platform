schema_version: 1
id: 02-transform-coordinates-between-frames
number: 2
title: Transform Coordinates Between Frames
summary: Apply and invert a planar rigid transform while making frame order and angle units visible.
guiding_question: What inputs, observable effects, and failure modes matter when you transform Coordinates Between Frames?
status: implemented
tags:
- robotics-autonomy
- kinematics
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: heading_deg
  type: slider
  label: Robot heading
  default: 30
  unit: deg
  minimum: -180
  maximum: 180
  step: 5
- id: robot_x_m
  type: slider
  label: Robot world x
  default: 0.5
  unit: m
  minimum: -2
  maximum: 2
  step: 0.1
- id: robot_y_m
  type: slider
  label: Robot world y
  default: -0.25
  unit: m
  minimum: -2
  maximum: 2
  step: 0.1
- id: point_x_m
  type: slider
  label: Point body x
  default: 1.2
  unit: m
  minimum: -3
  maximum: 3
  step: 0.1
- id: point_y_m
  type: slider
  label: Point body y
  default: 0.4
  unit: m
  minimum: -3
  maximum: 3
  step: 0.1
- id: broken_mode
  type: toggle
  label: Reverse the rotation sign
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A positive heading rotates body +x toward world +y before the robot-origin translation is added.
  reveal: Disable the reversed-rotation mode and use one declared body-to-world rotation convention in both directions.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Physical response and diagnostic
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery

