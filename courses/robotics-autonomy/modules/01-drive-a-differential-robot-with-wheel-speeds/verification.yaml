  "learning": {
    "guiding_question": "How do left and right wheel speeds determine a differential-drive robot's path?",
    "equations": [
      {
        "latex": "v=r(omega_R+omega_L)/2",
        "meaning": "Mean rim speed sets body-forward velocity."
      },
      {
        "latex": "Omega=r(omega_R-omega_L)/b",
        "meaning": "Differential rim speed sets yaw rate."
      }
    ],
    "coordinate_and_sign_convention": "World +x is the initial forward direction, +y is left, and positive yaw is counterclockwise.",
    "units": [
      "wheel speed: rad/s",
      "length: m",
      "body speed: m/s",
      "yaw rate: rad/s"
    ],
    "sweeps": [
      {
        "control": "left_wheel_rad_s",
        "values": [
          -6,
          6,
          12
        ],
        "expected_observation": "Average and difference create spin, arc, and reversed curvature."
      },
      {
        "control": "track_width_m",
        "values": [
          0.2,
          0.35,
          0.7
        ],
        "expected_observation": "A wider track reduces yaw rate for the same wheel-speed difference."
      }
    ],
    "broken_case": {
      "name": "Decoupled translation",
      "trigger": "Set broken_mode true.",
      "failure": "Heading changes while translation remains on world +x.",
      "recovery": "Set broken_mode false and rotate velocity through the body heading."
    },
    "limiting_cases": [
      "Equal wheel speeds produce a straight line.",
      "Equal-and-opposite speeds rotate the center in place."
    ]
  },
