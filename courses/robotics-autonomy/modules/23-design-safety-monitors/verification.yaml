  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you design Safety Monitors?",
    "equations": [
      {
        "latex": "d_{req}=v t_r+v^2/(2a)+m",
        "meaning": "The intervention envelope includes reaction travel, braking distance, and margin."
      },
      {
        "latex": "v_{k+1}=\\max(0,v_k-a\\Delta t)",
        "meaning": "A latched stop reduces speed monotonically at the validated deceleration bound."
      }
    ],
    "coordinate_and_sign_convention": "Robot position and positive velocity point toward the obstacle. Separation is obstacle position minus robot position, so nonpositive separation indicates crossing.",
    "units": [
      "position, separation, margin, and stopping envelope: m",
      "speed: m/s; deceleration: m/s^2; reaction and stop time: s"
    ],
    "sweeps": [
      {
        "control": "command_speed_m_s",
        "values": [
          0.5,
          2,
          3
        ],
        "expected_observation": "Braking distance grows quadratically with speed and moves intervention earlier."
      },
      {
        "control": "reaction_time_s",
        "values": [
          0,
          0.2,
          0.8
        ],
        "expected_observation": "Longer reaction bounds add linear travel to the required envelope."
      }
    ],
    "broken_case": {
      "name": "Fixed-distance stop trigger",
      "trigger": "Set broken_mode true.",
      "failure": "The monitor waits for 0.1 m regardless of speed and crosses the obstacle before stopping.",
      "recovery": "Use the speed-dependent envelope with conservative reaction and deceleration bounds."
    },
    "limiting_cases": [
      "At zero speed the dynamic braking and reaction terms vanish, leaving only margin.",
      "Smaller available deceleration increases required braking distance."
    ]
  },
