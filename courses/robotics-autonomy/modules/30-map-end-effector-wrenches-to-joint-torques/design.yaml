governing_equations:
- v=J(q) qdot; tau=J(q)^T F
- joint_power=tau^T qdot; Cartesian_power=F^T v
- force_to_torque_gain=||J^T F_unit||
signature:
- field: joint_torque
  unit: N*m
- field: virtual_power_error
  unit: W
- field: force_to_torque_gain
  unit: m
teaching_invariant: Predict which mapping preserves virtual power throughout an elbow sweep, and whether zero
  force can expose the wrong mapping.
limiting_cases:
- At zero force both torque maps produce zero, so the fault is unobservable through power.
- At zero length the ideal geometric torques vanish; the interactive length range remains positive. This is
  quasistatic mapping, with no inertia, friction or actuator model.
