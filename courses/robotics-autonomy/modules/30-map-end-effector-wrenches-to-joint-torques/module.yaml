- type: prediction
  title: Predict before running
  text: Predict which mapping preserves virtual power throughout an elbow sweep, and whether zero force can
    expose the wrong mapping.
  reveal: The square array dimensions do not enforce physical duality. Only J transpose maps Cartesian force
    into joint torque while preserving F dot (J qdot) = tau dot qdot. A zero-force trial cannot distinguish
    the maps.
