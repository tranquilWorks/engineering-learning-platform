schema_version: 1
id: 30-map-end-effector-wrenches-to-joint-torques
number: 30
title: Map Planar End-Effector Force to Joint Torque
summary: The two powers use the same force, configuration and joint velocity. Their equality tests the transpose
  map, not a torque magnitude proxy.
guiding_question: Why can a matrix multiplication run successfully while producing the wrong joint torques?
status: implemented
