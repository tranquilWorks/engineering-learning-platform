      {
        "control": "range_sigma_m",
        "values": [
          0.02,
          0.1,
          0.5
        ],
        "expected_observation": "Landmark coupling weakens as range uncertainty grows."
      }
    ],
    "broken_case": {
      "name": "Missing gauge prior",
      "trigger": "Set broken_mode true.",
      "failure": "All relative factors remain invariant to a common translation and the matrix loses rank.",
      "recovery": "Set broken_mode false and anchor one pose with an absolute prior."
    },
    "limiting_cases": [
      "A strong correct prior effectively fixes the first pose.",
      "Without an absolute constraint, every common state translation has equal relative residual."
    ]
