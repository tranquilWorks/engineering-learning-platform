- type: prediction
  title: Predict before running
  text: Predict which parameter becomes unobservable when training measurements use a stationary joint.
  reveal: The reported condition belongs to the regularized augmented system. Its prior supplies a numerical
    constraint on damping, but stationary training supplies no damping information. A dynamic held-out residual
    exposes that distinction.
