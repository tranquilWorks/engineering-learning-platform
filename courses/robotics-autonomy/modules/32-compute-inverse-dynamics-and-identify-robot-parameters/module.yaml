title: Identify Payload and Damping from Synthetic Joint Torque
summary: Fit payload and damping from actual excitation and torque data, then test the identified model on
  a separate held-out motion. Distinguish regressor rank from regularized conditioning.
guiding_question: How can a rank-deficient experiment return a finite condition number and a unique fit?
