schema_version: 1
id: 48-register-point-clouds-with-icp
number: 48
title: Register Point Clouds with ICP
summary: Build a deterministic numerical laboratory to register point clouds with icp, expose its governing relation,
  and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make register point clouds with icp defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: initial_offset_m
  type: slider
  label: Initial translation offset
  default: 0.25
  minimum: 0.0
  maximum: 1.5
  step: 0.05
  unit: m
- id: outlier_fraction
  type: slider
  label: Point-cloud outliers
  default: 0.12
  minimum: 0.0
  maximum: 0.7
  step: 0.02
  unit: '1'
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: 'ICP supports only a local registration claim: correspondences, robust weighting, and initialization jointly
    determine convergence.'
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
