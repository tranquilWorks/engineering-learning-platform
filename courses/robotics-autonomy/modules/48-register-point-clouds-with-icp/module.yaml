number: 48
title: Iterate Planar Point-Cloud Registration with Outlier Gating
summary: Iterate planar nearest-neighbour registration and inspect outlier gates, rigid composition and local
  convergence.
guiding_question: Why can an ICP run converge with a small residual and still have a wrong transform?
