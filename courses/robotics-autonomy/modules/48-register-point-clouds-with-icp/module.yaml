- type: prediction
  title: Predict before running
  text: Predict whether a falling nearest-neighbour residual establishes correct registration when initialization
    is poor or correspondences include clutter.
  reveal: Nearest-neighbour assignments and rigid fitting optimize a local objective. A wrong correspondence
    pattern can be self-consistent and produce tiny updates; independent geometry, initialization limits and
    truth-based evaluation are separate checks.
