governing_equations:
- nearest_i=argmin_j ||R*source_i+t-target_j||
- delta_R,delta_t=argmin sum_accepted ||delta_R*moved_i+delta_t-target_nearest_i||²
- R_next=delta_R*R; t_next=delta_R*t+delta_t
signature:
- field: correspondence_rms
  unit: m
- field: transform_point_error
  unit: m
- field: executed_iterations
  unit: count
teaching_invariant: Predict whether a falling nearest-neighbour residual establishes correct registration when
  initialization is poor or correspondences include clutter.
limiting_cases:
- The problem is planar SE(2), uses a fixed local initializer family and can reach a wrong local alignment
  or its iteration budget.
- Zero clutter can hide the rejection fault. A decreasing nearest-neighbour objective or tiny final increment
  does not establish the correct physical correspondence or a global optimum.
