  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you localize with a Particle Filter?",
    "equations": [
      {
        "latex": "w_i proportional to p(z|x_i)",
        "meaning": "Measurement likelihood reweights particle hypotheses."
      },
      {
        "latex": "N_eff=1/sum(w_i^2)",
        "meaning": "Effective sample size reports weight concentration."
      }
    ],
    "coordinate_and_sign_convention": "Position increases around a 20 m cyclic corridor and wraps at 20 m; landmark distance uses the shorter wrapped arc.",
    "units": [
      "position and noise: m",
      "weights and ESS fraction: dimensionless",
      "particle count: particles"
    ],
    "sweeps": [
      {
        "control": "particle_count",
        "values": [
          100,
          400,
          1000
        ],
        "expected_observation": "Higher count reduces sampling granularity without repairing model bias."
      },
      {
        "control": "sensor_noise_m",
        "values": [
          0.1,
          0.4,
          1.5
        ],
        "expected_observation": "Narrow likelihoods concentrate weights and reduce ESS."
      }
    ],
    "broken_case": {
      "name": "Non-cyclic landmark range",
      "trigger": "Set broken_mode true.",
      "failure": "The likelihood uses straight coordinate distance at the wrap boundary.",
      "recovery": "Set broken_mode false and evaluate measurement distance on the cyclic state manifold."
    },
    "limiting_cases": [
      "Infinite sensor noise approaches uniform weighting.",
      "Zero motion noise preserves deterministic particle offsets between resampling events."
    ]
  },
