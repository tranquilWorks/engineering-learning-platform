schema_version: 1
id: 34-compare-joint-space-and-task-space-tracking
number: 34
title: Compare Joint and Cartesian Kinematic Feedback
summary: Both trajectories execute ideal joint velocity servos capped at 2 rad/s. Geometry controls the goal
  elbow, whose measured Jacobian condition is 7.805. No actuator torque dynamics are simulated.
guiding_question: Why is the peak control output a joint speed rather than a torque, and why can transpose
  feedback still reduce error?
status: implemented
