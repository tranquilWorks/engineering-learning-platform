blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict why a Jacobian-transpose descent law can move toward the target without matching the Cartesian
    convergence of an inverse velocity map.
  reveal: The integrated plant is qdot equal to the applied velocity command, with no mass or torque equation.
    The transpose is a gradient direction for endpoint error, but its task response is weighted by J J transpose
    and does not implement the inverse velocity law.
