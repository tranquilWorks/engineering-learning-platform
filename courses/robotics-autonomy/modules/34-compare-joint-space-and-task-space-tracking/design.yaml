teaching_invariant: Predict why a Jacobian-transpose descent law can move toward the target without matching
  the Cartesian convergence of an inverse velocity map.
limiting_cases:
- At zero Cartesian error both mappings command zero motion, so a settled target does not distinguish them.
- The experiment assumes ideal velocity servos, a fixed local goal branch and no collision or torque constraints.
  Near singularities, rate clipping changes the nominal exponential error law.
