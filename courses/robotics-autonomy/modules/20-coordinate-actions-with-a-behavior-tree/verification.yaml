  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you coordinate Actions with a Behavior Tree?",
    "equations": [
      {
        "latex": "s_{seq}=s_j\\;\\text{for the first child }j\\text{ not returning SUCCESS}",
        "meaning": "A sequence propagates the first RUNNING or FAILURE child status."
      },
      {
        "latex": "p_{k+1}=p_k+1\\;\\text{while an action remains RUNNING}",
        "meaning": "A stateful action must retain its progress from tick to tick."
      }
    ],
    "coordinate_and_sign_convention": "Node codes increase through Navigate, Grasp, Deliver, and Done; Failed is a separate terminal code. One tick advances exactly one active child.",
    "units": [
      "execution and completion: mission ticks",
      "retry and transition quantities: integer counts"
    ],
    "sweeps": [
      {
        "control": "navigate_ticks",
        "values": [
          2,
          5,
          10
        ],
        "expected_observation": "Longer navigation delays every downstream child while preserving the sequence order."
      },
      {
        "control": "retry_limit",
        "values": [
          0,
          3,
          6
        ],
        "expected_observation": "Too few retries cause explicit failure; enough retries allow the scripted grasp success."
      }
    ],
    "broken_case": {
      "name": "RUNNING child progress reset",
      "trigger": "Set broken_mode true.",
      "failure": "Navigate progress returns to one every tick and the sequence cannot reach Grasp.",
      "recovery": "Retain child-local state across ticks and distinguish RUNNING from FAILURE."
    },
    "limiting_cases": [
      "Zero grasp failures succeeds on the first grasp attempt.",
      "A mission budget shorter than required work ends nonterminal without inventing success."
    ]
  },
