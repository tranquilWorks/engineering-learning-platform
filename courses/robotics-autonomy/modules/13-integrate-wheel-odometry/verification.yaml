  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you integrate Wheel Odometry?",
    "equations": [
      {
        "latex": "Delta s=(Delta s_R+Delta s_L)/2",
        "meaning": "Mean wheel travel gives local forward motion."
      },
      {
        "latex": "Delta theta=(Delta s_R-Delta s_L)/b",
        "meaning": "Differential wheel travel gives yaw change."
      }
    ],
    "coordinate_and_sign_convention": "World +x and +y form a right-handed plane; body +x is forward and positive yaw is counterclockwise.",
    "units": [
      "wheel radius and position: m",
      "track width: m",
      "heading: rad internal and displayed deg",
      "encoder resolution: lines/rev"
    ],
    "sweeps": [
      {
        "control": "encoder_cpr",
        "values": [
          128,
          1024,
          4096
        ],
        "expected_observation": "Quantization decreases with resolution but slip bias remains."
      },
      {
        "control": "slip_percent",
        "values": [
          0,
          2,
          15
        ],
        "expected_observation": "Unmeasured wheel slip accumulates position and heading error."
      }
    ],
    "broken_case": {
      "name": "Old-heading Euler step",
      "trigger": "Set broken_mode true.",
      "failure": "Finite translation is projected along the interval start heading instead of the exact twist midpoint.",
      "recovery": "Set broken_mode false and compose the SE(2) wheel increment."
    },
    "limiting_cases": [
      "Equal wheel increments produce straight translation.",
      "Infinite encoder resolution removes quantization but not wheel slip."
    ]
