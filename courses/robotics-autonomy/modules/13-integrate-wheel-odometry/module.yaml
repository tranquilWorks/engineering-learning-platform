schema_version: 1
id: 13-integrate-wheel-odometry
number: 13
title: Integrate Wheel Odometry
summary: Convert quantized wheel increments into an SE(2) trajectory and expose drift from slip and a first-order integration shortcut.
guiding_question: What inputs, observable effects, and failure modes matter when you integrate Wheel Odometry?
status: implemented
tags:
- robotics-autonomy
- localization-and-mapping
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
