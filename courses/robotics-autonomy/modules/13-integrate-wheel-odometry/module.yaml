blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Quantized wheel increments can be integrated exactly as local SE(2) twists, but unmeasured ground slip still produces accumulating pose error.
  reveal: Apply each twist about its midpoint and separate encoder quantization from wheel-to-ground model error.
