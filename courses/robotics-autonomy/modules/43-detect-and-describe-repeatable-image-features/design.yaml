schema_version: 1
item_id: P43
module: 43-detect-and-describe-repeatable-image-features
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- H=det(M)-0.04*trace(M)²; M=smooth(gradient(I)*gradient(I)^T)
- theta=atan2(sum(y*I),sum(x*I)) within a circular patch
- descriptor=(rotated_sampled_patch-mean)/norm; distance=||d1-d2||2
signature:
- field: geometric_repeatability
  unit: '1'
- field: descriptor_distance
  unit: '1'
- field: detected_features
  unit: count
teaching_invariant: Predict which results should stay unchanged when descriptor orientation normalization is
  disabled while the detector and images stay fixed.
limiting_cases:
- This is a fixed-scale synthetic corner detector and normalized intensity descriptor; it makes no SIFT, scale,
  perspective or general illumination-invariance claim.
- Zero rotation can hide the orientation fault. Empty matching sets have an unavailable-distance status, and
  low distance alone does not establish unique correspondence.
scenarios:
  baseline: &id001
    detector_threshold: 0.12
    image_rotation_deg: 25.0
    broken_mode: false
  sweep_1:
    detector_threshold: 0.8
    image_rotation_deg: 25.0
    broken_mode: false
  sweep_2:
    detector_threshold: 0.12
    image_rotation_deg: 180.0
    broken_mode: false
  broken:
    detector_threshold: 0.12
    image_rotation_deg: 25.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
