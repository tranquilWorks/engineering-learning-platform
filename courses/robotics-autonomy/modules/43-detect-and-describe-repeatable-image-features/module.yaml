schema_version: 1
id: 43-detect-and-describe-repeatable-image-features
number: 43
title: Detect and Describe Repeatable Image Features
summary: Build a deterministic numerical laboratory to detect and describe repeatable image features, expose its
  governing relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make detect and describe repeatable image features defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: detector_threshold
  type: slider
  label: Detector threshold
  default: 0.12
  minimum: 0.01
  maximum: 0.8
  step: 0.01
  unit: '1'
- id: image_rotation_deg
  type: slider
  label: Image rotation
  default: 25.0
  minimum: 0.0
  maximum: 180.0
  step: 5.0
  unit: deg
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A useful feature remains localized and descriptively close under the declared viewpoint transformation while
    retaining spatial coverage.
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
