schema_version: 1
id: 43-detect-and-describe-repeatable-image-features
number: 43
title: Detect Corners and Normalize Patch Orientation
summary: Detect corners in sampled images and compare oriented intensity patches under a controlled image rotation.
guiding_question: Why should the orientation fault leave geometric repeatability unchanged even when descriptor
  distances increase?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: detector_threshold
  type: slider
  label: Relative corner threshold
  default: 0.12
  minimum: 0.01
  maximum: 0.8
  step: 0.01
  unit: '1'
- id: image_rotation_deg
  type: slider
  label: Image rotation
  default: 25.0
  minimum: 0.0
  maximum: 180.0
  step: 5.0
  unit: deg
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict which results should stay unchanged when descriptor orientation normalization is disabled while
    the detector and images stay fixed.
  reveal: Repeatability is measured from detected positions and known image geometry. The fault changes only
    how a patch is sampled into a descriptor after detection; it cannot retroactively change those feature
    centres.
