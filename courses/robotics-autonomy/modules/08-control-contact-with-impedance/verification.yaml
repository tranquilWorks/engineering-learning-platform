  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you control Contact with Impedance?",
    "equations": [
      {
        "latex": "m x_ddot=K(x_d-x)-B x_dot-F_c",
        "meaning": "Virtual impedance drives penetration against contact."
      },
      {
        "latex": "F_c=K_e max(x,0)",
        "meaning": "The unilateral wall opposes positive penetration."
      }
    ],
    "coordinate_and_sign_convention": "Positive x enters the wall; reported force is a positive magnitude but enters dynamics with a negative sign.",
    "units": [
      "penetration: mm in UI, m internally",
      "stiffness: N/m",
      "damping: N s/m",
      "contact force: N"
    ],
    "sweeps": [
      {
        "control": "stiffness_n_m",
        "values": [
          75,
          200,
          600
        ],
        "expected_observation": "Stiffness changes static sharing with the wall."
      },
      {
        "control": "damping_ns_m",
        "values": [
          4,
          20,
          60
        ],
        "expected_observation": "Damping changes transient settling but not static balance."
      }
    ],
    "broken_case": {
      "name": "Disconnected wall reaction",
      "trigger": "Set broken_mode true.",
      "failure": "The wall reaction is removed from dynamics and force reporting.",
      "recovery": "Set broken_mode false and reconnect the opposing contact force."
    },
    "limiting_cases": [
      "Zero desired penetration keeps the zero state.",
      "Static controller force equals wall force."
    ]
  },
