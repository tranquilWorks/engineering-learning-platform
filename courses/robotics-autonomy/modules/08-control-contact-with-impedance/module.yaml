schema_version: 1
id: 08-control-contact-with-impedance
number: 8
title: Control Contact with Impedance
summary: Shape contact penetration and force with a virtual spring-damper against a compliant wall.
guiding_question: What inputs, observable effects, and failure modes matter when you control Contact with Impedance?
status: implemented
tags:
- robotics-autonomy
- dynamics-and-actuation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: stiffness_n_m
  type: slider
  label: Controller stiffness
  default: 200
  unit: N/m
  minimum: 50
  maximum: 800
  step: 25
- id: damping_ns_m
  type: slider
  label: Controller damping
  default: 20
  unit: N s/m
  minimum: 2
  maximum: 80
  step: 2
- id: desired_penetration_mm
  type: slider
  label: Desired penetration
  default: 5
  unit: mm
  minimum: 1
  maximum: 15
  step: 0.5
- id: broken_mode
  type: toggle
  label: Disconnect wall reaction
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Higher virtual stiffness raises contact force and moves penetration toward the command; damping mainly changes the transient.
  reveal: Disable the disconnected-contact mode so the wall reaction opposes penetration in the dynamics and force diagnostic.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Physical response and diagnostic
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery

