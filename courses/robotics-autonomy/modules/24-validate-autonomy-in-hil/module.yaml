schema_version: 1
id: 24-validate-autonomy-in-hil
number: 24
title: Validate Autonomy in HIL
summary: Exercise a deterministic software HIL loop with delayed telemetry, injected dropout, a freshness watchdog, and explicit pass/fail evidence.
guiding_question: What inputs, observable effects, and failure modes matter when you validate Autonomy in HIL?
status: implemented
tags:
- robotics-autonomy
- autonomous-system-integration
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: plant_tau_s
  type: slider
  label: Virtual-plant time constant
  default: 0.4
  unit: s
  minimum: 0.1
  maximum: 1
  step: 0.05
- id: io_latency_ms
  type: slider
  label: Telemetry latency
  default: 30
  unit: ms
  minimum: 0
  maximum: 100
  step: 10
- id: fault_start_s
  type: slider
  label: Dropout start
  default: 2
  unit: s
  minimum: 1
  maximum: 4
  step: 0.25
- id: fault_duration_s
  type: slider
  label: Dropout duration
  default: 1
  unit: s
  minimum: 0.2
  maximum: 2
  step: 0.1
- id: watchdog_ms
  type: slider
  label: Telemetry-freshness watchdog
  default: 120
  unit: ms
  minimum: 40
  maximum: 500
  step: 20
- id: broken_mode
  type: toggle
  label: Disable freshness watchdog
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A HIL test is useful only when interfaces, timing, injected faults, monitors, and verdict criteria are explicit; stale telemetry must force a bounded safe response.
  reveal: Detect signal age beyond the watchdog, command the virtual plant safe, and retain detection/verdict evidence.
- type: controls
  title: Live software-HIL controls
- type: metrics
- type: plot_grid
  title: Closed-loop response and interface health
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
