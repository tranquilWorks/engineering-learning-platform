        "expected_observation": "Longer dropout holds the software safe command for more samples after watchdog detection."
      }
    ],
    "broken_case": {
      "name": "Freshness watchdog disabled",
      "trigger": "Set broken_mode true.",
      "failure": "The controller acts on stale telemetry through the dropout and cannot produce required safe-state evidence.",
      "recovery": "Enable the watchdog, inhibit integral growth, and command the virtual plant safe after the age bound."
    },
    "limiting_cases": [
      "Zero interface latency removes queue delay but does not remove the sampled-data step.",
      "A dropout shorter than the watchdog may be tolerated without entering the modeled safe state."
    ]
