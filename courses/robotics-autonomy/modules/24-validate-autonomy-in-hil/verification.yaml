  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you validate Autonomy in HIL?",
    "equations": [
      {
        "latex": "y_{k+1}=y_k+\\Delta t(-y_k+u_k)/\\tau",
        "meaning": "The software-only virtual plant follows a bounded first-order recurrence."
      },
      {
        "latex": "a_k=t_k-t_{last};\\quad a_k>T_w\\Rightarrow u_k=0",
        "meaning": "Telemetry age beyond the watchdog threshold forces the modeled safe command."
      }
