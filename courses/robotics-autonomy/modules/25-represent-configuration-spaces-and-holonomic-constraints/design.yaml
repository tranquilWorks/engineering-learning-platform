teaching_invariant: Predict which quantities remain invariant when only the radial offset changes in normal
  mode, and whether tangency guarantees clearance.
limiting_cases:
- At zero offset the broken configuration already lies on the circle, so its radius residual can vanish while
  its unprojected velocity is still wrong.
- The Jacobian rank remains one.
- First-order tangency describes an instantaneous velocity and does not establish finite-step constraint preservation
  or collision avoidance.
