number: 25
title: Represent Configuration Spaces and Holonomic Constraints
summary: Build a deterministic numerical laboratory to represent configuration spaces and holonomic constraints,
  expose its governing relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make represent configuration spaces and holonomic constraints defensible?
