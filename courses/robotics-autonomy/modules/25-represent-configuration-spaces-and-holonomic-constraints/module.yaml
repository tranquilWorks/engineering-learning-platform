- type: prediction
  title: Predict before running
  text: Predict which quantities remain invariant when only the radial offset changes in normal mode, and whether
    tangency guarantees clearance.
  reveal: The requested velocity is wholly normal to the constraint and has no tangent component. With zero
    input offset the configuration is already valid, but a nonzero outward velocity violates J_h v=0. Both
    configuration and velocity evidence are needed.
