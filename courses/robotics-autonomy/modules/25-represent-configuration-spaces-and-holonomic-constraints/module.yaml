schema_version: 1
id: 25-represent-configuration-spaces-and-holonomic-constraints
number: 25
title: Project Configurations and Velocities onto a Circle Constraint
summary: The circle constraint and its Jacobian are evaluated at each sampled configuration. Projection enforces
  first-order tangency; the displayed arc is a configuration sweep, not an integrated velocity trajectory.
  Tangency alone does not certify collision avoidance.
guiding_question: At q=[1,0] m, why does projecting [1,0] m/s produce zero, and why can zero radius error fail
  to diagnose the broken mode?
status: implemented
