  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you execute a Mission State Machine?",
    "equations": [
      {
        "latex": "x_{k+1}=\\delta(x_k,e_k)",
        "meaning": "The transition function maps the current state and events to one next state."
      },
      {
        "latex": "t-t_{enter}\\ge T_{watchdog}",
        "meaning": "A state timeout sends stalled execution to SAFE."
      }
    ],
    "coordinate_and_sign_convention": "State codes progress INIT=0, SEARCH=1, TRACK=2, EXECUTE=3, with SAFE=4 and COMPLETE=5 terminal. Time advances in positive 0.1 s ticks.",
    "units": [
      "event, dwell, and terminal times: s",
      "unsafe exposure and transition totals: integer counts"
    ],
    "sweeps": [
      {
        "control": "target_detect_s",
        "values": [
          0.5,
          2,
          8
        ],
        "expected_observation": "A late target can delay progress or let the SEARCH watchdog win."
      },
      {
        "control": "fault_time_s",
        "values": [
          1,
          5,
          11
        ],
        "expected_observation": "Earlier faults shorten active execution and route immediately to SAFE."
      }
    ],
    "broken_case": {
      "name": "Global fault transition omitted",
      "trigger": "Set broken_mode true.",
      "failure": "Local mission progress continues after the injected fault and can report COMPLETE.",
      "recovery": "Evaluate a global fault guard before every nonterminal local transition."
    },
    "limiting_cases": [
      "A target event after the watchdog cannot rescue a timed-out SEARCH state.",
      "Terminal SAFE and COMPLETE states remain latched without an explicit reset."
    ]
  },
