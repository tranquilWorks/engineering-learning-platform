schema_version: 1
id: 45-recover-depth-from-stereo-geometry
number: 45
title: Triangulate Calibrated Stereo Rays and Propagate Pixel Noise
summary: Triangulate calibrated stereo rays, reproject the estimate and propagate declared pixel noise into
  depth uncertainty.
guiding_question: Why can increasing baseline increase displayed depth uncertainty in this particular sweep?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: baseline_m
  type: slider
  label: Stereo baseline
  default: 0.18
  minimum: 0.03
  maximum: 0.8
  step: 0.01
  unit: m
- id: disparity_px
  type: slider
  label: Rectified construction disparity
  default: 28.0
  minimum: 1.0
  maximum: 140.0
  step: 1.0
  unit: px
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict how depth and depth uncertainty change when baseline increases while the selected rectified
    disparity, rather than physical range, is held fixed.
  reveal: The control holds rectified disparity fixed, so increasing baseline also moves the constructed point
    farther away. The fixed-range precision benefit of a larger baseline answers a different experiment; the
    held variable must be stated.
