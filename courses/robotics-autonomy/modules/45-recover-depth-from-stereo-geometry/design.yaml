schema_version: 1
item_id: P45
module: 45-recover-depth-from-stereo-geometry
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- point_hat=midpoint(closest_points_on_calibrated_rays)
- depth_truth=f*baseline/disparity; f=520 px
- Sigma_point=J_pixels*Sigma_pixels*J_pixels^T; sigma_Z=sqrt(Sigma_point[2,2])
signature:
- field: estimated_depth
  unit: m
- field: depth_uncertainty
  unit: m
- field: reprojection_rms
  unit: px
teaching_invariant: Predict how depth and depth uncertainty change when baseline increases while the selected
  rectified disparity, rather than physical range, is held fixed.
limiting_cases:
- The deterministic estimate uses noiseless synthetic correspondences; its covariance is a first-order prediction
  under independent pixel noise, not an observed confidence interval.
- Positive disparity avoids the infinite-depth singularity but does not make low-disparity geometry well conditioned.
  Calibration uncertainty, matching errors and occlusion are excluded.
scenarios:
  baseline: &id001
    baseline_m: 0.18
    disparity_px: 28.0
    broken_mode: false
  sweep_1:
    baseline_m: 0.8
    disparity_px: 28.0
    broken_mode: false
  sweep_2:
    baseline_m: 0.18
    disparity_px: 140.0
    broken_mode: false
  broken:
    baseline_m: 0.18
    disparity_px: 28.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
