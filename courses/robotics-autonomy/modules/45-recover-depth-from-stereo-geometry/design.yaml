module: 45-recover-depth-from-stereo-geometry
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- Z=fB/d
- sigma_Z=|fB/d^2| sigma_d
- rectified matches share image row
signature:
- field: depth
  unit: m
- field: depth_sigma
  unit: m
- field: rectification_residual
  unit: px
teaching_invariant: Stereo depth is inverse in disparity, so uncertainty and calibration residuals must accompany
  every long-range estimate.
limiting_cases:
- As disparity tends to zero, depth and depth uncertainty become unbounded.
- At fixed disparity, doubling baseline doubles inferred depth.
scenarios:
  baseline: &id001
    baseline_m: 0.18
