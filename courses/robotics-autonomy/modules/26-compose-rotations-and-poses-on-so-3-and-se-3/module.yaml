- type: prediction
  title: Predict before running
  text: Predict whether two valid rotation endpoints make every linear matrix blend between them a valid rotation.
  reveal: The blend equals the valid endpoint rotation at f=1. Interior blends generally leave SO(3); the metric
    deliberately measures the maximum over the executed interpolation, not just its last sample.
