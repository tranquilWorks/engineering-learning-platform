schema_version: 1
id: 26-compose-rotations-and-poses-on-so-3-and-se-3
number: 26
title: Compose Rotations and Poses on SO(3) and SE(3)
summary: Build a deterministic numerical laboratory to compose rotations and poses on so(3) and se(3), expose its
  governing relation, and diagnose a named counterexample before recovery.
guiding_question: What assumptions and evidence make compose rotations and poses on so(3) and se(3) defensible?
status: implemented
tags:
- robotics-autonomy
- native-python
- geometry-dynamics
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: rotation_angle_deg
  type: slider
  label: Rotation angle
  default: 35.0
  minimum: -170.0
  maximum: 170.0
  step: 5.0
  unit: deg
- id: translation_m
  type: slider
  label: Translation magnitude
  default: 0.6
  minimum: 0.0
  maximum: 2.0
  step: 0.05
  unit: m
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Rigid transforms must remain on SE(3), round trip through their inverse, and preserve the declared composition
    order.
  reveal: Use the equations, units, and mechanism plot to test the prediction.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
