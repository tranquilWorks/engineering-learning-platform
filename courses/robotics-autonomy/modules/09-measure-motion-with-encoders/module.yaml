schema_version: 1
id: 09-measure-motion-with-encoders
number: 9
title: Measure Motion with Encoders
summary: Quantize shaft angle into quadrature counts and reconstruct angle and sampled speed.
guiding_question: What inputs, observable effects, and failure modes matter when you measure Motion with Encoders?
status: implemented
tags:
- robotics-autonomy
- sensing-and-calibration
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: counts_per_rev
  type: slider
  label: Encoder line count
  default: 1024
  unit: lines/rev
  minimum: 64
  maximum: 4096
  step: 64
- id: speed_rpm
  type: slider
  label: Shaft speed
  default: 120
  unit: rpm
  minimum: -300
  maximum: 300
  step: 10
- id: sample_rate_hz
  type: slider
  label: Sample rate
  default: 50
  unit: Hz
  minimum: 10
  maximum: 200
  step: 10
- id: duration_s
  type: slider
  label: Duration
  default: 2
  unit: s
  minimum: 1
  maximum: 5
  step: 0.5
- id: broken_mode
  type: toggle
  label: Forget quadrature factor
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: More counts per revolution reduces angle quantization, while higher sample rate changes how many count increments appear in each velocity estimate.
  reveal: Disable the missing-quadrature-factor mode and decode with four edges per encoder line.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Physical response and diagnostic
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken assumption
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery

