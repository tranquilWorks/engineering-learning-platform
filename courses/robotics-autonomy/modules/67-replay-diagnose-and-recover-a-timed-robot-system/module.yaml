- {id: clock_drift_ppm, type: slider, label: Remote clock drift, default: 50.0, minimum: 0.0, maximum: 300.0, step: 10.0, unit: ppm}
- {id: broken_mode, type: toggle, label: Replay arrival order without recovery, default: false}
