title: Replay, Diagnose, and Recover a Timed Robot System
summary: Replay a deterministic timed state log in source order, diagnose dropout and clock drift, and recover from a retained checkpoint.
guiding_question: What makes a robot log causally replayable rather than merely readable?
status: implemented
