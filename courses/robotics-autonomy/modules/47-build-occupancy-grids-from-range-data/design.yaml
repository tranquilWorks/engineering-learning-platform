schema_version: 1
item_id: P47
module: 47-build-occupancy-grids-from-range-data
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- log_odds_next=clip(log_odds+inverse_sensor_evidence,-5,5)
- hit_evidence=log(p_hit/(1-p_hit)); traversed_free_evidence=-hit_evidence
- entropy=sum(-p*log2(p)-(1-p)*log2(1-p)) over grid cells
signature:
- field: observed_hit_probability
  unit: '1'
- field: map_entropy
  unit: bit
- field: unconfirmed_free_fraction
  unit: '1'
teaching_invariant: Predict what an endpoint-only mapper can know about the free cells crossed by a beam, and
  distinguish unknown space from a false occupied measurement.
limiting_cases:
- Unobserved and occluded cells retain their prior; the unconfirmed-free fraction deliberately includes them
  and should not be read as a visible-cell false-positive rate.
- Known sensor pose, deterministic ranges, independent-cell updates and repeated-ray evidence are simplifying
  assumptions. Marginal entropy reduction does not prove calibrated joint uncertainty.
scenarios:
  baseline: &id001
    hit_probability: 0.72
    beam_count: 90.0
    broken_mode: false
  sweep_1:
    hit_probability: 0.98
    beam_count: 90.0
    broken_mode: false
  sweep_2:
    hit_probability: 0.72
    beam_count: 360.0
    broken_mode: false
  broken:
    hit_probability: 0.72
    beam_count: 90.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are recorded separately.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
