schema_version: 1
id: 47-build-occupancy-grids-from-range-data
number: 47
title: Trace Range Beams and Update an Occupancy Grid
summary: Trace actual range rays and accumulate occupied and free-cell evidence in a finite log-odds grid.
guiding_question: Why should the endpoint-only fault be described as missing free-space evidence rather than
  creating false-free cells?
status: implemented
tags:
- robotics-autonomy
- native-python
- perception
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: hit_probability
  type: slider
  label: Inverse-model hit probability
  default: 0.72
  minimum: 0.51
  maximum: 0.98
  step: 0.01
  unit: '1'
- id: beam_count
  type: slider
  label: Range beams
  default: 90.0
  minimum: 8.0
  maximum: 360.0
  step: 4.0
  unit: count
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict what an endpoint-only mapper can know about the free cells crossed by a beam, and distinguish
    unknown space from a false occupied measurement.
  reveal: Its omitted negative updates leave crossed free cells at the 0.5 prior. They remain unknown; the
    algorithm has not asserted that occupied cells are free. The metric must describe the posterior that was
    actually produced.
