schema_version: 1
item_id: P27
module: 27-map-twists-screws-and-wrenches-with-adjoint-transforms
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- V=[omega;v]; W=[moment;force]; power=W^T V
- Ad_T=[[R,0],[[t]cross R,R]]; V_A=Ad_T V_B
- W_A=Ad_T^-T W_B; pitch=omega·v/(omega·omega)
signature:
- field: power_error
  unit: W
- field: linear_roundtrip
  unit: m/s
- field: screw_pitch
  unit: m/rad
teaching_invariant: Predict which transform preserves the scalar power pairing when the frame origin is translated.
limiting_cases:
- At zero transform fraction the adjoint is identity and the wrong wrench map can coincide with the correct
  map.
- Zero power discrepancy at one frame is insufficient.
- Pure translation has no finite pitch under this formula, and this lab deliberately keeps angular speed positive.
scenarios:
  baseline: &id001
    lever_arm_m: 0.45
    angular_speed_rad_s: 1.8
    broken_mode: false
  sweep_1:
    lever_arm_m: 1.5
    angular_speed_rad_s: 1.8
    broken_mode: false
  sweep_2:
    lever_arm_m: 0.45
    angular_speed_rad_s: 6.0
    broken_mode: false
  broken:
    lever_arm_m: 0.45
    angular_speed_rad_s: 1.8
    broken_mode: true
  recovery: *id001
