  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you meet Real-Time Perception and Control Deadlines?",
    "equations": [
      {
        "latex": "U=\\sum_i C_i/T_i",
        "meaning": "Processor utilization sums each task WCET divided by its period."
      },
      {
        "latex": "R_i=C_i+\\sum_{j\\in hp(i)}\\lceil R_i/T_j\\rceil C_j",
        "meaning": "Fixed-point response time includes interference from all higher-priority releases."
      }
    ],
    "coordinate_and_sign_convention": "Task codes are control=0, perception=1, and planning=2. Smaller periods receive higher rate-monotonic priority unless broken mode reverses the order.",
    "units": [
      "period, WCET, response, deadline, and horizon: ms",
      "utilization: dimensionless ratio; jobs and misses: integer counts"
    ],
    "sweeps": [
      {
        "control": "control_wcet_ms",
        "values": [
          1,
          5,
          10
        ],
        "expected_observation": "More control execution consumes capacity and increases lower-priority interference."
      },
      {
        "control": "perception_wcet_ms",
        "values": [
          5,
          18,
          30
        ],
        "expected_observation": "More perception execution lengthens planning response and can consume its deadline margin."
      }
    ],
    "broken_case": {
      "name": "Fixed priorities reversed",
      "trigger": "Set broken_mode true.",
      "failure": "Long-period planning and perception block the fast control loop beyond its 20 ms deadline.",
      "recovery": "Restore rate-monotonic ordering and compare every bounded response with its own deadline."
    },
    "limiting_cases": [
      "A highest-priority task has response equal to its WCET in this zero-blocking model.",
      "Utilization below one is necessary but does not validate an arbitrary priority assignment."
    ]
  },
