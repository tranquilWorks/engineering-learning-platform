  type: slider
  label: Elbow angle
  default: 70.0
  minimum: 0.0
  maximum: 175.0
  step: 5.0
  unit: deg
- id: link_ratio
  type: slider
  label: Distal/proximal link ratio
  default: 0.8
  minimum: 0.2
  maximum: 1.5
  step: 0.05
  unit: '1'
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict what a missing elbow column does to task rank and to an independently differenced forward-kinematic
    check.
  reveal: At a real aligned configuration the correct analytic Jacobian still agrees with independently differentiated
    kinematics. The omitted column disagrees with a nonzero elbow derivative and causes rank loss even away
    from geometric alignment.
