schema_version: 1
id: 28-build-spatial-jacobians-and-diagnose-singularities
number: 28
title: Build a Planar Position Jacobian and Diagnose Singularities
summary: A two-link planar position Jacobian is differentiated from actual forward kinematics and checked by
  central differences. The omitted-column fault loses one joint contribution. Rank loss refers to this two-dimensional
  position task, not a full spatial-twist Jacobian.
guiding_question: How do you distinguish a real position singularity from the omitted-column fault?
status: implemented
tags:
- robotics-autonomy
- native-python
- geometry-dynamics
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
