  "learning": {
    "guiding_question": "What inputs, observable effects, and failure modes matter when you calibrate Sensor Extrinsics?",
    "equations": [
      {
        "latex": "p_B=R_BS p_S+t_BS+n",
        "meaning": "A planar rigid transform relates sensor and body correspondences."
      },
      {
        "latex": "t=mean(p_B)-R mean(p_S)",
        "meaning": "Translation follows after rotation is estimated."
      }
    ],
    "coordinate_and_sign_convention": "Body and sensor use +x forward, +y left, and positive counterclockwise yaw; the estimated transform maps sensor coordinates into body coordinates.",
    "units": [
      "translation: m",
      "yaw: deg control, rad internal",
      "residual: m and displayed mm"
    ],
    "sweeps": [
      {
        "control": "sensor_yaw_deg",
        "values": [
          -30,
          0,
          30
        ],
        "expected_observation": "Rigid calibration tracks yaw without structured residual."
      },
      {
        "control": "noise_mm",
        "values": [
          0,
          2,
          20
        ],
        "expected_observation": "Parameter error and residual RMS grow with correspondence noise."
      }
    ],
    "broken_case": {
      "name": "Translation-only extrinsic",
      "trigger": "Set broken_mode true.",
      "failure": "The fit fixes rotation to identity and leaves a position-dependent residual.",
      "recovery": "Set broken_mode false and solve a proper SO(2) rotation before translation."
    },
    "limiting_cases": [
      "Zero yaw makes translation-only fitting sufficient apart from noise.",
      "Zero noise with distributed correspondences recovers the rigid transform to numerical precision."
    ]
  },
