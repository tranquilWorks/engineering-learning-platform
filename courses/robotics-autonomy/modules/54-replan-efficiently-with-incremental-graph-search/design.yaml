governing_equations:
- rhs(s_start)=0 and rhs(s)=min_{s' in Pred(s)}(g(s')+c(s',s))
- key(s)=[min(g,rhs)+w h(s,s_goal), min(g,rhs)]
- A changed edge is repaired until top_key>=key(goal) and rhs(goal)=g(goal)
signature:
- {field: replanned_path_length, unit: m}
- {field: occupied_path_cells, unit: count}
- {field: repair_expansion_ratio, unit: '1'}
teaching_invariant: A replanned path is acceptable only if it is collision-free in the updated graph; zero search work cannot justify stale geometry.
limiting_cases:
- With no changed edge, every consistent vertex remains reusable and repair work tends to zero.
- With heuristic weight zero, the priority key reduces to incremental uniform-cost search.
