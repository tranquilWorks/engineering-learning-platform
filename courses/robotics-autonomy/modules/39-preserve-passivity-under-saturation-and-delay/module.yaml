id: 39-preserve-passivity-under-saturation-and-delay
number: 39
title: Account for Delayed Port Work with a Causal Energy Limiter
summary: Positive F·v is energy delivered by the force source to the prescribed moving port. The observer uses
  applied force after saturation and limiting. Its sampled work identity is exact for this declared quadrature.
guiding_question: Why can a force remain within its actuator bound while violating the energy budget?
