- type: prediction
  title: Predict before running
  text: Predict why force saturation alone cannot guarantee that the accumulated port energy stays nonnegative.
  reveal: An amplitude bound limits each force value, whereas the budget limits accumulated force times velocity
    times sample duration. Repeated bounded positive work can exceed the initial energy; the causal work limiter
    must constrain the actual applied work.
