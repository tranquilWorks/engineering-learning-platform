schema_version: 1
id: 37-compare-impedance-and-admittance-control
number: 37
title: Compare Impedance and Ideal Admittance Contact Transients
summary: Integrate declared impedance and ideal admittance contact dynamics, comparing actual force, energy
  and finite-window settling under different initial excitation.
guiding_question: Why does a reported value of 0.4 s not necessarily mean that the response settled at 0.4
  s?
status: implemented
tags:
- robotics-autonomy
- native-python
- control-interaction
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: environment_stiffness_n_m
  type: slider
  label: Environment stiffness
  default: 800.0
  minimum: 50.0
  maximum: 3000.0
  step: 50.0
  unit: N/m
- id: virtual_damping_n_s_m
  type: slider
  label: Virtual damping
  default: 45.0
  minimum: 1.0
  maximum: 150.0
  step: 2.0
  unit: N*s/m
- id: broken_mode
  type: toggle
  label: Enable named failure
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict the energy trend when damping is positive and when the same damping is given the wrong sign.
  reveal: The value can be the observation horizon with a censored status. Settling requires both normalized
    displacement and velocity to stay within the band; an oscillatory force zero crossing or the last available
    sample does not establish it.
- type: controls
  title: Live model controls
- type: metrics
- type: plot_grid
  title: Response and governing mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
