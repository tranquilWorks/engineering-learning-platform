schema_version: 1
item_id: P37
module: 37-compare-impedance-and-admittance-control
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- m xddot+b xdot+(k_virtual+k_environment)x=0
- contact_force=k_environment*x
- E=0.5m xdot²+0.5(k_virtual+k_environment)x²; Edot=-b xdot²
signature:
- field: peak_contact_force
  unit: N
- field: settling_time
  unit: s
- field: interaction_energy
  unit: J
teaching_invariant: Predict the energy trend when damping is positive and when the same damping is given the
  wrong sign.
limiting_cases:
- At zero damping the ideal system conserves energy and generally does not settle.
- The maintained-preload linearization and ideal position servo exclude contact loss, actuator limits and servo
  bandwidth. A censored 0.4 s result is not a measured settling time.
scenarios:
  baseline: &id001
    environment_stiffness_n_m: 800.0
    virtual_damping_n_s_m: 45.0
    broken_mode: false
  sweep_1:
    environment_stiffness_n_m: 3000.0
    virtual_damping_n_s_m: 45.0
    broken_mode: false
  sweep_2:
    environment_stiffness_n_m: 800.0
