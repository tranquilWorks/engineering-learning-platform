  "content": {
    "guiding_question": "How do fast-time beat frequency and chirp-to-chirp phase separate range and velocity?",
    "physical_model": "The 512x64 stop-and-hop scene separates two 20 m targets by signed velocity and a third at 23 m. Hann FFTs transform fast-time rows then coherent chirp columns. Tx conj(Rx) gives slow frequency -2v/lambda; the plotted velocity axis reverses that sign. Within-chirp Doppler coupling belongs to P71.",
    "signal_flow": [
      "The 512x64 stop-and-hop scene separates two 20 m targets by signed velocity and a third at 23 m. Hann FFTs transform fast-time rows then coherent chirp columns. Tx conj(Rx) gives slow frequency -2v/lambda; the plotted velocity axis reverses that sign. Within-chirp Doppler coupling belongs to P71.",
      "Taking absolute value of range data before its slow-time FFT erases signed phase and collapses the isolated moving target near zero velocity.",
      "Retain the unchanged complex range data and transform the chirp dimension. Toggle off reproduces the selected coherent map exactly.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
    ],
