  "content": {
    "guiding_question": "Why are symbols filtered before transmission and again at reception?",
    "physical_model": "A QPSK symbol is one desired I/Q point per symbol interval. A transmitter cannot send isolated mathematical points, so it launches a pulse for every symbol. Those shifted pulses add to make a continuous complex-envelope waveform. Pulse shaping chooses how that waveform occupies time and frequency. A rectangular pulse changes abruptly at symbol boundaries. It is compact in time, but its sinc-shaped spectrum has slowly decaying sidelobes. A root-raised-cosine (RRC) pulse spreads smoothly across several symbols. Its roll-off parameter trades occupied bandwidth for a gentler time response. The neighboring RRC pulses visibly overlap. Overlap is not automatically intersymbol interference (ISI): what matters is the combined response at the receiver's decision times.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary pulse shape rolloff while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "a_k = \\frac{I_k+jQ_k}{\\sqrt{2}}, \\qquad I_k,Q_k\\in\\{-1,+1\\}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "s[n] = \\sum_k a_k p[n-kN_s],",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "h_\\text{MF}[n] = p^*[L-1-n].",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
