  "content": {
    "guiding_question": "How do false alarms, detections, bias, variance, and theoretical bounds relate?",
    "physical_model": "Normalize the known-pulse matched filter by noise standard deviation. Independent H0/H1 banks trace Gaussian-tail ROC probabilities. The all-trial amplitude estimator attains variance sigma\u00b2/pulse energy under known timing and white Gaussian noise.",
    "signal_flow": [
      "Normalize the known-pulse matched filter by noise standard deviation. Independent H0/H1 banks trace Gaussian-tail ROC probabilities. The all-trial amplitude estimator attains variance sigma\u00b2/pulse energy under known timing and white Gaussian noise.",
      "Keeping only detected H1 trials selects high amplitude estimates. Its positive bias invalidates the unbiased-estimator claim; a smaller selected variance is not evidence of beating the unbiased CRLB.",
      "Restore all 12000 independent H1 trials before estimating amplitude. The recovered bias and SNR-dependent variance are checked separately from the detector operating point.",
      "Explicit stage equations are retained in lesson.md. NumPy random streams differ from MATLAB. Plot/console presentation is adapted; no MATLAB runtime parity is claimed."
    ],
    "equations": [
      {
        "latex": "H_0:\\;\\mathbf r=\\mathbf n,\\qquad H_1:\\;\\mathbf r=A\\mathbf s+\\mathbf n,",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "u=\\frac{\\mathbf s^T\\mathbf r}{\\sigma\\sqrt{\\mathbf s^T\\mathbf s}}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "d'=\\frac{A\\sqrt{\\mathbf s^T\\mathbf s}}{\\sigma}=\\sqrt{\\mathrm{SNR}_{MF}},",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
