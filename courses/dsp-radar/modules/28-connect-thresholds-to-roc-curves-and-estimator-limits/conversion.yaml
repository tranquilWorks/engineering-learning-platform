  "content": {
    "guiding_question": "How do false alarms, detections, bias, variance, and theoretical bounds relate?",
    "physical_model": "A receiver knows the shape and timing of a real pulse `s`, but it does not know whether that pulse is present in a record. It compares two hypotheses: \\[ H_0:\\;\\mathbf r=\\mathbf n,\\qquad H_1:\\;\\mathbf r=A\\mathbf s+\\mathbf n, \\] where each noise sample is independent Gaussian with mean zero and variance \\(\\sigma^2\\). This module uses real noise, so \\(\\sigma^2\\) is explicitly the variance of one real sample. The matched filter reduces each record to \\[ u=\\frac{\\mathbf s^T\\mathbf r}{\\sigma\\sqrt{\\mathbf s^T\\mathbf s}}. \\] Under \\(H_0\\), \\(u\\) has mean zero and variance one. Under \\(H_1\\), it still has variance one but its mean is \\[ d'=\\frac{A\\sqrt{\\mathbf s^T\\mathbf s}}{\\sigma}=\\sqrt{\\mathrm{SNR}_{MF}}, \\] where the final equality uses this experiment's known positive signal polarity (A>0). For an allowed signed amplitude, the more general relation is (d'=\\operatorname{sign}(A)\\sqrt{\\mathrm{SNR}_{MF}}). The pulse samples add coherently in the numerator; independent noise adds in power. That is why signal energy, observation duration, and SNR separate the two distributions.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary decision threshold while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "H_0:\\;\\mathbf r=\\mathbf n,\\qquad H_1:\\;\\mathbf r=A\\mathbf s+\\mathbf n,",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "u=\\frac{\\mathbf s^T\\mathbf r}{\\sigma\\sqrt{\\mathbf s^T\\mathbf s}}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "d'=\\frac{A\\sqrt{\\mathbf s^T\\mathbf s}}{\\sigma}=\\sqrt{\\mathrm{SNR}_{MF}},",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
