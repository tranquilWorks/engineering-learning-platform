  "content": {
    "guiding_question": "How can a known broadcast-like reference reveal delayed Doppler-shifted echoes without transmitting?",
    "physical_model": "Cross-ambiguity multiplies surveillance by a conjugate delayed reference and a negative trial Doppler phasor before coherent summation. Least-squares direct-path cancellation reveals the delayed target.",
    "signal_flow": [
      "Cross-ambiguity multiplies surveillance by a conjugate delayed reference and a negative trial Doppler phasor before coherent summation. Least-squares direct-path cancellation reveals the delayed target.",
      "Cancelling only 20 percent of the estimated direct term leaves the origin dominant. Poor reference quality also limits cancellation and coherent matching.",
      "Disable the failure to subtract the full estimated coefficient from the unchanged measured channels. Delay measures bistatic excess path c tau; geometry is still needed for target position.",
      "Explicit stage equations are retained in lesson.md. P77-P84 retain private source inputs and disclosed processing assumptions; P78 controls crop the full noise record and P84 tracking retains its explicitly labeled baseline. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
    ],
