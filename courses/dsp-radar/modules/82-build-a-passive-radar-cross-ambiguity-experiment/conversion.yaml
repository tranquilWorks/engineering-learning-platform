      {
        "latex": "y[n] = a_0r[n] + a_mr[n-d_m] + a_tr[n-d_t]e^{j2\\pi f_t n/f_s} + \\eta_y[n].",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
