    "guiding_question": "Why does a threshold that works in one noise level fail in another?",
    "physical_model": "One absolute signed-amplitude threshold is calibrated for zero-mean Gaussian noise at RMS 1. Increasing noise or adding a pedestal changes its false-alarm rate; H0 and H1 counts use separate denominators.",
