  "content": {
    "guiding_question": "What frequency does each FFT bin represent?",
    "physical_model": "A finite record is projected onto zero-based complex-sinusoid bins; signed frequency is the bin label times fs/N, not the one-based storage index.",
    "signal_flow": [
      "Retained from the pinned source: construct the retained complex tone and seeded noise; evaluate the explicit DFT and FFT on the same samples; map zero-based and signed bins to hertz; gate phase by projection magnitude.",
      "Named failure: Use a one-based array index directly as k and shift the reported frequency by one bin.",
      "Exact recovery: Convert index to zero-based k before applying f=k fs/N.",
      "Deliberately omitted: MATLAB figure-window behavior; the claim remains deterministic software-only."
    ],
    "equations": [
      {
        "latex": "X[k]=\\sum_{n=0}^{N-1}x[n]e^{-j2\\pi kn/N}",
        "meaning": "Explicit DFT projection."
      },
      {
        "latex": "f_k=kf_s/N,\\quad \\Delta f=f_s/N",
        "meaning": "Zero-based bin-to-frequency map and finite-record spacing."
