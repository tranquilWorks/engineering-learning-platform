  "content": {
    "guiding_question": "How can an adaptive filter learn an unknown coupling path?",
    "physical_model": "Imagine two receiver channels. The **primary** channel contains the signal we want plus a strong unwanted waveform. A nearby **reference** channel measures the source of that interference before it travels through an unknown cable, antenna, leakage, or multipath coupling path. The reference is not usually identical to the interference at the primary sensor. If the unknown path has (L) taps, its contribution is \\[ i[n] = \\sum_{k=0}^{L-1} h_k x[n-k] = \\mathbf{h}^{T}\\mathbf{x}_n. \\] The primary measurement is \\[ d[n] = s[n] + i[n], \\] where (s[n]) includes the desired waveform and independent receiver noise. P25 made a fixed FIR path visible. P26 asks how to estimate those taps from streaming samples when they are not known in advance.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary LMS step size while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "i[n] = \\sum_{k=0}^{L-1} h_k x[n-k] = \\mathbf{h}^{T}\\mathbf{x}_n.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "d[n] = s[n] + i[n],",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "\\hat{i}[n] = \\mathbf{w}^{T}[n]\\mathbf{x}_n",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
