    "guiding_question": "How can an adaptive filter learn an unknown coupling path?",
    "physical_model": "Each sample predicts the coupled reference, subtracts it, then updates eight taps by mu*error*reference. The desired two-tone output should remain; zero output is not the objective.",
    "signal_flow": [
      "Each sample predicts the coupled reference, subtracts it, then updates eight taps by mu*error*reference. The desired two-tone output should remain; zero output is not the objective.",
      "Step 0.35 exceeds the white-Gaussian mean-square reference limit 0.2. The guard stops before weights exceed 10000 or error exceeds one million; no unsafe tail is fabricated.",
      "Reset all taps and replay the same seed at step 0.006 with the correlated reference. Reacquisition requires 64 consecutive coefficient errors below 0.08; sentinel 3001 means not reacquired.",
