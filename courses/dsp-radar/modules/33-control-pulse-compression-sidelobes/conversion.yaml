  "content": {
    "guiding_question": "Why can a strong target hide a weak nearby target after matched filtering?",
    "physical_model": "Cosine receive weighting lowers sidelobes while broadening the mainlobe and losing output SNR. Weak-target margin compares its peak with strong-target leakage.",
