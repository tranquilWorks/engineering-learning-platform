  "content": {
    "guiding_question": "Why does a delayed chirp produce a nearly constant beat frequency?",
    "physical_model": "An 80 MHz sampled,40 us centered chirp returns after tau=2R/c. Only valid overlap is mixed as Tx conj(Rx), giving positive beat S tau. A Hann window and 65536-point FFT interpolate the beat; zero-padding does not improve the physical c/(2B) resolution.",
    "signal_flow": [
      "An 80 MHz sampled,40 us centered chirp returns after tau=2R/c. Only valid overlap is mixed as Tx conj(Rx), giving positive beat S tau. A Hann window and 65536-point FFT interpolate the beat; zero-padding does not improve the physical c/(2B) resolution.",
      "Using R=c fbeat/S omits round-trip propagation and doubles the same estimate.",
      "Restore R=c fbeat/(2S) without changing the observed beat.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
    ],
