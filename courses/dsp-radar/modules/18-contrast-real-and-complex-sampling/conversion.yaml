  "content": {
    "guiding_question": "Why can complex samples distinguish positive and negative frequencies?",
    "physical_model": "Positive and negative complex rotations have opposite phase progression and signed spectra, but projection onto the real axis makes the two cosines identical.",
    "signal_flow": [
      "Retained from the pinned source: construct conjugate positive and negative complex tones; compare their identical real projections; estimate signed phase progression and centered spectra; downconvert paired RF sides with complex and real mixers; sample at three rates to expose deterministic aliases.",
      "Named failure: Discard Q and try to infer rotation direction from the identical real projections.",
      "Exact recovery: Retain both I and Q and interpret the centered signed spectrum.",
      "Deliberately omitted: MATLAB figure-window behavior; the claim remains deterministic software-only."
    ],
    "equations": [
      {
        "latex": "z_+[n]=e^{j\\omega n},\\quad z_-[n]=e^{-j\\omega n}",
        "meaning": "Opposite complex rotations."
      },
      {
        "latex": "f_a=((f+f_s/2)\\bmod f_s)-f_s/2",
        "meaning": "Centered signed alias map."
      }
    ],
    "equation_order": "before_toolbox_shortcuts",
