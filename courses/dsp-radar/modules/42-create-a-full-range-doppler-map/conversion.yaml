  "content": {
    "guiding_question": "How do matched filtering and slow-time FFT combine to separate targets?",
    "physical_model": "Fast-time matched filtering separates range; the slow-time FFT separates signed velocity. Targets can share either coordinate and remain distinct in the two-dimensional map.",
    "signal_flow": [
      "Fast-time matched filtering separates range; the slow-time FFT separates signed velocity. Targets can share either coordinate and remain distinct in the two-dimensional map.",
