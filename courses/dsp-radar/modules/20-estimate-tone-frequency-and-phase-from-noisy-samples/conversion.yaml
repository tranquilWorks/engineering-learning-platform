    "guiding_question": "How accurately can frequency and phase be estimated from a finite noisy record?",
    "physical_model": "A noisy rotating complex phasor supports grid, sub-bin, and coherent phase-step frequency estimates plus de-rotated circular initial-phase estimates.",
