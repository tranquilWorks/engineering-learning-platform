  "content": {
    "guiding_question": "When should pulse phases be added and when should magnitudes be added?",
    "physical_model": "Known phase alignment gives coherent SNR N\u03c1. Noncoherent power has a different distribution: its standardized separation is \u221aN\u03c1. The Gaussian-jitter sweep is an ensemble expectation.",
    "signal_flow": [
      "Known phase alignment gives coherent SNR N\u03c1. Noncoherent power has a different distribution: its standardized separation is \u221aN\u03c1. The Gaussian-jitter sweep is an ensemble expectation.",
      "The prescribed 0\u00b0,90\u00b0,180\u00b0,-90\u00b0 error cycle cancels the clean nominally aligned sum while preserving pulse energy. It is not a typical random-jitter realization.",
      "Track and derotate the actual pulse errors to restore unit coherent signal fraction; disable the demonstration to replay the baseline. Recovery assumes known phase errors.",
      "Explicit stage equations are retained in lesson.md. NumPy random streams differ from MATLAB. Plot/console presentation is adapted; no MATLAB runtime parity is claimed."
    ],
    "equations": [
      {
        "latex": "x_n=Ae^{j(\\phi_n+\\epsilon_n)}+w_n,",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "z_c=\\sum_{n=0}^{N-1}x_ne^{-j\\phi_n}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "\\rho=\\frac{A^2}{\\sigma_w^2}, \\qquad \\mathrm{SNR}_{c,\\mathrm{out}}=N\\rho.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
