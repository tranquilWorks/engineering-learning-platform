  "content": {
    "guiding_question": "How does threshold choice trade probability of detection against false alarm?",
    "physical_model": "The normalized signed matched-filter score is Gaussian: H0 has mean zero and H1 shifts by \u221aSNR. Threshold sweeps trade Pd against Pfa, while trial count sets rare-event resolution.",
