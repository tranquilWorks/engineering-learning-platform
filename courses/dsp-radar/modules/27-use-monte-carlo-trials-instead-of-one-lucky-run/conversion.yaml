  "content": {
    "guiding_question": "Why is one noise realization not enough to judge an algorithm?",
    "physical_model": "Every BPSK trial uses its own 16-sample noise waveform and a unit-energy rectangular matched filter. Running error counts are Bernoulli observations; Wilson bounds quantify finite-sample uncertainty.",
    "signal_flow": [
      "Every BPSK trial uses its own 16-sample noise waveform and a unit-energy rectangular matched filter. Running error counts are Bernoulli observations; Wilson bounds quantify finite-sample uncertainty.",
      "Repeating one lucky correct waveform creates one unique statistic, zero errors, and a misleadingly narrow nominal interval. The independence validity flag is false, so that interval has no binomial coverage claim.",
      "Rebuild the independent bank from seed 2701. The bank and decisions reproduce exactly, while block variability remains visible. More trials reduce uncertainty; they do not improve the underlying detector.",
