  "content": {
    "guiding_question": "Why is one noise realization not enough to judge an algorithm?",
    "physical_model": "A receiver never gets to choose its next thermal-noise waveform. Even when the transmitter, channel, and algorithm stay fixed, the next decision can differ because the noise sample differs. One successful decision therefore describes one event, not the probability of error. P23 introduced BPSK symbols and P24 introduced matched filtering. P27 repeats that transparent signal chain many times. A bit becomes \\(b_k\\in\\{-1,+1\\}\\), and a unit-energy pulse satisfies \\[ \\sum_n p^2[n]=1. \\] In trial \\(k\\), the received waveform is \\[ r_k[n]=\\sqrt{E_b}\\,b_kp[n]+w_k[n]. \\] The script explicitly correlates with the known pulse, \\[ z_k=\\sum_n p[n]r_k[n], \\] then decides \\(+1\\) when \\(z_k\\ge 0\\) and \\(-1\\) otherwise. There is no communications-toolbox detector hidden behind the decision.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary Monte Carlo trials while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "\\sum_n p^2[n]=1.",
