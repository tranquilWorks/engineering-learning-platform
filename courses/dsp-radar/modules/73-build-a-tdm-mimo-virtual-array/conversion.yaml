  "content": {
    "guiding_question": "How do multiple transmit and receive channels create more spatial samples?",
    "physical_model": "Two TX at 0/2 wavelengths and four RX at 0:.5:1.5 create eight TX+RX positions. Tx-conjugate processing has negative spatial and Doppler phase. A lag-one estimate across 80 us same-TX cycles measures Doppler; correcting the 40 us slot offset restores virtual-array coherence.",
    "signal_flow": [
      "Two TX at 0/2 wavelengths and four RX at 0:.5:1.5 create eight TX+RX positions. Tx-conjugate processing has negative spatial and Doppler phase. A lag-one estimate across 80 us same-TX cycles measures Doppler; correcting the 40 us slot offset restores virtual-array coherence.",
      "Treating the named 10 m/s TDM record as simultaneous lets motion phase masquerade as angle.",
      "Multiply each virtual channel by exp(+j2pi fd slot_time) using the same-TX estimate. Recovery reuses the noisy record and assumes one unaliased target Doppler; the reviewed speed range lies below same-TX Nyquist.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
    ],
