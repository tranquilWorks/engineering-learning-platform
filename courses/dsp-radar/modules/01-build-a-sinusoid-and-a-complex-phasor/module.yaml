schema_version: 1
id: 01-build-a-sinusoid-and-a-complex-phasor
number: 1
title: Build a Sinusoid and a Complex Phasor
summary: Connect a real cosine to its rotating complex vector, then expose signed rotation and aliasing.
guiding_question: How do amplitude, frequency, and phase appear in time and in the complex plane?
status: implemented
tags:
  - signals
  - complex-phasor
  - sampling
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
  - id: amplitude
    type: slider
    label: Amplitude
    default: 1.0
    unit: a.u.
    minimum: 0.1
    maximum: 2.0
    step: 0.1
    description: Changes both time-domain peak height and IQ radius.
  - id: frequency_hz
    type: slider
    label: Signed frequency
    default: 5.0
    unit: Hz
    minimum: -20.0
    maximum: 20.0
    step: 0.5
    description: Magnitude sets rotation rate; sign sets direction.
  - id: phase_rad
    type: slider
    label: Initial phase
    default: 0.5235987755982988
    unit: rad
    minimum: -3.141592653589793
    maximum: 3.141592653589793
    step: 0.1308996938995747
  - id: sample_rate_hz
    type: slider
    label: Sample rate
    default: 200.0
    unit: Sa/s
    minimum: 8.0
    maximum: 500.0
    step: 1.0
  - id: duration_s
    type: slider
    label: Record duration
    default: 1.0
    unit: s
    minimum: 0.25
    maximum: 2.0
    step: 0.25
  - id: alias_mode
    type: toggle
    label: Force the 5 Hz at 8 Sa/s broken case
    default: false
blocks:
  - type: markdown
    source: lesson.md
  - type: prediction
    title: Predict before running
    text: If frequency changes sign while amplitude and phase stay fixed, what changes in the IQ view and what stays unchanged?
    reveal: The ordered IQ samples reverse rotation direction. Radius, starting point, and the real cosine's peak magnitude remain unchanged.
  - type: controls
    title: Phasor controls
  - type: metrics
  - type: plot_grid
    title: One motion, two representations
    plots:
      - time_projection
      - iq_trajectory
  - type: callout
    tone: info
    title: Current phasor interpretation
    source: observation
  - type: plot
    title: Signed complex frequency
    plot: rotation_direction
  - type: plot
    title: Isolated parameter effects
    plot: parameter_sweeps
  - type: plot
    title: Intentionally broken sampling case
    plot: alias_comparison
  - type: callout
    tone: warning
    title: Failure interpretation
    source: broken
  - type: callout
    tone: success
    title: Recovery
    source: recovery
