  "content": {
    "guiding_question": "How quickly does received echo power fall with range?",
    "physical_model": "A monostatic radar uses the same site to transmit and receive. Its pulse spreads out on the trip to the target, the target redirects only a fraction described by its radar cross section (RCS), and the echo spreads out again on the trip home. Those two geometric spreading trips are why range appears to the fourth power, not the second: \\[ P_r(R)=\\frac{P_t G_t G_r \\lambda^2 \\sigma} {(4\\pi)^3 R^4 L}. \\] Here `P_t` and `P_r` are transmit and received power in watts, `G_t` and `G_r` are dimensionless power gains, `lambda` is wavelength in metres, `sigma` is RCS in square metres, `R` is range in metres, and `L` is a dimensionless loss factor greater than or equal to one. The experiment converts gains and losses from dB to linear ratios before applying this equation. It then converts watts to dBW with `10 log10(P/1 W)` and to dBm by adding 30 dB. This is a power-budget model, not a waveform or range-estimation model. P30 will turn round-trip delay into measured range; P29 asks whether an echo at a stated range is strong enough to clear an illustrative receiver threshold.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary target range while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "P_r(R)=\\frac{P_t G_t G_r \\lambda^2 \\sigma} {(4\\pi)^3 R^4 L}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "\\frac{P_r(2R)}{P_r(R)}=\\frac{1}{2^4}=\\frac{1}{16}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "N=kTBF,",
        "meaning": "Pinned source equation used to interpret the experiment response."
