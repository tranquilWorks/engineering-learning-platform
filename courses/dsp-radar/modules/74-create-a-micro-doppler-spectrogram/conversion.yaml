  "content": {
    "guiding_question": "How do rotating or swinging target parts produce time-varying Doppler around bulk motion?",
    "physical_model": "Three scatterers integrate torso and opposite sinusoidal limb velocities into -4pi displacement/lambda phase. Explicit Hann windows use 75% overlap and a 2048-point FFT. The negative raw frequency axis is reversed so positive means approaching. Longer windows narrow frequency response but blur motion timing.",
    "signal_flow": [
      "Three scatterers integrate torso and opposite sinusoidal limb velocities into -4pi displacement/lambda phase. Explicit Hann windows use 75% overlap and a 2048-point FFT. The negative raw frequency axis is reversed so positive means approaching. Longer windows narrow frequency response but blur motion timing.",
      "Absolute value of the slow-time IQ record removes carrier phase and signed bulk Doppler; magnitude fluctuations cannot reconstruct the original motion phase.",
      "Use the retained unchanged complex IQ record. The plots use full STFT calculations; display coordinates are decimated and zero-padding is not independent frequency resolution.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
    ],
