    "guiding_question": "How do DC offset, gain mismatch, and quadrature error change an IQ spectrum?",
    "physical_model": "DC shifts the I/Q center, branch-gain mismatch stretches the trajectory, and quadrature error shears it while creating a conjugate image.",
    "signal_flow": [
      "Retained from the pinned source: inject DC, gain mismatch, and quadrature error separately and together; measure DC, desired/image ratio, axis ratio, and I/Q correlation; remove mean and normalize branch gains; apply the inverse quadrature shear.",
      "Named failure: Apply a global rotation, which preserves desired and image magnitudes.",
      "Exact recovery: Remove mean, normalize gains, and invert shear in that source order.",
      "Deliberately omitted: MATLAB figure-window behavior; the claim remains deterministic software-only."
    ],
