  "content": {
    "guiding_question": "How does target rotation create synthetic aperture when the radar is stationary?",
    "physical_model": "Target rotation projects scatterers onto changing range directions. Range compression precedes the signed angle FFT; translation correction removes both envelope migration and carrier phase.",
    "signal_flow": [
      "Target rotation projects scatterers onto changing range directions. Range compression precedes the signed angle FFT; translation correction removes both envelope migration and carrier phase.",
      "Omitting the known centroid translation correction spreads energy and shifts the apparent shape. A faster rotation alone cannot replace alignment.",
      "Disable the failure and multiply the original frequency history by the opposite translational phase. The small-angle cross-range approximation and uniform aspect sampling remain explicit assumptions.",
      "Explicit stage equations are retained in lesson.md. P77-P84 retain private source inputs and disclosed processing assumptions; P78 controls crop the full noise record and P84 tracking retains its explicitly labeled baseline. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
