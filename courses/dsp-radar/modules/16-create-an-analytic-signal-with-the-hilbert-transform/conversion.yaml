    "guiding_question": "How can a real waveform be represented by a complex envelope?",
    "physical_model": "The even-length FFT Hilbert mask constructs a one-sided analytic signal whose magnitude, unwrapped phase, and phase derivative describe envelope and instantaneous frequency.",
