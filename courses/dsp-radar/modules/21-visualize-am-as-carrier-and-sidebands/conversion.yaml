      "Multiplication creates carrier \u00b1 message-frequency lines; each sideband has depth/2 times the carrier amplitude. The multitone view retains both pairs.",
      "At depth 1.4 the signed envelope crosses zero. Magnitude detection folds the negative envelope and distorts the message.",
      "The explicit coherent mixer and 900 Hz lowpass retain envelope sign, even during overmodulation. Disable the failure to restore the selected depth.",
