  "content": {
    "guiding_question": "How does a baseband waveform create RF sidebands?",
    "physical_model": "Multiplication creates carrier \u00b1 message-frequency lines; each sideband has depth/2 times the carrier amplitude. The multitone view retains both pairs.",
