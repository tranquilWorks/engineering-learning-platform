  "content": {
    "guiding_question": "How do delayed copies distort symbols even when noise is small?",
    "physical_model": "Delayed pulse-shaped paths smear neighboring QPSK symbols. A 31-tap causal inverse cancels the leading response; regularization also penalizes tap energy.",
    "signal_flow": [
      "Delayed pulse-shaped paths smear neighboring QPSK symbols. A 31-tap causal inverse cancels the leading response; regularization also penalizes tap energy.",
      "The [1,-0.999] path has a -60 dB DC null. Finite ZF inversion boosts noise and leaves a tail: its symbol EVM and noise gain reveal the cost.",
      "The deep-null comparison uses lambda=0.01, nearest the 18 dB noise variance in the source grid. Regularization reduces noise enhancement but retains reported residual distortion; it does not perfectly recover lost information.",
      "Explicit stage equations are retained in lesson.md. NumPy random streams differ from MATLAB. Plot/console presentation is adapted; no MATLAB runtime parity is claimed."
    ],
    "equations": [
      {
