  "content": {
    "guiding_question": "How do delayed copies distort symbols even when noise is small?",
    "physical_model": "A receiver rarely sees only the direct path. Reflections from buildings, terrain, cables, or impedance discontinuities arrive later and with changed amplitude and phase. A short discrete channel is \\[ h[n]=\\sum_{p=0}^{P-1} a_p\\,\\delta[n-d_p], \\qquad r[n]=s[n]*h[n]+v[n]. \\] Each coefficient `a_p` is a complex path gain and each `d_p` is a delay. The convolution says that the receiver adds shifted copies of the pulse-shaped waveform. P07 introduced this echo-addition view; here the copies extend into neighboring QPSK decisions.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary multipath delay while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "h[n]=\\sum_{p=0}^{P-1} a_p\\,\\delta[n-d_p], \\qquad r[n]=s[n]*h[n]+v[n].",
