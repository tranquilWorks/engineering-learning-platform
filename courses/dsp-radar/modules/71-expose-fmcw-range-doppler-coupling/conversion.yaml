  "content": {
    "guiding_question": "Why can target motion bias the range estimated from one chirp?",
    "physical_model": "With approaching-positive velocity, Rx has +fd but Tx conj(Rx) yields fbeat=S tau-fd. The frozen-delay 45 m model measures lag-one signed frequency. A single chirp cannot identify both range and velocity; correction uses independently supplied velocity.",
    "signal_flow": [
      "With approaching-positive velocity, Rx has +fd but Tx conj(Rx) yields fbeat=S tau-fd. The frozen-delay 45 m model measures lag-one signed frequency. A single chirp cannot identify both range and velocity; correction uses independently supplied velocity.",
      "Subtracting fd again gives the wrong-sign correction and doubles the ideal stationary range bias.",
      "Add the independently known signed fd to the unchanged beat before converting delay to range.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
