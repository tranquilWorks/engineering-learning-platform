  "content": {
    "guiding_question": "Why does a high-frequency tone appear as a lower-frequency tone after sampling?",
    "physical_model": "A sampler is a clock that records one amplitude every `1/fs` seconds. It does not count the oscillations that occur between clock ticks. If two continuous tones land on the same amplitude at every tick, the stored sequence cannot tell which tone was present. P02 established that samples are timed measurements rather than a continuous line. P03 follows that consequence into frequency: a continuous tone can make several whole turns between measurements without leaving evidence of those extra turns.",
    "signal_flow": [
      "Retained from the pinned source: signed folding, phase reflection, recurrence estimation, and frequency/rate sweeps.",
      "Expose input frequency while holding sample rate fixed, then reverse the roles.",
      "Named failure: Keep the original phase after a negative signed fold, making the reflected alias miss the samples.",
      "Exact recovery: Reverse phase after reflection and verify frequency independently from the sample recurrence.",
      "Deliberately omitted: MATLAB figure-window behavior; the claim remains deterministic software-only."
    ],
    "equations": [
      {
        "latex": "x[n] = A\\cos\\left(2\\pi \\frac{f_{in}}{f_s}n+\\phi\\right).",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "k=\\operatorname{round}(f_{in}/f_s),\\qquad f_{fold}=f_{in}-k f_s.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "f_{apparent}=|f_{fold}|.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
