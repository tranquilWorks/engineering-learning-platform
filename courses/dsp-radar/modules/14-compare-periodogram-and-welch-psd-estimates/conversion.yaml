  "content": {
    "guiding_question": "Why does averaging make a noise spectrum easier to interpret?",
    "physical_model": "A periodogram estimates one record; Welch averages correctly scaled Hann-windowed segment powers and trades resolution for lower realization variance.",
    "signal_flow": [
      "Retained from the pinned source: form one-sided V^2/Hz periodograms; segment and Hann-window the same record explicitly; average segment power in linear units; repeat a tone-free probe across 24 fixed seeds.",
      "Named failure: Average logarithmic dB samples and introduce Jensen bias.",
      "Exact recovery: Average V^2/Hz linearly, then apply 10 log10 once.",
      "Deliberately omitted: MATLAB figure-window behavior; the claim remains deterministic software-only."
    ],
    "equations": [
      {
        "latex": "S_{xx}[k]=|X[k]|^2/(f_s\\sum_n w^2[n])",
        "meaning": "Window-energy-normalized PSD before one-sided doubling."
      },
      {
        "latex": "\\bar S[k]=K^{-1}\\sum_{r=1}^{K}S_r[k]",
        "meaning": "Linear-power Welch average."
      }
    ],
    "equation_order": "before_toolbox_shortcuts",
