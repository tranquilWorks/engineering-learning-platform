{
  "schema_version": 1,
  "id": "04-quantize-a-signal-and-hear-see-the-error",
  "number": 4,
  "title": "Quantize a Signal and Hear/See the Error",
  "summary": "Explore quantize a signal and hear/see the error with a bounded deterministic Python model, two sweeps, and an intentional failure/recovery comparison.",
  "guiding_question": "How do ADC bit depth and full-scale range change the measurement?",
  "status": "implemented",
  "tags": [
    "dsp-radar",
    "phase-1",
    "ADC-bit-depth"
  ],
  "runtime": {
    "kind": "python",
    "entrypoint": "experiment.py:run",
    "trust": "local-trusted",
    "timeout_seconds": 3.0
  },
  "controls": [
    {
      "id": "bit_depth",
      "type": "slider",
      "label": "Bit depth",
      "default": 6,
      "unit": "bits",
      "minimum": 2,
      "maximum": 14,
      "step": 1
    },
    {
      "id": "amplitude_v",
      "type": "slider",
      "label": "Signal peak",
      "default": 0.9,
      "unit": "V",
      "minimum": 0.05,
      "maximum": 1.5,
      "step": 0.05
    },
    {
      "id": "dither_enabled",
      "type": "toggle",
      "label": "Add deterministic triangular dither",
      "default": false
    },
    {
      "id": "broken_mode",
      "type": "toggle",
      "label": "Violate the central model assumption",
      "default": false
    }
  ],
  "blocks": [
    {
      "type": "markdown",
      "source": "lesson.md"
    },
    {
      "type": "prediction",
      "title": "Predict before running",
      "text": "Before changing adc bit depth, predict which feature moves and which feature should remain invariant.",
      "reveal": "Use the governing equation in the lesson, then verify by changing only one control."
    },
    {
      "type": "controls",
      "title": "Source-bound experiment controls"
    },
    {
      "type": "metrics"
    },
    {
      "type": "plot_grid",
      "title": "Model and response",
      "plots": [
        "quantized_waveform",
        "error"
      ]
    },
    {
      "type": "plot",
      "title": "One-variable sweeps",
      "plot": "parameter_sweeps"
    },
    {
      "type": "plot",
      "title": "Broken case and recovery",
      "plot": "error"
    },
    {
      "type": "callout",
      "tone": "info",
      "title": "Observation",
      "source": "observation"
    },
    {
      "type": "callout",
      "tone": "warning",
      "title": "Broken interpretation",
      "source": "broken"
    },
    {
      "type": "callout",
      "tone": "success",
      "title": "Recovery",
      "source": "recovery"
    }
  ]
}
