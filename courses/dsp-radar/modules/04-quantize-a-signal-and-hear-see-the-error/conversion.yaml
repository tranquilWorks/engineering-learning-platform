  "content": {
    "guiding_question": "How do ADC bit depth and full-scale range change the measurement?",
    "physical_model": "P02 treated samples as measurements taken at discrete times, and P03 showed that the timing choice can make frequencies ambiguous. P04 keeps those sample times fixed and asks a different question: how precisely can each stored sample describe voltage? Imagine a ruler whose marks are voltage bins. More ADC bits add more marks inside the same input range. A wider full-scale range spaces the marks farther apart. A signal that uses only a small part of the ruler touches few marks even if many are available. A signal beyond the ruler is not measured more coarsely\u2014it is cut off at the end, which is clipping.",
    "signal_flow": [
      "Retained from the pinned source: bipolar mid-rise saturation, LSB bounds, SQNR, bit/utilization sweeps, and seeded dither.",
      "Expose bit depth while holding signal peak fixed, then reverse the roles.",
      "Named failure: Overdrive the \u00b11 V converter so saturation error exceeds the half-LSB quantization bound.",
      "Exact recovery: Return the peak to 0.9 V and distinguish dithered quantization from clipping.",
      "Deliberately omitted: audio playback and MATLAB sound-device behavior; the claim remains deterministic software-only."
    ],
    "equations": [
      {
        "latex": "L=2^B",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "\\Delta=\\frac{2V_{FS}}{2^B}.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "c=\\left\\lfloor\\frac{x+V_{FS}}{\\Delta}\\right\\rfloor, \\qquad 0\\le c\\le L-1,",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
