  "content": {
    "guiding_question": "What information is lost when a continuous-looking signal is represented by discrete samples?",
    "physical_model": "Imagine a voltmeter that opens its eyes only at regularly spaced instants. For a continuous sinusoid \\[ x(t)=A\\cos(2\\pi f_0t+\\phi), \\] a sampler with interval \\(T_s=1/f_s\\) stores \\[ x[n]=x(nT_s)=A\\cos\\!\\left(2\\pi\\frac{f_0}{f_s}n+\\phi\\right). \\] The stored pair is the sample index (or its known time) and the measured amplitude. Nothing in that sequence directly records the path taken between two measurements. The baseline's dense curve is therefore a reference used by the experiment, not extra information available to the sampler.",
    "signal_flow": [
      "Start from the pinned source baseline and governing equations.",
      "Vary measurement rate while holding secondary stress fixed.",
      "Process the bounded deterministic measurement into the response view.",
      "Violate one central assumption, interpret the failure, and restore the baseline."
    ],
    "equations": [
      {
        "latex": "x(t)=A\\cos(2\\pi f_0t+\\phi),",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
