        "latex": "x[n]=x(nT_s)=A\\cos\\!\\left(2\\pi\\frac{f_0}{f_s}n+\\phi\\right).",
        "meaning": "Pinned source equation used to interpret the experiment response."
      },
      {
        "latex": "\\widehat{x}(t)=(1-\\alpha)x[n]+\\alpha x[n+1],\\qquad 0\\leq\\alpha\\leq1.",
        "meaning": "Pinned source equation used to interpret the experiment response."
      }
    ],
