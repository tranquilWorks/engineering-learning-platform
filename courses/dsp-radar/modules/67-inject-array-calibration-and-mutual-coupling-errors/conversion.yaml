  "content": {
    "guiding_question": "How sensitive are beamforming and DOA results to imperfect channels?",
    "physical_model": "A known 10-degree calibration source estimates each composite response after removing nominal steering. Equalization also colors receiver noise; MUSIC whitens with diag(|equalizer|\u00b2). Coupling and position errors make the residual direction-dependent.",
    "signal_flow": [
      "A known 10-degree calibration source estimates each composite response after removing nominal steering. Equalization also colors receiver noise; MUSIC whitens with diag(|equalizer|\u00b2). Coupling and position errors make the residual direction-dependent.",
      "Dividing by the raw calibration response without removing its known steering phase makes the calibration source appear at boresight.",
      "Divide the measured response by nominal 10-degree steering before equalization. This repairs the known direction on unchanged data; it does not identify a global coupling inverse.",
      "Explicit stage equations are retained in lesson.md. P65-P76 retain private source input formulas, with a fixed full-aperture noise crop for P75 controls. Plot/console presentation is adapted; no MATLAB runtime execution is claimed."
