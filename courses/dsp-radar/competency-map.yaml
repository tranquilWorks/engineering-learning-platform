schema_version: 1
course:
  id: dsp-radar
  title: DSP and Radar Learning Laboratory
  authority: Owner-authorized aggregate review of the pinned DSP/radar source and retained native numerical repairs.
  baseline: b107ac198543e8dfb563c6aae4175cc87da6210d
scope:
  target_learners:
  - Engineering learners who can manipulate algebraic equations and want executable DSP/radar reasoning before specialist
    implementation.
  prerequisites:
  - Algebra, trigonometry, complex numbers and elementary calculus.
  - Basic probability, vectors/matrices and units; covariance/eigendecomposition and conditional probability are
    developed where used.
  outcomes:
  - Explain a sampled-system result using complex phase, aliasing, noise, convolution and filtering assumptions.
  - Distinguish spectral display, physical resolution and uncertainty, and explain signed IQ processing through
    calibration and estimation.
  - Relate modulation, matched filtering and adaptation to decision statistics and defensible finite-trial uncertainty.
  - Connect radar power, waveform delay/compression, pulse ambiguity and coherent integration using consistent signs
    and units.
  - Choose and assess adaptive detection statistics with explicit training, valid-cell and finite-trial assumptions.
  - Distinguish clustering, state estimation, association, lifecycle and maneuver inference using report-driven
    histories.
  - Relate array geometry and calibration to beamforming, subspace and adaptive space-time evidence.
  - Separate FMCW delay/Doppler, multi-target pairing, virtual-array timing and time-varying Doppler under explicit
    conventions.
  - Explain coherent image formation, motion correction and passive/adaptive processing while distinguishing their
    geometry and assumptions.
  - Trace the retained end-to-end pulsed-radar mechanism and distinguish selected-scene changes from its fixed baseline
    track demonstration.
  exclusions:
  - Physical RF hardware, antenna/receiver calibration campaigns, EMC/regulatory qualification and operational radar
    acceptance.
  - Licensed MATLAB execution equivalence, real-time embedded throughput, concurrency certification and production
    deployment.
  - 'Universal integration of all branches in P84: it executes a pulsed-radar chain, while FMCW/array/imaging/passive
    competencies have separate cumulative portfolios.'
  - Representative-learner effectiveness and manual assistive-technology acceptance; no score or learner pass is
    recorded.
  cross_course_handoffs:
  - 'Controls/GNC: state-space modeling, covariance consistency and closed-loop estimation beyond these radar-report
    examples; consult its visible quality limits.'
  - 'Robotics/autonomy: perception/report interfaces, association and geometry; these experiments do not establish
    robot safety or field localization.'
  - 'Statistics/estimation and numerical optimization: inference assumptions, identifiability and constrained solvers
    beyond the bounded cases.'
  - 'RF, FPGA and embedded/HIL source curricula: physical front ends, data paths, timing and bench validation remain
    separate source-only or separately governed work.'
