provenance: {kind: python-first-native, source_equivalence_claimed: false, competency_map: ../../competency-map.yaml, matlab_runtime: not_run}
governing_equations:
- F_y=X[C_front,C_rear]^T+epsilon
- theta_hat=argmin_theta ||X_train theta-y_train||_2
- RMSE_validation=sqrt(mean((X_validation theta_hat-y_validation)^2))
signature:
- {field: front_stiffness_estimate, unit: N/rad}
- {field: rear_stiffness_estimate, unit: N/rad}
