teaching_invariant: The chronological validation segment remains untouched until all model fitting and parameter selection are complete.
limiting_cases:
- A larger training fraction leaves fewer future samples for the independent validation score.
- With vanishing disturbance and sufficient excitation both stiffness estimates approach their declared synthetic values.
