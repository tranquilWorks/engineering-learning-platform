title: Analyze Yaw and Sideslip Frequency Response
summary: Solve the complex bicycle-model response to sinusoidal steer and inspect yaw/sideslip magnitude, phase, DC gain, and equation residual.
guiding_question: When do yaw rate and sideslip stop following steering quasi-statically as excitation frequency rises?
