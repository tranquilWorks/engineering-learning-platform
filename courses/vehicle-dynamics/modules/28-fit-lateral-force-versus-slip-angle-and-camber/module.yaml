schema_version: 1
id: 28-fit-lateral-force-versus-slip-angle-and-camber
number: 28
title: Fit Lateral Force versus Slip Angle and Camber
summary: Separate cornering and camber stiffness in a bounded lateral-force fit with an explicit SAE-style sign convention.
guiding_question: How can a two-input experiment distinguish slip-angle force from camber thrust?
status: implemented
tags:
- vehicle-dynamics
- native-python
- tire-modeling
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
