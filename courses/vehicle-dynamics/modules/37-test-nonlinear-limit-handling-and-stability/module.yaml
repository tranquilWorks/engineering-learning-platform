number: 37
title: Test Nonlinear Limit Handling and Stability
summary: Couple bounded nonlinear axle forces to yaw moment, utilization, and local stability instead of extending linear force indefinitely.
guiding_question: Can a locally restoring yaw response still be invalid because one axle has exceeded tire capacity?
