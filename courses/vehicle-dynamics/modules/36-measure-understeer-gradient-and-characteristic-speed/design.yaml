  matlab_runtime: not_run
governing_equations:
- K=W_f/C_f-W_r/C_r
- delta=L/R+K a_y/g
- V_char=sqrt(g L/K) for K>0
signature:
- field: understeer_gradient
  unit: "deg/g"
- field: characteristic_speed
  unit: "m/s"
- field: steer_at_point_seven_g
  unit: "deg"
- field: handling_class_code
  unit: "1"
- field: steer_relation_residual
  unit: "deg"
teaching_invariant: Characteristic speed is reported only for positive understeer gradient, and the steer law uses axle stiffness in newtons per radian.
limiting_cases:
- At zero gradient the steer demand is purely geometric and characteristic speed is not finite.
- For negative gradient the instructional model classifies oversteer and does not invent a real characteristic speed.
