title: Measure Understeer Gradient and Characteristic Speed
summary: Derive the understeer gradient from axle loads and cornering stiffness and enforce the valid domain of characteristic speed.
guiding_question: How do axle load and cornering stiffness set steer demand, handling class, and characteristic speed?
