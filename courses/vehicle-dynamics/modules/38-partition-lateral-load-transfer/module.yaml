title: Partition Lateral Load Transfer
summary: Partition geometric and elastic lateral load transfer by axle, close roll moment, and connect the result to tire load sensitivity.
guiding_question: How do roll-center geometry and elastic roll stiffness distribute load transfer without creating extra roll moment?
