      "text": "Which force and power estimates can this simple alignment model support?",
      "reveal": "Camber force is odd in camber; toe scrub and power are even in toe. The camber error factor is exactly 180/π because that law is linear, whereas tan makes the scrub ratio nonlinear. A complete response separates the two mechanisms and declines to infer temperature or full suspension geometry from these estimates."
