governing_equations:
- anti_dive=eta_b tan(theta) L/h
- anti_squat=eta_d tan(theta) L/h
- Delta F_z=Delta F_geometry+Delta F_spring
signature:
- field: anti_dive_percentage
  unit: "%"
- field: anti_squat_percentage
  unit: "%"
- field: spring_supported_transfer
  unit: "N"
- field: geometry_supported_transfer
  unit: "N"
- field: pitch_transfer_closure_residual
  unit: "N"
teaching_invariant: Anti geometry partitions one longitudinal load-transfer total between suspension links and spring-supported pitch; it does not create or remove load transfer.
limiting_cases:
- At zero force-line angle, both anti percentages tend to zero and the spring-supported path carries the modeled transfer.
- As anti percentage approaches one within the non-lifting domain, the spring-supported share tends to zero.
