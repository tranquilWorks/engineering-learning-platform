governing_equations:
- gamma=gamma_0+g_gamma z+c_gamma F_y
- toe=toe_0+g_toe z+c_toe F_y
- k_wheel=k_spring MR(z)^2
signature:
- field: wheel_camber
  unit: "deg"
- field: wheel_toe
  unit: "deg"
- field: motion_ratio
  unit: "1"
- field: wheel_rate
  unit: "N/m"
- field: travel_unit_residual
  unit: "deg"
teaching_invariant: Kinematic gradients act on millimetres of wheel travel, compliance gradients act on newtons, and the two contributions superpose only under the declared sign convention.
limiting_cases:
- At zero travel and zero lateral force, alignment returns to the declared static camber and toe.
- With zero lateral force, the compliance contribution vanishes while bump kinematics and motion ratio remain.
