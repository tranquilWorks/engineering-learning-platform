  matlab_runtime: not_run
governing_equations:
- F=c_h v+(c_l-c_h)v/(1+|v|/v_k)
- dF/dv tends to c_l at v=0
- E_cycle=integral F(v) v dt
signature:
- field: force_at_low_speed
  unit: "N"
- field: force_at_high_speed
  unit: "N"
- field: apparent_low_speed_slope
  unit: "N*s/m"
- field: dissipated_cycle_energy
  unit: "J"
- field: velocity_unit_residual
  unit: "N"
teaching_invariant: The damper law is continuous, odd-symmetric, and dissipative, with the tangent slope transitioning from the low-speed coefficient toward the declared high-speed coefficient.
limiting_cases:
- As shaft velocity tends to zero, force tends to zero and tangent slope tends to the low-speed coefficient.
- At large velocity magnitude, tangent slope approaches the high-speed coefficient while force remains opposite motion by convention.
