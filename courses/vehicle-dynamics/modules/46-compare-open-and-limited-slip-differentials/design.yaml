teaching_invariant: Torque bias can redistribute demand between wheels but cannot exceed either wheel capacity or total driveshaft demand.
limiting_cases:
- At a torque-bias ratio of one, the limited-slip allocation tends toward equal wheel force.
- When both wheel capacities exceed half the demand, the open differential can deliver the entire demand.
