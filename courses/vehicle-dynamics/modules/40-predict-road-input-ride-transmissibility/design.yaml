governing_equations:
- f=v/lambda_road
- H=(k+j c omega)/(k-m omega^2+j c omega)
- a_body=|H| z_road omega^2
signature:
- field: displacement_transmissibility
  unit: "1"
- field: body_displacement_phase
  unit: "deg"
- field: body_acceleration_amplitude
  unit: "m/s^2"
- field: excitation_to_natural_frequency_ratio
  unit: "1"
- field: base_excitation_residual
  unit: "1"
teaching_invariant: Road spatial frequency becomes temporal hertz through speed divided by wavelength, then angular frequency enters the base-excitation equation as two pi times hertz.
limiting_cases:
- At zero temporal frequency, displacement transmissibility tends to one and acceleration tends to zero.
- Far above resonance, sprung displacement attenuates even though acceleration weighting by omega squared can remain important.
scenarios:
  baseline:
    speed_m_s: 22
    road_wavelength_m: 8
    broken_mode: false
  sweep_1:
