teaching_invariant: Bias is removed in sensor coordinates before a radian-valued orthonormal rotation maps the measurement into forward-left body axes.
limiting_cases:
- At zero mounting angle only bias removal changes the acceleration components.
- A correct rotation preserves the calibrated acceleration-vector norm for every allowed angle.
