module: 55-calibrate-sensors-and-transform-measured-axes
provenance: {kind: python-first-native, source_equivalence_claimed: false, competency_map: ../../competency-map.yaml, matlab_runtime: not_run}
governing_equations:
- a_sensor=S_sensor R(-psi_mount)a_body+b_sensor
- a_body_hat=R(psi_mount)S_sensor^-1(a_sensor-b_sensor)
- yaw_body=yaw_measured-b_yaw
signature:
- {field: body_longitudinal_acceleration, unit: "m/s^2"}
- {field: body_lateral_acceleration, unit: "m/s^2"}
- {field: calibrated_yaw_rate, unit: deg/s}
