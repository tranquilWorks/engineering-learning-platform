teaching_invariant: Clock epochs must align before interpolation, and every repaired interval must stay within a declared maximum gap.
limiting_cases:
- With zero clock offset the epoch correction vanishes but gap detection remains active.
- Longer drop periods reduce missing samples without changing the reference-grid sample count.
