teaching_invariant: For an exponent below one, peak force grows with normal load while effective friction falls, and unequal load sharing reduces paired capacity.
limiting_cases:
- At exponent one the force law is linear and load-transfer loss is zero.
- At zero load-transfer fraction the even and split paired capacities are identical.
