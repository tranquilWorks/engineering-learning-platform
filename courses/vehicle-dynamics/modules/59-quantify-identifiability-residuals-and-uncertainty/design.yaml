teaching_invariant: Parameter claims require sufficient excitation, structured-residual inspection, declared noise scale, and covariance coverage rather than fit error alone.
limiting_cases:
- Lower excitation reduces singular values and increases parameter uncertainty for fixed observation noise.
- Understating force-noise scale narrows intervals without changing the least-squares point estimate.
