schema_version: 1
id: 25-measure-motion-in-body-path-and-wheel-frames
number: 25
title: Measure Motion in Body, Path, and Wheel Frames
summary: Resolve one planar velocity through inertial, path, body, and steered-wheel frames while checking round-trip and norm invariants.
guiding_question: Which frame owns each velocity component, and how can invariants expose a silent angle-unit error?
status: implemented
tags:
- vehicle-dynamics
- native-python
- tire-modeling
