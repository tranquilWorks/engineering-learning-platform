- type: prediction
  title: Predict before running
  text: A proper planar rotation preserves speed norm, and a transform followed by its inverse recovers the original vector in the same angle unit.
  reveal: Convert every declared degree angle exactly once at the frame boundary, then verify both the expected path components and the rotation norm invariant.
