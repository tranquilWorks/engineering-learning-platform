{
  "schema_version": 1,
  "course": {
    "id": "vehicle-dynamics",
    "title": "Vehicle Dynamics and Motorsport Engineering",
    "authority": "tranquilWorks/portfolio-control#467 and the pinned vehicle-dynamics-learning source",
    "baseline": "57264b3ffeb517ee5eb73e8957b9cd190d022457"
  },
  "scope": {
    "target_learners": [
      "Engineers and advanced learners who know algebra, trigonometry, introductory calculus, and basic mechanics",
      "Motorsport practitioners who need traceable models from telemetry through setup and lap performance"
    ],
    "prerequisites": [
      "Algebra, trigonometry, derivatives, integrals, vectors, and ordinary differential equations",
      "Introductory Newtonian mechanics, energy, power, and free-body diagrams",
      "Basic programming and numerical-array literacy",
      "Controls/GNC and Statistics/Estimation cross-links when general controller or estimator theory is required"
    ],
    "outcomes": [
      "Derive and execute bounded vehicle, tire, suspension, powertrain, brake, aero, and lap-performance models with explicit assumptions and units",
      "Decode and replay privacy-safe GR86 CAN/BLE telemetry, reconstruct state, identify parameters, and quantify residuals and uncertainty",
      "Predict and compare handling, ride, acceleration, braking, thermal, setup, racing-line, and lap-time behavior without hiding validity limits",
      "Integrate telemetry-to-model validation and a requirements-traced GR86 digital twin with named failure and recovery paths"
    ],
    "exclusions": [
      "No claim of licensed MATLAB parity unless MATLAB actually executes or retained source-runtime vectors are reviewed",
      "No live vehicle control, actuation, autonomous driving, ECU calibration write, safety certification, or road/track operating authority",
      "No private VIN, driver identity, precise real route, or unnecessary location trace in replay fixtures",
      "No detailed general control, estimator, optimizer, real-time scheduler, embedded bus, or HIL theory duplicated from its owning course",
      "No browser/accessibility, representative-learner, physical HIL/hardware, bench, vehicle, field, release, deployment, or production claim without separate evidence"
    ],
    "cross_course_handoffs": [
      "Controls/GNC owns general feedback, observers, Kalman filtering, constrained control, and implementation-effect theory; Vehicle Dynamics applies bounded vehicle-specific instances",
      "Statistics/Estimation owns general probability, experiment design, regression, uncertainty, and inference theory; Vehicle Dynamics owns vehicle-specific excitation, residuals, and validation",
      "Numerical Optimization owns general nonlinear programming and solver theory; Vehicle Dynamics owns racing-line, setup, and lap constraints",
      "Embedded RT/HIL and HWIL Systems own real-time scheduling, electrical buses, interfaces, physical HIL, and hardware qualification; Vehicle Dynamics consumes offline timestamped data only",
      "Robotics/Autonomy owns general localization, mapping, and planning; Vehicle Dynamics owns closed-course motion reconstruction and performance modeling"
    ]
  },
