schema_version: 1
course:
  id: controls-gnc
  title: Controls, State Estimation, Guidance, and Navigation Laboratory
  authority: tranquilWorks/portfolio-control#439
  baseline: 88e8f7407ce516a16e9397318c38902a78c11070
scope:
  target_learners:
  - Engineers or graduate students with calculus, differential equations, linear algebra, probability fundamentals,
    and Python literacy.
  prerequisites:
  - Complex arithmetic, eigenvalues, matrices, first-order ordinary differential equations, and basic probability.
  - Ability to read Python and interpret time histories, frequency responses, and covariance matrices.
  outcomes:
  - Model, identify, linearize, realize, and validate dynamic plants with explicit operating domains and uncertainty.
  - Design and assess classical, multivariable, state-space, optimal, nonlinear, constrained, robust, adaptive,
    and digital feedback.
  - Build and monitor stochastic, nonlinear, smoothed, inertial, GNSS, and error-state navigation estimates.
  - Generate waypoint, path, pursuit, proportional-navigation, terminal, and actuator-aware guidance commands.
  - Integrate identification, control, estimation, navigation, guidance, constraints, monitoring, timing, faults,
    and recovery in three cumulative capstones.
  exclusions:
  - Detailed aerodynamic derivative identification, propulsion, flexible-body, and vehicle-specific flight dynamics
    belong to Flight Dynamics.
  - Optimization algorithm derivation beyond the bounded quadratic programs used by MPC belongs to Numerical Optimization.
  - Advanced stochastic-process proofs, Allan-variance characterization, and particle-method theory belong to Statistics
    and Estimation or the named Robotics handoff.
  - Physical HIL, flight test, certification, production deployment, MATLAB runtime equivalence, accessibility validation,
    and learner-effectiveness validation are not claimed.
  - The navigation capstone is a non-weapon autonomous survey mission; P22 and P64 remain bounded guidance-method
    lessons, not system-use endorsements.
  cross_course_handoffs:
  - 'flight-dynamics-learning: aerodynamic, propulsion, trim, stability-derivative, and six-degree-of-freedom depth.'
  - 'stats-estimation-learning: stochastic-process, covariance, identification, and advanced Bayesian depth.'
  - 'numerical-optimization-learning: solver derivations, conditioning, convexity, and nonlinear optimization depth.'
  - 'embedded-rt-hil-learning and hwil-systems-learning: target timing, buses, benches, physical I/O, and qualification.'
  - 'reliability-fdir-learning: fault trees, coverage, redundancy policy, and certification evidence.'
  - 'robotics-autonomy-learning P15 and DSP/Radar P60: particle-filter and interacting-multiple-model worked implementations;
    Controls/GNC retains EKF, UKF, RTS, consistency, and the selection tradeoff.'
  - 'robotics-autonomy-learning and vehicle-dynamics-learning: SLAM, mission autonomy, manipulation, and ground-vehicle-specific
    dynamics/control.'
