assessments:
- id: A-MODELING
  type: cumulative
  competency_ids:
  - MODEL-LINEARIZATION
  - MODEL-REALIZATION
  evidence: Operating-point residuals, Jacobian checks, transfer/state equivalence, block reduction, and local-model
    error.
- id: A-CLASSICAL
  type: cumulative
  competency_ids:
  - CLASSICAL-SPECS
  - CLASSICAL-STABILITY
  evidence: Transient, system-type, root-locus, margin, Nyquist encirclement, and stability criteria.
- id: A-LOOP
  type: cumulative
  competency_ids:
  - LOOP-SHAPING
  evidence: Sensitivity, noise, disturbance, effort, Bode, lead/lag, notch, and prefilter tradeoffs.
- id: A-MIMO
  type: cumulative
  competency_ids:
  - MULTIVARIABLE-CONTROL
  evidence: Interaction, zero, relative-gain, decoupling, and allocation-residual checks.
- id: A-STATE
  type: cumulative
  competency_ids:
  - STATE-REALIZATION
  - STATE-FEEDBACK
  evidence: Mode, transition, conditioning, controllability, pole-placement, servo, and limiting checks.
- id: A-OPTIMAL-EST
  type: cumulative
  competency_ids:
  - OPTIMAL-ESTIMATION
  evidence: Separate controller/estimator Riccati, separation-principle, LQG stability, and covariance checks.
- id: A-OPTIMAL
  type: cumulative
  competency_ids:
  - OPTIMAL-CONTROL
  evidence: Infinite/finite/time-varying horizon objectives, terminal cost, constraint, and effort checks.
- id: A-DIGITAL
  type: cumulative
  competency_ids:
  - DIGITAL-IMPLEMENTATION
  evidence: Discretization, aliasing, quantization, jitter, delay, multirate, switching, limiting, and recovery
    checks.
- id: A-NONLINEAR
  type: cumulative
  competency_ids:
  - NONLINEAR-STABILITY
  - NONLINEAR-CONTROL
  evidence: Phase-plane, local/global, Lyapunov, attraction, scheduling, and feedback-linearization criteria.
- id: A-CONSTRAINTS
  type: cumulative
  competency_ids:
  - SAFETY-CONSTRAINTS
  evidence: Barrier, feasibility, prediction, state/input limit, terminal, and fallback checks.
- id: A-ROBUST
  type: cumulative
  competency_ids:
  - ROBUST-ADAPTIVE
  evidence: Declared structured-uncertainty, robust bound, schedule, adaptation, and counterexample checks.
- id: A-IDENTIFICATION
  type: cumulative
  competency_ids:
  - SYSTEM-IDENTIFICATION
  evidence: Excitation richness, parameter confidence, held-out residual, mismatch, and online convergence checks.
- id: A-STOCHASTIC
  type: cumulative
  competency_ids:
  - STOCHASTIC-ESTIMATION
  evidence: Covariance, innovation whiteness, NIS, NEES, gate, and outlier-recovery checks.
- id: A-NONLINEAR-EST
  type: cumulative
  competency_ids:
  - NONLINEAR-ESTIMATION
  evidence: EKF Jacobian, UKF sigma-point, smoother consistency, and declared cross-course handoff checks.
- id: A-NAV-FRAMES
  type: cumulative
  competency_ids:
  - NAV-FRAMES-ATTITUDE
  evidence: Round-trip frame, handedness, quaternion norm/sign, alignment, covariance, and observability checks.
- id: A-NAVIGATION
  type: cumulative
  competency_ids:
  - INERTIAL-NAVIGATION
  evidence: IMU error growth, mechanization, pseudorange geometry, ESKF consistency, bias, and observability checks.
- id: A-INTEGRITY
  type: cumulative
  competency_ids:
  - NAV-INTEGRITY
  evidence: Protection-level, fault-detection, exclusion, availability, recovery, and non-certification boundaries.
- id: A-GUIDANCE
  type: cumulative
  competency_ids:
  - GUIDANCE-DESIGN
  evidence: Cross-track, pursuit geometry, PN convention, terminal, actuator, feasibility, and miss criteria.
- id: A-REALTIME
  type: cumulative
  competency_ids:
  - ACTUATION-REALTIME
  evidence: Sensor/actuator, rate, delay, watchdog, allocation, timestamp, and software-HIL evidence.
- id: A-CAP-ID
  type: capstone
  competency_ids:
  - INTEGRATED-GNC
  - SYSTEM-IDENTIFICATION
  - ROBUST-ADAPTIVE
  - OPTIMAL-ESTIMATION
  evidence: Reuse identification data/model, controller, estimator, and uncertainty artifacts in one independently
    scored closed loop.
- id: A-CAP-NAV
  type: capstone
  competency_ids:
  - INTEGRATED-GNC
  - INERTIAL-NAVIGATION
  - NAV-INTEGRITY
  - GUIDANCE-DESIGN
  - SAFETY-CONSTRAINTS
  evidence: Reuse navigation, integrity, guidance, and constraint artifacts in an autonomous survey mission.
- id: A-CAP-HIL
  type: capstone
  competency_ids:
  - INTEGRATED-GNC
  - ACTUATION-REALTIME
  - NAV-INTEGRITY
  - ROBUST-ADAPTIVE
  evidence: Trace requirements to timing, injected faults, pass/fail evidence, recovery, and explicit physical-validation
    gaps.
