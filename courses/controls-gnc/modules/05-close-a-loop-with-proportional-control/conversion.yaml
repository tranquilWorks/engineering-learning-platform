content:
  guiding_question: What inputs, observable effects, and failure modes matter when you close a Loop with Proportional
    Control?
  physical_model: Make proportional feedback speed/error tradeoffs and the sign of feedback visible.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \tau\dot y=-y+G K_p(r-y)
    meaning: Negative feedback increases the closed-loop rate.
  - latex: y_{ss}=GK_p r/(1+GK_p)
    meaning: Proportional control retains a finite step error.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 5
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 64e4cb30bbceb4105ab283c752f2e5c8eeca9dde956019bf9aa0403e4d9058c7
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Proportional closed-loop response
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Normalized plant output
      unit: ratio
    interpretation: negative feedback is bounded while the reversed sign is unstable
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Control action and tracking error
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Normalized control command
      unit: ratio
    - role: y
      label: Tracking error
      unit: ratio
    interpretation: plant output grows under positive feedback
  sweeps:
  - control: proportional_gain
    values:
    - 0.5
    - 2.0
    - 6.0
    expected_observation: Gain should speed the response and reduce—but not eliminate—the step error.
  - control: plant_time_constant_s
    values:
    - 0.5
    - 1.0
    - 3.0
    expected_observation: Make proportional feedback speed/error tradeoffs and the sign of feedback visible.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken toggle reverses the measurement sign, producing positive feedback.
    recovery: Disable the broken case to restore subtraction at the summing junction.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
