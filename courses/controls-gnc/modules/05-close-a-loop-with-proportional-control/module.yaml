schema_version: 1
id: 05-close-a-loop-with-proportional-control
number: 5
title: Close a Loop with Proportional Control
summary: Make proportional feedback speed/error tradeoffs and the sign of feedback visible.
guiding_question: What inputs, observable effects, and failure modes matter when you close a Loop with
  Proportional Control?
status: implemented
tags:
- controls-gnc
- feedback-fundamentals
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
