content:
  guiding_question: What inputs, observable effects, and failure modes matter when you relate Poles to
    Visible Motion?
  physical_model: Translate complex pole location into decay, oscillation, and instability.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: x(t)=e^{\sigma t}\cos(\omega t)
    meaning: The real part sets the envelope and the imaginary part sets oscillation rate.
  - latex: T=2\pi/|\omega|
    meaning: Imaginary pole magnitude maps directly to period.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 3
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 79cd0a7b87dd97e194f1f20df12d476cd103ab9780b5a68589fb5beebc2d6338
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Translate complex pole location into decay, oscillation, and instability.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case reflects a stable pole into the right half-plane, turning decay into
      exponential growth.
  sweeps:
  - control: pole_real_per_s
    values:
    - -1.0
    - -0.5
    - 0.2
    expected_observation: Moving sigma right slows decay and eventually turns the envelope into growth.
  - control: pole_imag_rad_s
    values:
    - 0.5
    - 2.0
    - 5.0
    expected_observation: Translate complex pole location into decay, oscillation, and instability.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case reflects a stable pole into the right half-plane, turning decay into exponential
      growth.
    recovery: Disable the broken case and keep the real part negative.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
