content:
  guiding_question: What inputs, observable effects, and failure modes matter when you generate a Feasible
    Trajectory?
  physical_model: Generate a rest-to-rest quintic and test speed/acceleration feasibility.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: x=x_f(10s^3-15s^4+6s^5)
    meaning: The quintic satisfies zero endpoint velocity and acceleration.
  - latex: s=t/T
    meaning: Duration scales velocity by 1/T and acceleration by 1/T squared.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 21
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 9614292d843643bd786b8b3e474296172403b1be9a1ca9387c8106c862207844
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Generate a rest-to-rest quintic and test speed/acceleration feasibility.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case forces the 20 m move into 4 s, exceeding the declared speed/acceleration
      limits.
  sweeps:
  - control: target_position_m
    values:
    - 5.0
    - 20.0
    - 30.0
    expected_observation: Shortening duration should raise peak acceleration faster than peak speed.
  - control: move_duration_s
    values:
    - 4.0
    - 8.0
    - 14.0
    expected_observation: Generate a rest-to-rest quintic and test speed/acceleration feasibility.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case forces the 20 m move into 4 s, exceeding the declared speed/acceleration
      limits.
    recovery: Disable the broken case and lengthen the move until both constraints pass.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
