schema_version: 1
id: 60-solve-a-gnss-pseudorange-navigation-fix
number: 60
title: Solve a GNSS Pseudorange Navigation Fix
summary: Relate range noise and geometry dilution to position/clock error and reject a near-collinear geometry.
guiding_question: How do receiver clock bias and satellite geometry jointly determine a pseudorange solution?
status: implemented
tags:
- controls-gnc
- native-python
- navigation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
