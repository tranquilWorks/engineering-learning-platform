  type: slider
  label: Pseudorange noise
  default: 2.0
  unit: m
  minimum: 0.1
  maximum: 10.0
  step: 0.1
- id: geometry_dilution
  type: slider
  label: Geometry dilution
  default: 2.2
  unit: '1'
  minimum: 1.0
  maximum: 12.0
  step: 0.2
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
