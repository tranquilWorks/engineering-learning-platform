schema_version: 1
id: 60-solve-a-gnss-pseudorange-navigation-fix
number: 60
title: Solve Position and Clock from Synthetic Pseudoranges
summary: Eight synthetic pseudoranges determine position and clock by nonlinear least squares. Concentration
  changes actual lines of sight; position dilution is computed from the fitted geometry. This omits atmospheric,
  orbital and Earth-rotation errors.
guiding_question: Why is geometry concentration an input while PDOP is an output, and why does clock omission
  affect position?
status: implemented
tags:
- controls-gnc
- native-python
- navigation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: pseudorange_noise_m
  type: slider
  label: Pseudorange noise
  default: 2.0
  unit: m
  minimum: 0.1
  maximum: 10.0
  step: 0.1
- id: geometry_dilution
  type: slider
  label: Geometry concentration
  default: 2.2
  unit: '1'
  minimum: 1.0
  maximum: 12.0
  step: 0.2
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict whether removing the receiver clock unknown merely changes clock error or also biases position.
  reveal: Concentration constructs lines of sight. Their design matrix determines PDOP. The omitted common
    range offset projects onto position columns, biasing the fitted position; it cannot generally be represented
    by a harmless display-only clock error.
