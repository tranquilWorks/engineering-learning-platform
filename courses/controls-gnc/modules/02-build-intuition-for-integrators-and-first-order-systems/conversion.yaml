content:
  guiding_question: What inputs, observable effects, and failure modes matter when you build Intuition
    for Integrators and First-Order Systems?
  physical_model: Compare accumulation with exponential memory under the same step input.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot{x}_I=u
    meaning: An integrator accumulates area and has no finite step equilibrium.
  - latex: \tau\dot{y}+y=Ku
    meaning: A first-order state approaches Ku with time constant tau.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 2
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: f4a3884c19df9b4811b5b1e406ddad8c2625ccf02e88c88c4349cd90df6e72a2
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Compare accumulation with exponential memory under the same step input.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case uses forward Euler with dt/tau greater than two, creating a discrete
      pole outside the unit circle.
  sweeps:
  - control: input_amplitude
    values:
    - 0.5
    - 1.0
    - 1.5
    expected_observation: The integrator ramp slope follows input amplitude; the first-order final value
      does not depend on tau.
  - control: time_constant_s
    values:
    - 0.5
    - 2.0
    - 4.0
    expected_observation: Compare accumulation with exponential memory under the same step input.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case uses forward Euler with dt/tau greater than two, creating a discrete pole
      outside the unit circle.
    recovery: Disable the broken case to use the exact first-order transition.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
