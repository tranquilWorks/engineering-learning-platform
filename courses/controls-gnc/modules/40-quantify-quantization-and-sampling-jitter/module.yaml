schema_version: 1
id: 40-quantify-quantization-and-sampling-jitter
number: 40
title: Quantify Quantization and Sampling Jitter
summary: Sample a deterministic sinusoid on a jittered clock, quantize it, and separate level error from timing-induced
  phase error.
guiding_question: How do amplitude quantization and clock jitter create different error signatures in sampled feedback
  data?
status: implemented
tags:
- controls-gnc
- native-python
- state-space-and-digital-control
