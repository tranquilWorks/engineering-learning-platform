  type: slider
  label: Converter resolution
  default: 10.0
  unit: bit
  minimum: 3.0
  maximum: 16.0
  step: 1.0
- id: jitter_fraction
  type: slider
  label: Peak jitter fraction
  default: 0.03
  unit: sample
  minimum: 0.0
  maximum: 0.45
  step: 0.01
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
