  source: lesson.md
- type: prediction
  title: Predict before running
  text: Quantization error follows converter step size, while jitter error scales with signal slope and timing displacement.
  reveal: Restore adequate resolution and clock stability, then budget quantization and jitter as separate mechanisms
    before combining them.
