schema_version: 1
id: 06-tune-a-pid-by-observing-each-term
number: 6
title: Tune a PID by Observing Each Term
summary: Observe proportional, integral, and derivative actions separately on a loaded carriage.
guiding_question: What inputs, observable effects, and failure modes matter when you tune a PID by Observing
  Each Term?
status: implemented
tags:
- controls-gnc
- feedback-fundamentals
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: integral_gain
  type: slider
  label: Integral gain
  default: 1.0
  unit: 1/s
  minimum: 0.0
  maximum: 4.0
  step: 0.25
- id: derivative_gain
  type: slider
  label: Derivative gain
  default: 3.0
  unit: s
  minimum: 0.0
  maximum: 8.0
  step: 0.25
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Integral action should remove load error; derivative action should suppress overshoot.
  reveal: Disable the broken case to restore derivative damping.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
