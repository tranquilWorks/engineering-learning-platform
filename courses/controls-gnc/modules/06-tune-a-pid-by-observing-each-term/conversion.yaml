content:
  guiding_question: What inputs, observable effects, and failure modes matter when you tune a PID by Observing
    Each Term?
  physical_model: Observe proportional, integral, and derivative actions separately on a loaded carriage.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u=K_pe+K_i\int e\,dt-K_d\dot{x}
    meaning: Each term reacts to a different feature of error.
  - latex: m\ddot{x}=u+F_{load}-b\dot{x}
    meaning: The controller must accelerate the mass and reject load.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 6
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: d6e8cd665c87be78898d0fabcefbc0311f3a2928c15a1fa1acfe05e24590fe07
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Observe proportional, integral, and derivative actions separately on a loaded carriage.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case applies derivative action with the wrong sign, injecting velocity
      instead of damping it.
  sweeps:
  - control: integral_gain
    values:
    - 0.0
    - 1.0
    - 3.0
    expected_observation: Integral action should remove load error; derivative action should suppress
      overshoot.
  - control: derivative_gain
    values:
    - 0.0
    - 3.0
    - 7.0
    expected_observation: Observe proportional, integral, and derivative actions separately on a loaded
      carriage.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case applies derivative action with the wrong sign, injecting velocity instead
      of damping it.
    recovery: Disable the broken case to restore derivative damping.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
