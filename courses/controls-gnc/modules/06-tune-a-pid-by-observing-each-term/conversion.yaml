content:
  guiding_question: What inputs, observable effects, and failure modes matter when you tune a PID by Observing Each
    Term?
  physical_model: Observe proportional, integral, and derivative actions separately on a loaded carriage.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u=K_pe+K_i\int e\,dt-K_d\dot{x}
    meaning: Each term reacts to a different feature of error.
  - latex: m\ddot{x}=u+F_{load}-b\dot{x}
    meaning: The controller must accelerate the mass and reject load.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 6
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: bc32db1cbbd84329fdfb5c4265b6226f46eaea655131692263a6506b2d1761ba
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: PID position response
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Position
      unit: m
    interpretation: correct derivative feedback dissipates rather than injects energy
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: PID command decomposition
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Force contribution
      unit: N
    interpretation: derivative action injects energy and command magnitude grows
  sweeps:
  - control: integral_gain
    values:
    - 0.0
    - 1.0
    - 3.0
    expected_observation: Integral action should remove load error; derivative action should suppress overshoot.
  - control: derivative_gain
    values:
    - 0.0
    - 3.0
    - 7.0
    expected_observation: Observe proportional, integral, and derivative actions separately on a loaded carriage.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case applies derivative action with the wrong sign, injecting velocity instead of damping
      it.
    recovery: Disable the broken case to restore derivative damping.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
