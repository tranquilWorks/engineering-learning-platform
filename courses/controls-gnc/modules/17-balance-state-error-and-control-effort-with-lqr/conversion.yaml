content:
  guiding_question: What inputs, observable effects, and failure modes matter when you balance State Error
    and Control Effort with LQR?
  physical_model: Trade position regulation against command effort with a discrete LQR design.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: J=\sum(x^TQx+u^TRu)
    meaning: The cost declares the state/effort tradeoff.
  - latex: u_k=-Kx_k
    meaning: Riccati feedback minimizes the declared quadratic cost.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 17
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 91ec483788d5e262abd21620dcaa118c38621b062dfc4a106ad665f306b7f1bc
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Trade position regulation against command effort with a discrete LQR design.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case sets actuator effectiveness to zero, so a valid design model cannot
      move the plant.
  sweeps:
  - control: position_weight
    values:
    - 1.0
    - 4.0
    - 16.0
    expected_observation: More position weight should regulate faster with a larger peak command.
  - control: control_weight
    values:
    - 0.1
    - 1.0
    - 10.0
    expected_observation: Trade position regulation against command effort with a discrete LQR design.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case sets actuator effectiveness to zero, so a valid design model cannot move
      the plant.
    recovery: Disable the broken case and verify actuator authority before applying the gain.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
