content:
  guiding_question: What inputs, observable effects, and failure modes matter when you implement Proportional Navigation?
  physical_model: Observe proportional navigation geometry, acceleration authority, and miss distance.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: a_n=N V_c\dot\lambda
    meaning: PN commands lateral acceleration from closing speed and line-of-sight rate.
  - latex: \dot\lambda=(r_xv_y-r_yv_x)/\|r\|^2
    meaning: LOS rotation encodes collision-course error.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 22
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 3602b21b87ef702fe69dcaad76b0bd419ce2e18f314b2be5bbdcf5db524d4286
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Proportional-navigation engagement geometry
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Range
      unit: m
    - role: y
      label: Line-of-sight angle
      unit: deg
    interpretation: PN acceleration respects the declared saturation
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Lateral-acceleration authority
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Lateral acceleration
      unit: m/s²
    interpretation: the acceleration clips and the modeled engagement misses
  sweeps:
  - control: navigation_constant
    values:
    - 2.0
    - 3.0
    - 5.0
    expected_observation: Insufficient lateral acceleration should leave a finite miss even with a reasonable navigation
      constant.
  - control: maximum_acceleration_m_s2
    values:
    - 20.0
    - 80.0
    - 120.0
    expected_observation: Observe proportional navigation geometry, acceleration authority, and miss distance.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case limits lateral acceleration to 5 m/s², preventing intercept in the modeled engagement.
    recovery: Disable the broken case and restore the 80 m/s² authority used by the baseline.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
