content:
  guiding_question: What inputs, observable effects, and failure modes matter when you implement Proportional
    Navigation?
  physical_model: Observe proportional navigation geometry, acceleration authority, and miss distance.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: a_n=N V_c\dot\lambda
    meaning: PN commands lateral acceleration from closing speed and line-of-sight rate.
  - latex: \dot\lambda=(r_xv_y-r_yv_x)/\|r\|^2
    meaning: LOS rotation encodes collision-course error.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 22
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 491dabf12a65da0dae96b53953dbf6ffbf4ae9d2421a6df5c954c29f0da6ed90
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Observe proportional navigation geometry, acceleration authority, and miss distance.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case limits lateral acceleration to 5 m/s², preventing intercept in the
      modeled engagement.
  sweeps:
  - control: navigation_constant
    values:
    - 2.0
    - 3.0
    - 5.0
    expected_observation: Insufficient lateral acceleration should leave a finite miss even with a reasonable
      navigation constant.
  - control: maximum_acceleration_m_s2
    values:
    - 20.0
    - 80.0
    - 120.0
    expected_observation: Observe proportional navigation geometry, acceleration authority, and miss distance.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case limits lateral acceleration to 5 m/s², preventing intercept in the modeled
      engagement.
    recovery: Disable the broken case and restore the 80 m/s² authority used by the baseline.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
