content:
  guiding_question: What inputs, observable effects, and failure modes matter when you fuse Noisy Sensors with a
    Kalman Filter?
  physical_model: Fuse noisy position samples with a deterministic constant-velocity Kalman filter.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: K_k=P^-C^T(CP^-C^T+R)^{-1}
    meaning: Kalman gain balances predicted and measured uncertainty.
  - latex: P^+=(I-KC)P^-
    meaning: The covariance update records information gained from the sensor.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 16
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: a960fdc9be56bf06efae0a70dc197f41a25669db2f112420fd1ecbfcf4ebf635
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Kalman position fusion
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Position
      unit: m
    interpretation: Kalman covariance assumptions yield a finite deterministic estimate
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Kalman state-estimation error
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Position error
      unit: m
    - role: y
      label: Velocity estimate
      unit: m/s
    interpretation: the deterministic outlier increases estimation error
  sweeps:
  - control: assumed_sensor_noise_m
    values:
    - 0.15
    - 0.35
    - 0.8
    expected_observation: Assuming noisier measurements should smooth the estimate but slow its response to real
      motion changes.
  - control: assumed_process_noise_m_s2
    values:
    - 0.02
    - 0.08
    - 0.3
    expected_observation: Fuse noisy position samples with a deterministic constant-velocity Kalman filter.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case injects one unvalidated 4 m position outlier.
    recovery: Disable the broken case; in production, gate innovations before applying the update.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
