content:
  guiding_question: How do mass, stiffness, and damping determine visible motion?
  physical_model: Relate inertia, energy storage, and dissipation to a forced mechanical response.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: m\ddot{x}+c\dot{x}+kx=F
    meaning: Force divides among inertia, damping, and spring reaction.
  - latex: \omega_n=\sqrt{k/m},\quad\zeta=c/(2\sqrt{km})
    meaning: Natural frequency and damping ratio predict the visible motion.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 1
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: cc30b63741eac8e0406fd3dc3a3f743d4c0e4e2d4b00bd9dbf8e55cfd819a1ea
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Relate inertia, energy storage, and dissipation to a forced mechanical response.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case uses an explicit integration step too large for the fastest mode,
      so numerical energy grows even though the physical system is damped.
  sweeps:
  - control: damping_ns_m
    values:
    - 0.2
    - 0.8
    - 2.5
    expected_observation: More damping should reduce ringing without changing the static displacement
      F/k.
  - control: stiffness_n_m
    values:
    - 1.0
    - 4.0
    - 10.0
    expected_observation: Relate inertia, energy storage, and dissipation to a forced mechanical response.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case uses an explicit integration step too large for the fastest mode, so numerical
      energy grows even though the physical system is damped.
    recovery: Disable the broken case to restore a time step that resolves the natural period.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
