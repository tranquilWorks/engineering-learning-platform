content:
  guiding_question: What inputs, observable effects, and failure modes matter when you reject a Disturbance with
    Feedback?
  physical_model: Separate true disturbance rejection from the cost of measurement bias.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot y=-y-K(y+b)+d
    meaning: Feedback rejects plant disturbance but reacts to sensor bias as if it were real output.
  - latex: '|S_d(j\omega)|=1/\sqrt{(1+K)^2+\omega^2}'
    meaning: Rejection is strongest below loop bandwidth.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 8
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 2542d20a9ca54940146b92ed31b5103f554b84dba641ee77e8c818fd4be35e01
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Disturbance rejection response
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Plant disturbance
      unit: normalized input
    - role: y
      label: True output
      unit: normalized output
    interpretation: sensitivity attenuation matches the closed-loop frequency relation
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Measurement and feedback command
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Measured output
      unit: normalized output
    - role: y
      label: Control command
      unit: normalized input
    interpretation: feedback reacts to sensor bias and creates costly true motion
  sweeps:
  - control: feedback_gain
    values:
    - 1.0
    - 4.0
    - 9.0
    expected_observation: More gain should reject a slow plant disturbance but amplify control response to bias.
  - control: disturbance_frequency_rad_s
    values:
    - 0.0
    - 2.0
    - 8.0
    expected_observation: Separate true disturbance rejection from the cost of measurement bias.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case injects a 0.5-unit sensor bias with no physical disturbance.
    recovery: Disable the broken case and validate/calibrate the sensor bias.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
