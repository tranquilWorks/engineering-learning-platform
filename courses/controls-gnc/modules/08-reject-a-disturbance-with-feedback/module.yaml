schema_version: 1
id: 08-reject-a-disturbance-with-feedback
number: 8
title: Reject a Disturbance with Feedback
summary: Separate true disturbance rejection from the cost of measurement bias.
guiding_question: What inputs, observable effects, and failure modes matter when you reject a Disturbance
  with Feedback?
status: implemented
tags:
- controls-gnc
- feedback-fundamentals
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: feedback_gain
  type: slider
  label: Feedback gain
  default: 4.0
  unit: gain
  minimum: 0.0
  maximum: 12.0
  step: 0.25
- id: disturbance_frequency_rad_s
  type: slider
  label: Disturbance frequency
  default: 0.0
  unit: rad/s
  minimum: 0.0
  maximum: 12.0
  step: 0.5
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: More gain should reject a slow plant disturbance but amplify control response to bias.
  reveal: Disable the broken case and validate/calibrate the sensor bias.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
