schema_version: 1
id: 44-certify-decay-with-lyapunov-functions-and-regions-of-attraction
number: 44
title: Certify Decay with Lyapunov Functions and Regions of Attraction
summary: "Evaluate V=x\xB2/2 for xdot=-x+mu*x\xB3, find where Vdot is negative, and reject a sublevel that crosses\
  \ the unstable boundary."
guiding_question: How does a Lyapunov sublevel set become a defensible local region-of-attraction certificate?
status: implemented
tags:
- controls-gnc
- native-python
- nonlinear-robust-id
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: sublevel_radius
  type: slider
  label: Sublevel radius
  default: 0.7
  unit: '1'
  minimum: 0.1
  maximum: 1.4
  step: 0.05
- id: cubic_coefficient
  type: slider
  label: Cubic coefficient
  default: 0.8
  unit: '1'
  minimum: 0.2
  maximum: 1.5
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A claimed sublevel is certified only when V is positive and Vdot is strictly negative everywhere except
    the origin.
  reveal: Shrink the sublevel below 1/sqrt(mu) and report it as a sufficient local certificate, not the exact global
    basin.
- type: controls
  title: Design controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
