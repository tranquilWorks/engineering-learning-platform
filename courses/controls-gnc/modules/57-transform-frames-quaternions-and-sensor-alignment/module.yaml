- type: prediction
  title: Predict before running
  text: Predict whether a quaternion norm fault can escape a matrix check at zero total rotation.
  reveal: No. The scalar quaternion can have norm 1.2 while its vector part is zero; the assumed-unit matrix
    formula still yields identity. Inspect the quaternion norm and declare the formula precondition.
