title: Transform Frames, Quaternions, and Sensor Alignment
summary: Rotate a body vector by a yaw quaternion, apply a sensor misalignment, and verify norm and DCM orthogonality
  invariants.
guiding_question: How do quaternion normalization and frame order prevent silent attitude and alignment errors?
