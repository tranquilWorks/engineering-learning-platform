schema_version: 1
id: 57-transform-frames-quaternions-and-sensor-alignment
number: 57
title: Compose Quaternions and Calibrate Sensor Vectors
summary: Scalar-first active quaternions compose sensor-to-body followed by body-to-world rotation. Residuals
  come from the actual matrices and vectors. A scaled identity quaternion is a special case where the unit-quaternion
  matrix formula can look correct despite an invalid quaternion norm.
guiding_question: At zero yaw and zero misalignment, does zero matrix residual prove that the fault is absent?
status: implemented
