schema_version: 1
item_id: P57
module: 57-transform-frames-quaternions-and-sensor-alignment
provenance:
  kind: python-first-native
  source_equivalence_claimed: false
  competency_map: ../../competency-map.yaml
  matlab_runtime: not_run
governing_equations:
- q=[w,x,y,z]; q_world_sensor=q_world_body ⊗ q_body_sensor
- q_normalized=q/||q||; R(q)^T R(q)=I for unit q
- v_world=R(q_world_sensor)v_sensor
signature:
- field: quaternion_norm_error
  unit: '1'
- field: dcm_orthogonality_error
  unit: '1'
- field: alignment_vector_error
  unit: '1'
teaching_invariant: Predict whether a quaternion norm fault can escape a matrix check at zero total rotation.
limiting_cases:
- q and -q encode the same rotation.
- At identity the unit-quaternion matrix formula can return identity even for [1.2,0,0,0], so a matrix-only
  test can miss invalid quaternion norm.
- This is a static calibration/rotation exercise, not an attitude filter.
scenarios:
  baseline: &id001
    yaw_angle_deg: 35.0
    sensor_misalignment_deg: 3.0
    broken_mode: false
  sweep_1:
    yaw_angle_deg: 180.0
    sensor_misalignment_deg: 3.0
    broken_mode: false
  sweep_2:
    yaw_angle_deg: 35.0
    sensor_misalignment_deg: 20.0
    broken_mode: false
  broken:
    yaw_angle_deg: 35.0
    sensor_misalignment_deg: 3.0
    broken_mode: true
  recovery: *id001
independent_reference:
  path: ../../expansion_reference_cases.py
  imports_production: false
  derived_from_production_output: false
  perturbs_production_output: false
tolerance:
  absolute: 1.0e-08
  relative: 1.0e-08
claim_boundary: Deterministic synthetic software evidence only. Browser/container checks are separately recorded.
  No MATLAB runtime, representative learner, manual screen-reader, hardware, certification or production acceptance.
