number: 48
title: Bound Structured Uncertainty and Robust Performance
summary: Sweep a first-order pole uncertainty, calculate the worst closed-loop margin and sensitivity proxy, and
  expose a destabilizing gain choice.
guiding_question: How can a declared real-parameter family support a narrow robust-stability statement without becoming
  a certification claim?
