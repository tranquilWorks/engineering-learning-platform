content:
  guiding_question: What inputs, observable effects, and failure modes matter when you compare Nominal
    and Robust Designs?
  physical_model: Compare a nominal gain with a conservative design across the same uncertainty envelope.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u=K(r-v)
    meaning: Both designs share structure; their gain is selected against different plant sets.
  - latex: J_w=\max_{p\in\mathcal P}J(K,p)
    meaning: The robust choice reduces worst-case error at the cost of more effort.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 20
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: e807f06aec60056612b6855b255e203af65809ca584d6542e1efbc4744398493
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Compare a nominal gain with a conservative design across the same uncertainty envelope.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case reverses actuator sign, violating the uncertainty set both designs
      assumed.
  sweeps:
  - control: actuator_gain_ratio
    values:
    - 0.5
    - 1.0
    - 1.5
    expected_observation: The robust design should improve the difficult low-gain/high-drag corner while
      using more command nominally.
  - control: drag_ratio
    values:
    - 0.5
    - 1.0
    - 2.0
    expected_observation: Compare a nominal gain with a conservative design across the same uncertainty
      envelope.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case reverses actuator sign, violating the uncertainty set both designs assumed.
    recovery: Disable the broken case and restore a plant inside the certified uncertainty family.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
