content:
  guiding_question: What inputs, observable effects, and failure modes matter when you compare Nominal and Robust
    Designs?
  physical_model: Compare exactly two preselected proportional gains on a scalar uncertain speed plant; no robust
    synthesis or certification is claimed.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot v=-a v+b u,\quad u_K=K(r-v),\;K\in\{2,4\}
    meaning: Both displayed designs are fixed proportional gains evaluated at the selected positive plant point.
  - latex: J_K=\int_0^{12}[(r-v_K)^2+0.05u_K^2]dt
    meaning: The finite-horizon objective compares tracking and effort at one point; it is not a worst-case certificate.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 20
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 1ebeb09d9030e34d9dfa30280db65b361fb0b257878d74293bf070ed0d01eb78
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Two fixed-gain speed responses
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Speed
      unit: m/s
    interpretation: the lesson compares exactly two fixed gains, not robust synthesis
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Two fixed-gain commands
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Commanded acceleration
      unit: m/s²
    interpretation: both preselected gains become positive-feedback failures
  sweeps:
  - control: actuator_gain_ratio
    values:
    - 0.5
    - 1.0
    - 1.5
    expected_observation: Higher positive actuator gain increases closed-loop authority for both fixed proportional
      gains and changes their finite-horizon tracking/effort objectives.
  - control: drag_ratio
    values:
    - 0.5
    - 1.0
    - 2.0
    expected_observation: Higher drag slows both fixed-gain responses and increases their proportional steady-state
      speed error.
  broken_case:
    trigger: Enable broken_mode.
    failure: Broken mode reverses actuator polarity, outside the declared positive gain/drag family; both fixed-gain
      loops then have the wrong feedback direction.
    recovery: Disable broken_mode to restore positive actuator polarity. The module remains a two-fixed-gain comparison,
      not a robust synthesis.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
