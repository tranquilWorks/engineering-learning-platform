content:
  guiding_question: What inputs, observable effects, and failure modes matter when you discretize a Continuous Controller?
  physical_model: Compare a sampled PI implementation with its continuous design target.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: y_{k+1}=e^{-T_s}y_k+(1-e^{-T_s})u_k
    meaning: The plant uses the exact zero-order-hold transition.
  - latex: q_{k+1}=q_k+T_s e_k
    meaning: The integral rule introduces its own discrete dynamics.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 9
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 6934a7dc21d9fcd6c7a0e2d18654363c7db99904218ee47b29bcac2fcc39a065
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Sampled PI response versus continuous target
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Normalized plant output
      unit: ratio
    interpretation: sampled PI remains finite and exposes the chosen discretization
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Held command and discrete integral state
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Held command
      unit: normalized input
    - role: y
      label: Integral state
      unit: ratio·s
    interpretation: coarse/delayed integration changes the sampled PI trajectory
  sweeps:
  - control: sample_period_s
    values:
    - 0.02
    - 0.1
    - 0.3
    expected_observation: A coarser sample period should move the digital response away from the continuous target.
  - control: integral_gain
    values:
    - 1.0
    - 4.0
    - 7.0
    expected_observation: Compare a sampled PI implementation with its continuous design target.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case combines coarse sampling with the less forgiving forward-error integral update.
    recovery: Disable the broken case and reduce the controller sample period.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
