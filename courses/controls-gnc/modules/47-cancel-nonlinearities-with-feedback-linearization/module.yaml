schema_version: 1
id: 47-cancel-nonlinearities-with-feedback-linearization
number: 47
title: Cancel Nonlinearities with Feedback Linearization
summary: Cancel a quadratic drift, impose first-order tracking dynamics, and expose residual drift under coefficient
  mismatch.
guiding_question: What remains after model-based nonlinear cancellation, and how does mismatch re-enter the error
  dynamics?
status: implemented
tags:
- controls-gnc
- native-python
- nonlinear-robust-id
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: model_mismatch
  type: slider
  label: Cancellation mismatch
  default: 0.08
  unit: '1'
  minimum: 0.0
  maximum: 0.5
  step: 0.02
- id: tracking_gain_per_s
  type: slider
  label: Tracking gain
  default: 2.0
  unit: 1/s
  minimum: 0.2
  maximum: 6.0
  step: 0.2
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: "Does a positive tracking gain guarantee convergence for every mismatch and initial state? Use x_dot=x(delta*x\u2212\
    k) to identify the boundary."
  reveal: 'No: x=1 exceeds k/delta=0.4 and initially grows at 0.3/s. The terminal error must be accompanied by observed
    duration and departure status; at x=10 the integrator stops before four seconds.'
- type: controls
  title: Design controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
