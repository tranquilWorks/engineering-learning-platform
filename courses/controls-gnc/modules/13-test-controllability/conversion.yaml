content:
  guiding_question: What inputs, observable effects, and failure modes matter when you test Controllability?
  physical_model: Use rank and reachability energy to distinguish weak from missing control authority.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \mathcal C=[B\;AB]
    meaning: Full row rank is required to reach arbitrary two-state targets.
  - latex: W_c=\sum A^kBB^T(A^T)^k
    meaning: The Gramian reveals how much command energy reachability costs.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 13
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: bca514c05d07586acf9512a46fe72553cd148019d592b32914a3ceccfda3f99c
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Use rank and reachability energy to distinguish weak from missing control authority.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case removes coupling between rate and position, dropping controllability
      rank.
  sweeps:
  - control: input_gain
    values:
    - 0.25
    - 1.0
    - 2.0
    expected_observation: Zero coupling should make position unreachable even though rate is directly
      actuated.
  - control: coupling
    values:
    - 0.25
    - 1.0
    - 2.0
    expected_observation: Use rank and reachability energy to distinguish weak from missing control authority.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case removes coupling between rate and position, dropping controllability rank.
    recovery: Disable the broken case to restore the state-to-state path.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
