content:
  guiding_question: What inputs, observable effects, and failure modes matter when you use Feedforward and Feedback
    Together?
  physical_model: Separate planned acceleration from feedback correction during trajectory tracking.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u=u_{ff}+K_pe+K_d\dot e
    meaning: Feedforward supplies known demand; feedback corrects mismatch.
  - latex: u_{ff}=\ddot x_d
    meaning: For a unit-mass model, desired acceleration is the nominal inverse input.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 18
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 0ba11fb9a6dfa7f50709d3a82402b917a8fa5d976e48fd4af0129da649813362
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Feedforward-plus-feedback tracking
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Position
      unit: m
    interpretation: tracking and command measures remain finite under the declared sign
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Acceleration-command decomposition
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Acceleration
      unit: m/s²
    interpretation: feedforward accelerates opposite the modeled demand
  sweeps:
  - control: feedforward_scale
    values:
    - 0.0
    - 1.0
    - 1.5
    expected_observation: Feedforward should reduce nominal lag while feedback remains necessary for disturbance
      rejection.
  - control: feedback_scale
    values:
    - 0.0
    - 1.0
    - 2.0
    expected_observation: Separate planned acceleration from feedback correction during trajectory tracking.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case reverses feedforward sign, commanding acceleration away from the plan.
    recovery: Disable the broken case and verify inverse-model sign conventions.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
