schema_version: 1
id: 07-see-stability-margin-in-time-and-frequency
number: 7
title: See Stability Margin in Time and Frequency
summary: Connect gain/phase margins to ringing and instability in the same transparent loop.
guiding_question: What inputs, observable effects, and failure modes matter when you see Stability Margin
  in Time and Frequency?
status: implemented
tags:
- controls-gnc
- feedback-fundamentals
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: loop_gain
  type: slider
  label: Loop gain
  default: 1.0
  unit: 1/s²
  minimum: 0.1
  maximum: 10.0
  step: 0.1
- id: actuator_lag_s
  type: slider
  label: Actuator lag
  default: 0.2
  unit: s
  minimum: 0.0
  maximum: 1.0
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Higher gain moves crossover upward where actuator lag removes phase margin.
  reveal: Disable the broken case or lower loop gain until both margins are positive.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
