content:
  guiding_question: What inputs, observable effects, and failure modes matter when you see Stability Margin
    in Time and Frequency?
  physical_model: Connect gain/phase margins to ringing and instability in the same transparent loop.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: L(s)=K/[s(s+1)(\tau_a s+1)]
    meaning: The actuator pole adds lag before crossover.
  - latex: PM=180^\circ+\angle L(j\omega_c)
    meaning: Phase margin measures distance from positive-feedback alignment.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 7
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: f249e80d6546bdbf8fd87a6d947c98ff063596ec204296732a52f08ccb7b32e0
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Connect gain/phase margins to ringing and instability in the same transparent loop.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case keeps K=4 while exposing a 0.5 s actuator lag omitted by the optimistic
      design.
  sweeps:
  - control: loop_gain
    values:
    - 0.5
    - 1.0
    - 4.0
    expected_observation: Higher gain moves crossover upward where actuator lag removes phase margin.
  - control: actuator_lag_s
    values:
    - 0.0
    - 0.2
    - 0.5
    expected_observation: Connect gain/phase margins to ringing and instability in the same transparent
      loop.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case keeps K=4 while exposing a 0.5 s actuator lag omitted by the optimistic design.
    recovery: Disable the broken case or lower loop gain until both margins are positive.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
