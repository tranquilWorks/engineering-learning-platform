schema_version: 1
id: 61-fuse-gnss-and-ins-with-an-error-state-kalman-filter
number: 61
title: Fuse GNSS and INS with a Coupled Error-State Filter
summary: Compare one-axis injection with a 15-state loosely coupled GNSS/INS estimator, bias correction
  and attitude reset.
guiding_question: Why can both normal and broken cases show a smaller post-update sigma while only one
  corrects position?
status: implemented
tags:
- controls-gnc
- native-python
- navigation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: gnss_interval_s
  type: slider
  label: GNSS update interval
  default: 1.0
  unit: s
  minimum: 0.2
  maximum: 10.0
  step: 0.2
- id: bias_random_walk
  type: slider
  label: Bias random walk
  default: 0.01
  unit: m/s^2/sqrt(s)
  minimum: 0.001
  maximum: 0.08
  step: 0.001
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict what happens if covariance is updated but the nominal navigation state never receives
    the correction.
  reveal: The covariance recurrence is independent of the realized innovation for this linear model. State
    injection uses that innovation; dropping it makes the reported uncertainty inconsistent with the executed
    estimator.
- type: controls
  title: Design controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
