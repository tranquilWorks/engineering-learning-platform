governing_equations:
- delta=[position error, velocity error, accelerometer bias error]
- F=[[1,dt,-dt²/2],[0,1,-dt],[0,0,1]]; Pminus=F P F^T+Q
- K=Pminus H^T/(H Pminus H^T+R); nominal+=K innovation; delta_reset=0
- Pplus=(I-KH)Pminus(I-KH)^T+K R K^T
signature:
- field: prior_sigma
  unit: m
- field: posterior_sigma
  unit: m
- field: terminal_error
  unit: m
teaching_invariant: Predict what happens if covariance is updated but the nominal navigation state never receives
  the correction.
limiting_cases:
- The terminal sigma can fall while actual error remains large in the fault.
- Additive reset leaves covariance coordinates unchanged.
- This lesson does not implement attitude, Earth frames, lever arms or a complete strapdown INS.
