  type: slider
  label: Damping
  default: 0.25
  unit: 1/s
  minimum: 0.02
  maximum: 1.0
  step: 0.02
- id: initial_energy
  type: slider
  label: Initial energy
  default: 0.8
  unit: J
  minimum: 0.05
  maximum: 2.5
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
