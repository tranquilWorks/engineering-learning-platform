schema_version: 1
id: 43-use-phase-portraits-to-separate-local-and-global-stability
number: 43
title: Use Phase Portraits to Separate Local and Global Stability
summary: Trace a damped Duffing trajectory, compare local decay with basin-scale energy motion, and identify negative
  damping as a global failure.
guiding_question: What can a nonlinear phase portrait reveal that a local eigenvalue calculation cannot?
status: implemented
tags:
- controls-gnc
- native-python
- nonlinear-robust-id
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
