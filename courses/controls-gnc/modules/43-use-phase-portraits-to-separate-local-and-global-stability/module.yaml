- type: prediction
  title: Predict before running
  text: Will positive damping force every initial condition toward the +1 m well? Use the phase portrait and the
    energy barrier at E=0 to justify your prediction.
  reveal: "While E is above the zero-energy barrier, crossings are possible even with dissipation. The actual phase\
    \ curve must satisfy x_dot=v and v_dot=x\u2212x\xB3\u2212cv, with E\u2212E0 equal to accumulated \u2212cv\xB2\
    \ work."
