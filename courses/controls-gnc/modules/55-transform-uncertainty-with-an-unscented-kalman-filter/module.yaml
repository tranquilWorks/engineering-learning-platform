  type: slider
  label: State standard deviation
  default: 0.8
  unit: '1'
  minimum: 0.1
  maximum: 2.0
  step: 0.05
- id: sigma_spread
  type: slider
  label: Sigma-point spread
  default: 1.0
  unit: '1'
  minimum: 0.2
  maximum: 2.0
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Does a negative central mean weight necessarily invalidate the transform? Try alpha below one and compare
    the computed moments with the Gaussian formulas.
  reveal: "The two off-center transformed values equal the mean, so their variance contributions vanish. The center\
    \ maps to zero, differs from mean by sigma\xB2 and contributes 2*sigma\u2074 only through the covariance correction.\
    \ Its mean weight is zero."
