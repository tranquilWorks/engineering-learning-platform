schema_version: 1
id: 55-transform-uncertainty-with-an-unscented-kalman-filter
number: 55
title: Transform Gaussian Uncertainty with Sigma Points
summary: Compute a scaled unscented transform through the square map and distinguish mean weights from covariance
  correction.
guiding_question: How do sigma points capture nonlinear mean and covariance beyond a first-order Jacobian?
status: implemented
tags:
- controls-gnc
- native-python
- estimation
