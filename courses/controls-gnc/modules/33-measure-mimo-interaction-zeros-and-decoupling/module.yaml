schema_version: 1
id: 33-measure-mimo-interaction-zeros-and-decoupling
number: 33
title: Measure MIMO Interaction, Zeros, and Decoupling
summary: Analyze a coupled two-input/two-output plant with RGA, frequency singular values, transmission zeros, and
  regularized static decoupling.
guiding_question: How do relative gain, transmission zeros, and decoupling residual reveal multivariable limitations?
status: implemented
tags:
- controls-gnc
- native-python
- modeling-and-classical-control
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: cross_coupling
  type: slider
  label: Cross-coupling coefficient
  default: 0.6
  unit: '1'
  minimum: 0.0
  maximum: 1.3
  step: 0.05
- id: decoupler_regularization
  type: slider
  label: Decoupler regularization
  default: 0.02
  unit: '1'
  minimum: 0.0
  maximum: 0.3
  step: 0.01
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: RGA rows and columns sum to one for a nonsingular plant, while decoupling residual grows when coupling or
    regularization prevents exact inversion.
  reveal: Compute RGA and transmission zeros first, then use a conditioned decoupler and report its off-diagonal
    residual rather than claiming perfect separation.
