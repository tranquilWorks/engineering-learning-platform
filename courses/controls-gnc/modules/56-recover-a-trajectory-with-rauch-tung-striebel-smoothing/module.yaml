schema_version: 1
id: 56-recover-a-trajectory-with-rauch-tung-striebel-smoothing
number: 56
title: Recover a Trajectory with RTS Smoothing
summary: The plotted smoother executes a backward RTS pass over all 41 retained measurements. Its last state/covariance
  equal the filter. Model covariance reduction does not guarantee a smaller error for every individual measurement
  realization.
guiding_question: Why must the final smoother covariance equal the filter covariance, and why is a fixed 35
  percent improvement incorrect?
status: implemented
