title: Recover a Trajectory with Rauch-Tung-Striebel Smoothing
summary: Compare scalar filtered and RTS-smoothed covariance and quantify the lagged improvement without calling
  it real-time estimation.
guiding_question: Why can a backward smoothing pass reduce past uncertainty after future measurements arrive?
