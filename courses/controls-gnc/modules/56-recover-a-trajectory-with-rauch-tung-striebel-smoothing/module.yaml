- type: prediction
  title: Predict before running
  text: Predict which sample cannot benefit from the backward pass, and whether smaller model covariance guarantees
    smaller error in every realization.
  reveal: The backward recursion is initialized by the final filtered pair. Earlier reductions depend on the
    retained covariance ratios and future observations; no universal percentage follows. A lower posterior
    covariance describes the model distribution, not guaranteed improvement for every observed truth trace.
