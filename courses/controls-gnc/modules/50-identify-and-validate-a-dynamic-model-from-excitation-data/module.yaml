schema_version: 1
id: 50-identify-and-validate-a-dynamic-model-from-excitation-data
number: 50
title: Identify and Validate a Dynamic Model from Excitation Data
summary: Relate an input information matrix to parameter uncertainty and validation residual without testing on
  the fit data.
guiding_question: How do excitation richness and held-out residuals determine whether an identified model is usable?
status: implemented
tags:
- controls-gnc
- native-python
- nonlinear-robust-id
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: excitation_amplitude
  type: slider
  label: Excitation amplitude
  default: 1.0
  unit: '1'
  minimum: 0.1
  maximum: 3.0
  step: 0.1
- id: frequency_spread_hz
  type: slider
  label: Excitation frequency spread
  default: 2.0
  unit: Hz
  minimum: 0.1
  maximum: 5.0
  step: 0.1
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Could a tiny training residual coexist with a useless input coefficient? Predict what removing training
    excitation does to regressor rank.
  reveal: With u=0, training contains no evidence about b. Held-out input exposes that missing coefficient. Free-run
    prediction feeds back y_hat; one-step fitting uses measured y and can conceal drift.
