schema_version: 1
id: 14-test-observability
number: 14
title: Test Observability
summary: Use measurement history and observability conditioning to expose hidden state.
guiding_question: What inputs, observable effects, and failure modes matter when you test Observability?
status: implemented
tags:
- controls-gnc
- state-space-control
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: sensor_gain
  type: slider
  label: Sensor gain
  default: 1.0
  unit: measurement/m
  minimum: 0.0
  maximum: 2.0
  step: 0.05
- id: observation_window_s
  type: slider
  label: Observation window
  default: 2.0
  unit: s
  minimum: 0.1
  maximum: 5.0
  step: 0.1
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A longer position record should improve velocity inference; a rate-only sensor hides initial position.
  reveal: Disable the broken case to measure position and restore full observability.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
