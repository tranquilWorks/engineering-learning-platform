content:
  guiding_question: What inputs, observable effects, and failure modes matter when you test Observability?
  physical_model: Use measurement history and observability conditioning to expose hidden state.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \mathcal O=[C;CA]
    meaning: Full column rank lets outputs distinguish every state direction.
  - latex: y(t)=g(x_0+v_0t)
    meaning: Position history reveals constant rate through slope.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 14
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 914b3acbc589bc549b761ba9ff617b192b62207ebe6405085f8f9b740ebf4180
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Use measurement history and observability conditioning to expose hidden state.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case measures rate only, so initial position never appears in the output.
  sweeps:
  - control: sensor_gain
    values:
    - 0.25
    - 1.0
    - 2.0
    expected_observation: A longer position record should improve velocity inference; a rate-only sensor
      hides initial position.
  - control: observation_window_s
    values:
    - 0.25
    - 2.0
    - 5.0
    expected_observation: Use measurement history and observability conditioning to expose hidden state.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case measures rate only, so initial position never appears in the output.
    recovery: Disable the broken case to measure position and restore full observability.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
