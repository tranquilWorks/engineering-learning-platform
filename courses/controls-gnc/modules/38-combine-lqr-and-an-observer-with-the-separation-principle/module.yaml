- type: prediction
  title: Predict before running
  text: Increasing observer speed should change estimation-error decay but leave the regulator eigenvalues unchanged.
    Predict this before moving the ratio control.
  reveal: The off-diagonal BK block couples estimation error into the plant without changing the diagonal-block
    spectra. The CARE with the stated Q and R establishes the cost-derived gain; the small CARE residual verifies
    that calculation.
