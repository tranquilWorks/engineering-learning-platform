number: 38
title: Combine LQR and an Observer with the Separation Principle
summary: Combine a stabilizing double-integrator feedback law with a full-order observer and verify the block-triangular
  separation spectrum.
guiding_question: Why can regulator and observer poles be designed separately, and when does the combined loop still
  fail?
status: implemented
