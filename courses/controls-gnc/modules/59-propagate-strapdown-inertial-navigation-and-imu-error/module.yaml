schema_version: 1
id: 59-propagate-strapdown-inertial-navigation-and-imu-error
number: 59
title: Propagate Strapdown Navigation and IMU Bias Errors
summary: Compare analytic one-axis bias drift with 3D quaternion strapdown mechanization and gravity compensation.
guiding_question: How do prescribed accelerometer bias and its correction accumulate into velocity and
  position error?
status: implemented
tags:
- controls-gnc
- native-python
- navigation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: accelerometer_bias_m_s2
  type: slider
  label: Accelerometer bias
  default: 0.03
  unit: m/s^2
  minimum: 0.0
  maximum: 0.2
  step: 0.005
- id: coast_duration_s
  type: slider
  label: Coast duration
  default: 30.0
  unit: s
  minimum: 1.0
  maximum: 120.0
  step: 1.0
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Under constant uncorrected bias, velocity error grows linearly and position error quadratically
    with coast time.
  reveal: Estimate and subtract bias, reapply gravity/frame conventions, and compare propagation to the
    analytic limiting case.
