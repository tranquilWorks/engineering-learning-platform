title: Propagate Strapdown Inertial Navigation and IMU Error
summary: Integrate a declared body-axis bias, compare analytic error growth, and show the effect of a bias correction.
guiding_question: How does a constant accelerometer bias grow into velocity and position error during strapdown
  propagation?
