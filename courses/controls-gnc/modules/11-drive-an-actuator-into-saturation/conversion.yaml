content:
  guiding_question: What inputs, observable effects, and failure modes matter when you drive an Actuator
    into Saturation?
  physical_model: Show the gap between requested and physically available actuator effort.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u=\operatorname{clip}(K_p(r-y),-u_{max},u_{max})
    meaning: Saturation changes the loop from linear to piecewise linear.
  - latex: \dot y=-y+u
    meaning: The plant cannot exceed the authority delivered by the clipped input.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 11
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 47973c9a6d767fa41ea7d072ae2dad2a620d9a83cb4926b7786fa072979a6cc3
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Show the gap between requested and physically available actuator effort.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case restricts a 1.5-unit request to 0.6 actuator units.
  sweeps:
  - control: reference
    values:
    - 0.5
    - 1.5
    - 3.0
    expected_observation: A limit below the needed equilibrium command should create persistent tracking
      error.
  - control: actuator_limit
    values:
    - 0.5
    - 2.0
    - 5.0
    expected_observation: Show the gap between requested and physically available actuator effort.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case restricts a 1.5-unit request to 0.6 actuator units.
    recovery: Disable the broken case or reduce the command to fit available authority.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
