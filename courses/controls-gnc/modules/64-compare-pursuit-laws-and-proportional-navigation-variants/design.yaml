governing_equations:
- Rdot=r·vrel/||r||; lambda_dot=cross(r,vrel)/||r||²
- a_PN=N max(-Rdot,0) lambda_dot; heading_dot=a/3
- a_pursuit=v_p k_heading wrap(lambda-heading); v_p=3 m/s; k_heading=1.5/s
- a_augmented=a_PN+(N/2) v_beacon omega_beacon cos(heading_beacon-heading); v_beacon=1 m/s
signature:
- field: initial_command
  unit: m/s^2
- field: sampled_closest
  unit: m
- field: observed_duration
  unit: s
teaching_invariant: Predict how reversing the measured line-of-sight rate changes the initial PN command and
  the integrated path.
limiting_cases:
- Capture is a one-metre event, not zero-distance contact.
- Closest approach is sampled.
- No actuator saturation, collision planning, sensor noise or universal capture guarantee is included.
- A comparison ending early has a shorter observation window.
