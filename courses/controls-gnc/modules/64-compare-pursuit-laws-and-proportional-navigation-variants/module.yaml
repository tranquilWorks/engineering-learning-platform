schema_version: 1
id: 64-compare-pursuit-laws-and-proportional-navigation-variants
number: 64
title: Compare Pursuit Laws and Proportional-Navigation Variants
summary: Compare PN navigation constant and target-turn demand using closing-speed and LOS-rate conventions.
guiding_question: When does proportional navigation outperform pure pursuit, and how do sign and target maneuver
  alter miss distance?
status: implemented
tags:
- controls-gnc
- native-python
- guidance
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: navigation_constant
  type: slider
  label: PN navigation constant
  default: 3.5
  unit: '1'
  minimum: 1.0
  maximum: 6.0
  step: 0.1
- id: target_turn_rate_deg_s
  type: slider
  label: Target turn rate
  default: 4.0
  unit: deg/s
  minimum: 0.0
  maximum: 15.0
  step: 0.5
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: For a closing engagement with correct LOS-rate sign, N greater than two reduces the nonmaneuvering miss
    proxy while increasing acceleration demand.
  reveal: Restore the frame and closing convention, apply actuator limits, and compare pursuit laws under the same
    target maneuver.
- type: controls
  title: Design controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
