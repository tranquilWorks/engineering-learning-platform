schema_version: 1
id: 64-compare-pursuit-laws-and-proportional-navigation-variants
number: 64
title: Compare Civilian Moving-Beacon Guidance Trajectories
summary: Civilian point-mass rendezvous compares heading pursuit, velocity-normal PN and a declared feed-forward
  variant. Each integration ends at one-metre capture or eight seconds. Closest separation is sampled on 121
  points, not a continuous minimum or universal capture guarantee. No actuator limits are included in this
  comparison.
guiding_question: Why can two laws have the same one-metre minimum yet different guidance performance?
status: implemented
tags:
- controls-gnc
- native-python
- guidance
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: navigation_constant
  type: slider
  label: PN navigation constant
  default: 3.5
  unit: '1'
  minimum: 1.0
  maximum: 6.0
  step: 0.1
- id: target_turn_rate_deg_s
  type: slider
  label: Beacon turn rate
  default: 4.0
  unit: deg/s
  minimum: 0.0
  maximum: 15.0
  step: 0.5
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict how reversing the measured line-of-sight rate changes the initial PN command and the integrated
    path.
  reveal: Both may reach the declared capture event, which terminates their integrations at the same radius.
    Capture time, command demand and trajectory history still differ; the threshold is not a fabricated miss
    metric.
