schema_version: 1
id: 04-compare-linear-and-nonlinear-pendulum-models
number: 4
title: Compare Linear and Nonlinear Pendulum Models
summary: Expose when the small-angle pendulum approximation stops representing the nonlinear plant.
guiding_question: What inputs, observable effects, and failure modes matter when you compare Linear and
  Nonlinear Pendulum Models?
status: implemented
tags:
- controls-gnc
- dynamic-systems
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: initial_angle_deg
  type: slider
  label: Initial angle
  default: 20.0
  unit: deg
  minimum: 2.0
  maximum: 150.0
  step: 2.0
- id: length_m
  type: slider
  label: Pendulum length
  default: 1.0
  unit: m
  minimum: 0.25
  maximum: 3.0
  step: 0.25
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Large release angles should lengthen the nonlinear period relative to the linear prediction.
  reveal: Disable the broken case or reduce the release angle until the approximation error is acceptable.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
