content:
  guiding_question: What inputs, observable effects, and failure modes matter when you compare Linear
    and Nonlinear Pendulum Models?
  physical_model: Expose when the small-angle pendulum approximation stops representing the nonlinear
    plant.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \ddot{\theta}+2\zeta\sqrt{g/L}\dot{\theta}+(g/L)\sin\theta=0
    meaning: The nonlinear restoring torque follows sine of angle.
  - latex: \sin\theta\approx\theta
    meaning: The linear model is trustworthy only for small angles.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 4
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 35c339e41f69356faf2215e8476592f5cf08acfb95a2dbfae636e03d01a3a9d7
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Expose when the small-angle pendulum approximation stops representing the nonlinear
      plant.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case forces a 120 degree release while interpreting the small-angle trace
      as truth.
  sweeps:
  - control: initial_angle_deg
    values:
    - 5.0
    - 30.0
    - 100.0
    expected_observation: Large release angles should lengthen the nonlinear period relative to the linear
      prediction.
  - control: length_m
    values:
    - 0.5
    - 1.0
    - 2.0
    expected_observation: Expose when the small-angle pendulum approximation stops representing the nonlinear
      plant.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case forces a 120 degree release while interpreting the small-angle trace as truth.
    recovery: Disable the broken case or reduce the release angle until the approximation error is acceptable.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
