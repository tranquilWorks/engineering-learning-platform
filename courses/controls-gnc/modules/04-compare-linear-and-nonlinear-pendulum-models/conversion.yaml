content:
  guiding_question: What inputs, observable effects, and failure modes matter when you compare Linear and Nonlinear
    Pendulum Models?
  physical_model: Expose when the small-angle pendulum approximation stops representing the nonlinear plant.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \ddot{\theta}+2\zeta\sqrt{g/L}\dot{\theta}+(g/L)\sin\theta=0
    meaning: The nonlinear restoring torque follows sine of angle.
  - latex: \sin\theta\approx\theta
    meaning: The linear model is trustworthy only for small angles.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 4
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 326f4032380e7f9101a0a55b2bafa474e04be16b6387d3a8787997960be54615
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Linear and nonlinear pendulum angles
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Angular displacement
      unit: deg
    interpretation: small-angle error grows at the forced large-angle failure
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Approximation error and nonlinear phase state
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Angular model gap
      unit: deg
    - role: x
      label: Angular displacement
      unit: deg
    - role: y
      label: Angular rate
      unit: deg/s
    interpretation: the linear/nonlinear angle gap becomes large
  sweeps:
  - control: initial_angle_deg
    values:
    - 5.0
    - 30.0
    - 100.0
    expected_observation: Large release angles should lengthen the nonlinear period relative to the linear prediction.
  - control: length_m
    values:
    - 0.5
    - 1.0
    - 2.0
    expected_observation: Expose when the small-angle pendulum approximation stops representing the nonlinear plant.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case forces a 120 degree release while interpreting the small-angle trace as truth.
    recovery: Disable the broken case or reduce the release angle until the approximation error is acceptable.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
