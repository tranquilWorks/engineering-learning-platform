content:
  guiding_question: What inputs, observable effects, and failure modes matter when you recover from Integrator Windup?
  physical_model: Compare PI recovery with and without correctly signed back-calculation.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot q=e+K_{aw}(u_{sat}-u_{raw})
    meaning: Back-calculation drains the integral state while clipped.
  - latex: u_{raw}=K_pe+K_iq
    meaning: Stored integral action delays recovery after demand changes.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 12
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: a97867f60e06d104454e06cde74175e0bb794bb5162c6b184f6ba48930bd6ee8
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Anti-windup recovery response
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Normalized plant output
      unit: ratio
    interpretation: anti-windup recovery metrics remain finite and nonnegative
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Saturation gap and controller memory
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Normalized actuator command
      unit: ratio
    - role: y
      label: Integral state
      unit: ratio·s
    interpretation: the integral state grows and post-demand recovery degrades
  sweeps:
  - control: anti_windup_gain
    values:
    - 0.0
    - 0.5
    - 2.0
    expected_observation: Correctly signed back-calculation should shorten recovery after the high demand ends.
  - control: demand_duration_s
    values:
    - 1.0
    - 3.0
    - 5.0
    expected_observation: Compare PI recovery with and without correctly signed back-calculation.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case reverses the back-calculation sign and drives the integrator farther into windup.
    recovery: Disable the broken case to feed the saturation gap back with the corrective sign.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
