schema_version: 1
id: 62-monitor-navigation-integrity-and-exclude-faulty-measurements
number: 62
title: Detect and Exclude a Synthetic Range Fault
summary: An alarm selects the largest leverage-standardized residual. Normal mode removes that measurement
  and recomputes the solution. The formal one-metre-noise covariance is not a certified protection level or
  a guarantee against arbitrary multiple faults.
guiding_question: What evidence distinguishes a real exclusion/refit from multiplying the displayed residual
  by a fixed factor?
status: implemented
tags:
- controls-gnc
- native-python
- navigation
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: fault_magnitude_m
  type: slider
  label: Fault magnitude
  default: 16.0
  unit: m
  minimum: 0.0
  maximum: 60.0
  step: 1.0
- id: integrity_threshold
  type: slider
  label: Residual alarm threshold
  default: 5.0
  unit: sigma
  minimum: 2.0
  maximum: 10.0
  step: 0.2
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Predict whether a zero injected fault should always trigger exclusion and whether deleting one residual
    value is a valid refit.
  reveal: The retained row identities and count change, the state estimate changes, and residuals recomputed
    from retained measurements satisfy the new fit. A fixed factor cannot demonstrate those operations.
- type: controls
  title: Design controls
- type: metrics
- type: plot_grid
