number: 54
title: Estimate Nonlinear State with an Extended Kalman Filter
summary: "Update a scalar state through z=x\xB2, track the Jacobian and posterior covariance, and expose the unobservable\
  \ zero-Jacobian initialization."
guiding_question: When is a first-order measurement linearization informative enough for an EKF update?
status: implemented
