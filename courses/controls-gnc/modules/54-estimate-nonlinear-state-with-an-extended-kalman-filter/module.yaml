blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: An EKF update uses the local Jacobian; at xhat=0 the quadratic measurement has zero first-order sensitivity
    despite nonzero global information.
  reveal: Move to an observable linearization or use an estimator that represents the nonlinear transform, then
    recheck innovation consistency.
