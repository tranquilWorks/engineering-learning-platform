teaching_invariant: This model follows a single straight path with instantaneous heading tracking. It has no
  waypoint switching, obstacles or bounded turn-rate dynamics. The exponential solution is a local approximation;
  nonlinear kinematics generate the displayed path and peak heading. The survey capstone adds separate waypoint,
  freshness and turn constraints.
limiting_cases:
- This model follows a single straight path with instantaneous heading tracking. It has no waypoint switching,
  obstacles or bounded turn-rate dynamics. The exponential solution is a local approximation; nonlinear kinematics
  generate the displayed path and peak heading. The survey capstone adds separate waypoint, freshness and turn
  constraints.
- At zero lateral error the straight path is invariant.
