content:
  guiding_question: What inputs, observable effects, and failure modes matter when you close the Loop
    Through a Hardware-in-the-Loop Plant?
  physical_model: Close a virtual controller/plant protocol loop with latency, drops, watchdog, and cancellation.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u_k=K_p(r-y_k)-K_d\dot y_k
    meaning: A sampled controller computes timestamped commands.
  - latex: u=0\;\text{if age}>T_w
    meaning: The virtual plant watchdog removes stale authority safely.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 24
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: da593fe7fa288f2ec255bd531fbc996bd8ac39c1de13553c32a86b662ccb59e1
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Close a virtual controller/plant protocol loop with latency, drops, watchdog, and
      cancellation.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case drops every second command with a 0.1 s controller period, 0.04 s
      one-way latency, and 0.12 s watchdog.
  sweeps:
  - control: controller_period_s
    values:
    - 0.02
    - 0.05
    - 0.15
    expected_observation: Latency and dropped packets should increase command age; the watchdog must fail
      to zero rather than hold forever.
  - control: one_way_latency_s
    values:
    - 0.0
    - 0.01
    - 0.06
    expected_observation: Close a virtual controller/plant protocol loop with latency, drops, watchdog,
      and cancellation.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case drops every second command with a 0.1 s controller period, 0.04 s one-way
      latency, and 0.12 s watchdog.
    recovery: Disable the broken case to restore fresh commands. This is a software-only virtual protocol/plant
      lesson; it does not claim physical HIL execution.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
