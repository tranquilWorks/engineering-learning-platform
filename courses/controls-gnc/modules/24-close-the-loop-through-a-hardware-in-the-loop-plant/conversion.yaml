content:
  guiding_question: What inputs, observable effects, and failure modes matter when you close the Loop Through a
    Hardware-in-the-Loop Plant?
  physical_model: A software-only two-way timestamped packet loop around an exact damped virtual mass, with deterministic
    drops and watchdog fail-zero.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u_c=\operatorname{clip}(18(r-x_m)-8v_m,-30,30)
    meaning: The sampled controller uses the most recently delivered measurement.
  - latex: v_{k+1}=\alpha v_k+(1-\alpha)u_k/c
    meaning: The virtual mass-damper uses the exact held-force velocity transition.
  - latex: u_{applied}=0\;\text{during startup or when command age}\ge T_w
    meaning: The receiver substitutes zero rather than holding stale force.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 24
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 6c2b34ad20ad7850be16a653539b2783a7c9b0575f308332da8cefe354f206b1
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Software-only virtual-plant tracking
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Position
      unit: m
    interpretation: software event ordering produces a bounded watchdog fraction
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Packet-driven force and freshness
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Force
      unit: N
    - role: y
      label: Packet age
      unit: s
    interpretation: delivery gaps exceed the watchdog threshold and applied force repeatedly falls to zero
  sweeps:
  - control: controller_period_s
    values:
    - 0.02
    - 0.05
    - 0.15
    expected_observation: A longer controller period reduces release count and holds delivered measurements and
      forces longer while the 0.01 s plant tick stays fixed.
  - control: one_way_latency_s
    values:
    - 0.0
    - 0.01
    - 0.06
    expected_observation: More one-way latency raises measurement and command source age before its downstream effect
      appears in position.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case drops every second command with a 0.1 s controller period, 0.04 s one-way latency,
      and 0.12 s watchdog.
    recovery: Disable broken_mode to restore the selected clocks, retain every command, and return to the 0.2 s
      watchdog. No physical HIL is claimed.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
