schema_version: 1
id: 24-close-the-loop-through-a-hardware-in-the-loop-plant
number: 24
title: Close the Loop Through a Hardware-in-the-Loop Plant
summary: Close a virtual controller/plant protocol loop with latency, drops, watchdog, and cancellation.
guiding_question: What inputs, observable effects, and failure modes matter when you close the Loop Through
  a Hardware-in-the-Loop Plant?
status: implemented
tags:
- controls-gnc
- guidance-and-hil
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: controller_period_s
  type: slider
  label: Controller period
  default: 0.05
  unit: s
  minimum: 0.02
  maximum: 0.2
  step: 0.01
- id: one_way_latency_s
  type: slider
  label: One-way latency
  default: 0.01
  unit: s
  minimum: 0.0
  maximum: 0.08
  step: 0.005
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Latency and dropped packets should increase command age; the watchdog must fail to zero rather
    than hold forever.
  reveal: Disable the broken case to restore fresh commands. This is a software-only virtual protocol/plant
    lesson; it does not claim physical HIL execution.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
