schema_version: 1
id: 41-cross-rate-transitions-and-execution-delay
number: 41
title: Cross Rate Transitions and Execution Delay
summary: Move a command from a slow task to a fast plant, measure data age and phase lag, and expose incoherent
  read/write timing.
guiding_question: How do zero-order hold age and execution delay accumulate in a multirate control path?
status: implemented
tags:
- controls-gnc
- native-python
- state-space-and-digital-control
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: rate_ratio
  type: slider
  label: Fast-to-slow rate ratio
  default: 5.0
  unit: '1'
  minimum: 2.0
  maximum: 20.0
  step: 1.0
- id: execution_delay_ms
  type: slider
  label: Execution delay
  default: 12.0
  unit: ms
  minimum: 0.0
  maximum: 80.0
  step: 2.0
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: A coherent rate transition never uses future data; maximum age is bounded by one slow period plus execution
    delay.
  reveal: Use an explicit hold/buffer handoff, timestamp every sample, and include execution delay in the phase-margin
    budget.
