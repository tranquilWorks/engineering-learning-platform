- type: prediction
  title: Predict before running
  text: ZOH maps the autonomous pole exactly, Tustin preserves stability, and any sampled sinusoid is indistinguishable
    from its Nyquist-folded alias.
  reveal: Reduce the sample period or use a stability-preserving mapping, then place the antialias boundary before
    sampling.
