schema_version: 1
id: 35-compare-discretization-methods-and-aliasing
number: 35
title: Compare Discretization Methods and Aliasing
summary: Map a stable pole three ways, expose explicit-Euler instability, and distinguish discrete pole error from
  input-frequency aliasing.
guiding_question: Which continuous-time behaviors survive ZOH, Tustin, and Euler discretization at a chosen sample
  rate?
status: implemented
