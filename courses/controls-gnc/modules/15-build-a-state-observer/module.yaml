schema_version: 1
id: 15-build-a-state-observer
number: 15
title: Build a State Observer
summary: Watch a Luenberger observer reconstruct position and rate from position measurements.
guiding_question: What inputs, observable effects, and failure modes matter when you build a State Observer?
status: implemented
tags:
- controls-gnc
- state-space-control
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: observer_speed_per_s
  type: slider
  label: Observer pole speed
  default: 2.0
  unit: 1/s
  minimum: 1.0
  maximum: 5.0
  step: 0.25
- id: sensor_bias_m
  type: slider
  label: Sensor bias
  default: 0.0
  unit: m
  minimum: -0.25
  maximum: 0.25
  step: 0.01
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Faster poles should reduce settling time but increase sensitivity to measurement contamination.
  reveal: Disable the broken case and correct the sensor bias before trusting the state estimate.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
