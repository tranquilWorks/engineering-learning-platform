content:
  guiding_question: What inputs, observable effects, and failure modes matter when you build a State Observer?
  physical_model: Watch a Luenberger observer reconstruct position and rate from position measurements.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot{\hat x}=A\hat x+Bu+L(y-C\hat x)
    meaning: The innovation corrects both estimated states.
  - latex: \dot e=(A-LC)e
    meaning: Observer poles set nominal error convergence.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 15
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 258dcc50d4071df1574d9766e08aaeae2b63fe838f951ba477c9c1bfbcc3d80e
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Watch a Luenberger observer reconstruct position and rate from position measurements.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case introduces a persistent 0.15 m measurement bias.
  sweeps:
  - control: observer_speed_per_s
    values:
    - 1.0
    - 2.0
    - 5.0
    expected_observation: Faster poles should reduce settling time but increase sensitivity to measurement
      contamination.
  - control: sensor_bias_m
    values:
    - -0.1
    - 0.0
    - 0.1
    expected_observation: Watch a Luenberger observer reconstruct position and rate from position measurements.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case introduces a persistent 0.15 m measurement bias.
    recovery: Disable the broken case and correct the sensor bias before trusting the state estimate.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
