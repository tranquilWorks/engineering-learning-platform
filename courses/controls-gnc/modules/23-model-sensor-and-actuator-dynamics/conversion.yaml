content:
  guiding_question: What inputs, observable effects, and failure modes matter when you model Sensor and Actuator
    Dynamics?
  physical_model: Separate actuator lag, sensor lag, clipping, and bias in one command chain.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \tau_a\dot u_a+u_a=u_c
    meaning: The actuator filters and clips command.
  - latex: \tau_s\dot y_s+y_s=u_a+b_s
    meaning: The sensor adds its own lag and bias.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 23
      unit: index
    datasets:
    - name: five-scenario independent reference signatures (expected-independent.json)
      provenance: independent_reference
      sha256: 5c04d03c4c93b37ac221a081186c1502f850cfe47f65f01681876c6b1eb76d9c
      unit: ordered mixed SI signature; fields and units are embedded in the evidence file
  plot_sequence:
  - source_figure: Pinned MATLAB source intent mapped to platform response view
    target_plot_key: response
    title: Actuator and sensor acceleration dynamics
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Acceleration
      unit: m/s²
    interpretation: positive first-order time constants create finite cascaded lag
  - source_figure: Pinned MATLAB source intent mapped to platform mechanism view
    target_plot_key: mechanism
    title: Actuator and sensor lag errors
    axes:
    - role: x
      label: Time
      unit: s
    - role: y
      label: Acceleration error
      unit: m/s²
    interpretation: the measured acceleration cannot follow rapid command reversals
  sweeps:
  - control: actuator_time_constant_s
    values:
    - 0.05
    - 0.2
    - 0.8
    expected_observation: When command reversals are faster than either bandwidth, measured output should lag twice.
  - control: sensor_time_constant_s
    values:
    - 0.05
    - 0.1
    - 0.6
    expected_observation: Separate actuator lag, sensor lag, clipping, and bias in one command chain.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case combines slow actuator/sensor dynamics with a command that reverses every 0.1 s.
    recovery: Disable the broken case and slow the command or increase component bandwidth.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
