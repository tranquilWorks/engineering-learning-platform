number: 23
title: Model Sensor and Actuator Dynamics
summary: Separate actuator lag, sensor lag, clipping, and bias in one command chain.
guiding_question: What inputs, observable effects, and failure modes matter when you model Sensor and
  Actuator Dynamics?
