governing_equations:
- h=x-x_min; dh/dt=u; u_nom=-v_close
- u[k]=max(u_nom,-alpha*h[k]); h[k+1]=h[k]+dt*u[k]
- dt=0.01 s; h[k+1]>=(1-alpha*dt)*h[k]
signature:
- field: first_filtered_command
  unit: m/s
- field: minimum_safety_margin
  unit: m
- field: peak_intervention
  unit: m/s
teaching_invariant: For alpha*dt<=1, nonnegative current clearance implies nonnegative next clearance.
limiting_cases:
- For alpha*dt<=1, nonnegative current clearance implies nonnegative next clearance.
- At h=0 the healthy controller refuses negative velocity.
- If nominal velocity already satisfies the barrier, intervention is zero; this does not remove the need to reevaluate
  it later.
