schema_version: 1
id: 51-adapt-a-parameter-estimate-online
number: 51
title: Adapt a Parameter Estimate Online
summary: Track a scalar parameter with RLS, relate excitation and forgetting to covariance, and expose covariance
  collapse without information.
guiding_question: When does recursive estimation learn, forget, or become falsely confident?
status: implemented
tags:
- controls-gnc
- native-python
- nonlinear-robust-id
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: forgetting_factor
  type: slider
  label: Forgetting factor
  default: 0.98
  unit: '1'
  minimum: 0.85
  maximum: 1.0
  step: 0.01
- id: excitation_level
  type: slider
  label: Excitation level
  default: 0.8
  unit: '1'
  minimum: 0.05
  maximum: 2.0
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the intentionally broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: What should happen to covariance when excitation vanishes and lambda<1? Decide before enabling the broken
    case.
  reveal: Multiplication by one leaves P fixed, so this particular false-confidence symptom disappears. The zero
    regressor still gives zero gain and no information, leaving theta=0 instead of the true value one.
