- type: prediction
  title: Predict before running
  text: Predict whether a finite terminal penalty forces exact arrival, even when the command limits permit
    arrival.
  reveal: Bounds may make exact arrival infeasible, and finite penalties trade residual against effort even
    when arrival is feasible. Correctness requires executed dynamics, feasible controls and optimality evidence,
    not an assigned zero endpoint.
