schema_version: 1
id: 65-enforce-terminal-and-actuator-aware-guidance-constraints
number: 65
title: Solve a Bounded Terminal Guidance Objective
summary: A twenty-interval bounded least-squares solve balances terminal position, terminal velocity and command
  effort. Actual applied commands propagate the double integrator. Finite terminal weights permit residual
  even when exact arrival is feasible; broken mode applies the unconstrained optimum.
guiding_question: Why is a positive terminal residual compatible with a correct bounded optimizer?
status: implemented
tags:
- controls-gnc
- native-python
- guidance
