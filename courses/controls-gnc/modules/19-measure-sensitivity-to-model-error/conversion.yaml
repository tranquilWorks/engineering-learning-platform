content:
  guiding_question: What inputs, observable effects, and failure modes matter when you measure Sensitivity
    to Model Error?
  physical_model: Measure how actuator gain and drag mismatch change closed-loop speed tracking.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: \dot v=-b_av+g_au
    meaning: The actual plant carries uncertain drag and control effectiveness.
  - latex: S_p=(y_a-y_n)/y_n
    meaning: Sensitivity compares actual response with nominal prediction.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 19
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: 271e5c874d821e70a70af4ef4e730d95c6f2052c6fd8299f12ba874d2d83f2e5
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Measure how actuator gain and drag mismatch change closed-loop speed tracking.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case reverses actuator sign, outside the modeled positive-gain uncertainty
      family.
  sweeps:
  - control: actuator_gain_ratio
    values:
    - 0.5
    - 1.0
    - 1.5
    expected_observation: Lower actuator gain and higher drag should both increase tracking error, but
      through different mechanisms.
  - control: drag_ratio
    values:
    - 0.5
    - 1.0
    - 2.0
    expected_observation: Measure how actuator gain and drag mismatch change closed-loop speed tracking.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case reverses actuator sign, outside the modeled positive-gain uncertainty family.
    recovery: Disable the broken case and validate control polarity before tuning robustness.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
