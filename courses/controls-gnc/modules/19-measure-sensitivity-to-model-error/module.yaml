schema_version: 1
id: 19-measure-sensitivity-to-model-error
number: 19
title: Measure Sensitivity to Model Error
summary: Measure how actuator gain and drag mismatch change closed-loop speed tracking.
guiding_question: What inputs, observable effects, and failure modes matter when you measure Sensitivity
  to Model Error?
status: implemented
tags:
- controls-gnc
- optimal-and-robust-control
runtime:
  kind: python
  entrypoint: experiment.py:run
  trust: local-trusted
  timeout_seconds: 3
controls:
- id: actuator_gain_ratio
  type: slider
  label: Actual / nominal actuator gain
  default: 1.0
  unit: ratio
  minimum: 0.5
  maximum: 1.5
  step: 0.05
- id: drag_ratio
  type: slider
  label: Actual / nominal drag
  default: 1.0
  unit: ratio
  minimum: 0.5
  maximum: 2.0
  step: 0.05
- id: broken_mode
  type: toggle
  label: Enable the source broken case
  default: false
blocks:
- type: markdown
  source: lesson.md
- type: prediction
  title: Predict before running
  text: Lower actuator gain and higher drag should both increase tracking error, but through different
    mechanisms.
  reveal: Disable the broken case and validate control polarity before tuning robustness.
- type: controls
  title: Source-aligned experiment controls
- type: metrics
- type: plot_grid
  title: Response and mechanism
  plots:
  - response
  - mechanism
- type: callout
  tone: info
  title: Current interpretation
  source: observation
- type: callout
  tone: warning
  title: Broken-case interpretation
  source: broken
- type: callout
  tone: success
  title: Recovery
  source: recovery
