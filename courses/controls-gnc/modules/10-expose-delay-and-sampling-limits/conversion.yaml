content:
  guiding_question: What inputs, observable effects, and failure modes matter when you expose Delay and
    Sampling Limits?
  physical_model: Reveal held commands, computation latency, and sampled-data pole movement.
  signal_flow:
  - Set one source-aligned lever and predict the mechanism.
  - Evaluate the deterministic Python model.
  - Compare the observable response with its diagnostic mechanism.
  - Inject the source failure and verify the stated recovery.
  equations:
  - latex: u_k=K_p(1-y_k)
    meaning: The command is computed only at sample instants.
  - latex: u(t)=u_{k-1}\;\text{then}\;u_k
    meaning: Computation delay retains the previous command within each interval.
  equation_order: before_toolbox_shortcuts
  deterministic_data:
    seed: 1601
    constants:
    - name: item_number
      value: 10
      unit: index
    datasets:
    - name: baseline numeric signature
      provenance: retained_fixture
      sha256: b32745b15f0dde4e6dc15c285c38483f1001318ca60f3a9861c92dea57c6101f
      unit: mixed numeric signature
  plot_sequence:
  - source_figure: Source baseline and sweep figures
    target_plot_key: response
    title: Observable response
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Response
      unit: source units
    interpretation: Reveal held commands, computation latency, and sampled-data pole movement.
  - source_figure: Source diagnostic and broken-case figures
    target_plot_key: mechanism
    title: Mechanism and diagnostic view
    axes:
    - role: x
      label: Independent variable
      unit: source units
    - role: y
      label: Diagnostic
      unit: source units
    interpretation: The broken case uses a 0.2 s period with 90 percent computation delay.
  sweeps:
  - control: sample_period_s
    values:
    - 0.02
    - 0.1
    - 0.2
    expected_observation: Sampling and delay together should increase oscillation even when the continuous
      design is fast.
  - control: delay_fraction
    values:
    - 0.0
    - 0.5
    - 0.9
    expected_observation: Reveal held commands, computation latency, and sampled-data pole movement.
  broken_case:
    trigger: Enable broken_mode.
    failure: The broken case uses a 0.2 s period with 90 percent computation delay.
    recovery: Disable the broken case and schedule computation early in the sample interval.
    expected_observation: The diagnostic signature and plotted mechanism change from the recovered case.
  common_mistakes:
  - Changing more than one lever before explaining the first delta.
  - Treating simulated evidence as physical hardware evidence.
  - Retuning around a broken assumption instead of identifying it.
  completion_checklist:
  - Explain both governing equations.
  - Complete both one-variable sweeps.
  - Predict and reproduce the broken case.
  - Confirm recovery with a metric and a plot.
