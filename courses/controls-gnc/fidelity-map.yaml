items:
- id: P01
  number: 1
  source_folder: modules/01-watch-a-mass-spring-damper-respond
  target_folder: modules/01-watch-a-mass-spring-damper-respond
  source_model:
    path: modules/01-watch-a-mass-spring-damper-respond/model.m
    sha256: d820c6e74cf73aafb66220a5ac89873f575fd9a80983a21a0ccb7cedb5b329a8
  controls:
  - platform_control: mass_kg
    source_quantity: Mass
    unit: kg
    role: learner_sweep
  - platform_control: damping_ns_m
    source_quantity: Damping
    unit: N s/m
    role: learner_sweep
  - platform_control: stiffness_n_m
    source_quantity: Stiffness
    unit: N/m
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - m x_ddot + c x_dot + k x = F
  - 'normal: v[k+1]=v[k]+dt*a[k], x[k+1]=x[k]+dt*v[k+1]; broken: explicit x update at dt=1 s'
  observables:
  - quantity: displacement
    unit: m
  - quantity: velocity
    unit: m/s
  - quantity: mechanical energy
    unit: J
  sweeps:
  - control: damping_ns_m
    evidence_case: sweep_1
    endpoint: 2.5
    one_variable: true
    expected_observation: More damping should reduce ringing without changing the static displacement F/k.
  - control: stiffness_n_m
    evidence_case: sweep_2
    endpoint: 10.0
    one_variable: true
    expected_observation: Relate inertia, energy storage, and dissipation to a forced mechanical response.
  broken_case:
    trigger: broken_mode=true
    state_change: Use explicit Euler at dt=1 s instead of the resolved semi-implicit step
    observable_failure: final numerical energy grows instead of decaying
  recovery: Disable the broken case to restore a time step that resolves the natural period.
  teaching_invariant: natural frequency and damping are physical; broken integration exposes energy growth
  limiting_cases:
  - c=0 removes physical damping but does not justify an unstable integrator
  - dt small relative to 2*pi/sqrt(k/m) recovers the resolved semi-implicit response
  omissions:
  - The platform fixes force, horizon, normal dt, and source resource diagnostics so the three learner levers isolate
    m, c, and k.
  reference:
    type: alternative_algorithm
    formulation: Affine semi-implicit state-transition recurrence
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Mass–spring–damper displacement
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Position (m)
  - key: mechanism
    title: Phase state and mechanical energy
    axes:
    - id: x
      title: Position (m)
    - id: y
      title: Velocity (m/s)
    - id: x2
      title: Time (s)
    - id: y2
      title: Mechanical energy (J)
- id: P02
  number: 2
  source_folder: modules/02-build-intuition-for-integrators-and-first-order-systems
  target_folder: modules/02-build-intuition-for-integrators-and-first-order-systems
  source_model:
    path: modules/02-build-intuition-for-integrators-and-first-order-systems/model.m
    sha256: dc2b2f62bfd039133e2c7582b9014cda8f826e6dde89614947208befc19085a6
  controls:
  - platform_control: input_amplitude
    source_quantity: Step amplitude
    unit: input
    role: learner_sweep
  - platform_control: time_constant_s
    source_quantity: First-order time constant
    unit: s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - x_dot=u for the integrator
  - tau*y_dot+y=u; normal path uses the analytic step response
  observables:
  - quantity: integrator response
    unit: ratio
  - quantity: first-order response
    unit: ratio
  - quantity: first-order error
    unit: ratio
  sweeps:
  - control: input_amplitude
    evidence_case: sweep_1
    endpoint: 1.5
    one_variable: true
    expected_observation: The integrator ramp slope follows input amplitude; the first-order final value does not
      depend on tau.
  - control: time_constant_s
    evidence_case: sweep_2
    endpoint: 4.0
    one_variable: true
    expected_observation: Compare accumulation with exponential memory under the same step input.
  broken_case:
    trigger: broken_mode=true
    state_change: Use forward Euler with dt=3*tau
    observable_failure: the discrete first-order path oscillates or grows outside its physical bound
  recovery: Disable the broken case to use the exact first-order transition.
  teaching_invariant: the integrator ramps while the stable first-order path remains bounded
  limiting_cases:
  - tau>0 gives a bounded first-order equilibrium equal to the step amplitude
  - forward Euler crosses its scalar stability boundary when dt/tau exceeds 2
  omissions:
  - The platform fixes horizon and display grid; source-only validation and extended diagnostic tables are not exposed.
  reference:
    type: closed_form
    formulation: Analytic integrator/first-order response and Euler recurrence formula
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Integrator and first-order step responses
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized response (ratio)
  - key: mechanism
    title: First-order tracking mechanism
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized signal (ratio)
- id: P03
  number: 3
  source_folder: modules/03-relate-poles-to-visible-motion
  target_folder: modules/03-relate-poles-to-visible-motion
  source_model:
    path: modules/03-relate-poles-to-visible-motion/model.m
    sha256: 0b7db76072227ff9e10f4db3541046ebd55642be66b42867fbc470bc4ea4c471
  controls:
  - platform_control: pole_real_per_s
    source_quantity: Pole real part
    unit: 1/s
    role: learner_sweep
  - platform_control: pole_imag_rad_s
    source_quantity: Pole imaginary part
    unit: rad/s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - x(t)=exp(sigma*t)*cos(omega*t)
  - period=2*pi/omega for omega>0
  observables:
  - quantity: modal amplitude
    unit: ratio
  - quantity: modal rate
    unit: 1/s
  - quantity: pole location
    unit: 1/s and rad/s
  sweeps:
  - control: pole_real_per_s
    evidence_case: sweep_1
    endpoint: 0.2
    one_variable: true
    expected_observation: Moving sigma right slows decay and eventually turns the envelope into growth.
  - control: pole_imag_rad_s
    evidence_case: sweep_2
    endpoint: 5.0
    one_variable: true
    expected_observation: Translate complex pole location into decay, oscillation, and instability.
  broken_case:
    trigger: broken_mode=true
    state_change: Reflect the real pole part into the right half-plane
    observable_failure: the modal envelope grows
  recovery: Disable the broken case and keep the real part negative.
  teaching_invariant: real pole sign controls decay or growth and imaginary part fixes period
  limiting_cases:
  - sigma<0 decays, sigma=0 is sustained, and reflected sigma>0 grows
  - omega approaching zero removes visible oscillation and makes the period convention explicit
  omissions:
  - The platform keeps one conjugate-mode visualization and omits the source check-table and resource-bound reporting
    surface.
  reference:
    type: closed_form
    formulation: Complex-pole exponential envelope and phase relation
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Mode response and exponential envelope
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Modal amplitude (ratio)
  - key: mechanism
    title: Phase portrait and pole location
    axes:
    - id: x
      title: Modal amplitude (ratio)
    - id: y
      title: Modal rate (1/s)
    - id: x2
      title: Real pole part (1/s)
    - id: y2
      title: Imaginary pole part (rad/s)
- id: P04
  number: 4
  source_folder: modules/04-compare-linear-and-nonlinear-pendulum-models
  target_folder: modules/04-compare-linear-and-nonlinear-pendulum-models
  source_model:
    path: modules/04-compare-linear-and-nonlinear-pendulum-models/model.m
    sha256: 90b101c9c04fed852f4cac88c0c0eb5b91f37d53181b1860b42f28414fc31c1d
  controls:
  - platform_control: initial_angle_deg
    source_quantity: Initial angle
    unit: deg
    role: learner_sweep
  - platform_control: length_m
    source_quantity: Pendulum length
    unit: m
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - theta_ddot+2*zeta*sqrt(g/L)*theta_dot+(g/L)*sin(theta)=0
  - linear comparison replaces sin(theta) by theta
  observables:
  - quantity: pendulum angle
    unit: deg
  - quantity: linearization gap
    unit: deg
  - quantity: angular rate
    unit: deg/s
  sweeps:
  - control: initial_angle_deg
    evidence_case: sweep_1
    endpoint: 100.0
    one_variable: true
    expected_observation: Large release angles should lengthen the nonlinear period relative to the linear prediction.
  - control: length_m
    evidence_case: sweep_2
    endpoint: 2.0
    one_variable: true
    expected_observation: Expose when the small-angle pendulum approximation stops representing the nonlinear plant.
  broken_case:
    trigger: broken_mode=true
    state_change: Force a 120 deg release while applying the linear interpretation
    observable_failure: the linear/nonlinear angle gap becomes large
  recovery: Disable the broken case or reduce the release angle until the approximation error is acceptable.
  teaching_invariant: small-angle error grows at the forced large-angle failure
  limiting_cases:
  - initial angle approaching zero makes sin(theta) approach theta
  - a 120 deg release exposes the small-angle approximation error
  omissions:
  - The platform fixes damping and integration grid and omits the source solver-residual and extended validation
    diagnostics.
  reference:
    type: separately_formulated_numerical
    formulation: High-accuracy continuous nonlinear and linear pendulum integration
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Linear and nonlinear pendulum angles
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Angular displacement (deg)
  - key: mechanism
    title: Approximation error and nonlinear phase state
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Angular model gap (deg)
    - id: x2
      title: Angular displacement (deg)
    - id: y2
      title: Angular rate (deg/s)
- id: P05
  number: 5
  source_folder: modules/05-close-a-loop-with-proportional-control
  target_folder: modules/05-close-a-loop-with-proportional-control
  source_model:
    path: modules/05-close-a-loop-with-proportional-control/model.m
    sha256: 30bf526bcffff28fc74ec5f925a82f5f3d69e820079bbac3388413a3c85b8386
  controls:
  - platform_control: proportional_gain
    source_quantity: Proportional gain
    unit: gain
    role: learner_sweep
  - platform_control: plant_time_constant_s
    source_quantity: Plant time constant
    unit: s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - tau*y_dot=-y+Kp*(r+s*y), with s=-1 for negative feedback and s=+1 for the failure
  observables:
  - quantity: plant output
    unit: ratio
  - quantity: tracking error
    unit: ratio
  - quantity: control command
    unit: ratio
  sweeps:
  - control: proportional_gain
    evidence_case: sweep_1
    endpoint: 6.0
    one_variable: true
    expected_observation: Gain should speed the response and reduce—but not eliminate—the step error.
  - control: plant_time_constant_s
    evidence_case: sweep_2
    endpoint: 3.0
    one_variable: true
    expected_observation: Make proportional feedback speed/error tradeoffs and the sign of feedback visible.
  broken_case:
    trigger: broken_mode=true
    state_change: Reverse the measurement sign
    observable_failure: plant output grows under positive feedback
  recovery: Disable the broken case to restore subtraction at the summing junction.
  teaching_invariant: negative feedback is bounded while the reversed sign is unstable
  limiting_cases:
  - Kp=0 leaves the open plant equilibrium unchanged
  - reversing the measurement sign changes negative feedback into positive feedback
  omissions:
  - The platform fixes reference amplitude and initial condition; source-only bound tables are omitted.
  reference:
    type: closed_form
    formulation: Scalar affine closed-loop recurrence
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Proportional closed-loop response
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized plant output (ratio)
  - key: mechanism
    title: Control action and tracking error
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized control command (ratio)
    - id: y2
      title: Tracking error (ratio)
- id: P06
  number: 6
  source_folder: modules/06-tune-a-pid-by-observing-each-term
  target_folder: modules/06-tune-a-pid-by-observing-each-term
  source_model:
    path: modules/06-tune-a-pid-by-observing-each-term/model.m
    sha256: b75ab58810ad8aaf4070bb566c620de70431183c30e3af9f3035a844e2bbbfea
  controls:
  - platform_control: integral_gain
    source_quantity: Integral gain
    unit: 1/s
    role: learner_sweep
  - platform_control: derivative_gain
    source_quantity: Derivative gain
    unit: s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - x_ddot=u-1-0.4*x_dot; q_dot=r-x
  - u=4(r-x)+Ki*q-Kd*x_dot
  observables:
  - quantity: position
    unit: m
  - quantity: P/I/D force contributions
    unit: N
  - quantity: peak command
    unit: N
  sweeps:
  - control: integral_gain
    evidence_case: sweep_1
    endpoint: 3.0
    one_variable: true
    expected_observation: Integral action should remove load error; derivative action should suppress overshoot.
  - control: derivative_gain
    evidence_case: sweep_2
    endpoint: 7.0
    one_variable: true
    expected_observation: Observe proportional, integral, and derivative actions separately on a loaded carriage.
  broken_case:
    trigger: broken_mode=true
    state_change: Reverse derivative-feedback sign
    observable_failure: derivative action injects energy and command magnitude grows
  recovery: Disable the broken case to restore derivative damping.
  teaching_invariant: correct derivative feedback dissipates rather than injects energy
  limiting_cases:
  - Ki=0 removes integral memory while Kd=0 removes derivative damping
  - negative derivative gain injects rather than dissipates velocity feedback
  omissions:
  - The platform fixes Kp, load, damping, horizon, and initial state to isolate Ki and Kd.
  reference:
    type: alternative_algorithm
    formulation: Augmented affine PID state-transition recurrence
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: PID position response
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Position (m)
  - key: mechanism
    title: PID command decomposition
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Force contribution (N)
- id: P07
  number: 7
  source_folder: modules/07-see-stability-margin-in-time-and-frequency
  target_folder: modules/07-see-stability-margin-in-time-and-frequency
  source_model:
    path: modules/07-see-stability-margin-in-time-and-frequency/model.m
    sha256: 223a80479b0ce06e48d37b4b210260a0bf16766d9b42d2254c468b5b0769b4cd
  controls:
  - platform_control: loop_gain
    source_quantity: Loop gain
    unit: 1/s²
    role: learner_sweep
  - platform_control: actuator_lag_s
    source_quantity: Actuator lag
    unit: s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - L(s)=K/[s(s+1)(tau*s+1)]
  - phase margin is evaluated at |L(j*omega_c)|=1
  observables:
  - quantity: plant output
    unit: ratio
  - quantity: open-loop magnitude
    unit: dB
  - quantity: open-loop phase
    unit: deg
  sweeps:
  - control: loop_gain
    evidence_case: sweep_1
    endpoint: 4.0
    one_variable: true
    expected_observation: Higher gain moves crossover upward where actuator lag removes phase margin.
  - control: actuator_lag_s
    evidence_case: sweep_2
    endpoint: 0.5
    one_variable: true
    expected_observation: Connect gain/phase margins to ringing and instability in the same transparent loop.
  broken_case:
    trigger: broken_mode=true
    state_change: Force K=4 and actuator lag=0.5 s
    observable_failure: phase reserve becomes negative and the time response rings
  recovery: Disable the broken case or lower loop gain until both margins are positive.
  teaching_invariant: actuator lag reduces phase reserve
  limiting_cases:
  - actuator lag approaching zero removes its phase contribution
  - the source failure combines K=4 with 0.5 s lag and yields negative phase reserve
  omissions:
  - The platform uses a fixed logarithmic display grid and reports an approximate grid crossover; the independent
    reference root-solves the crossover.
  reference:
    type: alternative_algorithm
    formulation: Affine plant recurrence plus root-solved frequency crossover
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Closed-loop stability-margin response
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized plant output (ratio)
  - key: mechanism
    title: Open-loop frequency response
    axes:
    - id: x
      title: Angular frequency (rad/s)
    - id: y
      title: Magnitude (dB)
    - id: y2
      title: Phase (deg)
- id: P08
  number: 8
  source_folder: modules/08-reject-a-disturbance-with-feedback
  target_folder: modules/08-reject-a-disturbance-with-feedback
  source_model:
    path: modules/08-reject-a-disturbance-with-feedback/model.m
    sha256: bff95267e52505a22fb513477abb436ca0c9bb631f6429201479af17cc9883a3
  controls:
  - platform_control: feedback_gain
    source_quantity: Feedback gain
    unit: gain
    role: learner_sweep
  - platform_control: disturbance_frequency_rad_s
    source_quantity: Disturbance frequency
    unit: rad/s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - y_dot=-y+u+d; u=-K*(y+b)
  - '|S(j*omega)|=1/sqrt((1+K)^2+omega^2)'
  observables:
  - quantity: plant disturbance
    unit: normalized input
  - quantity: true/measured output
    unit: normalized output
  - quantity: control command
    unit: normalized input
  sweeps:
  - control: feedback_gain
    evidence_case: sweep_1
    endpoint: 9.0
    one_variable: true
    expected_observation: More gain should reject a slow plant disturbance but amplify control response to bias.
  - control: disturbance_frequency_rad_s
    evidence_case: sweep_2
    endpoint: 8.0
    one_variable: true
    expected_observation: Separate true disturbance rejection from the cost of measurement bias.
  broken_case:
    trigger: broken_mode=true
    state_change: Inject a measurement bias after the disturbance starts
    observable_failure: feedback reacts to sensor bias and creates costly true motion
  recovery: Disable the broken case and validate/calibrate the sensor bias.
  teaching_invariant: sensitivity attenuation matches the closed-loop frequency relation
  limiting_cases:
  - K=0 gives open-loop disturbance response
  - zero disturbance frequency reduces the sensitivity magnitude to 1/(1+K)
  omissions:
  - The platform fixes plant pole, disturbance start, and horizon; source-only extended sensitivity tables are omitted.
  reference:
    type: alternative_algorithm
    formulation: Closed-loop scalar recurrence with analytic sensitivity
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Disturbance rejection response
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Plant disturbance (normalized input)
    - id: y2
      title: True output (normalized output)
  - key: mechanism
