    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Measured output (normalized output)
    - id: y2
      title: Control command (normalized input)
- id: P09
  number: 9
  source_folder: modules/09-discretize-a-continuous-controller
  target_folder: modules/09-discretize-a-continuous-controller
  source_model:
    path: modules/09-discretize-a-continuous-controller/model.m
    sha256: 3eafd5232b4dec38c1ccb34c0224d258630d0f1c0454678d72cdae01903d0803
  controls:
  - platform_control: sample_period_s
    source_quantity: Controller sample period
    unit: s
    role: learner_sweep
  - platform_control: integral_gain
    source_quantity: Integral gain
    unit: 1/s
    role: learner_sweep
  - platform_control: broken_mode
    source_quantity: Enable the source broken case
    unit: flag
    role: failure_injection
  state_equations:
  - y[k+1]=exp(-Ts)*y[k]+(1-exp(-Ts))*u[k]
  - q[k+1]=q[k]+Ts*e[k] with the declared broken integral convention
  observables:
  - quantity: digital PI output
    unit: ratio
  - quantity: held command
    unit: normalized input
  - quantity: integral state
    unit: ratio*s
  sweeps:
  - control: sample_period_s
    evidence_case: sweep_1
    endpoint: 0.3
    one_variable: true
    expected_observation: A coarser sample period should move the digital response away from the continuous target.
  - control: integral_gain
    evidence_case: sweep_2
    endpoint: 7.0
    one_variable: true
    expected_observation: Compare a sampled PI implementation with its continuous design target.
  broken_case:
    trigger: broken_mode=true
    state_change: Force Ts=0.3 s and use the declared delayed-integral update
    observable_failure: coarse/delayed integration changes the sampled PI trajectory
  recovery: Disable the broken case and reduce the controller sample period.
  teaching_invariant: sampled PI remains finite and exposes the chosen discretization
  limiting_cases:
  - Ts approaching zero approaches the continuous-controller convention
  - the broken delayed-integral convention remains deterministic and finite on the declared grid
  omissions:
  - The platform fixes Kp, plant pole, reference, and horizon and does not expose alternate discretization families.
  reference:
    type: alternative_algorithm
    formulation: Augmented sampled-data PI state recurrence
    path: reference_cases.py
    independent: true
    imports_production_entrypoint: false
    derived_from_production_output: false
    perturbs_production_output: false
  plots:
  - key: response
    title: Sampled PI response versus continuous target
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Normalized plant output (ratio)
  - key: mechanism
    title: Held command and discrete integral state
    axes:
    - id: x
      title: Time (s)
    - id: y
      title: Held command (normalized input)
    - id: y2
      title: Integral state (ratio·s)
