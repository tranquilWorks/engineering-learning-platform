[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-learning-platform-api"
version = "0.1.0"
description = "Course catalog and numerical runtime for the Engineering Learning Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.38,<1",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "numpy>=2.3,<3",
  "scipy>=1.17,<2",
  "pandas>=2.2,<3",
  "orjson>=3.10,<4"
]

[project.optional-dependencies]
large-data = ["pyarrow>=18,<23"]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
