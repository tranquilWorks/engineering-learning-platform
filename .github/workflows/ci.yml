name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: pip install -e 'apps/api[dev]'
      - name: Check generated schemas
        run: PYTHONPATH=apps/api/src python3 scripts/export_schemas.py --check
      - name: Validate course contracts and deterministic defaults
        run: PYTHONPATH=apps/api/src python3 scripts/validate_courses.py --execute --deterministic
      - name: Test API and runtime
        run: PYTHONPATH=apps/api/src pytest -q apps/api/tests
      - name: Static Python checks
        run: ruff check apps/api/src apps/api/tests courses scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: engineering-learning-platform:ci
