schema_version: 1
standard:
  id: ELP-COURSE-CALIBER-1
  effective_date: '2026-09-21'
  control_repository: tranquilWorks/portfolio-control
  control_revision: 2fd02a1b72536ee6f4ff59357a74be7dc99c72c8
  audit_baseline: 1506591946ec8e96fe3201e8893b8ad851a1685a
count_semantics: implementation_inventory_not_curriculum_completeness
maturity_states:
- id: source_authored
  definition: Canonical learning goals, prerequisites, explanations, exercises, and source provenance are authored
    rather than placeholders.
  required_evidence: Reviewed source inventory, immutable revision, and no unresolved authorship gaps in the
    claimed scope.
- id: platform_converted
  definition: The reviewed source or approved native design is represented by complete learner-facing modules
    and executable platform artifacts.
  required_evidence: Complete lesson, runtime, provenance, deterministic discovery, and execution evidence
    for every mapped item.
- id: numerically_verified
  definition: Course-specific computations pass independently originated references with units, tolerances,
    limiting cases, and failure behavior.
  required_evidence: Evidence-origin metadata and semantic anti-template review across unrelated competencies.
- id: curriculum_covered
  definition: A reviewed competency map demonstrates appropriate foundations, breadth, sequencing, assessment,
    exclusions, and cross-course handoffs.
  required_evidence: Every in-scope competency maps to teaching modules and assessment evidence; inventory
    counts are insufficient.
- id: capstone_integrated
  definition: Learners integrate multiple mapped competencies in one or more cumulative, independently assessed
    capstones.
  required_evidence: Capstone traceability names integrated competencies, modules, artifacts, recovery behavior,
    and cumulative assessment.
- id: learner_validated
  definition: Representative learners meet predeclared comprehension, usability, and accessibility criteria.
  required_evidence: Reviewed protocol, cohort, privacy boundary, results, and acceptance thresholds.
rubric_dimensions:
- foundations_prerequisites
- breadth_sequencing
- derivation_physical_meaning
- unique_executable_fidelity
- sweeps_limits_failure_recovery
- independent_evidence
- formative_cumulative_assessment
- capstones
- exclusions_cross_course_handoffs
policies:
  conversion_authorization:
    competency_map_required: true
    schema: portfolio-control/contracts/course-competency-map.schema.json
    count_source: competency_to_module_matrix
    arbitrary_module_target_allowed: false
  batching:
    max_new_lessons: 10
    coherent_unit_required: true
  semantic_fidelity:
    anti_template_review_required: true
    compared_facets:
    - governing_relations
    - state
    - controls
    - transformations
    - outputs
    - failures
    - reference_methods
  independent_evidence:
    origin_metadata_required: true
    imports_production_entrypoint_allowed: false
    derived_from_production_output_allowed: false
    perturbs_production_output_allowed: false
  completion_language:
    module_counts_are_inventory_only: true
    curriculum_complete_requires: 'curriculum_covered: passed'
course_reviews:
- course_id: dsp-radar
  title: DSP and Radar
  inventory:
    source_items: 84
    platform_modules: 84
    interactive_modules: 84
  maturity:
    source_authored:
      status: passed
      evidence: The pinned source contains 84 authored DSP and radar modules.
      limitation: Source authorship does not establish fidelity of the native platform implementation.
    platform_converted:
      status: passed
      evidence: The catalog discovers and deterministically executes 84 native modules.
      limitation: Structural conversion is not semantic equivalence or curriculum completeness.
    numerically_verified:
      status: passed
      evidence: 'Fresh replay of 417 retained independent comparisons: two analytic P01 signatures and five
        separately formulated scenarios for P02–P84. All existing physical/failure/source-fidelity tests remain
        required; see docs/course-quality/dsp-aggregate-review.json.'
      limitation: Aggregate acceptance covers the retained deterministic synthetic models and cases; it does
        not establish MATLAB parity, physical radar behavior or universal numerical accuracy.
    curriculum_covered:
      status: passed
      evidence: Reviewed competency-map.yaml binds all 84 existing identities to acyclic prerequisites, 84
        authored formative checkpoints and ten cumulative evidence portfolios with explicit tasks, rubrics,
        exclusions and handoffs. Referenced assessment.md files are embedded through the portable markdown
        contract.
      limitation: This is authored curriculum coverage against the declared scope. It is not representative-learner
        effectiveness; final browser delivery evidence is recorded separately.
    capstone_integrated:
      status: passed
      evidence: P84 independently verifies its waveform, receiver correction, conjugate compression, range-Doppler,
        CFAR, report and gated tracking stages. DSP-A10 maps those executed competencies to a four-part cumulative
        evidence rubric; other branches have separate portfolios.
      limitation: P84 selected first-scan controls do not recompute its fixed baseline eight-scan tracker.
        Arrays, FMCW, MIMO, imaging and passive processing are not integrated into this capstone. No learner
        passing or operational performance is claimed.
    learner_validated:
      status: not_run
      evidence: No representative-learner study is retained.
      limitation: No learning-effectiveness or accessibility acceptance claim is supported.
  rubric:
    foundations_prerequisites:
      status: passed
      finding: Explicit entry knowledge and acyclic lesson/competency prerequisites are retained in competency-map.yaml;
        all links bind actual native identities.
    breadth_sequencing:
      status: passed
      finding: Ten domains cover the 84 retained identities with exact competency, formative and cumulative
        bindings; count is derived from the matrix.
    derivation_physical_meaning:
      status: passed
      finding: Each checkpoint adds a concrete dimensioned relation, prediction, expected explanation and model
        limit to the preserved source lesson and numerical lab.
    unique_executable_fidelity:
      status: passed
      finding: All 84 distinct repaired experiments and their source identities remain byte-identical to the
        semantic-revision baseline; prior semantic/source checks remain enforced.
    sweeps_limits_failure_recovery:
      status: passed
      finding: Checkpoint tasks connect existing controls, one-variable comparisons, named faults/recovery
        and domain-specific limiting assumptions. Numerical and browser evidence have separately named scopes.
    independent_evidence:
      status: passed
      finding: 417 fresh independent comparisons retain original oracle formulations, expected hashes and tolerances;
        no production-derived expected values or oracle modifications.
    formative_cumulative_assessment:
      status: passed
      finding: 84 individually authored checkpoints and ten four-task/four-criterion cumulative portfolios
        are embedded. Authored self-check guidance does not record learner achievement.
    capstones:
      status: passed
      finding: P84 stage quantities bind to DSP-A10 and its actual pulsed-chain competencies. Separate array/FMCW/imaging/passive
        portfolios prevent unsupported universal integration claims.
    exclusions_cross_course_handoffs:
      status: passed
      finding: Map names exclusions and Controls/Robotics/statistics/RF/embedded handoffs; unperformed learner,
        manual screen-reader, MATLAB, hardware and production acceptance remains explicit.
  disposition: maintain
  follow_up_issues:
  - 441
