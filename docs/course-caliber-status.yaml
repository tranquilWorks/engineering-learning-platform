schema_version: 1
standard:
  id: ELP-COURSE-CALIBER-1
  effective_date: '2026-09-21'
  control_repository: tranquilWorks/portfolio-control
  control_revision: 2fd02a1b72536ee6f4ff59357a74be7dc99c72c8
  audit_baseline: 1506591946ec8e96fe3201e8893b8ad851a1685a
count_semantics: implementation_inventory_not_curriculum_completeness
maturity_states:
- id: source_authored
  definition: Canonical learning goals, prerequisites, explanations, exercises, and source provenance are authored rather
    than placeholders.
  required_evidence: Reviewed source inventory, immutable revision, and no unresolved authorship gaps in the claimed scope.
- id: platform_converted
  definition: The reviewed source or approved native design is represented by complete learner-facing modules and executable
    platform artifacts.
  required_evidence: Complete lesson, runtime, provenance, deterministic discovery, and execution evidence for every mapped
    item.
- id: numerically_verified
  definition: Course-specific computations pass independently originated references with units, tolerances, limiting cases,
    and failure behavior.
  required_evidence: Evidence-origin metadata and semantic anti-template review across unrelated competencies.
- id: curriculum_covered
  definition: A reviewed competency map demonstrates appropriate foundations, breadth, sequencing, assessment, exclusions,
    and cross-course handoffs.
  required_evidence: Every in-scope competency maps to teaching modules and assessment evidence; inventory counts are insufficient.
- id: capstone_integrated
  definition: Learners integrate multiple mapped competencies in one or more cumulative, independently assessed capstones.
  required_evidence: Capstone traceability names integrated competencies, modules, artifacts, recovery behavior, and cumulative
    assessment.
- id: learner_validated
  definition: Representative learners meet predeclared comprehension, usability, and accessibility criteria.
  required_evidence: Reviewed protocol, cohort, privacy boundary, results, and acceptance thresholds.
rubric_dimensions:
- foundations_prerequisites
- breadth_sequencing
- derivation_physical_meaning
- unique_executable_fidelity
- sweeps_limits_failure_recovery
- independent_evidence
- formative_cumulative_assessment
- capstones
- exclusions_cross_course_handoffs
policies:
  conversion_authorization:
    competency_map_required: true
    schema: portfolio-control/contracts/course-competency-map.schema.json
    count_source: competency_to_module_matrix
    arbitrary_module_target_allowed: false
  batching:
    max_new_lessons: 10
    coherent_unit_required: true
  semantic_fidelity:
    anti_template_review_required: true
    compared_facets:
    - governing_relations
    - state
    - controls
    - transformations
    - outputs
    - failures
    - reference_methods
  independent_evidence:
    origin_metadata_required: true
    imports_production_entrypoint_allowed: false
    derived_from_production_output_allowed: false
    perturbs_production_output_allowed: false
  completion_language:
    module_counts_are_inventory_only: true
    curriculum_complete_requires: 'curriculum_covered: passed'
course_reviews:
- course_id: dsp-radar
  title: DSP and Radar
  inventory:
    source_items: 84
    platform_modules: 84
    interactive_modules: 84
  maturity:
    source_authored:
      status: passed
      evidence: The pinned source contains 84 authored DSP and radar modules.
      limitation: Source authorship does not establish fidelity of the native platform implementation.
    platform_converted:
      status: passed
      evidence: The catalog discovers and deterministically executes 84 native modules.
      limitation: Structural conversion is not semantic equivalence or curriculum completeness.
    numerically_verified:
      status: blocked
      evidence: Verification records and fixtures exist for all 84 modules.
      limitation: P02-P84 share a generic execution structure across unrelated topics; issue 441 must replace and independently
        reverify them.
    curriculum_covered:
      status: blocked
      evidence: The source topic inventory is broad.
      limitation: Coverage cannot pass until fidelity remediation and a reviewed competency matrix close the audit.
    capstone_integrated:
      status: blocked
      evidence: P84 is labeled as an end-to-end radar processing capstone.
      limitation: Its native implementation has not passed semantic fidelity or independent capstone evidence.
    learner_validated:
      status: not_run
      evidence: No representative-learner study is retained.
      limitation: No learning-effectiveness or accessibility acceptance claim is supported.
  rubric:
    foundations_prerequisites:
      status: partial
      finding: The sequence is extensive, but prerequisites are not reconciled to a reviewed competency graph.
    breadth_sequencing:
      status: partial
      finding: Topic breadth is strong; competency depth and sequencing require post-remediation review.
    derivation_physical_meaning:
      status: partial
      finding: Source derivations are substantial, but native fidelity is not established for P02-P84.
    unique_executable_fidelity:
      status: failed
      finding: P02-P84 reuse a generic implementation structure across unrelated DSP and radar topics.
    sweeps_limits_failure_recovery:
      status: partial
      finding: Declared sweeps and broken cases do not compensate for failed semantic fidelity.
    independent_evidence:
      status: failed
      finding: Existing evidence cannot close correctness while the production implementations are semantically templated.
    formative_cumulative_assessment:
      status: partial
      finding: Module checks exist; cumulative competency assessment is not demonstrated.
    capstones:
      status: failed
      finding: P84 cannot pass until its course-specific runtime and independent integration evidence are repaired.
    exclusions_cross_course_handoffs:
      status: partial
      finding: MATLAB and physical boundaries are explicit; competency handoffs remain unmapped.
  disposition: remediate
  follow_up_issues:
  - 441
- course_id: controls-gnc
  title: Controls and Guidance, Navigation, and Control
  inventory:
    source_items: 24
    platform_modules: 68
    interactive_modules: 68
  maturity:
    source_authored:
      status: passed
      evidence: The immutable source pin contains 24 authored modules with exact per-file identities retained in both source
        and fidelity maps.
      limitation: The authored inventory is not a complete Controls/GNC competency map.
    platform_converted:
      status: passed
      evidence: The catalog discovers and deterministically executes 24 source-bound conversions plus forty-four competency-mapped
        Python-first native laboratories through three cumulative capstones, each with two one-variable sweeps and
        named broken/recovery paths.
      limitation: The 68-module inventory represents the reviewed map, but native additions do not claim MATLAB/source equivalence.
    numerically_verified:
      status: passed
      evidence: P01-P68 each retain independently originated baseline, two sweep, broken, and recovery signatures with units,
        tolerances, finite comparisons, limiting cases, and teaching invariants.
      limitation: Verification is deterministic software-only evidence; MATLAB runtime, browser/accessibility, learner, and
        physical HIL evidence remain unperformed.
    curriculum_covered:
      status: passed
      evidence: The reviewed 68-module competency/prerequisite map closes every named topic to a lesson or explicit cross-course
        handoff; P01-P68 implement the complete prerequisite-closed sequence and all named assessments.
      limitation: This is platform curriculum coverage; learner-effectiveness and physical-system validation are separate evidence states.
    capstone_integrated:
      status: passed
      evidence: P66 traces identification, control, estimation, and uncertainty requirements; P67 traces navigation, guidance,
        monitoring, and actuator constraints; P68 traces timing, loss, and fail-zero watchdog requirements.
      limitation: Capstones are deterministic software integrations, not physical HIL, certification, or production evidence.
    learner_validated:
      status: not_run
      evidence: No representative-learner study is retained.
      limitation: No learning-effectiveness or accessibility acceptance claim is supported.
  rubric:
    foundations_prerequisites:
      status: passed
      finding: The reviewed prerequisite graph and cross-course handoffs are implemented through P68 without unresolved internal gaps.
    breadth_sequencing:
      status: passed
      finding: Sixty-eight implemented topics cover source foundations, mapped breadth, sequencing, and three cumulative capstones.
    derivation_physical_meaning:
      status: passed
      finding: Every item retains governing relations, observables, units, limiting cases, failure behavior, and explicit
        omissions.
    unique_executable_fidelity:
      status: passed
      finding: P01-P68 retain distinct state equations, controls, observables, failures, plots, and reference formulations.
    sweeps_limits_failure_recovery:
      status: passed
      finding: Every item executes baseline, two one-variable sweeps, broken behavior, and explicit recovery with invariant
        checks.
    independent_evidence:
      status: passed
      finding: Course-owned references import no production entrypoint, consume no production output, and perturb no production
        value.
    formative_cumulative_assessment:
      status: passed
      finding: Per-item prediction, checks, recovery, and teach-back culminate in three requirements-traced capstone assessments.
    capstones:
      status: passed
      finding: P66-P68 close control/estimation, navigation/guidance, and software-HIL requirement chains with explicit failure recovery.
    exclusions_cross_course_handoffs:
      status: passed
      finding: MATLAB, browser, learner, and physical-HIL exclusions are explicit, and the reviewed map names Robotics, Statistics,
        Optimization, Flight Dynamics, Embedded/RT-HIL, Reliability/FDIR, and Vehicle Dynamics handoffs.
  disposition: maintain
  follow_up_issues: []
- course_id: robotics-autonomy
  title: Robotics and Autonomy
  inventory:
    source_items: 24
    platform_modules: 69
    interactive_modules: 69
  maturity:
    source_authored:
      status: partial
      evidence: P01 is implemented source material; P02-P24 provide approved identities and scaffolds.
      limitation: P02-P24 are not fully authored runnable source lessons.
    platform_converted:
      status: passed
      evidence: The catalog discovers and deterministically executes all 69 reviewed modules; P01-P24 retain source/depth provenance and P25-P69 are approved native additions.
      limitation: P02-P69 include Python-first platform designs and do not claim source or MATLAB equivalence.
    numerically_verified:
      status: passed
      evidence: P01 retains source-design cases and P02-P69 use analytic, invariant, or separately formulated references that
        do not import production experiments; every P25-P69 item retains five-scenario independent and production evidence.
      limitation: Verification is software-only and excludes MATLAB runtime and physical robot/HIL evidence.
    curriculum_covered:
      status: passed
      evidence: The reviewed 69-module competency map closes foundations, geometry, dynamics, control, perception, SLAM, planning, manipulation, task autonomy, systems integration, assessments, and cross-course handoffs.
      limitation: Passing reviewed curriculum coverage does not establish learner comprehension, accessibility, or physical-robot safety.
    capstone_integrated:
      status: passed
      evidence: P68 and P69 retain requirement traces across perception, mapping/SLAM, replanning, dynamic avoidance, manipulation, grasp mechanics, contact/passivity control, interfaces, replay, and recovery.
      limitation: The capstones are deterministic software integrations; no physical HIL, field, or production evidence is claimed.
    learner_validated:
      status: not_run
      evidence: No representative-learner study is retained.
      limitation: No learning-effectiveness or accessibility acceptance claim is supported.
  rubric:
    foundations_prerequisites:
      status: passed
      finding: The reviewed prerequisite graph covers mobile and manipulator kinematics, mechanics, probability, perception, optimization, control, timing, and safety foundations.
    breadth_sequencing:
      status: passed
      finding: P01-P69 form prerequisite-closed arcs from foundations through planning, manipulation, systems integration, and two cumulative capstones.
    derivation_physical_meaning:
      status: passed
      finding: Native lessons state equations, frames, units, assumptions, and limiting behavior.
    unique_executable_fidelity:
      status: passed
      finding: All 69 modules use distinct course-specific models and stable result structures; the 45 additions have unique governing-equation fingerprints.
    sweeps_limits_failure_recovery:
      status: passed
      finding: Each module retains two useful sweeps and a named broken/recovery path.
    independent_evidence:
      status: passed
      finding: References do not import production experiments and retain tolerances and measured errors.
    formative_cumulative_assessment:
      status: passed
      finding: Focused checks, reviewed assessment mappings, five-scenario evidence, and P68/P69 cumulative requirement traces cover formative and cumulative software assessment.
    capstones:
      status: passed
      finding: P68 closes mobile autonomy and P69 closes two-link manipulation with multiple named prerequisites, signed requirements, broken integration, and exact recovery.
    exclusions_cross_course_handoffs:
      status: passed
      finding: Software/physical boundaries and controls, estimation, optimization, embedded/timing, reliability, and vehicle-dynamics handoffs are explicit in the reviewed map and lessons.
  disposition: maintain
  follow_up_issues: []
holds:
- course_id: vehicle-dynamics
  implementation_status: preparation_complete
  authorization_status: first_batch_required
  reason: The governed course shell, reviewed 67-module map, exact source ledger, and synthetic GR86 CAN/BLE replay package are installed; no Vehicle Dynamics lesson is implemented.
  completed_release_conditions:
  - Issue 437 course-caliber gate is merged and projected into the target repository.
  - The reviewed Vehicle Dynamics competency-to-module matrix validates against the control-plane schema.
  - Replayable synthetic GR86 CAN/BLE fixtures and exact protocol provenance are available for authorized software evidence.
  release_conditions:
  - A separately authorized P01-P08 first batch forms a coherent unit and contains at most ten new lessons.
