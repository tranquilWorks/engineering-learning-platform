acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main a24818f42ff267394ee4ec97727ddb7d1978e3f4, tree 1b5f62cc0adaa1796c459e7def317405cea4fe37; target, source, map, ledger, index, or worktree drift stops implementation.
  - Repair exactly P11-P20 in numeric order. Preserve P01-P10 and P21-P84 module artifacts byte-identically. Preserve the read-only source gitlink, source map, conversion manifest, schema, authoring rules, course identity, titles, guiding questions, phase order, and catalog count byte-identically. In coverage.yaml preserve every identity, status, record path, blocker, summary, and P01-P10/P21-P84 target digest; update only P11-P20 target_content_digest values.
  - Replace generic primary_scale, secondary_scale, noise_db, PHASE dispatch, and shared response logic with lesson-specific controls, equations, state, transformations, outputs, plots, failure behavior, and diagnostics derived from each pinned source experiment.
  - Retain each source lesson's important processing order and explicitly record retained behavior, deliberately omitted MATLAB-only display behavior, and the software-only claim boundary in each module conversion record.
  - P11 must map zero-based and signed FFT bins to hertz, match an explicit DFT to the FFT, sweep fractional-bin offset and record length, preserve meaningful phase only above a magnitude threshold, and expose the one-based-array-index frequency-axis error before exact recovery.
  - P12 must separate deterministic finite-record leakage from seeded noise; explicitly construct rectangular, Hann, Hamming, Blackman, and flat-top windows; report coherent gain, main-lobe width, amplitude error, and sidelobes; sweep window and fractional-bin offset; and reject the broken rule that all nonpeak energy is noise.
  - P13 must compare one 128-sample record at 1x, 4x, and 16x zero padding with genuinely longer 256- and 512-sample records using shared samples; preserve the two-tone 4 Hz separation case; measure display spacing and physical main-lobe/Rayleigh scale separately; and make the broken display-spacing-as-resolution claim fail.
  - P14 must implement a one-sided full-record periodogram and explicit Hann-windowed Welch PSD with correct V^2/Hz scaling; sweep segment length and overlap; repeat a tone-free probe across 24 deterministic seeds; distinguish raw segment count from effective independent averages; and expose the low bias from averaging dB instead of linear power.
  - P15 must explicitly form an STFT/PSD of the source steady tone, gated chirp, short burst, and continuous-phase hop; sweep window length and overlap separately; expose frame-time, burst-localization, chirp-ridge, and close-frequency metrics; and reject the claim that a zero-padded 64-sample window gains 2 Hz physical resolution.
  - P16 must form the analytic signal with the explicit even-length FFT Hilbert mask, retain DC/Nyquist, suppress negative-frequency redundancy, recover envelope/unwrapped phase/instantaneous frequency, sweep envelope depth and phase deviation separately, and gate the broken near-zero-envelope phase spike by amplitude reliability.
  - P17 must multiply a real 240 Hz passband tone by an explicit negative-exponent complex LO, expose desired difference and sum-frequency image, apply the explicit 129-tap windowed-sinc low-pass with group-delay handling and visible real-input 2x calibration, sweep LO frequency and phase, and make the reversed-oscillator-sign convention select the wrong signed copy before recovery.
  - P18 must compare positive/negative complex rotations with indistinguishable real projections, preserve centered signed spectra and real-versus-complex downconversion, sweep offset frequency and sample rate, show the signed discrete-time aliases at the under-Nyquist rate, and make discard-Q collapse both sign estimates before recovery by retaining I and Q.
  - P19 must inject DC offset, gain mismatch, and quadrature error separately and together; expose DC spike, desired/image ratio, trajectory/constellation geometry, axis ratio, and I/Q correlation; correct mean, gain, and shear in source order; sweep gain and quadrature error; and show that a broken global rotation cannot repair image rejection.
  - P20 must compare peak-bin, three-bin interpolated-FFT, and coherent adjacent-phase-increment frequency estimates plus de-rotated initial-phase estimates; sweep SNR and coherent record length with bounded trials; report bias, spread, circular phase error, and coherence; expose wrapped first-to-last endpoint failure; and withhold the low-amplitude estimate below the coherence gate.
  - Every repaired module must validate finite bounded inputs before allocation; use deterministic NumPy only; return finite Plotly-compatible results with physical axes and units; include baseline, two one-variable sweeps, one named broken case, exact recovery, limiting cases, common mistakes, formative checks, and teach-back completion.
  - Extend the course-owned independent reference implementation without importing a production experiment, consuming production output, or perturbing a production value. Retain origin, scenario parameters, signature fields and units, tolerances, and finite expected-versus-actual evidence for baseline, sweep_1, sweep_2, broken, and recovery for every P11-P20 item.
  - Update the remediation ledger to distinguish P01 already distinct, P02-P10 repaired in the prior batch, P11-P20 repaired in this batch, and P21-P84 pending. Derive counts as 1 already distinct, 9 prior repaired, 10 current repaired, 64 pending, and 84 total without implying that pending modules are verified.
  - Extend structural-similarity prevention to reject unexplained identical normalized ASTs across P02-P20 and reject generic control ids for P11-P20. Regress P02-P10 evidence and behavior without changing their module artifacts.
  - Keep DSP/Radar numerically_verified, curriculum_covered, and capstone_integrated blocked after this batch because P21-P84 and P84 remain pending. Record incremental P11-P20 repair without claiming 84/84 fidelity.
  - End with exactly six courses, 290 modules, and 290 interactive modules. Record exact local verification. Hosted CI is not required by owner direction.
  - Keep MATLAB runtime comparison, browser/accessibility validation, representative learner validation, physical HIL/hardware, certification, release, deployment, credentials/settings, and production use explicitly unperformed.
