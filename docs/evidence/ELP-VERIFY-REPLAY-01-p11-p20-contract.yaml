risk:
  class: high
  hazards:
    - renamed generic logic is mistaken for source fidelity
    - source conventions for FFT index, spectral scaling, window gain, signed frequency, IQ calibration, or phase wrapping are changed silently
    - independent evidence reuses production calculations
    - P11-P20 repair is mislabeled as full P02-P84 completion
  stop_conditions:
    - exact target, source, source-map, conversion-ledger, coverage identity/status/count, course identity, or worktree drift outside the explicitly authorized P11-P20 digest refresh
    - a source-specific invariant cannot be reproduced with bounded NumPy without a new product decision
    - an independent reference needs production code or output
    - work requires P01-P10, P21-P84, source, generic runtime, UI, dependency, credential, release, deployment, or production mutation
    - any focused, full, deterministic, lint, typecheck, build, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit to restore the prior generic P11-P20 implementations while retaining P01-P10 and every other course.
evidence:
  output:
    - docs/evidence/ELP-DSP-FIDELITY-P11-P20-2026-09-24.md
    - one P11-P20 row with source flow, controls, equations, retained and omitted behavior, signatures, tolerance, failure/recovery, limitation, and residual risk
    - structural-similarity, generic-control, and P02-P10 regression results
    - focused, full, deterministic catalog, lint, typecheck, build, diff, scope, and source-cleanliness results
    - one target squash merge with exact commit and tree; issue 441 remains open for P21-P84
  claim_boundary: This batch repairs and independently verifies ten deterministic software-only DSP/Radar source conversions, P11-P20. It does not complete issue 441 or establish P21-P84 fidelity. MATLAB runtime comparison, browser/accessibility, learner, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence remain unperformed.
