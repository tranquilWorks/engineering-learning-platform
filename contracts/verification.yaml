schema_version: 1
commands:
  backend:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests
  contract:
  - ./scripts/agent-verify.sh contract
  quick:
  - ./scripts/agent-verify.sh quick
  full:
  - ./scripts/agent-verify.sh full
  deterministic-catalog:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic
    --json
  frontend:
  - npm run typecheck
  - npm run build
  lint:
  - .venv/bin/ruff check scripts/audit_course_quality.py scripts/container-quality.py apps/api/tests/test_course_delivery_quality.py
  scope:
  - git diff --check
  - git diff --name-only b107ac198543e8dfb563c6aae4175cc87da6210d
  dsp-fidelity-p77-p84:
  - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B
    -m pytest -q apps/api/tests/test_dsp_fidelity_remediation.py apps/api/tests/test_dsp_fidelity_remediation_p11_p20.py
    apps/api/tests/test_dsp_fidelity_remediation_p21_p28.py apps/api/tests/test_dsp_fidelity_remediation_p29_p40.py
    apps/api/tests/test_dsp_fidelity_remediation_p41_p52.py apps/api/tests/test_dsp_fidelity_remediation_p53_p64.py
    apps/api/tests/test_dsp_fidelity_remediation_p65_p76.py apps/api/tests/test_dsp_fidelity_remediation_p77_p84.py
    apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py apps/api/tests/test_course_caliber_status.py
  course-delivery:
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  semantic-quality-12:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_capstone_quality_revision.py apps/api/tests/test_gnc_expansion.py
    apps/api/tests/test_robotics_expansion.py apps/api/tests/test_vehicle_dynamics_expansion.py
  dsp-aggregate-quality:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_dsp_aggregate_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-dsp-assessments.py
evidence_boundary: Authored DSP curriculum and independently verified synthetic software/browser/container evidence;
  sixty other findings remain blocked. No learner, manual screen-reader, MATLAB, physical or production acceptance.
