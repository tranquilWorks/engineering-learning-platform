schema_version: 1
commands:
  robotics-map-and-regression:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/robotics-autonomy-learning courses/robotics-autonomy/modules courses/controls-gnc courses/dsp-radar courses/demo-radar courses/platform-showcase)"
evidence_boundary: These commands validate the reviewed 69-module Robotics/Autonomy boundary and the P01-P08 depth pass while regressing all 24 source-bound Python laboratories. P01-P08 each exceed 1,250 words and add a named derivation/convention, alternative or limit, practical failure/recovery, formative evidence workflow, and cross-course boundary without changing runtime code. P09-P24 depth and P25-P69 expansion remain incomplete. The evidence does not execute MATLAB, validate browser accessibility or learners, operate physical hardware/HIL, certify safety, or authorize release, deployment, credentials/settings, or production use.
