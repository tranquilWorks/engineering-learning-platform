schema_version: 1
commands:
  replay:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src .venv/bin/python -B -m pytest -q apps/api/tests/test_numerical_replay.py
    apps/api/tests/test_gnc_course.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_expansion.py
    apps/api/tests/test_vehicle_dynamics_expansion.py
  dsp-fidelity-p11-p20:
  - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src .venv/bin/python
    -B -m pytest -q apps/api/tests/test_dsp_fidelity_remediation.py apps/api/tests/test_dsp_fidelity_remediation_p11_p20.py
    apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py apps/api/tests/test_course_caliber_status.py
  contract:
  - ./scripts/agent-verify.sh contract
  quick:
  - ./scripts/agent-verify.sh quick
  full:
  - ./scripts/agent-verify.sh full
  deterministic-catalog:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src .venv/bin/python -B scripts/validate_courses.py
    --execute --deterministic --json
  lint:
  - .venv/bin/ruff check --ignore UP038 apps/api/tests/numerical_replay.py apps/api/tests/test_numerical_replay.py
    apps/api/tests/test_gnc_course.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_expansion.py
    apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_dsp_fidelity_remediation.py
    apps/api/tests/test_dsp_fidelity_remediation_p11_p20.py
  scope:
  - git diff --check
  - git diff --exit-code 01a510244801cbf2c3b7ce990693aac9dc5959c1 -- courses apps/api/src apps/web packages
    scripts .github .gitmodules
evidence_boundary: Validation portability for unchanged software simulations only. No new module implementation
  or expanded scientific tolerance; no MATLAB, learner, physical or production claim.
