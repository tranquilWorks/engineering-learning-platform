schema_version: 1
commands:
  dsp-framework:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py
  dsp-source-attested:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
evidence_boundary: These commands provide repository-static, deterministic software, API protocol, frontend build, exact DSP source identity, and read-only conversion-framework evidence for the active batch only. The source-attested profile inspects but does not execute or modify the canonical DSP course. These commands do not provide a converted P01-P84 learner page, Python numerical equivalence for any item, MATLAB execution or parity, browser or accessibility acceptance, learner effectiveness, hardware, release, deployment, or production evidence.
