schema_version: 1
commands:
  vehicle-chassis-p34-p43:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_course_caliber_status.py
  retained-courses:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  lint:
    - .venv/bin/ruff check apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_course_caliber_status.py courses/vehicle-dynamics/modules/34-* courses/vehicle-dynamics/modules/35-* courses/vehicle-dynamics/modules/36-* courses/vehicle-dynamics/modules/37-* courses/vehicle-dynamics/modules/38-* courses/vehicle-dynamics/modules/39-* courses/vehicle-dynamics/modules/40-* courses/vehicle-dynamics/modules/41-* courses/vehicle-dynamics/modules/42-* courses/vehicle-dynamics/modules/43-* courses/vehicle-dynamics/expansion_reference_cases.py
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_expansion.py
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase courses/vehicle-dynamics/fixtures courses/vehicle-dynamics/modules/0[1-9]-* courses/vehicle-dynamics/modules/1[0-9]-* courses/vehicle-dynamics/modules/2[0-9]-* courses/vehicle-dynamics/modules/3[0-3]-*)"
    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
evidence_boundary: The commands validate Vehicle Dynamics P34-P43 as ten deterministic competency-derived software-only Python-first chassis lessons with independent analytic or numerical references, five scenarios, exact provenance, and a six-course/266-module/266-interactive catalog. The 24-item source conversion and coverage ledgers and P25-P33 remain closed and unchanged; P44-P67 remain unimplemented. The evidence does not claim source or MATLAB-runtime equivalence, validate browser accessibility or learners, use measured damper, suspension, rig, track, or vehicle data, operate firmware, BLE radio, bench, vehicle, track, physical hardware/HIL, certify safety, or authorize release, deployment, credentials/settings, or production use.
