schema_version: 1
commands:
  robotics-framework:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_conversion_framework.py
  robotics-course:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_course.py
  robotics-focused:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  source-course-regression:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - ELP_GNC_SOURCE_ROOT=courses/controls-gnc-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  robotics-lint:
    - .venv/bin/ruff check apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py courses/robotics-autonomy/modules courses/robotics-autonomy/reference_cases.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
evidence_boundary: These commands provide exact source identity and cleanliness, deterministic bounded Python runtime, independent numeric reference, closed provenance, content-digest, source-course regression, API protocol, and frontend build evidence for Robotics P01-P24. P01 is checked against its implemented source design. P02-P24 are native Python designs derived from scaffolded curriculum identities and are not source-equivalence claims. P24 is a deterministic software-only HIL methodology exercise, not physical HIL evidence. MATLAB runtime, browser/accessibility acceptance, learner effectiveness, physical robot/motor/sensor/HIL, bench, field, release, deployment, credentials/settings, and production evidence remain separate and unperformed.
