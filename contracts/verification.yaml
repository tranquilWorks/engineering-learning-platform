schema_version: 1
commands:
  course-caliber-status:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_course_caliber_status.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses)"
evidence_boundary: These commands validate the course-caliber status contract and prove that the existing five-course catalog still contains 134 deterministic interactive modules without changing course files. They do not repair the child findings, establish curriculum completeness, execute MATLAB, validate learners, exercise browser accessibility, operate physical hardware or HIL, or authorize release, deployment, credentials, settings, or production use.
