schema_version: 1
commands:
  dsp-fidelity-p02-p10:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src .venv/bin/python -B -m pytest -q apps/api/tests/test_dsp_fidelity_remediation.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py apps/api/tests/test_course_caliber_status.py
  retained-courses:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  lint:
    - .venv/bin/ruff check apps/api/tests/test_dsp_fidelity_remediation.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py apps/api/tests/test_course_caliber_status.py courses/dsp-radar/remediation_reference_cases.py courses/dsp-radar/modules/02-* courses/dsp-radar/modules/03-* courses/dsp-radar/modules/04-* courses/dsp-radar/modules/05-* courses/dsp-radar/modules/06-* courses/dsp-radar/modules/07-* courses/dsp-radar/modules/08-* courses/dsp-radar/modules/09-* courses/dsp-radar/modules/10-*
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_expansion.py
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/dsp-radar-learning courses/dsp-radar/source-map.yaml courses/dsp-radar/conversion-manifest.yaml courses/dsp-radar/modules/01-* courses/dsp-radar/modules/1[1-9]-* courses/dsp-radar/modules/2[0-9]-* courses/dsp-radar/modules/3[0-9]-* courses/dsp-radar/modules/4[0-9]-* courses/dsp-radar/modules/5[0-9]-* courses/dsp-radar/modules/6[0-9]-* courses/dsp-radar/modules/7[0-9]-* courses/dsp-radar/modules/8[0-4]-* courses/controls-gnc courses/robotics-autonomy courses/vehicle-dynamics)"
evidence_boundary: The commands validate DSP/Radar P02-P10 as nine distinct deterministic source-faithful software-only experiments with independent references and five scenarios each. P01 remains the prior distinct conversion; P11-P84 remain pending and issue 441 stays open. The catalog remains six courses, 290 modules, and 290 interactive modules. The evidence does not claim full DSP/Radar numerical verification, curriculum coverage, P84 capstone integration, MATLAB runtime comparison, audio playback, browser/accessibility or learner validation, physical hardware/HIL, certification, release, deployment, credentials/settings, or production use.
