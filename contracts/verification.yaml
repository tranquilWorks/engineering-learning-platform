schema_version: 1
commands:
  vehicle-p09-p16:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_course_caliber_status.py
  retained-courses:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  lint:
    - .venv/bin/ruff check apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_course_caliber_status.py courses/vehicle-dynamics/modules/09-* courses/vehicle-dynamics/modules/10-* courses/vehicle-dynamics/modules/11-* courses/vehicle-dynamics/modules/12-* courses/vehicle-dynamics/modules/13-* courses/vehicle-dynamics/modules/14-* courses/vehicle-dynamics/modules/15-* courses/vehicle-dynamics/modules/16-* courses/vehicle-dynamics/reference_cases.py
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_robotics_conversion_framework.py
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase courses/vehicle-dynamics/fixtures courses/vehicle-dynamics/modules/01-* courses/vehicle-dynamics/modules/02-* courses/vehicle-dynamics/modules/03-* courses/vehicle-dynamics/modules/04-* courses/vehicle-dynamics/modules/05-* courses/vehicle-dynamics/modules/06-* courses/vehicle-dynamics/modules/07-* courses/vehicle-dynamics/modules/08-*)"
    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
evidence_boundary: The commands validate Vehicle Dynamics P09-P16 as eight deterministic software-only Python-first lessons with independent scalar references, five scenarios, exact provenance, and a six-course/239-module/239-interactive catalog. P17-P67 remain unimplemented. The evidence does not execute MATLAB, validate browser accessibility or learners, use measured vehicle data, operate firmware, BLE radio, bench, vehicle, track, physical hardware/HIL, certify safety, or authorize release, deployment, credentials/settings, or production use.
