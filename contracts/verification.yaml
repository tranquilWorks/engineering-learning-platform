schema_version: 1
commands:
  vehicle-telemetry-p53-p60:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_course_caliber_status.py
  retained-courses:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  lint:
    - .venv/bin/ruff check apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_course_caliber_status.py courses/vehicle-dynamics/modules/53-* courses/vehicle-dynamics/modules/54-* courses/vehicle-dynamics/modules/55-* courses/vehicle-dynamics/modules/56-* courses/vehicle-dynamics/modules/57-* courses/vehicle-dynamics/modules/58-* courses/vehicle-dynamics/modules/59-* courses/vehicle-dynamics/modules/60-* courses/vehicle-dynamics/expansion_reference_cases.py
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_expansion.py
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase courses/vehicle-dynamics/fixtures courses/vehicle-dynamics/modules/0[1-9]-* courses/vehicle-dynamics/modules/1[0-9]-* courses/vehicle-dynamics/modules/2[0-9]-* courses/vehicle-dynamics/modules/3[0-9]-* courses/vehicle-dynamics/modules/4[0-9]-* courses/vehicle-dynamics/modules/5[0-2]-*)"
    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
evidence_boundary: The commands validate Vehicle Dynamics P61-P67 as seven deterministic competency-derived software-only performance and cumulative capstone modules with independent references, five scenarios, and a six-course/290-module/290-interactive catalog. The 24-item source conversion ledger remains closed and unchanged, and all 67 reviewed Vehicle Dynamics modules are implemented. The evidence does not claim source or MATLAB-runtime equivalence, browser/accessibility or learner validation, measured vehicle data, firmware/radio/CAN electrical, bench, vehicle, track, physical hardware/HIL, certification, release, deployment, credentials/settings, or production use.
