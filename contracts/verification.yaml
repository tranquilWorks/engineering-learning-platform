schema_version: 1
commands:
  vehicle-tires-p25-p33:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_course_caliber_status.py
  retained-courses:
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
  contract:
    - ./scripts/agent-verify.sh contract
  quick:
    - ./scripts/agent-verify.sh quick
  full:
    - ./scripts/agent-verify.sh full
  deterministic-catalog:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  lint:
    - .venv/bin/ruff check apps/api/tests/test_vehicle_dynamics_expansion.py apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_course_caliber_status.py courses/vehicle-dynamics/modules/25-* courses/vehicle-dynamics/modules/26-* courses/vehicle-dynamics/modules/27-* courses/vehicle-dynamics/modules/28-* courses/vehicle-dynamics/modules/29-* courses/vehicle-dynamics/modules/30-* courses/vehicle-dynamics/modules/31-* courses/vehicle-dynamics/modules/32-* courses/vehicle-dynamics/modules/33-* courses/vehicle-dynamics/expansion_reference_cases.py
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_expansion.py
  scope:
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase courses/vehicle-dynamics/fixtures courses/vehicle-dynamics/modules/0[1-9]-* courses/vehicle-dynamics/modules/1[0-9]-* courses/vehicle-dynamics/modules/2[0-4]-*)"
    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
evidence_boundary: The commands validate Vehicle Dynamics P25-P33 as nine deterministic competency-derived software-only Python-first lessons with independent analytic or numerical references, five scenarios, exact provenance, and a six-course/256-module/256-interactive catalog. The 24-item source conversion and coverage ledgers remain closed and unchanged; P34-P67 remain unimplemented. The evidence does not claim source or MATLAB-runtime equivalence, validate browser accessibility or learners, use measured tire or vehicle data, operate firmware, BLE radio, bench, vehicle, track, physical hardware/HIL, certify safety, or authorize release, deployment, credentials/settings, or production use.
