acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 509f6b71d6b4fc51532b7bcd1bffd628cc7bfebc, tree 85c81a80aa523764de15072559fe1ba21382f8b3; any target, control, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly P17-P24 in source order: decode and plot CAN signals; fuse GPS and IMU motion; estimate vehicle state; identify parameters from a real drive; optimize a racing line; build a lap-time simulator; compare setup changes quantitatively; construct a GR86 digital twin.
  - Preserve exact source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed map, source map, fixtures, and P01-P16 byte-identically. P17-P24 retain scaffold provenance and are labeled Python-first native designs, not source or MATLAB equivalence.
  - Treat all eight IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate/sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use a course-owned independent reference implementation that imports no production experiment, consumes no production result, and perturbs no production value. Retain origin, inputs, fields/units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P17 must decode documented byte order, raw counts, scale, CAN identifier, DLC, timestamps, freshness, malformed frames, engineering units, round-trip residual, and a bounded signal trace. Its broken case must make the endian defect visible and invalid.
  - P18 must fuse bounded deterministic synthetic GPS and IMU motion with explicit timestamps, bias, interpolation or alignment, innovation, error, and recovery. Its broken case must expose a time-alignment defect rather than conceal it in a plausible trace.
  - P19 must reconstruct a two-dimensional vehicle state from speed and yaw rate with explicit frames, heading units, curvature, path coordinates, lateral acceleration, and integration limits. Its broken case must expose a degrees-versus-radians defect.
  - P20 must retain the exact title "Identify Parameters from a Real Drive" while explicitly using deterministic synthetic offline coastdown data as a software stand-in. Fit rolling resistance and aerodynamic drag with separate train and validation samples; expose excitation, conditioning, residuals, uncertainty, and an invalid under-excited fit. Do not claim measured or real-drive evidence.
  - P21 must optimize a racing line over a bounded, deterministic feasible set while exposing path offset, curvature or radius, path length, grip limit, lap-time proxy, constraint margin, and the trade between a wider radius and added distance. Its broken case must select or score an infeasible line explicitly.
  - P22 must build a bounded segment lap-time simulator with curvature speed limits plus forward acceleration and backward braking constraints. Expose segment speeds, lap time, active limits, residuals, and an invalid corner-entry overspeed when the backward pass is removed.
  - P23 must compare baseline and candidate setup changes with paired deterministic sectors, main effects, interaction, sensitivity, uncertainty or decision threshold, and an explicit quantitative verdict. Its broken case must make an unpaired or confounded comparison invalid.
  - P24 must integrate the prior software concepts into a bounded baseline GR86 digital twin driven only by deterministic synthetic telemetry. Expose longitudinal speed, path or yaw response, residuals, requirement traceability, error metrics, and a lap-time proxy. Its broken case must reveal a steering-angle unit or equivalent interface defect. Do not claim validation against a physical GR86.
  - Validate inputs before allocation; cap samples, searches, and integration horizon; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install/import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update conversion and coverage ledgers to total=24, pending=0, converted=24, blocked=0, placeholder=0 with exact content digests and closed per-item verification records. Do not create P25 or later target folders or placeholders.
  - End with exactly six courses, 247 modules, and 247 interactive modules. Update only retained catalog-total assertions needed for this authorized eight-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
