    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every new module.
    - Assert track closure/curvature, g-g-v coupling, racing-line feasibility, forward/backward lap closure, designed-experiment effects, both requirements-traced capstones, teaching invariants, limiting cases, named failures, and exact recovery.
