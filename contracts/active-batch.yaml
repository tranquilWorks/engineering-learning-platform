acceptance:
  - Start only after the exact control commit containing this contract and the reviewed competency map is merged. Use exact clean target main 88e8f7407ce516a16e9397318c38902a78c11070, tree b713b922be3bc7a0c6fbe9f0b0bc5c485818b16c; target, control, source identity, index, or worktree drift stops implementation.
  - Validate products/engineering-learning-platform/competency-maps/controls-gnc.yaml against contracts/course-competency-map.schema.json. The planned course count is exactly len(modules)=68, with seven coherent delivery batches of nine, nine, nine, five, six, three, and three new modules; no arbitrary lesson target is used.
  - "Implement exactly P25-P33 from batch ELP-GNC-MODELING-CLASSICAL-P25-P33: nonlinear operating-point linearization, block reduction and transfer/state realizations, transient and system-type specifications, root locus, Nyquist, Bode sensitivity shaping, lead/lag, notch/prefilter, and MIMO interaction/zeros/decoupling."
  - Treat P25-P33 as nine separately reviewed work items. Each must include a complete learner lesson, unique executable model, baseline, two one-variable sweeps, broken behavior, explicit recovery, limiting cases, domain-specific quantities and units, and named teaching invariants.
  - Mark P25-P33 as Python-first native designs authorized by the reviewed competency map. Do not add them to the immutable 24-item source map, source conversion manifest, source coverage, or source fidelity map; do not claim MATLAB equivalence.
  - Implement independent references that import no production experiment, consume no production result, and perturb no production value. Retain origin metadata, inputs, signature fields/units, tolerances, measured errors, and invariant results for baseline, sweep_1, sweep_2, broken, and recovery.
  - Every plot must use domain-specific titles, axes, quantities, and units. Incompatible units require separate axes or views. Every runtime remains deterministic, finite, bounded, and within the existing trusted Python timeout.
  - P25 must distinguish operating-point residual from local linearization error; P26 must prove block/transfer/state realization equivalence and expose an invalid reduction; P27 must connect poles and system type to measured transient and steady error; P28 must preserve root-locus branch/asymptote behavior; P29 must use Nyquist encirclement with the correct open-loop right-half-plane pole count; P30 must calculate sensitivity, complementary sensitivity, disturbance, noise, and effort tradeoffs; P31 must calculate lead/lag phase and magnitude; P32 must distinguish a notch from a reference prefilter; P33 must expose interaction, transmission zeros, relative gain, and decoupling residual.
  - Preserve P01-P24 module files, source gitlink, source identity, source/fidelity/conversion evidence, and 24/24 source inventory byte-identically. Preserve DSP/Radar, Robotics, examples, platform source/UI/schema/runtime, dependencies, workflows, and deployment artifacts byte-identically.
  - End with 33 Controls/GNC platform modules and a five-course catalog of 143 modules, all interactive. Keep curriculum_covered and capstone_integrated partial because P34-P68 remain unimplemented; keep learner_validated not_run and issue 439 open.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; do not claim a hosted result that was not run. Keep browser/accessibility, learner effectiveness, physical hardware/HIL, bench, field, release, deployment, credentials/settings, certification, and production evidence explicitly unperformed.
