schema_version: 1
batch:
  id: ELP-B010-01
  title: Enforce the strict v1 course contract and revision identity
  goal: Implement the DR-001 single-version course boundary by accepting exactly schema version 1, rejecting unknown structure while preserving explicit content carriers, validating lesson-to-result references, and surfacing deterministic content plus Git and runtime revision identities without changing any canonical course repository.
sources:
  product: products/engineering-learning-platform/product.yaml
  requirements:
    - products/engineering-learning-platform/PRD.md#cap-contract-01--strict-course-contract-and-revision-identity
    - products/engineering-learning-platform/acceptance.yaml#CAP-CONTRACT-01
    - products/engineering-learning-platform/decisions/DR-001.md
    - products/engineering-learning-platform/architecture.md#strict-contract-and-course-conversion
  milestone: products/engineering-learning-platform/milestones/ELP-M1.md
  baseline_commit: 60c1b68797743616d08eb1ad34ee96f98d3bc36a
  accepted_baseline_anchor: 60c1b68797743616d08eb1ad34ee96f98d3bc36a
  baseline_policy: >-
    baseline_commit permanently identifies the audited clean pre-activation target. The implementation branch must start at exact origin/main, baseline_commit must remain its ancestor, and any committed baseline-to-origin/main delta must consist only of merged governed harness synchronization commits changing managed harness files. Before product implementation, the runner may overlay exactly `contracts/active-batch.yaml` and `contracts/repo-profile.yaml` as uncommitted activation-owned files; their contents must bind the exact merged control revision containing this contract, and they are excluded from the product-owned dirty-state and scope comparison. No committed activation successor is required. Any other uncommitted path, product-owned target movement, unexpected intervening commit or path, divergence, missing ancestry, overlay mismatch, or unmerged control revision requires replanning.
  accepted_decision: DR-001
  control_plane_planning_baseline: 8d8b705bb7542391f63960e8b3811cd5c8c9e490
  control_plane_activation_policy: The runner-installed target contract and managed profile overlays must pin the exact merged control revision containing DR-001 and this contract. That revision must be an ancestor of the fetched control-plane origin/main; an unrelated or stale local checkout is not the authority. The planning revision, a working-tree-only control revision, or an unmerged commit is not activation evidence.
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/engineering-learning-platform/batches/ELP-B010-01.yaml
  control_plane_revision: f46251f31e61d468871793a02506285c65c1ec29  # pragma: allowlist secret
dependencies:
  - ELP-G-PLAN-BASELINE
