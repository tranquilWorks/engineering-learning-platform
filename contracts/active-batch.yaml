acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 4b613a79bfe3cbd997e64e8372a58956533dae2c, tree 9d7de9eb1399cdc541cc8475a2bc0a380c9c00e5; target, source, map, ledger, index, or worktree drift stops implementation.
  - Repair exactly P02-P10 in numeric order. Preserve P01 and P11-P84 byte-identically. Preserve the read-only source gitlink, source map, conversion manifest, schema, authoring rules, course identity, titles, guiding questions, phase order, and catalog count byte-identically. In coverage.yaml preserve every identity, status, record path, blocker, summary, and P01/P11-P84 target digest; update only P02-P10 target_content_digest values to the repaired catalog revisions.
  - Replace generic primary_scale, secondary_scale, noise_db, PHASE dispatch, and shared response logic with lesson-specific controls, equations, state, transformations, outputs, plots, failure behavior, and diagnostics derived from each pinned source experiment.
  - Retain the source lesson's important processing order and explicitly record retained behavior, deliberately omitted MATLAB-only display or audio behavior, and the software-only claim boundary in each module conversion record.
  - P02 must sample the same sinusoid on dense and measurement grids, quantify interpolation error, sweep sample rate and clock offset, and prove exact below-Nyquist alias-family agreement in the broken case.
  - P03 must calculate signed alias folding and reflected phase, recover apparent frequency independently from the sample recurrence, sweep input frequency and sample rate, and make the wrong-phase reflected alias fail sample agreement.
  - P04 must implement bounded bipolar mid-rise quantization with code saturation, LSB and half-LSB error bounds, SQNR, bit-depth and utilization sweeps, deterministic dither behavior, and a clipping failure distinct from quantization noise. Audio playback remains omitted.
  - P05 must create separately normalized white, colored, narrowband, and impulsive seeded noise; expose RMS, crest factor, lag-one correlation, low-frequency power, and tone-estimation behavior; sweep colored memory and interferer offset; its broken case must compare unequal RMS records and recovery must mean-center and renormalize.
  - P06 must demonstrate that linear convolution with each impulse response matches direct delay, moving-average, echo, and resonator implementations; sweep echo delay and resonator radius; its broken circular-convolution case must show wrapped-tail error and exact linear recovery.
  - P07 must form convolution as explicit shifted signed echo addition, match manual, explicit-sum, and NumPy convolution outputs, expose per-path contributions, sweep one delay and one signed gain, and make overwrite-instead-of-add fail on overlap before exact recovery.
  - P08 must embed an asymmetric known chip sequence at a bounded delay in seeded noise, implement correlation with an explicit lag convention, match an alternate convolution formulation, sweep amplitude and noise, resolve two-target separation limits, and expose the common convolution-index-as-delay error before recovery.
  - P09 must compare source-derived FIR and stable biquad IIR magnitude, group delay, impulse, step, pulse, signal/noise, and arithmetic behavior; sweep FIR taps and IIR Q; its broken pole radius above one must grow while the recovered radius below one decays.
  - P10 must implement anti-alias filtering before integer decimation and reconstruction filtering after zero insertion, measure folded and imaging components, sweep offending tone frequency and reconstruction taps, and contrast naive sample dropping/zero insertion with filtered recovery.
  - Every repaired module must validate finite bounded inputs before allocation; use deterministic NumPy only; return finite Plotly-compatible results with physical axes and units; include baseline, two one-variable sweeps, one named broken case, exact recovery, limiting cases, common mistakes, formative checks, and teach-back completion.
  - Add a course-owned independent reference implementation that imports no production experiment, consumes no production output, and perturbs no production value. Retain origin, scenario parameters, signature fields and units, tolerances, and finite expected-versus-actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - Add a remediation ledger covering P02-P84. Mark exactly P02-P10 repaired in this batch and P11-P84 pending; P01 remains the already-distinct implemented source conversion. The ledger must derive counts and may not imply that the remaining generic modules are verified.
  - Add structural-similarity prevention that rejects an unexplained identical normalized AST across unrelated repaired lessons and rejects generic control ids for repaired items.
  - Keep DSP/Radar numerically_verified, curriculum_covered, and capstone_integrated blocked after this batch because P11-P84 and P84 remain pending. Record incremental P02-P10 repair without claiming 84/84 fidelity.
  - Correct the retained Vehicle Dynamics terminal-authorization regression so it verifies its merged historical contract from baseline commit 4b613a79bfe3cbd997e64e8372a58956533dae2c instead of requiring that completed batch to remain the active contract; change no Vehicle Dynamics course artifact or claim.
  - End with exactly six courses, 290 modules, and 290 interactive modules. Record exact local verification. Hosted CI is not required by owner direction.
  - Keep MATLAB runtime comparison, browser/accessibility validation, representative learner validation, audio playback, physical HIL/hardware, certification, release, deployment, credentials/settings, and production use explicitly unperformed.
