acceptance:
- Start after this exact control contract merges from merged PR50 baseline f05403ef2c0a5e31d7045c0cb796b2e136ca50c9,tree
  f30d2a4a74d1fb76b94c6446095698615847cbbb. Owner approved the final group on2026-09-28 after the explicit
  merge/continuation handoff.
- Repair exactly eight existing P77-P84. Preserve P01-P76 bytes,canonical source pin,all other courses,platform,dependencies,workflows,identities,source-map
  and conversion manifest. Only eight coverage target_content_digest values may change.
- 'P77: seed7701,5GHz,121 aperture looks at.25m over30m,990:.5:1035m range with2.5m sinc response,two targets(-6,1002)/(7,1020)m
  and.015noise. Explicit complex row interpolation, hypothesized slant range,positive two-way phase compensation
  and pixel sums on source image grid. Centered21/61/121looks and0/5/10mm sinusoidal assumed-path sweeps;10mm
  wrong path failure and exact same-data recovery.'
- 'P78: seed7801,1GHz,1601looks over400m at.25m,955:.5:1075m range,2m sinc response,target(60,1000)m,.02noise.
  Migration path relative to center look; correct interpolation samples r+DeltaR while retaining phase. Aperture100/200/400m
  and squint0/60/80m sweeps; fixed-bin versus path-following images. Wrong-sign interpolation increases migration;
  exact unchanged-input recovery. Shorter apertures crop fixed full noise record, disclosed.'
- 'P79: seed7901,10GHz,1000m scene,257 frequencies across200MHz,30m aperture/.25m spacing. Explicit coherent
  frequency/range sums and exact slant-range aperture PSF; bandwidth100/200/400MHz,aperture10/20/30m,Hamming
  versus uniform sidelobes and width. Three-target separable image. Sparse5m sampling aliases cross-range;
  dense retained-scene recovery. Preserve half-offset private uniforms.'
- 'P80: seed8001,10GHz,121looks/30m,three isolated range gates at offsets-10/0/9m,cross-range-1/.35/1.45m,35dBnoise.
  Common phase screen from lambda/8 RMS and .25 smooth/random mixture,source-seeded templates. Deramp strong
  gate,integrate adjacent phase differences,correct unchanged histories; error-RMS and random-mixture sweeps.
  Contaminated reference gate adds.95 of gate2,defocuses; isolated-gate recovery. Disclose known geometry/isolated-gate
  assumptions and centered phase gauge.'
- 'P81: seed8101,10GHz,600MHz/129frequencies,65uniform aspect looks,ten seeded scatterers,6deg aperture,6deg/s
  rotation,2m/s translation. Project rotating scatterers,form frequency histories,align translation,range IFFT
  then signed angle FFT with physical axes. Aperture2/4/6/8deg and rate3/6/12deg/s sweeps. Omitted translation
  alignment loses shape; same-history alignment restores exactly. Disclose small-angle cross-range approximation.'
- 'P82: seed8201,200kHz,4096samples,QPSK four samples/symbol with25tap sinc/cosine shaping. Separate measured
  reference35dB and surveillance containing direct2.5,multipath.1 at11samples,target.18 at24samples/500Hz,noise.08.
  Least-squares direct cancellation and explicit delay-product/Doppler cross-ambiguity on0:64samples and-1000:50:1000Hz.
  Delay,Doppler,integration and reference-quality sweeps. Twenty-percent cancellation leaves origin dominant;
  full same-data cancellation recovers. Excess path is c*tau,not monostatic range.'
- 'P83: seed8301,4sensors x8pulses,48range cells,CUT25,36guarded training cells,lambda.03m,PRF20kHz,platform90m/s,41clutter
  patches/32dB. Assumed12deg/.12 versus actual12.5deg/.125,18dB target,trace loading. Fixed-beam Doppler and
  adaptive normalized maps from identical record; clean support and ridge-offset sweeps. Twenty-five-percent30dB
  training contamination preserves assumed response and loses SCNR through interference growth,not target null;
  clean-record exact recovery.'
- 'P84: seed8401,10GHz,4MHz sampling,8us2MHz unit-energy LFM,128fast samples x32pulses,eight scans. Four targets,range-dependent
  clutter,receiver spur,noise and explicit DC/IQ image impairment/inverse. Conjugate matched filtering with
  delay correction,Hann Doppler,2D CA-CFAR,8-connected excess-weighted reports,maximum one-to-one offline truth
  matching,and gated alpha-beta track. Scan4 target fade must cause physical coast. Taper0/.5/1 and Pfa1e-4/1e-3/1e-2
  sweeps. Wrong nonconjugated replica reduces compression; recovery reuses calibrated cube. Truth never drives
  detection/association; distinguish requested Pfa from empirical correlated-cell false rate.'
- Every item preserves pinned source text and guiding question, physical labeled controls, equations/units,
  intermediate evidence, prediction,two one-variable manipulations,named failure/recovery,focused checks and
  teach-back. Distinct physical algorithms,not generic renamed templates. Bound full computation and decimate
  only display.
- Retain forty baseline/two-sweep/broken/recovery independent comparisons with per-field units,hashes,provenance
  and1e-8 absolute/scaled-relative tolerances. References use alternate algorithms or formulas,never production
  imports or outputs. Preserve byte-identical prior reference prefix and earlier fixtures. No MATLAB runtime
  claim.
- Regress P02-P76 unchanged and extend normalized-AST anti-template coverage throughP84. P01 remains the already-distinct
  conversion. Preserve historical provenance assertions while permitting active-contract rotation.
- Ledger exit:one distinct,seventy-five prior repairs,eight current repairs,zero pending,total84. This completes
