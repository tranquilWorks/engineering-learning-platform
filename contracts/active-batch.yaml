  focused_tests_to_add:
    - Validate exact source identity, P02-P10 titles and guiding questions, source-to-target retained/omitted behavior, repaired and pending ledger membership, and unchanged source-bound ledgers.
    - Execute baseline, two sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and independent-evidence checks for P02-P10.
