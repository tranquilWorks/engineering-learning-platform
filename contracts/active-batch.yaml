acceptance:
- Activate only after this control contract merges, from exact target PR57 merge f04472f16fc1da00e817d385eaef0a63f3c71b48
  and tree df3b63e993c4d488b2a280868c29a3e220523e11. Repair exactly existing Robotics P42-P48/P52. Preserve
  all290 identities, source pins, prerequisite graph, unselected module payloads and unselected reference definitions/origins/five-case
  outputs, including the completed P25-P41 and capstone repairs, except the explicitly bounded P31 wording
  and six static-summary clarifications below.
- 'Clarify only P31 wording in experiment.py explanations, lesson.md and module.yaml summary: its existing
  defect is ||S+S^T|| with S=Mdot-2C, twice the conventional symmetric-part norm. Do not change its numerical
  program, arrays, control values, metrics, signatures or retained evidence. Add a preservation check proving
  that only the declared strings and explanatory prose changed; the prior live62 checks remain intact.'
- Replace only static module.yaml summary fields in P32/P34/P36/P37/P40/P41 with parameter-independent lesson
  overviews so baseline rank, conditioning, settling, capture or visibility results are not mistaken for the
  selected run. Preserve every other manifest field and all numerical payloads; retain the dynamic interpretation
  panels and add a preservation check.
- P42 must generate actual synthetic calibration views, fit declared intrinsic/distortion parameters and reproject
  independent held-out points. A known-extrinsic calibration subproblem is permitted if explicitly bounded.
  Report actual parameter error, regressor conditioning/rank and held-out residuals. The missing-distortion
  fault preserves selected controls and may be benign at zero distortion; do not claim full joint intrinsic/extrinsic
  calibration without executing it.
- P43 must sample actual synthetic images, compute a corner/feature response, threshold and suppress candidates,
  and derive descriptors from pixel patches with an executed orientation treatment. Compute geometric repeatability
  and descriptor distances from detected features. An orientation-normalization fault need not change geometric
  detection repeatability or count. Retain zero-rotation and unavailable-match cases honestly; do not claim
  SIFT, scale or general viewpoint invariance from a fixed-scale patch lab.
- P44 must fit an actual correspondence consensus model and refit selected inliers, comparing an executed nonrobust
  fit. A declared translation-only exhaustive hypothesis problem is permitted; distinguish it from random RANSAC
  confidence or general epipolar geometry. Measure actual residual masks, parameter error and false acceptance
  against synthetic truth. Preserve selected outlier fraction/threshold and expose failed consensus at difficult
  settings rather than assign success.
- P45 must construct calibrated stereo observations, triangulate actual rays and reproject the resulting point
  through the declared cameras. A wrong rectification/pose assumption must create a measured residual rather
  than a fixed mode flag. Derive uncertainty from declared observation noise and the executed triangulation
  Jacobian; keep physical units, positive-depth assumptions and singular/low-disparity limits explicit.
- P46 must solve a declared rigid pose from actual synthetic 3D landmark projections with selected noise and
  visible count, retaining the fitted transform and pixel residuals. Full six-DOF pose is the intended scope;
  any narrower family requires explicit lesson/title boundaries and review before closure. The initializer,
  positive-depth branch, Jacobian/rank, local convergence and calibration assumptions must be disclosed. The
  fault changes an actual estimation assumption while preserving selected noise/count; no assigned error formula.
- P47 must trace actual range beams through a declared occupancy grid and accumulate free/occupied evidence
  with a specified inverse sensor model. Compute cell probabilities, entropy and truth-based error/coverage
  from that grid. An endpoint-only fault leaves traversed free space unknown, so report missed free-space evidence
  rather than falsely claim invented false-free cells. Preserve unobserved priors, ray corner-tie conventions
  and correlation/confidence boundaries.
- P48 must execute repeated nearest correspondences and rigid transformation updates with actual stopping/insufficient-match
  status. A planar SE(2) cloud is permitted with explicit scope; do not imply general 3D or global convergence.
  Outlier filtering or a composition fault must operate on actual correspondences. Retain transform, objective/correspondence
  history, actual iteration count and local-minimum outcomes. Do not mix rotation and translation in an undimensioned
  pose-error metric.
- P52 must preserve selected appearance/geometric controls in both modes, construct an actual anchored graph
  and solve it again with accepted loop factors. Compute final factor influence, objective and map displacement
  from optimized states. Geometric rejection and robust influence must be executed; a translation-only graph
  is permitted if declared. Independently verify the anchor, residuals, stationarity and zero/rejected-factor
  limits. No fixed-factor deformation surrogate.
- Author eight substantial portable lessons and embedded Course checkpoints with equations/units, worked examples,
  predictions, two one-variable sweeps, causal faults/recovery, limits and reasoning rubrics. Preserve existing
  lesson identities/control ranges and inventory; accurately narrow labels where needed. Render real mechanism
  arrays with readable desktop/mobile axes, legends and zero-span behavior; avoid magnifying numerical roundoff
  into physical claims.
- Retain five independently formulated scenarios per selected lesson at unchanged1e-8 absolute/relative tolerance.
  Expected evidence comes only from separate references and actual evidence only from production. Test full
  arrays/geometry/solutions and physical or statistical invariants beyond three-number summaries. Execute all64
  control corners through the unchanged three-second runtime, with meaningful degenerate/failure limits.
- Anchor the prior Robotics dynamics scope/reference guards to its exact PR56-to-merged-revision trees while
  preserving all62 live checks. Add a new current-baseline preservation guard. Update only obsolete selected
  surrogate invariants and successor-contract bindings; no weakened tolerance, runtime, source protection or
  unrelated numerical checks.
- Close only selected findings after independent numerical and selected baked browser checks pass. Final read-only
  nonroot delivery must verify all290 HTTP modules, all580 desktop/mobile pages, all existing plus eight new
  checkpoints, all revised control/fault/recovery/reset/drawn-plot sequences, actual plot-text clipping/overlap
  checks, all290 host/baked identities and40 independent HTTP comparisons. Then run contract, quick and full
  sequentially. Hosted CI remains separately reported/nonmandatory.
- 'After verified closure retain16 named findings: Controls0, Robotics0, Vehicle16. Keep all three non-DSP
  aggregate numerical/curriculum/capstone reassessments blocked, including courses with zero named findings.
  The defect register is non-exhaustive. Preserve DSP authored/software aggregate acceptance. No representative
  learner, manual screen-reader, MATLAB, hardware, production or concurrent-capacity claims.'
- Publish exact reviewable evidence and perform an eligible normal exact-head development merge under standing
  owner authorization, then reconcile Portfolio Control. This completes the requested twenty Robotics findings.
  Do not activate Vehicle repairs, inventory expansion or course-wide aggregate acceptance. Preserve historical
  local/hosted discrepancies and billing limits without changing account/workflow/protection settings.
