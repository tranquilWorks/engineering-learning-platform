acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 408870fbd43a739fcb16e4be3f416841036ca115, tree c5736ac588c7e20bab512a0f3cebeb1db7e6303d; any target, control, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly P09-P16 in source order: spring rate and ride frequency; damping and transient motion; roll-stiffness distribution; camber and toe geometry; engine torque through gearing; shift-point selection; braking distance and heat; drag and downforce balance.
  - Preserve exact source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed map, source map, fixtures, and P01-P08 byte-identically. P09-P16 retain scaffold provenance and are labeled Python-first native designs, not source or MATLAB equivalence.
  - Treat all eight IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate/sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use a course-owned independent reference implementation that imports no production experiment, consumes no production result, and perturbs no production value. Retain origin, inputs, fields/units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P09 must distinguish spring rate, wheel rate, motion ratio, sprung mass, and ride frequency. P10 must expose natural frequency, damping ratio, overshoot or decay, settling behavior, and an invalid negative/nonphysical damping case.
  - P11 must conserve total lateral load transfer while exposing front/rear roll-stiffness distribution and its handling implication. P12 must define camber and toe sign conventions and show their separate contact/thrust and scrub effects without claiming a full tire model.
  - P13 must map engine torque, selected gear, final drive, efficiency, wheel radius, vehicle speed, engine speed, wheel force, and the tire-force boundary. P14 must select shift points from adjacent-gear wheel-force crossover or redline and expose an invalid gear/curve setup.
  - P15 must couple braking force, load transfer, stopping distance, kinetic energy, and a bounded rotor-temperature estimate. P16 must expose dynamic pressure, drag, downforce, aero balance, straight-line cost, and grip benefit without treating a steady aero map as track evidence.
  - Validate inputs before allocation; cap samples and integration horizon; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install/import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update conversion and coverage ledgers to total=24, pending=8, converted=16, blocked=0, placeholder=0 with exact content digests and closed per-item verification records. Do not create P17-P24 target folders or placeholders.
  - End with exactly six courses, 239 modules, and 239 interactive modules. Update only retained catalog-total assertions needed for this authorized eight-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
