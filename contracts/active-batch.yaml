    apps/api/tests/test_robotics_expansion.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-navigation-geometry-quality.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Executed filtering, navigation, terminal dynamics, geometric transforms and Jacobian mechanisms with independent
    references.
  - Every selected control corner, failure and meaningful zero/degenerate limit with unchanged tolerances/runtime.
  - Exact-baseline unselected preservation plus checkpoint navigation, units and drawn browser output.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Correlated reference formulations hiding the same numerical defect.
  - Overstating synthetic navigation covariance, sampled closest approach or local Jacobian checks as operational
    certification/global guarantees.
  - Slow solves or browser workloads exceeding unchanged runtime limits.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
