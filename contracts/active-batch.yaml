    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
  focused_tests_to_add:
    - Validate exact P09-P16 membership, prerequisite closure, scaffold provenance, coverage transition, content digests, and absence of later modules.
    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every new module.
    - Assert topic-specific equations, sign/frame conventions, teaching invariants, limiting cases, physical boundaries, formative checks, and exact recovery.
    - Compare P09-P16 against analytic, invariant, or separately formulated numerical references without relabeling source scaffolds as executed designs.
    - Validate the six-course, 239-module, 239-interactive catalog and regress every retained course.
  required_ci: []
risk:
  class: high
  hazards:
    - a shared vehicle template substitutes for eight distinct governing models
    - motion-ratio exponents, damping convention, load-transfer conservation, alignment signs, gearing units, shift crossover, brake energy, or aero signs are subtly wrong
    - an independent oracle imports or derives from production behavior
    - source scaffolds are mislabeled as implemented MATLAB or source-equivalent behavior
    - invalid setups yield plausible finite plots instead of explicit broken/recovery verdicts
  stop_conditions:
    - exact target, control, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code/output or a perturbed production value
    - work requires source mutation, fixture mutation, generic runtime/UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only Vehicle Dynamics P09-P16, their independent reference/tests/evidence, and their ledger/documentation transitions while retaining P01-P08.
evidence:
  output:
    - docs/evidence/ELP-VEHICLE-P09-P16-2026-09-24.md
    - one P09-P16 row per work item with governing relation, provenance, scenarios, teaching invariant, tolerance, axes/units, limitation, and residual risk
    - focused, retained-course, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target squash merge, exact resulting commit/tree, and explicit unperformed evidence
  claim_boundary: This batch implements and independently verifies eight deterministic software-only Vehicle Dynamics lessons. P09-P16 are Python-first native designs derived from source identities and reviewed competencies. No MATLAB runtime comparison, browser/accessibility or learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, or production use is implied.
