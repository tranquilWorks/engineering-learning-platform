acceptance:
- Start only after the exact control commit containing this contract is merged. Use exact clean target main 8cc4a00d325c1098dee832f841e3af373ae8a7e3,
  tree 839c0e31c1d5df7ce6a25e33303eb48dbe29beda; any target, control, source, map, index, or worktree drift stops implementation.
- 'Implement exactly P66, P67, P68, P69 as Python-first native modules from the reviewed map: robot model/frame/interface
  integration; deterministic timed replay, diagnosis, and recovery; a cumulative perception-to-replanning mobile-autonomy
  capstone; and a cumulative perception-to-contact-control two-link manipulation capstone.'
- Treat every ID as a separately reviewed work item with a complete learner lesson, unique executable model, baseline, two
  one-variable sweeps, broken behavior, exact recovery, limiting cases, domain quantities/units, and a named teaching invariant.
- Use an independent reference that imports no production experiment, consumes no production result, and perturbs no production
  value. Retain origin, inputs, fields/units, tolerances, and finite results for baseline, sweep_1, sweep_2, broken, and recovery.
- Do not modify the immutable source map, source coverage meaning, source fidelity map, or source-bound reference; do not
  claim conversion or MATLAB equivalence for native additions.
- Every plot and metric must retain domain-specific quantities and units. Every runtime must remain deterministic, finite,
  bounded, and within the trusted Python timeout.
- Preserve every module outside P66, P67, P68, P69, the source gitlink and source evidence, every other course,
  generic platform behavior, dependencies, workflows, and deployment artifacts byte-identically.
- 'End with all 69 reviewed Robotics modules implemented/deepened and a five-course catalog of 223 modules, all interactive.
  Mark curriculum coverage and the two software capstone integrations passed only after their requirement traces and cumulative
  failure/recovery evidence pass; learner validation remains not run.'
- P68 and P69 must reuse and trace multiple named prerequisite mechanisms, expose cumulative success/failure criteria, and retain independent capstone evidence rather than concatenate prior outputs.
- Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB, browser/accessibility,
  learner, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly
  unperformed.
validation:
  local:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py
    apps/api/tests/test_robotics_course.py apps/api/tests/test_course_caliber_status.py
  - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest
    -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py
    apps/api/tests/test_gnc_course.py
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  - .venv/bin/ruff check apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py courses/robotics-autonomy
  - git diff --check
  focused_tests_to_add:
  - Validate exact batch membership, map identity, prerequisite closure, and source/native provenance.
  - Execute deterministic baseline, two sweeps, broken, recovery, invalid-input, resource, axis/unit, and evidence-independence
    checks where applicable.
  - Assert topic-specific derivations, teaching invariants, limits, failure/recovery, formative checks, and cross-course boundaries.
  required_ci: []
risk:
  class: high
  hazards:
  - a shared template substitutes for a named derivation or unique governing model
  - an independent oracle silently imports or derives from production behavior
  - a frame, interface, unit, timestamp, replay, fault, requirement-trace, or cumulative capstone convention is subtly wrong
  - the batch claims learner validation, MATLAB equivalence, browser accessibility, or physical evidence
  stop_conditions:
  - exact target, control, source, map, or worktree identity drifts
  - independent evidence needs production code/output or a perturbed production value
  - any focused, cumulative, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
  - work requires source mutation, generic runtime/UI changes, a dependency, unbounded compute, or unsupported evidence
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; do not rewrite
    source or prior batches.
evidence:
  output:
  - docs/evidence/ELP-ROB-SYSTEMS-CAPSTONES-P66-P69-2026-09-23.md
  - per-item derivation/model, scenario, invariant, tolerance, axis, limitation, and residual-risk review
  - focused, regression, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
  - one target squash merge and explicit unperformed evidence
  claim_boundary: 'This batch completes P66, P67, P68, and P69 at a deterministic software-only boundary and closes the reviewed 69-module
    Robotics map with two cumulative software capstones. It does not execute MATLAB, validate learners or browser accessibility,
    operate physical HIL/hardware, certify safety, or authorize release, deployment, credentials/settings, or production use.'
