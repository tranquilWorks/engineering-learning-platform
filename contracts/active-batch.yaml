  focused_tests_to_add:
  - Replay bound, finite/type/shape validation and material-drift rejection.
  - Saved error-metadata integrity and unchanged live scientific acceptance.
  - Retained completed DSP contract rather than permanent active-batch identity.
  required_ci:
  - Retained owner-directed local verification is mandatory; hosted CI is not a completion requirement. Report hosted
    checks separately when run.
risk:
  class: moderate
  hazards:
  - A replay allowance masks an algorithm or fixture change.
  - Historical metrics are silently replaced or fresh scientific gates weakened.
  stop_conditions:
  - Any course/source/fixture/scientific-tolerance change is needed.
  - Replay errors exceed the bounded policy or fresh scientific acceptance fails.
  - A mandatory local gate fails or is skipped.
rollback:
  strategy: Revert only the target validation repair and activation overlay; restore the prior strict replay tests.
    Course artifacts and learner state never change.
evidence:
