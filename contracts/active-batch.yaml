acceptance:
- Complete the owner-authorized content-only continuation, publish a matching Control contract, preserve
  other course payloads and source pins, and merge after verification. No inventory expansion.
- Audit all 67 lessons and their governing equations, units, numerical mechanisms, independent reference
  origins, limiting cases and named faults; repair substantive gaps with explicit scope and without weakening
  tolerances.
- Author 67 distinct browser-embedded formative checkpoints and the 14 existing competency-derived portfolios.
  Include actual controls, two sweeps, worked predictions, failure/recovery and limits. Preserve all previously
  reviewed assessment prose and control/block identities.
- Independently replay five cases per lesson through runtime and real HTTP; check full histories and invariants
  for repaired mechanisms, off-grid/corner cases, held-out data separation and bounded failures. Preserve
  historical conversion artifacts and distinguish updated current identities.
- Exercise all 134 desktop/mobile lesson views, controls, fault/reset/recovery, assessments and cumulative
  portfolios. Inspect capstone plots and math, retain actual hashes and failed attempts, and run required
  contract/quick/full gates sequentially on frozen lesson inputs.
- Promote only evidence-supported Vehicle numerical/curriculum/capstone stages after all nine review dimensions
  pass; retain DSP, Controls and Robotics acceptance and all learner-validation boundaries.
- Preserve immutable source course, source-map, conversion manifest and original verification schema.
  A compatible separate assessment schema and target-only current verification bindings may be added.
  Prior golden vectors remain historical; changed native outputs receive explicitly identified refreshed
  independent evidence.
- Historical aggregate preservation tests and the three named DSP fidelity files may recognize this exact
  successor batch/baseline; all other-course byte, numerical, oracle and source-prefix assertions remain
  enforced.
- Content-only scope retains owner-deferred Docker delivery and nonmandatory hosted CI. No learner, manual
  screen-reader, MATLAB, measured vehicle, hardware, track-safety or production acceptance follows from
  synthetic host evidence.
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_vehicle_aggregate_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-vehicle-assessments.py
  - npm run test:web
  - npm run test:browser
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  - ./scripts/verify-vehicle-host.sh
  focused_tests_to_add:
  - Independent full mechanisms, live assessment bindings, exact unchanged source/course preservation,
    singular and off-grid inputs, capstone stage/requirement evidence.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; named local gates remain required except baked
    Docker delivery explicitly deferred by the owner for this content-only merge.
risk:
  class: high
  hazards:
  - Copied reference equations masking incorrect physics.
  - Misleading dimensions, unavailable/singular values or empirical-model claims.
  - Host storage/resource contention disrupting long verification.
  stop_conditions:
  - Need source pin, generic runtime/schema, other course payload or workflow changes.
  - Cannot establish credible independent numerical or actual browser evidence.
  - Need measured vehicle data, hardware, learner or production access.
rollback:
  strategy: Revert the isolated Vehicle aggregate revision to PR64; no learner-data migration or source
    pin changes.
evidence:
  output:
  - docs/evidence/ELP-VEHICLE-AGGREGATE-QUALITY-01-2026-11-05.md
  - docs/course-quality/vehicle-aggregate-review.json
  - courses/vehicle-dynamics/assessment-map.json
  claim_boundary: Authored curriculum and independently verified synthetic software; no Docker, learner,
    MATLAB, hardware or production claim from host evidence.
