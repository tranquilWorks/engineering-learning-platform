    - Validate exact target/control/source/map/protocol/fixture identities, source cleanliness, and the 150-file source map.
    - Validate P01-P24 order and identities, P01-P02 implemented-source versus P03-P24 scaffold status, zero converted/placeholder modules, and absence of a module directory.
    - Validate CAN/BLE packet identity, independent signal decode, deterministic fault diagnostics, provenance, and privacy exclusions without importing the generator or trusting generated decoded values.
    - Validate the six-course, 223-module, 223-interactive prep catalog and every unchanged source gitlink.
