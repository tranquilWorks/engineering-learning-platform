schema_version: 1
batch:
  id: ELP-DSP-00
  title: Pin the complete DSP source and establish the item-by-item conversion framework
  goal: Pin the read-only canonical DSP/Radar source at its complete 84-item revision and establish a platform-owned, fail-closed conversion framework that fixes every source-to-target identity, measures conversion coverage without creating placeholder learner pages, and makes Python/source equivalence mandatory while representing unavailable MATLAB runtime parity honestly.
