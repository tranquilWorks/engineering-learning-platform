  - Wrong noise-energy, pulse normalization, delay, signed frequency or trial-independence conventions.
  - Circular correctness references or false course-completion claims.
  stop_conditions:
  - Source or immutable module drift.
  - Need to change generic UI/runtime/dependencies or unrelated courses.
  - Independent evidence or a mandatory gate cannot be made credible.
