acceptance:
- Start after this exact control contract merges, from clean target main b7e684d595bd777602c9aa22cd489189efa6584b,
  tree 19a298703ab04794e855edffb8aa83a6f0e2ba83. Preserve all canonical source bytes and pins.
- Repair exactly P21-P28 in numeric order. Preserve P01-P20 and P29-P84 byte-identically, all other courses, framework
  identities, source map and conversion manifest. Update only P21-P28 target_content_digest entries in coverage.yaml.
- 'P21: explicit conventional AM at 20 kHz with 3 kHz carrier, 200 Hz baseline message, 0.6 depth, single/multitone
  spectral pairs, signed versus analytic magnitude envelope, coherent 900 Hz lowpass recovery, depth and message-frequency
  sweeps, and 1.4 overmodulation failure.'
- 'P22: complex FM at 24 kHz with 3 kHz carrier, 100 Hz message and 400 Hz deviation, phase slope and sideband power,
  98 percent occupied bandwidth and Carson approximation, deviation/message sweeps, and 8 kHz carrier plus 5 kHz
  deviation aliasing recovered at 30 kHz.'
- 'P23: 400 deterministic BPSK/QPSK symbols, energy-consistent Eb/N0, bit mapping, noisy rotated constellations,
  sign decisions and BER, noise and phase sweeps, 55 degree carrier-reference failure at 16 dB and exact inverse-rotation
  recovery.'
- 'P24: explicit finite unit-energy root-raised-cosine pulse with removable singularities, rectangular comparison,
  320 QPSK symbols at eight samples per symbol, transmit convolution, reversed-conjugate matched filter and correct
  group delay, spectra/eye/symbol error, rolloff and span sweeps, half-symbol timing failure and aligned recovery.'
- 'P25: 480 pulse-shaped QPSK symbols through explicit delayed complex paths, matched-filter symbol-rate response,
  31-tap finite zero-forcing and regularized equalizers, echo-strength and regularization sweeps, deep-null [1,-0.999]
  noise amplification, and bounded regularized recovery with residual distortion reported.'
- 'P26: explicit eight-tap LMS recurrence on 6000 samples at 8 kHz, changing unknown interference path at sample
  3001, desired two-tone signal, convergence/reacquisition and coefficient error, step-size and reference-correlation
  sweeps, guarded oversized-step divergence and reset/recovery. Preserve source seed 2601.'
- 'P27: 4000 independent BPSK trials with a 16-sample unit-energy matched filter, running BER, explicit 95 percent
  Wilson intervals, block variability, trial-count and Eb/N0 sweeps, duplicated lucky-trial pseudoreplication failure
  and independent-bank recovery. Preserve source seed 2701.'
- 'P28: independent H0/H1 Gaussian matched-filter trials, 16-sample known pulse, threshold ROC, analytic Gaussian
  detection tails, unbiased amplitude estimator and variance bound across SNR, selected-detections estimation bias
  and all-trial recovery. Preserve 12000-trial bound and source seed 2801.'
- Every item has concrete physical controls, deterministic bounded NumPy processing, finite results, correctly labeled
  plots with separated incompatible units, baseline/two sweeps/broken/recovery, limiting cases, interpretation checks,
  and teach-back. Retain important source stages and explicitly document any omitted behavior; never silently replace
  a source algorithm.
- Expected values come from independently formulated references (closed form, alternate algorithm, or separately
  formulated oracle), never production imports or perturbed production values. Retain five named scenarios per item,
  origins, units, tolerances and measured errors. Distinguish NumPy seeded data from MATLAB runtime parity.
- Extend semantic and normalized-AST anti-template checks through P28. Regress P02-P20 without changing their modules.
  Historical P11-P20 contract tests may be updated to validate immutable prior facts rather than incorrectly require
  the old batch to remain active.
- Remediation ledger reports one already-distinct, nineteen prior repaired, eight current repaired, fifty-six pending,
  total eighty-four. Course numerically_verified/curriculum_covered/capstone_integrated remain blocked for P29-P84.
- All local source-attested, focused, backend, contract, quick/full, deterministic catalog, lint, frontend typecheck/build
  and diff/scope checks pass. Catalog remains 6 courses / 290 modules / 290 interactive. Hosted CI is not a completion
  requirement under retained owner direction.
- No MATLAB runtime, browser/accessibility, representative learner, hardware/HIL, certification, release/deployment
  or production claim without actual evidence. Target protected-branch merge retains its separate authorization.
