acceptance:
  - Before product edits, target HEAD, origin/main, and origin/HEAD are all exact baseline 8019d1798ea771f1f466e24c9983549ec1d6c127; the worktree and index are clean except for runner-owned activation overlays at contracts/active-batch.yaml and contracts/repo-profile.yaml, and those overlays bind the exact merged control revision containing this contract. Baseline drift, another uncommitted path, a stale/unmerged control revision, or a semantic mismatch in the activated contract stops implementation.
  - The only gitlink delta is courses/dsp-radar-learning changing in mode 160000 from 203c3738a88070bd43a93d969b6991a195bb6e27 to exact 5d73667a486df4a7b6c581e4c9406e810ed4f0f6. The .gitmodules bytes, URL https://github.com/kpbianco/dsp-radar_learning.git, branch declaration main, and the other twelve course gitlinks remain byte-for-byte unchanged.
  - The pinned source resolves to tree 7a3a0f9adce607e10097724c13745eace212f4e1 and curriculum/modules.json SHA-256 0b92e76efc1f72930fab730145326315219ab3813b8cbf17d32a33f507a4974f. Its manifest contains exactly P01 through P84 once each, numbers 1 through 84 in order, all status implemented, and nine phase counts 10, 10, 8, 14, 10, 8, 8, 6, and 10. Exactly 84 mapped source folders each contain the five required canonical inputs README.md, lesson.md, walkthrough.md, checks.md, and experiment.m; SHA-256 of the LF-terminated `sha256sum` records in C-locale relative-path order is c2511015b195a48bd847bd1f1cdeed92384a10eddf0b23e755590af4fb66ddca. No native source course.yaml or module.yaml is invented or expected.
  - Source inspection and source-attested tests run against a detached exact 5d73667a486df4a7b6c581e4c9406e810ed4f0f6 checkout or the exact initialized gitlink. A before/after inventory of tracked path, mode, Git blob identity, and SHA-256 is identical; source status is clean; no source file, source contract, retained evidence, Git ref, configuration, generated file, cache, bytecode, learner state, or submodule metadata is changed by the platform batch.
  - courses/dsp-radar/course.yaml is a valid exact-version-one native CourseManifest with stable id dsp-radar and modules_path modules. A separate closed, deterministically ordered conversion manifest enumerates exactly the same 84 P## identities, source folders, target module folders, titles, guiding questions, phases, and sequential ELP-DSP-P## batch identities without copying a learner page or claiming conversion completion.
  - The immutable source map records the exact source repository, commit, tree, curriculum digest, every P## identity and folder, and the path plus SHA-256 of all five canonical inputs per item. Tests reject an omitted, duplicated, reordered, renamed, out-of-root, wrong-commit, wrong-folder, wrong-file-set, or wrong-hash record. Later P## batches may not modify the source map or stable conversion-manifest fields; a source revision change requires a new reviewed pin/reconciliation batch.
  - The coverage ledger contains exactly 84 unique ordered entries and initially reports pending=84, converted=0, blocked=0, placeholder=0. Stable item/source/target/batch keys are bound to the immutable source-map digest; no item is marked converted and no courses/dsp-radar/modules/* learner module directory, module.yaml, lesson.md, experiment.py, copied MATLAB file, empty shell, TODO page, or bulk placeholder is created by ELP-DSP-00.
  - The course-owned conversion/parity schema is exact-versioned, closed to unknown fields, deterministic, and requires each later item record to bind the source map and target content identities; preserve the guiding question, beginner-focused physical meaning and signal flow, equations before toolbox shortcuts, constants and deterministic seed/data, important source plot order and labels, expected observations, at least two useful sweeps, one intentionally broken case with recovery, common mistakes, and a completion checklist; declare runtime kind and resource bounds; and retain named Python/source-equivalence cases, units, tolerances, expected values/digests, and results.
  - The parity schema distinguishes required Python/source equivalence from optional MATLAB runtime/visual parity. Python/source equivalence cannot be absent, skipped, weakened, or satisfied by screenshots. MATLAB status is one of passed, failed, or not_run; passed requires the exact runtime/version/toolboxes, command, inputs, tolerances, outputs, and retained evidence, while not_run requires a reason and must never be rendered or counted as passed. No MATLAB installation, license, or runtime execution is required by this batch.
  - courses/dsp-radar/AUTHORING.md is the normative successor-batch rulebook. It fixes source precedence and read-only handling; exact P## order and one-item scope; permitted coverage transition; required page, runtime, deterministic-data, plot, sweep, broken-case, mistake, completion, and parity content; evidence and claim vocabulary; rollback; and escalation when the source cannot be reproduced within the current generic contract. It cannot authorize a source write, another item, a generic platform extension, or an evidence promotion.
  - Reusable focused tests validate duplicate-key rejection, exact schema versions, closed fields, path containment, all 84 identities/counts/mappings/hashes, immutable-field drift, legal single-item future coverage transitions, illegal bulk/out-of-order/converted-without-record transitions, conversion-record completeness, deterministic serialization, source read-only behavior when the source checkout is supplied, exact gitlink identity, and negative parity/claim cases. Tests use synthetic mutations and the committed ledgers; they neither fetch nor write the source course.
  - The current generic Python/API/React contract and generated lesson schemas/types do not change. DSP/Radar equations, source-specific validation, and conversion logic remain course-owned under courses/dsp-radar or test-owned in the single focused test file; no subject identity or behavior is added to apps/api/src, apps/web, packages/lesson-schema, existing courses, or another course gitlink.
  - Target current-state, handoff, roadmap, architecture, and authoring documentation describe the pinned-source/derived-platform ownership split, the zero-converted framework state, the one-item-per-batch rule, rollback, and evidence boundary without claiming an implemented learner page. The retained ELP-DSP-00 evidence names every command/result, exact revision and count, changed/preserved invariant, residual risk, manual/environment gate, and unperformed validation.
  - Product-data profile gates report schema validation, canonical-source immutability, 84-item uniqueness/completeness, no hidden scoring, no data migration, Git pin/revert recovery, stateless backup/restore not applicable, and existing service smoke results explicitly. The final catalog validation observes three courses, two implemented modules, and two interactive modules; the empty DSP catalog entry is framework state, not an 84-page or learner-readiness claim.
validation:
  local:
    - test "$(git rev-parse HEAD)" = 8019d1798ea771f1f466e24c9983549ec1d6c127 && test "$(git rev-parse origin/main)" = 8019d1798ea771f1f466e24c9983549ec1d6c127 && test "$(git rev-parse origin/HEAD)" = 8019d1798ea771f1f466e24c9983549ec1d6c127
    - test "$(git ls-tree HEAD courses/dsp-radar-learning | awk '{print $1":"$3}')" = 160000:203c3738a88070bd43a93d969b6991a195bb6e27
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - git diff --check
    - git diff --submodule=log 8019d1798ea771f1f466e24c9983549ec1d6c127 -- courses/dsp-radar-learning
  focused_tests_to_add:
    - Add apps/api/tests/test_dsp_conversion_framework.py with always-on repository fixtures for the exact gitlink, native course manifest, closed conversion schema, deterministic 84-item conversion manifest/source map/coverage ledger, immutable fields, legal one-item transition, and negative duplicate/gap/order/path/hash/placeholder/parity claims.
    - Add a source-attested mode selected only by ELP_DSP_SOURCE_ROOT that requires an existing clean exact source checkout, recomputes the exact commit/tree/curriculum and 420-file inventory, snapshots source bytes/modes/status before and after validation, and fails rather than skipping when the variable is supplied but the source is missing, dirty, wrong, or mutated.
    - Prove the native catalog accepts the new exact-v1 dsp-radar course with zero learner modules while existing demo-radar and platform-showcase documents/default executions remain unchanged and deterministic.
  required_ci:
    - The existing GitHub Actions quality workflow must pass backend, frontend, and container jobs on the exact target PR head. The backend job must discover and pass the new always-on framework tests without a network fetch, skip, xfail, count waiver, source mutation, or weakened existing test; source-attested recomputation remains separately retained local evidence because the current workflow does not initialize course submodules.
    - PFSPAM automatic merge authority applies only to the exact clean PR head after required checks pass and no review thread, branch-protection gate, source/provenance mismatch, scope exception, or stop condition remains. A later commit invalidates prior CI and must rerun all required checks.
  manual:
    - Standing owner direction dated 2026-08-21 authorizes exact-head CI-green software-only DSP conversion and defers intermediate human content review to ELP-DSP-G-PYTHON; it does not authorize an implementing agent to bypass branch protection, resolve an ownership/licensing conflict, or merge when a required human gate or unresolved review exists.
    - A reviewer at the final aggregate gate must inspect the immutable 84-item mapping, per-item conversion/parity records, complete learner course, browser/accessibility results, residual numerical differences, and every MATLAB not_run or failed record. ELP-DSP-00 does not satisfy that gate.
    - Signing, release, publishing, deployment, production, credential use, settings changes, and any physical, RF-transmit, energized-output, hardware/HIL/HWIL, bench, field, RT, or engine action remain separate explicit human gates and are not performed here.
risk:
  class: high
  hazards:
    - the gitlink pins an incomplete or different source tree, or an apparently complete ledger silently omits, duplicates, reorders, renames, or mis-hashes an item
    - source inspection, testing, or generation writes the canonical DSP repository, its metadata, retained evidence, cache, bytecode, or learner state
    - an 84-entry inventory is mistaken for 84 converted learner pages, or placeholder modules are bulk-created to make coverage appear complete
    - mutable coverage fields allow stable source/target identities to drift or permit more than one item to transition in a later P## batch
    - a visual resemblance, source prose, fixture, generated report, hosted CI result, or MATLAB not_run state is promoted into numerical parity, MATLAB execution, learner acceptance, physical, release, deployment, or production evidence
    - DSP-specific rules leak into generic platform models, API, React components, generated lesson schemas/types, another course, or a shared runtime
    - the empty native course shell is presented as learner-ready before P01 or its zero-converted state is hidden
    - source-attested local evidence and source-independent hosted CI are conflated, leaving a source-map transcription error undetected
  stop_conditions:
    - target HEAD, origin/main, origin/HEAD, worktree/index state, B010 ancestry, activated contract/profile, or merged control authority differs from the exact baseline and activation conditions in this contract
    - the current DSP gitlink is not 203c3738a88070bd43a93d969b6991a195bb6e27 before the batch, another gitlink or .gitmodules would change, or the requested target source is not exact commit 5d73667a486df4a7b6c581e4c9406e810ed4f0f6 and tree 7a3a0f9adce607e10097724c13745eace212f4e1
    - the exact source manifest, phase distribution, 84-folder/420-file inventory, curriculum digest, aggregate file-set digest, or per-file hash cannot be reproduced from a clean read-only source checkout
    - source ownership, permission to create the platform-owned derivative framework, or the distinction between canonical source and derived native course is disputed or requires a new product decision
    - acceptance would require changing source-course contents, another submodule, an existing course, generic platform source/schema/type code, a dependency/lockfile, workflow, deployment file, credential, setting, protected-branch policy, release, deployment, or production system
    - any learner module/page, copied MATLAB source, placeholder, TODO shell, runtime experiment, or converted coverage state is needed to make ELP-DSP-00 pass
    - focused framework, source-attested immutability, catalog/default-execution, contract, quick, full, deterministic course, diff, or required exact-head CI validation fails or is skipped/relabeled
    - a required Python/source-equivalence field can be omitted, a MATLAB not_run/failed record can be counted as passed, or any evidence claim exceeds the software provenance/framework boundary
rollback:
  strategy: Before any ELP-DSP-P## successor merges, revert the single ELP-DSP-00 target change under the governed merge path. That restores courses/dsp-radar-learning to gitlink 203c3738a88070bd43a93d969b6991a195bb6e27 and removes the new platform-owned dsp-radar framework, focused tests, target documentation, active-contract update, and ELP-DSP-00 evidence while leaving the source repository untouched. There is no course-source write, learner data, database migration, package change, release, deployment, or production state to reverse. If a successor already depends on the framework, stop and materialize a coordinated forward/revert contract rather than reverting the foundation alone.
  data_migration: none
  source_course_write: none
  release_action: none
evidence:
  output:
    - docs/evidence/ELP-DSP-00-<date>.md
    - exact target baseline/candidate/control activation plus old/new DSP gitlink, source repository/commit/tree, curriculum and aggregate file-set identities
    - deterministic 84-item and nine-phase counts, 420 per-file path/SHA-256 mappings, source before/after mode/blob/hash/status inventory, and all other gitlinks/.gitmodules preservation result
    - native course, conversion manifest, source-map, coverage-ledger, conversion/parity schema, immutable-field, legal-transition, negative-claim, placeholder-absence, and catalog/default-execution test results
    - focused, source-attested, contract, quick, full, deterministic course validation, git diff --check, submodule diff, and exact-head hosted-CI commands with exits and relevant counts
    - product-data profile gate disposition, changed and preserved invariants, rollback/recovery path, manual/environment gates, residual risks, and all unperformed validation
  claim_boundary: Repository-static, deterministic software, immutable-source-provenance, conversion-framework, catalog-fixture, and exact-head hosted-CI evidence for zero converted DSP learner modules at source pin 5d73667a486df4a7b6c581e4c9406e810ed4f0f6 only. It does not establish any completed P01-P84 page, Python numerical result, MATLAB runtime or visual parity, learner experience or effectiveness, browser/accessibility acceptance, hostile-code isolation, security accreditation, physical hardware, HIL/HWIL, bench, RF transmit, energized output, field, real-time or engine behavior, signing, release, publishing, deployment, production operation, or permission to mutate the canonical source course.
