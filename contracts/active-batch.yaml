acceptance:
- Begin after this control contract merges, from exact merged PR51 baseline. Owner continuation authorizes this
  delivery-quality batch followed by a separately scoped aggregate DSP/competency review; no automatic import of
  nine source-only courses or production deployment.
- 'Inventory remains 6 courses/290 interactive modules: DSP84, Controls68, Robotics69, Vehicle67 and two examples.
  Enumerate all13 pinned sources and distinguish nine source-only repositories from four native engineering curricula.
  Do not use inventory as curriculum-completeness proof.'
- Preserve every course payload byte, source gitlink/file identity, numerical algorithm, independent reference and
  fixture. Audit all288 engineering lessons for concepts, source/competency alignment, equations/units, prediction,
  controls, plots, interpretation, checks, failures/recoveries and independent provenance. Report incomplete criteria
  honestly with paths, not blanket pass labels.
- Correct demonstrated raw TeX rendering while preserving inline/fenced code and currency text; render source display
  and inline delimiters through existing KaTeX. Fix demonstrated accessibility/responsive/navigation/focus issues
  using generic components; preserve stale-result/revision protection and live controls.
- 'Repair the demonstrated browser JSON numeric-choice boundary: finite integer/float spellings of the same declared
  numeric option must resolve to the declared option value/type, while strings, booleans and undeclared values remain
  rejected. Reject numerically duplicate int/float menu options that a JavaScript client cannot distinguish. Preserve
  all valid native manifests, public schema shape, numerical course payloads and revision/trust boundaries. Add
  actual browser regressions for affected DSP lessons and parameterized runtime/manifest tests.'
- Keep browser implementation details out of the normal learning flow. Technical revision information may remain
  in an accessible collapsed disclosure. Provide accessible plot names and usable text/numerical evidence without
  claiming a chart is fully accessible solely because it has an aria-label.
- Implement deterministic pinned Playwright/axe browser checks. Render all290 native pages on desktop and mobile,
  assert plots/metrics, math where present, no page/runtime errors, no page-level horizontal overflow, labeled keyboard
  controls and no unapproved serious/critical automated accessibility violations. Exercise real control/failure/recovery/reset
  and navigation on at least one representative per course, plus delayed-response cancellation and stale-revision
  rejection regressions.
- Build actual Docker image using lockfile-based frontend installation; run nonroot, readonly root/course filesystem,
  bounded temporary storage and numerical-library threads, one localhost port. Verify baked course inventory, every
  default through real HTTP, deterministic repeat, static assets/deep routes, bounded outputs, recovery and stale
  digests. Never claim hostile-code isolation or production deployment.
- Retain per-lesson JSON audit/browser/container results and representative desktop/mobile screenshots with hashes
  and named validation level. Automated accessibility and agent visual inspection are separate from manual screen-reader
  and representative-learner validation, which remain not_run.
- Run focused frontend/browser tests, scoped Python tests, complete repository full verification, deterministic
  catalog, image/container checks and source/scope audits. Hosted CI remains nonmandatory per retained owner direction;
  do not weaken source tests or alter workflow/secrets to manufacture green status.
- Publish updated quality board and reviewable PR. Aggregate DSP competency/cumulative assessment review remains
  the next authorized scoped batch; no false whole-course promotion based on browser checks. Protected target merge
  and deployment retain owner authority.
validation:
  local:
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_course_delivery_quality.py apps/api/tests/test_course_caliber_status.py
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  focused_tests_to_add:
  - Source math delimiter/code preservation and rendered equation regressions.
  - All-page browser/automatic accessibility/mobile, representative real controls/recovery/navigation and stale-response
    checks.
  - Course immutability, quality-ledger count and truthful native/source-only/maturity states.
  - Nonroot readonly one-port container with complete real HTTP course inventory and deterministic defaults.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; every named local gate remains mandatory.
risk:
  class: high
  hazards:
  - Generic rendering regressions across mathematical lessons.
  - Automated checks mistaken for educational or manual accessibility acceptance.
  - Source/module mutation, revision-race regressions, unbounded browser or runtime work.
  stop_conditions:
  - Need to change numerical course payloads, source identities or other backend components; record defect and use
    a fresh scoped repair batch.
  - Cannot produce credible browser/container evidence.
  - Need production access, secrets, learner personal data or untrusted execution.
rollback:
  strategy: Revert isolated delivery-quality change to merged PR51; no content/schema/data migration.
evidence:
  output:
  - docs/evidence/ELP-COURSE-DELIVERY-QUALITY-01-2026-09-28.md
  - docs/course-quality/lesson-audit.json
  - docs/course-quality/browser-report.json
  - docs/course-quality/container-report.json
  - docs/COURSE_QUALITY.md
  claim_boundary: Automated software/browser/container evidence and named agent visual inspection only. Manual assistive-technology,
    learner-effectiveness, MATLAB, hardware and production remain unperformed.
