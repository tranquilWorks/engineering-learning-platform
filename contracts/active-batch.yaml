  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Separate numerical/geometry formulations and full-solution/array comparisons.
  - All64 runtime control corners, positive-depth/rank/convergence/unknown-cell/rejected-closure limits.
  - Exact preservation, eight embedded checkpoints, actual browser plots with readable units and labels.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Correlated synthetic image or geometry implementations hiding incorrect mechanisms.
  - Overclaiming calibration, feature invariance, pose uniqueness or global registration/SLAM from a bounded
    example.
  - Host runtime/storage constraints undermining reproducible verification.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
  strategy: Revert this isolated group to target PR57 baseline and restore original findings; no schema or
    persisted-data migration.
evidence:
