risk:
  class: high
  hazards:
    - synthetic telemetry is mislabeled as measured vehicle evidence
    - a replay verifier reuses generator equations or trusts embedded decoded values
    - a source scaffold is mislabeled as implemented or converted
    - prep work silently authors a lesson or changes generic runtime behavior
    - a CAN ID, byte order, scaling, packet boundary, sequence fault, privacy claim, or source identity is wrong
  stop_conditions:
    - exact target, control, source, competency-map, telemetry, fixture, index, or worktree identity drifts
    - any module or lesson is implemented before separate P01-P08 authorization
    - independent verification imports the fixture generator or derives expected decoded values from production output
    - work requires source mutation, generic runtime/UI changes, a dependency, network access, or unsupported evidence
    - any focused, regression, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this restores the prior source gitlink and removes only the Vehicle Dynamics prep shell, map, conversion records, fixtures, tests, and prep documentation.
evidence:
  output:
    - docs/evidence/ELP-VEHICLE-PREP-00-2026-09-23.md
    - exact target, control, source, map, telemetry-source, fixture, and source-cleanliness identities
    - map/schema/closure, source-map/status, CAN/BLE identity, independent-decode, fault-diagnostic, privacy, catalog, regression, full, deterministic, lint, diff, and scope results
    - one target squash merge, the exact resulting commit/tree, and explicit unperformed evidence
  claim_boundary: This batch establishes a six-course, 223-module prep state with an empty Vehicle Dynamics shell, a reviewed 67-module plan, exact read-only source evidence, and deterministic synthetic protocol fixtures. It implements no Vehicle Dynamics lesson and does not execute MATLAB, browser/accessibility, learner, firmware, BLE radio, bench, vehicle, track, physical HIL/hardware, certification, release, deployment, credentials/settings, or production validation.
