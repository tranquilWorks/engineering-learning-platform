acceptance:
- Activate only after this control contract merges, using exact target PR54 merge/tree. Repair exactly existing
  Controls P36, P38, P42, P43, P45-P51 and P55. Preserve 290 total modules, all source pins, all DSP content/assessments/numerics
  and all Robotics/Vehicle payloads.
- P36 propagate position and velocity and include both feedback terms in acceleration; report gains with separate
  dimensions. P38 solve a declared LQR cost using CARE, propagate the actual plant/observer augmented state and
  verify separation spectra and Riccati residual independently.
- P42 retain actual integral-state history, enforce manual and automatic actuator limits, measure switch bump and
  explicitly censor unobserved recovery. P43 integrate the double-well dynamics and verify energy balance, local
  equilibria and damping-sign failure without substituting exponential envelopes.
- P45 apply the barrier filter to the current state throughout the trajectory and verify the sampled safety condition.
  P46 construct real gain-table knots and interpolate them, measuring interpolation errors at actual off-grid points
  and preserving exact knot behavior.
- P47 integrate the residual nonlinear dynamics with a documented terminal escape event rather than fabricating
  a terminal error. P48 evaluate actual dimensionless sensitivity transfer functions over the declared uncertainty
  interval and finite frequency band; distinguish instability from frequency-response magnitude.
- P49 solve a constrained finite-horizon objective and execute receding-horizon moves, exposing predicted state,
  applied input, objective and optimality/constraint checks. P50 generate excitation data, fit a dynamic model and
  evaluate separate held-out free-run data, exposing rank and measured errors. P51 execute the RLS gain/estimate/covariance
  recurrence and compare independent weighted batch least squares.
- P55 construct, transform and weight actual sigma points against Gaussian moments. Distinguish mean and covariance
  weights; negative central weights are not alone a fault. Narrow the visible title/outcomes to the unscented-transform
  component actually executed, retaining its stable module identity. Only selected competency entry labels/outcomes/assessment
  descriptions may change; preserve the prerequisite graph and inventory.
- Individually author twelve portable Course checkpoint blocks and revised lessons with equations/units, worked
  examples, predictions, two controls/sweeps, physical limits, named faults/recovery, answer rationale and scope
  boundaries. Preserve keyboard accessibility and actual plots. No blanket curriculum promotion.
- Retain five independently formulated scenarios per revised lesson, expected values generated solely from references,
  explicit origins and existing 1e-8 tolerances. Add physical, limiting, negative, trajectory and all-control-corner
  checks that detect the original defects. Preserve all unselected reference function bodies, origins and outputs
  and all prior capstone repairs.
- Historical preservation tests must continue comparing their original exact merged batch trees, rather than incorrectly
  treating all later authorized work as forbidden. Add an exact PR54-to-current scope/payload/reference guard for
  this new batch. Retain every historical numerical/invariant assertion; only active-contract successor bindings
  and historically anchored scope guards may be adjusted.
- 'Run focused checks and actual read-only nonroot baked-container browser delivery: all 290 HTTP modules, 580 desktop/mobile
  pages, existing DSP checkpoints and new twelve Controls checkpoints, real control/fault/recovery/reset for every
  revised lesson, drawn traces and representative screenshots. Preserve three-second runtime limits and single-request
  pacing. Then run mandatory contract, quick and full sequentially without overlapping browser workloads.'
- Remove a selected finding only after numerical and browser evidence passes. The resulting register should have
  Controls 7, Robotics 25 and Vehicle 16 remaining findings, with all three aggregate reviews blocked. Preserve
  all other defect disclosures and learner/manual-screen-reader/MATLAB/hardware/production not_run boundaries.
- Publish exact evidence and a reviewable PR, then perform an eligible verified development merge under retained
  owner authorization. Hosted CI is nonmandatory under retained owner direction; required local gates remain mandatory.
  No production deployment or unrelated backlog consumption.
validation:
