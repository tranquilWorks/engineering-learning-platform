acceptance:
- Start only after this exact control contract merges, from clean merged target PR 48 baseline 255427e3b3c6a31a66b74ad7f9836dad09b164e5,
  tree 3958e73ecf1914e4d2b5dee4a919c6b7275434f2. Owner explicitly approved merge 48 and next twelve-lesson
  chunk on 2026-09-27.
- Repair exactly existing P53-P64 as one twelve-item batch. Preserve P01-P52 and P65-P84 module bytes, canonical
  source/pin, every other course, platform, identities, source map and conversion manifest. Only twelve coverage
  target_content_digest values may change.
- 'P53: seed5301, 72x65 normalized detector-score scene, 15m/.5m/s axes, two extended targets plus shoulder
  and disconnected nuisance cells; deterministic local maxima, explicit 8-connected grouping, size filtering
  and excess-power weighted centroids/shape proxies. Minimum size 1/3/18 and exponent0/1/2 sweeps; peak-only
  over-reporting failure and grouped recovery. Shape proxies are not calibrated tracker covariance.'
- 'P54: seed5401,81scans at1s,1000m/20m/s start with32m/s velocity from source scan41,30m report noise and
  missing scans18-20/66-68. Explicit alpha-beta prediction/innovation/correction and coasting; alpha .1/.35/.85,
  beta .01/.08/.30 sweeps. Beta-zero velocity-learning failure and positive-beta recovery.'
- 'P55: seed5501,101scans at1s, interval acceleration sigma .8m/s2 and report sigma25m; explicit two-state
  CV prediction, gain, Joseph covariance and NIS. Q and R sweeps isolate assumptions on fixed reports; zero-Q
  and severely underestimated-R failures with calibrated recovery, finite positive covariance and disclosed
  single-record consistency limits.'
- 'P56: seed5601,101scans,Cartesian state[-1600,4,600,-12],polar range/bearing noise18m/.8deg,acceleration
  .25m/s2. Nonlinear predicted measurement/Jacobian, wrapped bearing innovation, Joseph update, covariances
  and normalized residuals. Bearing assumption and range geometry sweeps; branch-cut subtraction failure and
  wrapped recovery.'
- 'P57: seed5701 private deterministic Gaussian generator,three predicted CV tracks and six position reports;
  track-specific innovation covariances, Mahalanobis distances, gate5.991 and deterministic global greedy one-to-one
  assignment. Gate .5/5.991/13.816 and covariance .25/1/4 sweeps. Ungated Euclidean association failure, covariance-aware
  recovery; labels used only for scoring.'
- 'P58: deterministic30-scan target/noise/false-report record with seeds5801/5802, M-of-N3of4 confirmation
  and coast limit2; predict,one-to-one association,birth,confirmation,coasting,deletion with retained stable
  identities and reason logs. M1/3/4 and coast0/2/5 sweeps; immediately-confirmed immortal-report failure and
  managed recovery.'
- 'P59: private seed 5908, 25-scan two-target crossing, 6 m position and 3 m/s auxiliary velocity uncertainty,
  200 paired trials. Compare position-only greedy identity swaps with normalized position-plus-velocity evidence;
  preserve noise/update-interval/closest-approach sweeps and identity/error statistics. The named broken case
  permits independent row minima to reuse a report; recovery restores one-to-one assignment and velocity evidence
  on identical reports. Preserve alternating report order, truth-free association and idealized Cartesian velocity-feature
  limitation.'
- 'P60: seed6007,60scans,10m reports,shared six-state CV/CA IMM; explicit transition/mixing probabilities,
  state and covariance mixing including mean spread, model predictions/Joseph updates, log likelihoods and
  posterior blending. Acceleration .8/2/3.2 and mode persistence .80/.94/.99 sweeps; unreachable zero-support
  maneuver mode failure and nonzero-support recovery; compare fixed steady filter.'
- 'P61: seed6101,8element3GHzULA,half-wavelength spacing,30deg arrival,20deg initial phase,35dBSNR. Geometry/time
  advance,steering phasors,wrapped/unwrapped phase and adjacent-sensor angle inference; angle/spacing/frequency
  sweeps. One-wavelength .6/- .4 direction-cosine alias failure and half-wavelength recovery; explicit sign
  conventions.'
- 'P62: seed6201,uniform8elementULA,half-wavelength broadside,full -90:.025:90deg calculation; element-count4/8/16
  and spacing .5/.75/1 sweeps,explicit Hamming taper,interpolated half-power beamwidth and sidelobe/null metrics.
  One-wavelength steering30deg creates equal -30deg grating lobe; restore half-wavelength geometry.'
- 'P63: seed6301,8sensors,128snapshots,two sources -20/25deg at10dB per-source sensorSNR. Form source steering/snapshots/noise,
  conjugate-normalized DAS and output power over -60:.1:60deg. Preserve source separation/aperture and SNR/snapshot
  sweeps with coupled deterministic inputs. Wrong steering-sign failure on source named broken scene and correct-sign
  recovery; narrowband limitation.'
- 'P64: seed6401,12sensors/256snapshots,half-wavelength spacing,phase-aligned beams squinted +/-3deg,2deg target,15dBSNR.
  Explicit sum/difference ratio,monotone calibration within+/-4deg,sum guard .15,interpolated/clipped estimates
  and validity counts. Squint1.5/3/5 andSNR -5/5/15/25 sweeps;1.12right-channel gain creates boresight bias,measured-gain
  correction recovers.'
- Every item preserves pinned source text and guiding question, physical labeled controls, source equations
  and units, intermediate processing, prediction/two one-variable sweeps/named failure/recovery/focused checks/teach-back.
  Retain source essential operations and bounded resource use; explicitly disclose porting choices. No generic
  renamed template algorithms.
- Expected signatures use independent formulas or alternate algorithms, never production imports or perturbed
  production output. Retain sixty baseline/two-sweep/broken/recovery comparisons with units, inputs, provenance
  hashes, tolerances and measured errors. Preserve exact prior reference prefix and fixtures; no MATLAB execution
  claim.
- Regress P02-P52 without rewriting their module bytes. Extend append-only independent references and normalized-AST
  anti-template regression through P64. Historical contracts/provenance tests permit the new batch while retaining
  their immutable facts.
- 'Remediation ledger: one already-distinct,fifty-one prior repairs,twelve current repairs,twenty pending,total84.
  P65-P84 and whole-course numerical/curriculum/capstone maturity remain blocked; issue441 stays open. Catalog
  stays6courses/290modules/290interactive.'
- All required local focused DSP,backend,contract,quick/full,deterministic catalog,lint,frontend typecheck/build,service
  smoke and scope/source checks pass. Bounded numerical-library thread environment is permitted; do not relax
  runtime limits. Hosted CI is not mandatory by retained owner direction; missing checkout prerequisites remain
  documented.
- No MATLAB runtime,browser/accessibility,representative learner,hardware/HIL,certification,deployment or production
  claims without actual evidence. Protected target merge retains separate human approval. Subsequent repairs
  prefer twelve consecutive items under owner direction.
