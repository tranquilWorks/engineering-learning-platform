  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_robotics_dynamics_quality.py
    apps/api/tests/test_robotics_expansion.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-robotics-dynamics-quality.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Executed robotics mechanisms with separately formulated references and full-trajectory/energy/algebra checks.
  - All96 control corners, meaningful zero/degenerate limits, no-capture and actual feedback/fault behavior.
  - Exact baseline preservation, checkpoint navigation, units and actual drawn traces in browser/container.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Correlated dynamics/reference implementations hiding defects.
  - Overstating local Jacobian, prescribed-port energy or finite-window capture as global/physical guarantees.
  - Runtime or host-storage constraints invalidating repeatable verification.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
  strategy: Revert this isolated group to exact PR56 baseline and restore its original findings; no schema
    or persisted-data migration.
