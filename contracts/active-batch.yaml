acceptance:
  - Begin from exact clean target main 71e3842f0839d9534a1c77e9d95d84a929489aff, tree d7716986417df16aeaf1171bd5cc3e40bd3f4295, after the merged control revision contains this exact contract. Any target, control, source, dependency, index, or worktree drift stops implementation.
  - Keep the Robotics source gitlink byte-identical at f8807640258f1a6c1c77f1dcc9e61734551c585b, tree 7f8bc62382ca8d7fbe26ff4413cabf7d00d64bb9, curriculum SHA-256 972eee6b99945f6c2380ba097e443b30c37ca9e4e0acfd2c7f7cde8a7550207d. Source inspection is read-only.
  - Create one platform-owned native course with exactly P01-P10 in source order. P01 retains the implemented differential-drive source contract. P02-P10 retain their source IDs, numbers, titles, guiding questions, prerequisite order, and scaffold hashes while supplying new Python-first designs; they must not be labeled source-equivalent or MATLAB-parity passed.
  - Use one isolated target branch and one final implementation commit/PR. Internally complete P01 through P10 strictly in order; a failed, blocked, placeholder, nondeterministic, or over-budget item stops the lane.
  - Every module contains exact-v1 module.yaml, an expanded lesson.md, a self-contained bounded experiment.py, a closed provenance/verification record, and distinct expected plus actual JSON evidence. No TODO, copied scaffold prose, generic placeholder, renamed duplicate experiment, or fabricated evidence is accepted.
  - Each lesson implements concept -> prediction -> manipulation -> evidence -> explanation -> focused check. It defines equations, symbols, coordinate/sign conventions, units, limiting cases, at least two bounded useful controls/sweeps, one named broken assumption with recovery, common mistakes, and teach-back completion.
  - P01 Python/source-equivalence uses independent retained cases against the pinned implemented MATLAB design. P02-P10 correctness uses independent analytic, closed-form, invariant, or separately formulated numerical references that do not call the production experiment implementation. Expected and actual files must remain distinct and report tolerances and measured errors.
  - MATLAB runtime parity is passed only if an identified licensed MATLAB runtime actually executes. The expected environment has no MATLAB runtime, so records remain not_run unless retained runtime evidence proves otherwise. Octave, Python agreement, or visual similarity must not be relabeled MATLAB parity.
  - Experiments use only current dependencies, validate parameters before allocation, cap sample/state sizes and output, emit finite stable Plotly-compatible result keys with labeled axes and units, and perform no network, source write, subprocess, dynamic install/import, eval, learner-code execution, or shared mutable state.
  - The completed DSP/Radar and Controls/GNC courses, their source pins/provenance/evidence, both example courses, generic API/UI/schema/runtime, dependencies, workflows, and deployment files remain byte-identical.
  - Final catalog is exactly five courses, 120 modules, and 120 interactive modules. Every default executes deterministically; Robotics coverage is total=24, authored=10, remaining=14, blocked=0, placeholder=0, with only P01-P10 catalog-visible.
  - Update only the stale final-catalog assertion in apps/api/tests/test_gnc_conversion_framework.py from the completed pre-Robotics 4/110/110 shape to the required post-Robotics 5/120/120 shape; all GNC course data, provenance, evidence, and other test behavior remain byte-identical.
  - Focused tests verify exact source identity and read-only state, ordered unique mappings, honest P01 versus P02-P10 provenance semantics, lesson completeness, controls and result references, default/two-sweep/broken-recovery behavior, invalid/resource rejection, finite deterministic serialization, independent expected/actual evidence, content digests, and catalog visibility.
  - Final evidence distinguishes Python verification from unperformed MATLAB, browser/accessibility, learner-effectiveness, physical robot, motor/encoder/IMU, HIL, bench, field, release, deployment, and production validation.
validation:
  local:
    - test "$(git rev-parse HEAD)" = 71e3842f0839d9534a1c77e9d95d84a929489aff && test "$(git rev-parse origin/main)" = 71e3842f0839d9534a1c77e9d95d84a929489aff
    - test "$(git rev-parse HEAD^{tree})" = d7716986417df16aeaf1171bd5cc3e40bd3f4295
    - test "$(git -C courses/robotics-autonomy-learning rev-parse HEAD)" = f8807640258f1a6c1c77f1dcc9e61734551c585b
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - .venv/bin/ruff check apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py courses/robotics-autonomy/modules
    - git diff --check
    - test -z "$(git -C courses/robotics-autonomy-learning status --porcelain=v1 --untracked-files=all)"
  focused_tests_to_add:
    - Add a Robotics framework suite for exact source pin/tree/curriculum/scaffold hashes, 24-item mapping, P01 source-backed versus P02-P10 native-design provenance, ten-item authored prefix, placeholder rejection, source cleanliness, and honest evidence states.
    - Add an item-filterable P01-P10 suite exercising source-specific defaults, two sweeps, broken/recovery behavior, independent oracle comparisons, invalid/resource inputs, finite deterministic serialization, stable result references, lessons, records, content digests, and catalog visibility.
    - Prove the final catalog exposes and executes Robotics P01-P10 plus the retained 110 modules, with no skips, xfails, count waivers, source writes, or generic runtime/schema changes.
  required_ci:
    - Existing quality workflow passes backend, frontend, and Linux/amd64 container jobs on the exact PR head. Any later target commit invalidates those results.
risk:
  class: high
  hazards:
    - a plausible visualization hides a wrong frame convention, kinematic sign, unreachable inverse-kinematics branch, motor unit conversion, controller discretization, trajectory boundary, impedance sign, encoder quantization, or inertial integration bias
    - scaffold identity is misrepresented as implemented MATLAB behavior or Python agreement is mislabeled MATLAB parity
    - expected and actual evidence share an implementation path, use fabricated values, exceed tolerance, or omit units and limiting cases
    - generic platform, completed courses, source gitlink, dependencies, workflows, or deployment change to accommodate Robotics
  stop_conditions:
    - exact target/control/source identities or source cleanliness differ
    - any item requires source mutation, generic renderer/runtime/schema/type changes, a new dependency, unsupported result primitive, unbounded solver, placeholder, or semantic duplication
    - any independent correctness case, focused test, cumulative gate, full verification, deterministic catalog run, lint, source-cleanliness check, or exact-head CI fails or is skipped
    - any MATLAB, browser/accessibility, learner, physical robot/HIL, bench, field, release, deployment, credential/settings, or production claim exceeds retained evidence
rollback:
  strategy: Before merge, close or discard the isolated target branch. After merge, revert the one aggregate implementation commit, removing only the platform-owned Robotics native course/tests/evidence and restoring the prior 4/110/110 catalog while leaving the source repository and completed courses untouched.
evidence:
  output:
    - docs/evidence/ELP-ROB-P01-P10-2026-09-21.md
    - exact target/control/source identities and source cleanliness
    - one P01-P10 row per internal gate with design equations, reference method, coverage transition, default/two-sweep/broken-recovery/resource/determinism/comparison results, tolerances, residual risks, and unperformed checks
    - complete focused, contract, quick, full, deterministic catalog, lint, diff, source-cleanliness, and exact-head hosted-CI results
    - one final target commit, one target PR, rollback path, and explicit MATLAB/browser/accessibility/learner/physical/release/deployment/production dispositions
  claim_boundary: Ten catalog-visible, Python-verified Robotics and Autonomy software lessons at pinned curriculum identity f8807640258f1a6c1c77f1dcc9e61734551c585b. P01 is checked against its implemented source design; P02-P10 are Python-first native designs verified against independent references. No MATLAB runtime comparison, learner effectiveness, browser/accessibility acceptance, physical robot/HIL, bench, field, release, deployment, or production result is implied.
