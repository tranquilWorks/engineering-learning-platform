schema_version: 1
batch:
  id: ELP-COURSE-CALIBER-00
  title: Separate course implementation coverage from curriculum completeness
  goal: Establish the six-stage course-caliber gate, competency-map prerequisite, semantic anti-template and independent-evidence rules, audited DSP/Controls/Robotics dispositions, and matching target status documentation without changing any lesson or starting Vehicle Dynamics.
sources:
  product: products/engineering-learning-platform/product.yaml
  requirements:
    - products/engineering-learning-platform/COURSE_CALIBER.md
    - products/engineering-learning-platform/course-caliber.yaml
    - tranquilWorks/portfolio-control#437
  milestone: products/engineering-learning-platform/roadmap.yaml#course_caliber_gate
  baseline_commit: 39aed41de4e3c84fc00c3b8546c5488e253b6be2
  baseline_tree: 648c193722e8d356b7520ba064e23e884d25d36c
  control_plane_repository: tranquilWorks/portfolio-control
  control_plane_revision: f6745e44f459a52431b81a3f953c8f2e03cbe45e
  control_plane_path: products/engineering-learning-platform/batches/ELP-COURSE-CALIBER-00.yaml
  target_repository: tranquilWorks/engineering-learning-platform
dependencies:
  - ELP-ROB-P01-P24
scope:
  allowed_paths:
    - contracts/active-batch.yaml
    - contracts/repo-profile.yaml
    - contracts/verification.yaml
    - docs/COURSE_CALIBER.md
    - docs/course-caliber-status.yaml
    - docs/CURRENT_STATE.md
    - docs/HANDOFF.md
    - docs/ROADMAP.md
    - docs/evidence/ELP-COURSE-CALIBER-00-*.md
    - apps/api/tests/test_course_caliber_status.py
  forbidden_paths:
    - courses/**
    - apps/api/src/**
    - apps/web/**
    - packages/**
    - scripts/**
    - .github/**
    - .gitmodules
    - package.json
    - package-lock.json
    - apps/api/pyproject.toml
    - apps/web/package.json
    - apps/web/package-lock.json
    - Dockerfile
    - compose.yaml
acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 39aed41de4e3c84fc00c3b8546c5488e253b6be2, tree 648c193722e8d356b7520ba064e23e884d25d36c; target, control, index, or worktree drift stops implementation.
  - Project the ordered maturity states source_authored, platform_converted, numerically_verified, curriculum_covered, capstone_integrated, and learner_validated into target status documentation with separate evidence and limitations.
  - State explicitly that source-item, platform-module, authored, interactive, or P## counts are implementation inventory only and cannot establish curriculum completeness.
  - Document all nine rubric dimensions, the mandatory competency-to-module matrix before any new course conversion, count derivation from that matrix, and coherent implementation batches of at most ten new lessons.
  - Document semantic anti-template review across governing relations, state, controls, transformations, outputs, failures, and reference methods for unrelated competencies.
  - Require evidence-origin metadata and reject any independent claim whose fixture imports the production entrypoint, derives from production output, or perturbs production output.
  - Project the reviewed DSP/Radar, Controls/GNC, and Robotics and Autonomy maturity and rubric dispositions without modifying their course content. Link DSP remediation to issue 441, Controls fidelity and expansion to issues 438 and 439, and Robotics expansion to issue 440.
  - Keep Vehicle Dynamics queued and unimplemented. It remains blocked until this gate is merged, a schema-valid reviewed competency map exists, replayable GR86 CAN/BLE fixtures are available, and a coherent first batch of at most ten lessons is separately authorized.
  - Add a focused target test that validates the status document shape, exact states and dispositions, inventory-only count semantics, follow-up issue ownership, Vehicle Dynamics hold, batch limit, and independent-evidence rejection examples.
  - Preserve all five catalog courses, 134 modules, 134 interactive modules, every course/source byte and gitlink, generic runtime/UI/schema behavior, dependencies, workflows, and deployment artifacts.
  - Record local validation and exact-head hosted backend/frontend/container CI. Keep MATLAB runtime, browser/accessibility acceptance, learner effectiveness, physical hardware/HIL, bench, field, release, deployment, credentials/settings, and production evidence explicitly unperformed.
validation:
  local:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_course_caliber_status.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - git diff --check
    - test -z "$(git status --short -- courses)"
  focused_tests_to_add:
    - Validate the target status document's closed shape, ordered maturity states, exact reviewed courses, issue dispositions, inventory-only count semantics, and Vehicle Dynamics hold.
    - Exercise negative fixtures for an arbitrary module-count target, an eleven-lesson batch, missing competency mapping, and independent evidence derived from or perturbed from production output.
    - Assert no course is marked curriculum-complete at this audit baseline.
  required_ci:
    - Existing quality workflow passes backend, frontend, and Linux/amd64 container jobs on the exact final PR head. Any later target commit invalidates those results.
risk:
  class: moderate
  hazards:
    - status language continues to equate a complete module inventory with curriculum completeness
    - a future course is sized to an arbitrary count before competencies, prerequisites, assessment, capstone, exclusions, and handoffs are mapped
    - semantic duplicates or production-derived fixtures are accepted as independent numerical evidence
    - a governance-only change accidentally modifies existing course content or starts Vehicle Dynamics
  stop_conditions:
    - the exact target or control baseline drifts before target implementation
    - any lesson, experiment, evidence fixture, source gitlink, runtime, UI, dependency, workflow, release, deployment, credential, or production path must change
    - any target status marks DSP/Radar, Controls/GNC, or Robotics curriculum-complete at this baseline
    - Vehicle Dynamics content or a child remediation issue is implemented under this batch
    - focused, contract, quick, full, deterministic catalog, diff, course-immutability, or exact-head hosted CI fails or is skipped
rollback:
  strategy: Before merge, close or discard the isolated governance branch and pull request. After merge, revert the one target governance commit; no course or source history is rewritten.
evidence:
  output:
    - docs/evidence/ELP-COURSE-CALIBER-00-2026-09-21.md
    - exact target and merged control identities
    - focused status-contract negative and positive test results
    - contract, quick, full, deterministic catalog, diff, course-immutability, and exact-head hosted-CI results
    - explicit child-issue and Vehicle Dynamics hold dispositions
  claim_boundary: A governance and status correction at the five-course, 134-module platform baseline. It defines how course caliber will be authorized and reported but does not repair DSP/Radar or Controls, expand Controls or Robotics, implement Vehicle Dynamics, validate learners, execute MATLAB, operate hardware, or authorize release/deployment/production.
