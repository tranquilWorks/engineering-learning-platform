acceptance:
- Activate only after verified PR53 merges, using its exact merge commit/tree and this merged control contract.
  Preserve its twelve model repairs, generic SVG fallback and documented rendering/concurrent-load/hosted-CI boundaries.
- Bind all 84 existing DSP identities to a reviewed competency/prerequisite graph with explicit target learners,
  entry knowledge, outcomes, exclusions and cross-course handoffs. Validate the local copy of the existing competency
  schema, acyclic dependencies and exact inventory-derived count. This is assessment of existing lessons, not new
  inventory.
- Embed 84 individually authored formative checkpoints and ten cumulative task/rubric portfolios covering the domains
  in the retained aggregate review plan. Every checkpoint connects a concrete prediction, named live controls/plots,
  dimensioned reasoning, fault/recovery, expected explanation and a limiting assumption. Avoid title-substituted
  generic questions.
- Use the portable markdown block contract for assessment.md. Add generic named additional-markdown navigation/headings
  so Course checkpoint is reachable on desktop and mobile; do not hard-code DSP behavior in generic components.
  Retain all existing lesson blocks, controls, plots, runtime definitions, source-copied lesson.md and experiment.py
  bytes.
- Reconcile conversion.yaml target.content_digest and target.files and coverage.yaml target digests through the
  actual catalog after adding referenced assessment files. All other conversion provenance/equivalence/source/claim
  fields remain unchanged; no source-map, framework-manifest, reference oracle or retained numeric artifact mutation.
- Reconcile the 417 retained independent comparisons (two P01 signatures plus five scenarios for each P02-P84) with
  the competency map and execute fresh independent reference/production comparisons. Retain origin/tolerance and
  model-specific limiting/invariant checks. Add analytic P01 limits and actual cumulative-stage/metric binding checks
  without production-derived expected values or weakened numerical gates.
- Explicitly bound P84 to its executed pulsed-radar chain and fixed baseline eight-scan tracker; selected first-scan
  controls do not recompute that trajectory. Arrays/FMCW/MIMO/imaging/passive branches receive separate cumulative
  portfolios, not an invented universal capstone integration.
- Reassess DSP numerical, curriculum and capstone maturity only from actual reviewed map, independently verified
  stage traces and accessible browser assessments. Self-check authorship is not learner success. Retain Controls/Robotics/Vehicle
  aggregate blocks and all sixty additional named findings. No representative-learner, manual screen-reader, MATLAB,
  hardware or production acceptance.
- Run mandatory contract/quick/full and actual baked read-only nonroot container checks. Verify all 290 HTTP modules,
  580 desktop/mobile pages, every DSP checkpoint's visible navigation and all ten cumulative blocks in both viewports;
  exercise relevant live controls/failure/recovery/reset. Require drawn plot evidence and preserve the single-request
  pacing/no-concurrent-capacity claim. Retain image identity, content digests and representative visual screenshots.
- Publish exact results and a reviewable PR. Retained owner continuation authorizes eligible verified development
  merge; no production action, source-only course conversion or unrelated sixty-lesson repair consumption.
- 'Navigation amendment: the actual checkpoint test exposed that a native fragment link triggers popstate with a
  new route object for the same lesson; AppShell then resets scroll to the page top. Compare stable course/module
  route identity before resetting focus/scroll, preserving ordinary anchor navigation and real lesson changes. Verify
  checkpoint and existing section links, keyboard use, same-page history and actual next-lesson behavior on desktop/mobile;
  no runtime/schema/source changes.'
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_dsp_aggregate_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-dsp-assessments.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  focused_tests_to_add:
  - Exact competency/assessment/identity binding, acyclic prerequisites and no orphaned outcomes or rubric links.
  - Preserved numerical/source files and conversion metadata, with newly reconciled referenced-markdown digests.
  - Actual cumulative plot/metric quantities and analytic P01 limits; retain all prior numerical comparisons.
  - Accessible checkpoint navigation and cumulative tasks on desktop/mobile; no inferred learner pass.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Authored assessments mistaken for measured learner outcomes.
  - Broad capstone claims that exceed the actual executed branches.
  - Adding referenced content without reconciling immutable target identities.
  stop_conditions:
  - Need to modify source pins, existing model/source lesson bytes, production runtime or public schemas.
  - Independent evidence or browser delivery cannot support the claimed scope.
  - Need learner personal data, physical hardware or production access.
rollback:
  strategy: Revert the isolated assessment revision to the exact merged PR53 baseline; no learner-data/schema migration.
    Preserve historical numerical repairs and honest maturity boundaries.
evidence:
  output:
  - docs/evidence/ELP-DSP-AGGREGATE-QUALITY-01-2026-09-28.md
  - docs/course-quality/dsp-aggregate-review.json
  - courses/dsp-radar/assessment-map.json
  - docs/COURSE_QUALITY.md
  claim_boundary: Reviewed authored curriculum and independently verified synthetic numerical/browser/container
    evidence only; no learner-effectiveness, manual assistive-technology, MATLAB, physical or production acceptance.
