acceptance:
- Activate only after this contract merges from exact PR56 merge/tree. Repair exactly existing Robotics P30-P41;
  preserve all 290 identities, source pins, prerequisites, unselected module payloads and unselected reference
  definitions/origins/five-case outputs.
- P30 must construct a declared arm Jacobian and apply its transpose to force, comparing actual joint and Cartesian
  virtual power with velocity and units. Wrong transpose is an executed map, not a torque-scaled assigned power
  error. P31 must construct physical inertia, Coriolis and gravity terms, compute positive inertia eigenvalues
  and the time-derivative skew identity; a dropped Coriolis coupling must create the measured defect.
- P32 must generate synthetic excitation/torque data, fit declared parameters, report actual regressor rank/conditioning
  and independently held-out inverse-dynamics error. Disclose any prior regularization and use a physically
  specified excitation failure. P33 must derive duration from actual cubic peak velocity (including its 1.5
  factor) and declared acceleration constraints, retain actual multi-joint q/qdot/qddot and measure applied-limit
  violations.
- P34 must execute joint-space and task-space feedback using actual forward kinematics/Jacobians and trajectories.
  Distinguish a kinematic velocity-servo scope from torque dynamics; derive conditioning from the declared
  geometry rather than assign it as an output. P35 must integrate a declared robot equation with applied computed
  torque, inertia/velocity/gravity compensation and actual model mismatch or compensation-sign failure.
- P36 must construct a physical joint inertia and Jacobian, derive operational inertia/dynamically consistent
  inverse/null torque, and compute resulting task acceleration and leakage. Explicitly distinguish a local
  acceleration experiment from integrated motion. P37 must execute the declared impedance/admittance differential
  equations, with measured contact-force/energy traces and finite-window settling status; no assigned exponential
  proxy or universal stability claim.
- P38 must construct surface-frame motion/force projectors and execute feedback with a declared contact model.
  A wrong-frame fault can remain algebraically orthogonal; report the actual frame mismatch and resulting force/motion
  errors rather than invent projector nonorthogonality. P39 must replay delayed saturated force with an actual
  work/energy observer and causal energy limiter, preserving selected controls. Report energy balance and intervention
  from the trace; distinguish a sampled prescribed-port passivity experiment from closed-loop hardware stability.
- P40 must integrate a genuinely underactuated two-coordinate/one-input robot, execute bounded energy swing-up
  and a declared state-dependent balance handoff, and measure capture and terminal state. A reaction-wheel
  pendulum is permitted with explicit rotor coordinate/torque and wheel-speed/position limits excluded. Retain
  no-capture/censored cases honestly and zero-motion equilibrium limitations. P41 must transform actual points
  into camera coordinates, test near/behind-plane depth, and compute projection/sensitivity/reprojection on
  valid rays. Wrong-frame behavior must operate on those points, not replace a count by a mode flag.
- Individually author twelve substantive portable lessons and Course checkpoint blocks with equations/units,
  worked examples, prediction, two sweeps, named failure/recovery, limits and reasoning rubrics. Every plotted
  series must come from the executed mechanism with readable axis/legend units and visible zero-span points.
  Selected labels may narrow unsupported claims while identities, inventory and prerequisite graph remain fixed.
- Retain five independently formulated scenarios per lesson at unchanged absolute/relative 1e-8 tolerances.
  Expected artifacts must originate solely from separate references, actual artifacts solely from production.
  Add mechanism, negative, physical/energy, degenerate/zero-limit and all96 runtime-control-corner checks.
  Preserve the three-second execution limit. Independently test full trajectories or algebra beyond three-number
  signatures.
- Anchor historical PR56 scope/reference guards to exact PR55-to-PR56 trees, preserving their live numerical
  checks; add a PR56-to-current scope/reference guard. Update only obsolete selected surrogate assertions and
  successor-contract bindings; do not weaken runtime, tolerances, independent evidence or unrelated checks.
- Close only selected findings after independent numerical and selected baked browser evidence passes. Final
  read-only nonroot delivery must verify all290 HTTP modules, all580 desktop/mobile pages, all existing plus
  twelve new embedded checkpoints, and real control/fault/recovery/reset/drawn-plot sequences for all revised
  lessons. Bind all290 host/baked identities and replay60 independent cases over HTTP. Then run mandatory contract,
  quick and full sequentially; hosted CI remains separately reported/nonmandatory.
- 'After verified closure retain24 findings: Controls0, Robotics8 (P42-P48/P52), Vehicle16. All three non-DSP
  numerical/curriculum/capstone aggregates remain blocked, including Controls with zero listed findings. No
  representative learner, manual screen-reader, MATLAB, hardware, production or concurrent-capacity acceptance.'
- Publish reviewable exact evidence and perform an eligible normal exact-head development merge under standing
  owner authorization, then reconcile Portfolio Control. The user has authorized the subsequent eight Robotics
  findings, but activate them only through a fresh exact-merged-baseline successor contract. Do not consume
  Vehicle findings or course-wide aggregate acceptance in this contract. Preserve historical local/hosted discrepancies
  and billing limitations; no workflow, protection or account changes.
