schema_version: 1
batch:
  id: ELP-ROB-P01-P10
  title: Author Robotics and Autonomy P01-P10 as native Python lessons
  goal: Add one platform-owned Robotics and Autonomy course containing P01 through P10 as complete deterministic Python/Plotly lessons while preserving the pinned MATLAB-first source repository read-only. P01 is checked against its implemented source model; P02-P10 are new native designs derived from the approved curriculum identities and independently checked analytic or numerical reference cases, without pretending the scaffolded MATLAB source ran.
