acceptance:
- Start only after this exact control contract merges, from clean merged target PR 47 baseline f78831b23e46ff1cb9518a716ac8ba5aeab5a3ee,
  tree ee7d2536b91b25b670dba34c222002e401fe6747. Owner requested the next twelve-lesson batch after the merge-and-continue
  question on 2026-09-27.
- Repair exactly P41-P52 as one twelve-item batch. Preserve P01-P40 and P53-P84 module bytes, canonical source/pin,
  every other course, platform, identities, source map and conversion manifest. Only twelve coverage target_content_digest
  values may change.
- 'P41: 96 range cells by 64 pulses, separable AR(1) clutter (range .85, slow-time .92) over a decaying power
  profile plus white thermal noise; nonfluctuating and Swerling I-IV equal-average-SNR powers, 2000 target
  trials, integration/correlation sweeps, global-threshold clutter failure and known-local-power normalization
  recovery; seed 4101.'
- 'P42: explicit 20 MHz sampled 8 MHz/2.4 microsecond LFM, 512 fast-time rows by 64 pulses, 4 kHz PRF and 10
  GHz carrier; three moving echoes including shared range and shared velocity, stationary clutter and noise;
  delay-corrected fast-time matched filtering followed by coherent-gain-normalized slow-time FFT, CPI/window
  sweeps, wrong-axis FFT failure and correct-axis recovery; seed 4201.'
- 'P43: real signed Gaussian amplitude statistic, 20000 separate H0/H1 trials, one threshold calibrated at
  reference RMS 1 for Pfa .01, target amplitude 4; 256-cell profile, fixed-threshold noise-RMS/pedestal sweeps,
  conditioned counts and Gaussian analytic probabilities; hidden true-RMS adaptation failure and native-amplitude
  recovery; seed 4301.'
- 'P44: explicit signed 16-sample matched filter, separate 60000-trial H0/H1 banks, normalized Gaussian statistics,
  SNR/threshold ROC curves, operating point Pfa .001 and million-cell false-alarm budget, trial-count uncertainty;
  cherry-picked tuning-bank zero-Pfa claim failure and predetermined independent-bank recovery; seed 4401.'
- 'P45: 256-cell slowly varying complex-noise profile and three coherent point targets; linear-power CA-CFAR
  with 12 training and two guards per side, exact finite-N alpha and full-window edge exclusion; Pfa/whole-scene
  scale sweeps; dB-mean/geometric-mean failure and arithmetic-power recovery; seed 4501.'
- 'P46: sampled-sinc strong target plus weak CUT and gradual background transition; guard sweep 0/4/10 shows
  self-masking, training sweep 4/12/36 separates roughness from locality; contaminator at source cell 126 masks
  weak cell 138, expanded 12-cell guard recovers without altering CUT power; seed 4601.'
- 'P47: 50000 paired complex CUT/independent-reference trials in blocks, 3:.5:17 dB Pd curves at equal Pfa,
  N=8/16/32/64 and Pfa .01/.001/.0001; disclose raw curves and monotone adjustment before interpolating horizontal
  loss at Pd .8; infinite-training multiplier failure and finite-N recovery; seed 4701.'
- 'P48: separately calibrated GO/SO homogeneous probabilities, 240-cell clutter edge at cell 121, 12 dB step,
  isolated reference profile; 25000 paired contrast/one-side-contamination trials, protected edge failure versus
  weak-target masking tradeoff; shared-CA-alpha and always-SO failures, variant calibration and GO edge recovery;
  seed 4801.'
- 'P49: ascending rank-18 among 24 independent reference powers, transparent product-form Pfa calibration,
  four interfering targets; 20000 paired count/strength/rank trials including N-k capacity crossing; reused-rank
  calibration failure and rank-specific recovery; seed 4901.'
- 'P50: 96x64 square-law range-Doppler map with nonuniform background and finite target responses; rectangular
  training ring excludes guard rectangle/CUT, exact N and full-window eligibility; range/Doppler-width sweeps,
  boundary target explicitly untestable; zero-padding with full N failure and complete-stencil recovery; seed
  5001.'
- 'P51: combined nonuniform/clutter-edge/sidelobe/crowded scene; calibrated CA/GO/SO/OS comparisons, inspected
  reference statistics, target misses, modeled-response artifacts, true H0 crossings and disagreement causes;
  contrast/crowded-count sweeps with 12000 paired trials; shared-CA-alpha failure and statistic-specific recovery;
  seed 5101.'
- 'P52: 200000 target-absent trials processed in 2000-trial blocks; independent square-law CUT and finite-N
  reference means, Pfa/N sweeps and running Wilson intervals; correlated Gaussian and independent-cell lognormal
  texture model mismatches; known-noise multiplier failure and finite-N recovery; seed 5201. Preserve uncertainty,
  trial independence and no production false-alarm guarantee.'
- Every item retains important source stages, source lesson text and guiding question; physical controls, equations,
  units, bounded deterministic processing, baseline/two sweeps/broken/recovery, interpretation checks and teach-back.
  Explicitly document porting choices and omitted presentation behavior.
- Expected numerical signatures use independent formulas or alternate algorithms, never production imports
  or perturbed production values. Retain sixty five-scenario comparisons with units, provenance, file hashes,
  tolerances and measured errors. NumPy RNG is not MATLAB runtime parity.
- Regress P02-P40 without changing their modules or prior reference bytes; extend independent references append-only
  and verify historical provenance against its retained prefix. Extend semantic/normalized-AST anti-template
  checks through P52. Historical contract tests must permit the new active batch while retaining immutable
  facts.
- 'Remediation ledger: one already-distinct, thirty-nine prior repairs, twelve current repairs, thirty-two
  pending, total eighty-four. Whole-course numerical/curriculum/capstone maturity stays blocked for P53-P84;
  issue 441 remains open.'
- All required local focused DSP, backend, contract, quick/full, deterministic catalog, lint, frontend typecheck/build,
  service smoke, and scope/source checks pass. Catalog stays 6 courses / 290 modules / 290 interactive. Hosted
  CI is not required under retained owner direction; missing hosted checkout prerequisites remain documented.
- No MATLAB execution, browser/accessibility, representative learner, hardware/HIL, certification, deployment
  or production claims without actual evidence. Protected target merge retains separate human approval. Subsequent
  learning batches should prefer twelve consecutive items under the owner request.
