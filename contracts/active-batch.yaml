risk:
  class: high
  hazards:
    - a shared tire template substitutes for nine distinct governing or computational models
    - frame rotation, slip signs, normal-load scaling, saturation, fitting identifiability, combined-slip constraints, relaxation discretization, absolute temperature, energy units, or uncertainty coverage are subtly wrong
    - deterministic synthetic observations are mislabeled as measured tire, rig, track, or vehicle evidence
    - an independent oracle imports or derives from production behavior
    - invalid setups yield plausible finite plots instead of explicit broken and recovery verdicts
  stop_conditions:
    - exact target, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code, production output, or a perturbed production value
    - work requires source-bound ledger mutation, source mutation, fixture mutation, generic runtime or UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only the Vehicle Dynamics P25-P33 native expansion, independent reference, tests, evidence, and expansion ledger while retaining the complete P01-P24 source-bound course.
evidence:
  output:
    - docs/evidence/ELP-VEHICLE-TIRES-P25-P33-2026-09-24.md
    - one P25-P33 row per work item with governing relation, provenance, scenarios, teaching invariant, tolerance, axes and units, limitation, and residual risk
    - focused, retained-course, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target squash merge, exact resulting commit and tree, and explicit unperformed evidence
  claim_boundary: This batch implements and independently verifies nine deterministic software-only Vehicle Dynamics tire lessons. P25-P33 are Python-first native designs derived from the reviewed competency map and deterministic synthetic observations. No source or MATLAB-runtime equivalence, measured tire or vehicle validation, browser/accessibility or learner validation, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, or production use is implied.
