acceptance:
- Activate only after this control contract merges, from exact PR55 merge/tree. Repair exactly existing Controls
  P56/P57/P60-P62/P64-P65 and Robotics P25-P29. Preserve all 290 module identities, source pins, DSP content/numerics/assessments,
  Vehicle payloads and all unselected Controls/Robotics payloads.
- Controls P56 must execute a forward Kalman filter and backward RTS smoother, retaining actual means/covariances
  and final-sample equality. Compare an independently formulated joint Gaussian posterior. Fault skips smoothing
  without overwriting controls. Do not claim every finite realization must have smaller trajectory error.
- Controls P57 must construct, compose and normalize quaternions, evaluate rotation matrices and transform actual
  sensor vectors. Compute norm, orthogonality and calibration residuals from those operations. Declare scalar/vector
  and frame conventions; exercise a normalization fault and degenerate limits.
- Controls P60 must generate declared synthetic satellite geometry/pseudoranges and solve receiver position and
  clock together, with actual post-fit residuals and geometry conditioning. Geometry concentration is an input;
  dilution is a computed output. A clock-omission fault must execute the wrong solve. P62 must detect an injected
  measurement fault, select an exclusion only when warranted, remove that row and recompute the navigation solution
  and residuals. No certified protection/integrity claim from a toy covariance.
- Controls P61 must propagate a declared additive one-axis position/velocity/bias error state, process covariance
  and GNSS updates, then inject and reset the state with an appropriate covariance update. Compare an equivalent
  independently evaluated full-state filter. The fault may update covariance while withholding state correction;
  show the actual resulting estimation error. Narrow visible scope to the executed one-axis model rather than claim
  full three-dimensional attitude ESKF.
- Controls P64 must integrate declared civilian moving-beacon pursuit and proportional-navigation comparison trajectories
  and actual commands over a bounded observation/capture window. Disclose sampled closest approach, capture events
  and limits; no assigned miss proxy or universal capture claim. P65 must solve a declared constrained terminal
  objective, propagate the terminal dynamics using actual applied commands, and measure actuator violation and terminal
  residual from that execution. Compare a separately formulated constrained reference; no assigned infeasibility
  bound.
- Robotics P25 must construct a holonomic constraint and its Jacobian, project actual configurations/candidate velocities,
  compute rank/tangency and geometric clearance, and distinguish sampled configuration analysis from integrated
  dynamics. P26 must construct and compose homogeneous transforms, evaluate rotation-group/rigid-inverse residuals
  and demonstrate noncommuting operations. Invalid interpolation must be an executed fault.
- Robotics P27 must construct a twist, dual wrench and adjoint transform, verify actual power invariance and separate
  angular/linear round-trip units. P28 must construct a declared arm Jacobian, compute singular values/manipulability
  and compare independently differenced kinematics. Distinguish a position-task singularity from full spatial-twist
  rank. P29 must execute primary inverse kinematics and a null-space projection with an actual task velocity and
  posture direction; report true residual/leakage without inventing joint-limit guarantees.
- Individually author twelve portable Course checkpoint blocks with equations/units, a worked example, prediction,
  two meaningful sweeps, named fault/recovery, limits and answer rationale. Preserve accessible labels/keyboard
  operation and drawn plots. Selected competency labels/method descriptions may narrow unsupported claims; preserve
  the prerequisite graph, competency IDs and inventory. No blanket course promotion.
- Retain five independently formulated scenarios per selected lesson with expected artifacts generated only by references
  and unchanged absolute/relative 1e-8 tolerances. Add trajectory/algebra/physical, negative and limiting tests
  plus all 96 control corners through the unchanged runtime. Preserve all unselected reference definitions, origins
  and five-scenario outputs against exact PR55.
- Anchor historical PR55 scope/reference preservation guards to their original exact merged trees while retaining
  their live numerical/physical checks. Add a PR55-to-current scope/reference/content guard for this batch. Only
  selected obsolete surrogate assertions and active-contract successor bindings may change; replace them with mechanism-level
  checks rather than weaken coverage.
- Close selected findings only after independent numerical and selected browser evidence passes. Final baked read-only
  nonroot delivery must check 290 HTTP modules, 580 desktop/mobile pages, all retained DSP/Controls checkpoints
  plus the new twelve checkpoints, and real control/fault/recovery/reset with drawn traces for all revised lessons.
  Bind host canonical content identities to the baked image and replay sixty independent cases over actual HTTP.
  Keep single-request pacing and three-second runtime limits. Then run mandatory contract, quick and full sequentially.
- 'After verified closure retain 36 findings: Controls zero listed, Robotics twenty and Vehicle sixteen. Controls
  numerical/curriculum/capstone aggregate reassessment remains separately blocked even with no remaining listed
  Controls finding; absence from this register is not exhaustive acceptance. Preserve original findings history
  and all learner/manual-screen-reader/MATLAB/hardware/production not_run boundaries.'
- Publish exact evidence and a reviewable PR, then perform an eligible exact-head normal development merge under
  retained owner authorization and reconcile Portfolio Control. Hosted CI remains separately reported/nonmandatory;
  local gates mandatory. Retain PR55 hosted checkout/history failures (75 failed, 14 errors, 1288 passed), distinct
  from its passed local gates. No workflow/protection/account changes, production deployment or unrelated backlog
  consumption.
