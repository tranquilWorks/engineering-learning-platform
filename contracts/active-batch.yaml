  - docs/evidence/ELP-VERIFY-REPLAY-01-2026-09-26.md
  - Retained initial failures, measured replay audit, negative controls, source/scope preservation and exact verification
    results.
  claim_boundary: Validation portability for unchanged software simulations only. No new module implementation or
    expanded scientific tolerance; no MATLAB, learner, physical or production claim.
