    - deterministic synthetic results are mislabeled as measured track, driver, rig, or vehicle evidence
    - an independent oracle imports or derives from production behavior
    - a capstone passes aggregate metrics while a named prerequisite requirement fails
  stop_conditions:
    - exact target, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code, production output, or a perturbed production value
    - work requires prior-module mutation, source-bound ledger mutation, source or fixture mutation, generic runtime or UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, source-cleanliness, or capstone requirement gate fails or is skipped
