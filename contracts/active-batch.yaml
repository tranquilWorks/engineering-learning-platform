risk:
  class: high
  hazards:
    - a shared propulsion template substitutes for nine distinct governing or computational models
    - torque/radius, reflected-inertia ratio, differential capacity, shift crossover, load-transfer sign, slip sign, thermal energy, aero balance, ride-height unit, or stint constraint is subtly wrong
    - deterministic synthetic observations are mislabeled as measured engine, driveline, brake, aero, rig, track, or vehicle evidence
    - an independent oracle imports or derives from production behavior
    - invalid setups yield plausible finite plots instead of explicit broken and recovery verdicts
  stop_conditions:
    - exact target, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code, production output, or a perturbed production value
    - work requires prior-module mutation, source-bound ledger mutation, source mutation, fixture mutation, generic runtime or UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only the Vehicle Dynamics P44-P52 native propulsion expansion, independent reference additions, tests, evidence, and ledger transition while retaining P01-P43.
