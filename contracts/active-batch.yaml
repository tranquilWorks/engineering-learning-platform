acceptance:
  - Treat target pull request 12 as immutable merged P01-P10 history. After this exact control amendment merges, continue only from exact clean target main 5f6fdae255cf5f188e4ee8a4d50e74949538b8eb, tree 568707b6a2db038fd3d3fa66308b8872122f1601, on isolated branch agent/elp-robotics-p11-p24-20260921 and exactly one new target pull request 13 containing one P11-P24 implementation commit. Do not rewrite the merged PR or publish the pre-merge aggregate commit; target, control, source, dependency, index, or worktree drift stops implementation.
  - Retain merged P01-P10 commit 5f6fdae255cf5f188e4ee8a4d50e74949538b8eb, tree 568707b6a2db038fd3d3fa66308b8872122f1601, and its exact-head verification as prior evidence while rerunning every required cumulative gate after P11-P24. No prior result substitutes for final exact-head verification.
  - Keep the Robotics source gitlink byte-identical at f8807640258f1a6c1c77f1dcc9e61734551c585b, tree 7f8bc62382ca8d7fbe26ff4413cabf7d00d64bb9, curriculum SHA-256 972eee6b99945f6c2380ba097e443b30c37ca9e4e0acfd2c7f7cde8a7550207d. Source inspection is read-only.
  - Complete one platform-owned native course with exactly P01-P24 in source order. P01 retains the implemented differential-drive source contract. P02-P24 retain their source IDs, numbers, titles, guiding questions, prerequisite order, and scaffold hashes while supplying new Python-first designs; they must not be labeled source-equivalent or MATLAB-parity passed.
  - Treat P11-P24 as fourteen separate full-rigor work items and complete them strictly in numeric order. Each item must pass its own default, two sweeps, broken/recovery, invalid/resource, finite/deterministic, independent-reference, content/provenance, and cumulative focused gates before the next item begins.
  - Every module contains exact-v1 module.yaml, an expanded lesson.md, a self-contained bounded experiment.py, a closed provenance/verification record, and distinct expected plus actual JSON evidence. No TODO, copied scaffold prose, generic placeholder, renamed duplicate experiment, fabricated evidence, or silent approximation is accepted.
  - Each lesson implements concept -> prediction -> manipulation -> evidence -> explanation -> focused check. It defines equations, symbols, coordinate/sign conventions, units, assumptions, limiting cases, at least two bounded useful controls/sweeps, one named broken assumption with recovery, common mistakes, and teach-back completion.
  - P01 Python/source-equivalence retains independent cases against the pinned implemented MATLAB design. P02-P24 correctness uses independent analytic, closed-form, invariant, alternative-algorithm, or separately formulated numerical references that do not call the production experiment implementation. Expected and actual files remain distinct and report tolerances and measured errors.
  - MATLAB runtime parity is passed only if an identified licensed MATLAB runtime actually executes. The expected environment has no MATLAB runtime, so all P02-P24 records remain not_run unless retained runtime evidence proves otherwise. Octave, Python agreement, or visual similarity must not be relabeled MATLAB parity.
  - Experiments use only current dependencies, validate parameters before allocation, cap samples, states, nodes, particles, iterations, events, and output bytes, emit finite stable Plotly-compatible result keys with labeled axes and units, and perform no network, source write, subprocess, dynamic install/import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - P24 is a deterministic software-only HIL methodology and fault-injection experiment. It must not claim a real-time target, physical robot, motor, sensor, bench, or hardware loop was executed.
  - The completed DSP/Radar and Controls/GNC courses, their source pins/provenance/evidence, both example courses, generic API/UI/schema/runtime, dependencies, workflows, deployment files, and source gitlinks remain byte-identical.
  - Final catalog is exactly five courses, 134 modules, and 134 interactive modules. Every default executes deterministically; Robotics coverage is total=24, authored=24, remaining=0, blocked=0, placeholder=0, with P01-P24 catalog-visible.
  - Retain the already-authorized narrow GNC final-catalog assertion update at 5/134/134 while all GNC course data, provenance, evidence, and other test behavior remain byte-identical.
  - Focused tests verify exact source identity and read-only state, ordered unique mappings, honest P01 versus P02-P24 provenance semantics, lesson completeness, controls and result references, all default/two-sweep/broken-recovery paths, invalid/resource rejection, finite deterministic serialization, independent expected/actual evidence, content digests, and catalog visibility.
  - Final evidence distinguishes Python verification from unperformed MATLAB, browser/accessibility, learner-effectiveness, physical robot/motor/encoder/IMU/range sensor, physical HIL, bench, field, release, deployment, and production validation.
