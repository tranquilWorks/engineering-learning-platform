  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_gnc_quality_revision.py apps/api/tests/test_gnc_expansion.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-gnc-quality.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Twelve actual model mechanisms, independent signatures and physical trajectory/negative/limiting checks.
  - Every selected control boundary, finite outputs and execution within unchanged runtime budgets.
  - Exact-baseline preservation and truthful per-lesson evidence/checkpoint navigation.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Correlated references hiding a model defect.
  - Finite-horizon or event-limited evidence overstated as global stability or complete UKF.
  - Slow numerical solves exceeding the unchanged trusted runtime.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
  strategy: Revert this isolated batch to exact PR54 baseline. Preserve the original findings ledger; no schema/data
    migration.
