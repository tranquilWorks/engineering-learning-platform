acceptance:
- Start only after this exact control contract merges, from clean merged target PR49 baseline e28b041aff3f4e66cec2190e04a5d689be23f260,
  tree 4b3ee5c371db2835920c4c3d8b04cd29dab2954b. Owner explicitly approved merge49 and next grouping on2026-09-28.
- Repair exactly existing P65-P76 as one twelve-item batch. Preserve P01-P64 and P77-P84 module bytes,canonical
  source/pin,every other course,platform,identities,source map and conversion manifest. Only twelve coverage
  target_content_digest values may change.
- 'P65: seed6501,8-element half-wavelength array,desired3deg/-3dB and interference30deg/25dB,128 of256 snapshots.
  Explicit covariance, trace-scaled loading, distortionless MVDR and conventional component SINR, snapshot/loading
  sweeps. Refuse singular four-snapshot unregularized solve; mismatched-look self-nulling failure and loaded
  recovery on fixed data.'
- 'P66: seed6601,10-element half-wavelength array,two sources -3/+3deg,10dB,512 snapshots. Covariance eigensplit,
  Bartlett and MUSIC projection, separated local-peak selection; separation/SNR/snapshot/assumed-count sweeps.
  Coherent-source rank failure and seven-element spatial-smoothing recovery.'
- 'P67: seed6701,10 channels,sources -15/10deg,25/10dB,512 snapshots. Fixed gain/phase/position patterns and
  nearest/next-neighbor coupling; noisy256-snapshot30dB known-source calibration at10deg. Explicit composite
  channel estimate, Bartlett/Capon/MUSIC and output SINR; error-scale/coupling sweeps. Failing to remove calibration
  steering absorbs physical phase; corrected division recovers with direction-dependent residual limits.'
- 'P68: seed6801,8 sensors x8 pulses,lambda.03m,PRF20kHz,platform105m/s,61clutter patches -60:2:60deg and30dB
  total clutter. Joint space-time steering,128target-free training cells,trace loading. Fixed,separate and
  joint processing with component accounting; training-support and target-like contamination sweeps. Mismatched
  target10.7deg/.208 versus assumed10deg/.2 exposes self-nulling from contaminated training; clean-training
  recovery.'
- 'P69: seed6901,80MHz sampling,40us20MHz chirp,45m target,.7echo voltage,.01noise,65536FFT. Explicit delayed
  echo/valid overlap and Tx*conj(Rx) dechirp,Hann FFT/interpolated peak. Range and slope sweeps; missing round-trip
  factor gives doubled range,corrected conversion recovers.'
- 'P70: seed7001,77GHz,512 fast-time samples x64 chirps,12.8MHz sampling,40us150MHz chirp,50usPRI; targets20/20/23m
  and Doppler bins-3/+3/+3. Explicit separable fast-time range and coherent slow-time Doppler transforms. Fast-sample/chirp-count
  prefix sweeps and resolution metrics; magnitude-before-Doppler failure and complex-data recovery.'
- 'P71: seed7101,77GHz,80MHz sampling,40us20MHz upchirp,45m20m/s,.002noise. Explicit delayed moving echo and
  signed frequency estimation under Tx*conj(Rx); range-Doppler coupling,velocity/bandwidth sweeps. Wrong Doppler
  correction sign doubles bias; correct sign recovers on same beat.'
- 'P72: seed7201,same carrier/sampling/chirp scale,45m20m/s,.002noise. Explicit signed up/down chirps,beat
  estimates and two-equation range/velocity solve; range/velocity/noise sweeps. Two-target30/65m,15/-10m/s
  wrong beat pairing produces ghosts; correctly paired evidence recovers with association limitation disclosed.'
- 'P73: seed7301,77GHz,4RX positions0:.5:1.5lambda,2TX at0/2lambda,64TDMcycles,40us slot,18deg target,20dB.
  TX+RX virtual positions,physical-versus-virtual patterns and separation sweep; signed-velocity sweep. Moving10m/s
  target creates slot phase/angle bias; same-TX Doppler estimate and per-slot compensation recover unchanged
  data.'
- 'P74: seed7401,24GHz,4800Hz slow sampling,4s,1.2m/s bulk,2m/s sinusoidal limb speed at1.5Hz,three scatterers,25dB.
  Integrate velocities into phase,explicit Hann STFT,512window/384overlap/2048FFT baseline; speed/carrier/window
  sweeps. Magnitude-only processing destroys signed Doppler; unchanged complex-IQ recovery.'
- 'P75: seed7501,5GHz,1000m closest range,80m aperture/.2m spacing,995:.05:1005m fast range,Gaussian .6m envelope,30dB.
  Explicit slant range,two-way delay/carrier phase,raw history and candidate-path coherent sums. Cross-range
  -20/0/20m and aperture20/40/80m sweeps; magnitude-only phase loss and complex-history recovery.'
- 'P76: seed7601,5GHz,120MHz sampling,2us20MHz LFM,950:1.25:1400m gate,80m/.2m aperture,three targets. Zero-extended
  integer-delay insertion,linear per-row matched filter,energy normalization and filter-delay-corrected range
  axis preserving aperture phase. Bandwidth10/20/40MHz and target-spacing3.75/10/15m sweeps; magnitude-only
  compressed-history phase loss and original-complex recovery.'
- Every item preserves pinned source text and guiding question, physical labeled controls, source equations
  and units, intermediate processing, prediction/two one-variable sweeps/named failure/recovery/focused checks/teach-back.
  Retain source essential operations and bounded resource use; explicitly disclose porting choices. No generic
  renamed template algorithms.
- Expected signatures use independent formulas or alternate algorithms, never production imports or perturbed
  production output. Retain sixty baseline/two-sweep/broken/recovery comparisons with units, inputs, provenance
  hashes, tolerances and measured errors. Preserve exact prior reference prefix and fixtures; no MATLAB execution
  claim.
- Regress P02-P64 without rewriting their module bytes. Extend append-only independent references and normalized-AST
  anti-template regression through P76. Historical contracts/provenance tests permit the new batch while retaining
  their immutable facts.
- 'Remediation ledger: one already-distinct,sixty-three prior repairs,twelve current repairs,eight pending,total84.
  P77-P84 and whole-course numerical/curriculum/capstone maturity remain blocked; issue441 stays open. Catalog
  stays6courses/290modules/290interactive.'
- All required local focused DSP,backend,contract,quick/full,deterministic catalog,lint,frontend typecheck/build,service
  smoke and scope/source checks pass. Bounded numerical-library thread environment is permitted; do not relax
  runtime limits. Hosted CI is not mandatory by retained owner direction; missing checkout prerequisites remain
  documented.
- No MATLAB runtime,browser/accessibility,representative learner,hardware/HIL,certification,deployment or production
  claims without actual evidence. Protected target merge retains separate human approval. Subsequent repairs
  prefer twelve consecutive items under owner direction.
