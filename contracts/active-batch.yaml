    - Compare P02-P10 against separately formulated analytic or numerical references without production imports or outputs.
    - Reject generic repaired controls and unexplained cross-topic normalized-AST identity.
    - Validate the six-course, 290-module, 290-interactive catalog and regress every retained course.
  required_ci: []
risk:
  class: high
  hazards:
    - renamed generic logic is mistaken for source fidelity
    - source conventions for alias sign, phase reversal, quantizer endpoints, correlation lag, filter delay, or multirate gain are changed silently
    - independent evidence reuses production calculations
    - P02-P10 repair is mislabeled as full P02-P84 completion
  stop_conditions:
    - exact target, source, source-map, conversion-ledger, coverage identity/status/count, course identity, or worktree drift outside the explicitly authorized P02-P10 digest refresh
    - a source-specific invariant cannot be reproduced with bounded NumPy without a new product decision
    - an independent reference needs production code or output
    - work requires P01, P11-P84, source, generic runtime, UI, dependency, credential, release, deployment, or production mutation
    - any focused, full, deterministic, lint, typecheck, build, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit to restore the prior generic P02-P10 implementations while retaining all other courses and DSP P01/P11-P84.
evidence:
  output:
    - docs/evidence/ELP-DSP-FIDELITY-P02-P10-2026-09-24.md
    - one P02-P10 row with source flow, controls, equations, retained and omitted behavior, signatures, tolerance, failure/recovery, limitation, and residual risk
    - structural-similarity and generic-control prevention results
    - focused, full, deterministic catalog, lint, typecheck, build, diff, scope, and source-cleanliness results
    - one target squash merge with exact commit and tree; issue 441 remains open for P11-P84
  claim_boundary: This batch repairs and independently verifies nine deterministic software-only DSP/Radar source conversions, P02-P10. It does not complete issue 441 or establish P11-P84 fidelity. MATLAB runtime comparison, audio playback, browser/accessibility, learner, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence remain unperformed.
