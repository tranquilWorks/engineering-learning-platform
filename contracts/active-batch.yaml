acceptance:
- Begin only after this control contract merges, from exact merged delivery PR52 revision 4e8e39fb3fc05eef8b4ca5607bec4d0bc9320891.
  Delivery passed all local gates, 290 container checks and 580 desktop/mobile page checks; retain its documented
  concurrent-load and hosted-CI limitations.
- 'Repair exactly twelve existing lessons: Controls P66-P68, Robotics P68-P69, Vehicle P61-P67. Preserve the 6-course/290-module
  inventory, every source pin, approved prerequisite map, source-bound lesson, unrelated native module and unaffected
  reference output. No new course conversion or production action.'
- 'Implement the target semantic-repair-plan: actual identify/control/estimate/stress, navigation/guidance/constraints,
  and timestamped closed-loop/watchdog capstones for Controls; measured perception/replay/recovery and timed contact-interface
  behavior for Robotics. Derive requirement verdicts from executed histories; no algebraic stand-ins or fixed flags
  for unexecuted stages.'
- For Vehicle P61-P65 correct dimensional signatures and concrete limiting cases; use consistent distance/time integration
  in the bounded racing-line family; couple a finite energy budget into reachable lap speeds and derive braking
  residuals without arbitrary offsets. Evaluate the factorial held-out metric at unused design points, not fitted
  corners. Keep the factorial lesson explicitly a synthetic response surface rather than measured vehicle performance.
- Execute the Vehicle P66 provenance/alignment/calibration/reconstruction/identification/held-out validation/uncertainty/diagnosis
  chain and P67 tire/chassis/propulsion/brake/aero/track/line/lap/uncertainty/setup chain. Every trace requirement
  has a named computed quantity, units, threshold and pass/fail. Bound approximation scope explicitly; no actual
  GR86 calibration, track validation or physical HIL claim.
- Every revised lesson includes governing relations with dimensions, a worked physical example, concrete prediction,
  useful controls, explained plots/metrics, two sweeps, specific limiting cases, named failure and exact recovery,
  focused questions with answer rationale and cumulative assessment where appropriate. Keep teaching prose accessible
  and avoid generic template substitution.
- Retain five independently originated scenarios per lesson, record formulation/origin/tolerances, and generate
  expected values solely from the reference implementation. No imports of production models, consumption or perturbation
  of production output. Add physical invariants and metamorphic/negative tests that detect the original false-integration
  or dimensional defect; preserve all unaffected numerical evidence.
- Run focused revision and existing expansion/course checks, mandatory contract/quick/full gates, actual desktop/mobile
  controls/failure/recovery/reset for all twelve lessons, and the updated read-only nonroot one-port container.
  Preserve the established generic delivery fixes and data/revision/trust boundaries.
- Update per-lesson audit and embedded review disclosures with actual repaired evidence. Retain the 60 additional
  Controls/Robotics/Vehicle defects from the wider review as blocked and outside this twelve-lesson scope; this
  group cannot close their aggregate maturity. Vehicle P01-P16 dimensional chart defects also remain blocked; do
  not promote any of the three course aggregates after these twelve repairs; DSP aggregate review remains a separate
  next batch. Human learning/screen-reader/MATLAB/hardware/production validation stays not_run.
- Publish exact evidence and a reviewable PR. Owner continuation retains the prior merge/next-group authorization
  for eligible verified work; no production deployment or unrelated backlog consumption.
- 'Rendering amendment: direct screenshots and a single-page replay found WebGL unsupported notices in existing
  2D scattergl plots despite serialized data and visible axes. Add a generic capability-based SVG fallback for 2D
  scattergl only, preserving all coordinates, units, curves and course calculations. Assert actual drawn traces
  after failure/recovery/reset and retain the negative finding; do not claim a WebGL notice or plot container is
  plotted evidence. Unrelated course payloads remain immutable.'
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_capstone_quality_revision.py apps/api/tests/test_gnc_expansion.py
    apps/api/tests/test_robotics_expansion.py apps/api/tests/test_vehicle_dynamics_expansion.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  focused_tests_to_add:
  - Computed cumulative stage traces and fault/recovery behavior for the twelve lessons.
  - Independent numeric cases, dimensions, physical limits and parameter sensitivity; no production-derived oracles.
  - Unaffected module/reference/source preservation and truthful embedded maturity.
  - No-WebGL browser renders actual SVG traces with unchanged data, including after parameter changes and reset;
    3D trace types are not silently projected.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Correlated reference and production errors.
  - Cumulative labels exceeding executed model fidelity.
  - Unbounded coupled numerical work or changed unrelated references.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
  strategy: Revert the isolated twelve-lesson repair to the delivery-quality baseline; retain the honest defect
    ledger. No schema/data migration.
evidence:
  output:
  - docs/evidence/ELP-SEMANTIC-QUALITY-12-2026-09-28.md
  - docs/course-quality/semantic-revision.json
  - docs/course-quality/lesson-audit.json
  - docs/COURSE_QUALITY.md
  claim_boundary: Deterministic synthetic numerical/browser/container evidence only. No representative learner,
    manual screen-reader, MATLAB, measured vehicle, hardware or production acceptance.
