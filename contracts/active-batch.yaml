acceptance:
- Start only after this exact control contract merges, from clean target main 74fbe13828665783a97d047eae0c6dc6ef482745,
  tree 2ac9ed6889e18f531b6d01dba794b710a2f51996. Owner approved merge of PR 46 and requested twelve items per batch
  on 2026-09-27.
- Repair exactly P29-P40 as one twelve-item batch. Preserve P01-P28 and P41-P84 module bytes, canonical source/pin,
  every other course, platform, identities, source map and conversion manifest. Only twelve coverage target_content_digest
  values may change.
- 'P29: monostatic R^-4 radar equation, 100 kW/35 dBi gains/10 GHz/1 m2/6 dB loss; kTBF noise and 13 dB detection
  margin, RCS/frequency/power sweeps, range-doubling 16x cost, anchored inverse-square failure and fourth-power
  recovery; seed 2901.'
- 'P30: 20 MHz sampled 1 microsecond rectangular pulse, fractional 6.0175 microsecond echo delay with zero extension,
  explicit nonnegative-lag correlation and parabolic sub-bin estimate; sample-rate/fractional-delay/two-target sweeps;
  missing round-trip factor failure and c*tau/2 recovery; seed 3001.'
- 'P31: finite Gaussian pulse at 80 MHz, 4 MHz baseline bandwidth, 900.37 m isolated target and 22 m pair spacing;
  physical matched-response width, two-peak counting, bandwidth/spacing sweeps and 128-trial SNR-dependent accuracy;
  dense-display interpolation failure, physical peak counting and wider-bandwidth recovery; seed 3101.'
- 'P32: explicit 40 MHz sampled 8 MHz/10 microsecond LFM phase law, two zero-extended echoes 75 m apart, conjugate-reversed
  matched filter with delay-corrected range axis; bandwidth/duration sweeps, Fs*T versus B*T gain with stated noise
  convention; 0.55B replica mismatch and exact-replica recovery; seed 3201.'
- 'P33: rectangular versus cosine-tapered LFM receive filters, weak 0.04-amplitude target at 17-sample separation;
  mainlobe width, peak sidelobe ratio, output SNR loss and masking on consistent scales; taper/separation sweeps,
  seven-sample excessive-width failure and validated-separation recovery; seed 3301.'
- 'P34: explicit delay-Doppler correlation surfaces and cuts for rectangular, LFM and seeded binary-phase-coded
  pulses; 10 MHz sample rate, 13 microsecond duration, 3 MHz LFM and 13 chips; duration/bandwidth/code-length sweeps;
  finite-Doppler LFM ridge plus circular-delay-wraparound failure and zero-filled recovery; seed 3401.'
- 'P35: six periodic pulses at 20 kHz PRF with 18 km true target, explicit timeline and modulo PRI folding; 20 MHz
  sampling and 2 microsecond pulse; PRF/range sweeps and boundary checks; false transmitted-pulse identity failure
  and apparent-range recovery; seed 3501.'
- 'P36: coherent complex slow-time samples, approaching-positive signed velocity, lambda=c/fc and fd=2v/lambda,
  32 pulses/4 kHz/10 GHz/15 m/s; phase increments and FFT with units; velocity/carrier/count sweeps; magnitude-only
  loss of Doppler and complex-data recovery; seed 3601.'
- 'P37: explicit 256 fast-time rows by 32 slow-time columns, three Gaussian range responses at 450/900/1200 m and
  0/12/-18 m/s; 20 MHz/5 kHz/10 GHz; physical axes, range profiles, selected-range phase/FFT, range/velocity sweeps;
  magnitude-only failure and complex-matrix recovery; seed 3701.'
- 'P38: 128x64 radar matrix with strong stationary clutter and weaker moving targets; explicit [1,-1] and [1,-2,1]
  slow-time cancellers, transfer-function nulls, signal/clutter/noise response, 2x/6x white-noise gain, velocity/PRF
  sweeps; wrong fast-time-axis failure and slow-time recovery; seed 3801.'
- 'P39: separate coherent dwells at 4.0 and 5.3 kHz, target at primary first blind speed, explicit two-pulse subtraction,
  normalized velocity responses and noncoherent fusion, second-PRF sweep; duplicated-PRF failure and diverse-PRF
  recovery without claiming removal of stationary/common nulls; seed 3901.'
- 'P40: 32-pulse weak target at -8 dB with known 35-degree progression, complex phase alignment versus power sums
  with different noise-normalized statistics; pulse-count and Gaussian-jitter sweeps; deterministic quadrature phase
  cycle destroys coherent sum and tracked-phase recovery restores it; seed 4001.'
- Every item retains important source stages, source lesson text and guiding question; physical controls, equations,
  units, bounded deterministic processing, baseline/two sweeps/broken/recovery, interpretation checks and teach-back.
  Explicitly document porting choices and omitted presentation behavior.
- Expected numerical signatures use independent formulas or alternate algorithms, never production imports or perturbed
  production values. Retain sixty five-scenario comparisons with units, provenance, file hashes, tolerances and
  measured errors. NumPy RNG is not MATLAB runtime parity.
- Regress P02-P28 without changing their modules or prior reference bytes; extend independent references append-only
  and verify historical provenance against its retained prefix. Extend semantic/normalized-AST anti-template checks
  through P40. Historical contract tests must permit the new active batch while retaining immutable facts.
- 'Remediation ledger: one already-distinct, twenty-seven prior repairs, twelve current repairs, forty-four pending,
  total eighty-four. Whole-course numerical/curriculum/capstone maturity stays blocked for P41-P84; issue 441 remains
  open.'
- All required local focused DSP, backend, contract, quick/full, deterministic catalog, lint, frontend typecheck/build,
  service smoke, and scope/source checks pass. Catalog stays 6 courses / 290 modules / 290 interactive. Hosted CI
  is not required under retained owner direction; missing hosted checkout prerequisites remain documented.
- No MATLAB execution, browser/accessibility, representative learner, hardware/HIL, certification, deployment or
  production claims without actual evidence. Protected target merge retains separate human approval. Subsequent
  learning batches should prefer twelve consecutive items under the owner request.
