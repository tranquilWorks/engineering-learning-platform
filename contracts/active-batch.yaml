acceptance:
- Start only after the exact control contract is merged, from clean target 01a510244801cbf2c3b7ce990693aac9dc5959c1
  tree a757015ceca672e34d0d73bc94d6527cf5c6f0fb. Record the exact control revision in the target profile.
- Preserve every course, source pin, production algorithm, independent oracle, saved expected/actual fixture, evidence
  hash, scientific tolerance and catalog/maturity claim byte-for-byte. Catalog remains six courses, 290 modules
  and 290 interactive modules.
- Introduce a test-only replay comparator for finite one-dimensional same-shaped signatures. Bound each replay difference
  by the smaller of 1e-9 times max(1,abs(saved)) and one percent of the declared per-component scientific budget
  max(absolute_tolerance,relative_tolerance*abs(saved)). Validate tolerance inputs and reject invalid, nonfinite,
  wrong-shaped or empty signatures. No vector-global scale may hide a small-component change.
- The replay ceiling is a portability allowance, not a new scientific acceptance threshold. Retain all fresh production
  versus independently recomputed reference checks under unchanged per-course scientific tolerances, exact fixture
  hashes, parameter/origin identity, same-run determinism, and teaching invariants.
- For GNC P01-P24, validate recorded comparison/error metrics from the immutable saved reference/production pair,
  and independently require newly computed reference/production metrics to pass the original scientific budgets.
  Do not require present floating-point error maxima to be bit-identical to historical maxima.
- Apply the replay policy only to the four failing GNC/Robotics/Vehicle test files. Convert DSP historical active-contract
  assertions into retained-history assertions against the exact completed P11-P20 commit; continue checking the
  immutable DSP source map, pin, tree, titles, module behaviors and repair ledger.
- 'Add positive near-roundoff and negative regression tests: material drift within a loose scientific tolerance
  still fails replay, a large unrelated component cannot hide a small-component error, shape/order/length mismatches
  and NaN/Inf fail, invalid tolerances fail, and corrupted saved error metadata fails. A failing scientific comparison
  cannot be rescued by replay allowance.'
- Retain a read-only audit of all repaired reference scenarios. The preliminary 780-case reference audit had worst
  scaled difference 1.173e-10 in GNC P18 continuous integration, and 9.095e-13 outside that case. Preserve failed
  baseline evidence; do not regenerate fixtures.
- Run targeted replay/course regressions, DSP source-attested regression, contract, quick and full wrappers, deterministic
  full catalog, Python lint, frontend typecheck/build and exact scope/source immutability checks. All required local
  gates must pass before readiness.
- End with a reviewable target change and exact evidence. Target merge retains its human authorization requirement.
  P21-P28 remains pending and must be rebound to the exact merged repair baseline before activation. No MATLAB,
  browser/accessibility, learner, hardware, release/deployment or production claim is made.
