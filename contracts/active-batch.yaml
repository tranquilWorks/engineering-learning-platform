    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - .venv/bin/ruff check apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py courses/controls-gnc
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc-learning courses/controls-gnc/modules/{01..24}-* courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase)"
  focused_tests_to_add:
    - Validate the reviewed competency map, reference integrity, exact map-derived count, and batch membership.
    - Prove P25-P33 use nine semantically distinct governing models and independent reference paths.
    - Execute and compare five scenarios per module with finite values, units, tolerances, measured errors, and teaching invariants.
    - Reject source-equivalence claims for native modules, generic axes, incompatible shared units, production-derived evidence, broad robust-certification claims, or premature curriculum/capstone completion.
  required_ci: []
risk:
  class: high
  hazards:
    - a round module target substitutes for reviewed competency coverage
    - native Python designs are mislabeled as conversions of the pinned MATLAB course
    - a shared implementation template hides distinct control equations or reference methods
    - operating-point, realization, root-locus, Nyquist, frequency-shaping, compensator, transmission-zero, relative-gain, or decoupling conventions are subtly wrong
    - the first expansion batch prematurely claims navigation breadth, curriculum completeness, or an integrated capstone
  stop_conditions:
    - exact target, control, source, competency-map, or worktree identities drift before implementation
    - a module count is changed without a revised reviewed competency matrix
    - an independent method needs production code/output or a perturbed production value
    - any focused/cumulative regression, full verification, deterministic catalog, lint, source-cleanliness, or scope check fails or is skipped
    - work requires source mutation, generic runtime/UI/schema changes, a dependency, unsupported plot primitive, unbounded compute, or evidence beyond deterministic software simulation
rollback:
  strategy: Before merge, close or discard the isolated target branch and pull request. After merge, revert the one target implementation commit to restore the issue-438 baseline; the source repository, reviewed competency map in control, and issue 439 are not rewritten.
evidence:
  output:
    - docs/evidence/ELP-GNC-MODELING-CLASSICAL-P25-P33-2026-09-22.md
    - one P25-P33 row recording competency mapping, governing model, independent formulation, five scenario comparisons, teaching invariants, tolerances, errors, axis review, omissions, and residual limitations
    - focused GNC, DSP, Robotics, course-caliber, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target implementation commit and pull request for this batch, merge identity, rollback path, and explicit unperformed evidence
  claim_boundary: P25-P33 extend the source-bound 24-module course with nine reviewed Python-first modeling and classical-control laboratories verified at a deterministic software-only boundary. This batch does not implement P34-P68, close issue 439, establish curriculum completeness or cumulative capstones, execute MATLAB, validate learners or browser accessibility, operate physical hardware/HIL, or authorize certification, release, deployment, credentials/settings, or production use.
