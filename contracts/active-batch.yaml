acceptance:
- Start only after the exact control commit containing this contract is merged. Use exact clean target main 5c2dc7c918100ef9c6d94aeb1e080f282f947db8,
  tree 3e77d4f6844be639a27bcf25c3236336e7a2a82c; any target, control, source, competency-map, index, or worktree drift stops
  implementation.
- 'Implement exactly P34, P35, P36, P37, P38, P39, P40, P41, P42 from batch ELP-GNC-STATE-DIGITAL-P34-P42: state modes and
  numerical conditioning; discretization and aliasing; pole placement and reference tracking; integral augmentation and command
  limits; LQR/observer separation; finite-horizon time-varying LQR; quantization and jitter; rate transitions and execution
  delay; bumpless transfer and anti-windup.'
- Treat P34, P35, P36, P37, P38, P39, P40, P41, P42 as 9 separately reviewed work items. Each must include a complete learner
  lesson, unique executable model, baseline, two one-variable sweeps, broken behavior, explicit recovery, limiting cases,
  domain-specific quantities and units, and named teaching invariants.
- Keep every expansion lesson a Python-first native design authorized by the reviewed competency map. Do not modify the immutable
  24-item source map, conversion manifest, source coverage, or source fidelity map; do not claim MATLAB equivalence.
- Use independent references that import no production experiment, consume no production result, and perturb no production
  value. Retain origin metadata, inputs, signature fields/units, tolerances, and finite comparison results for baseline, sweep_1,
  sweep_2, broken, and recovery.
- Every plot must use domain-specific titles, axes, quantities, and units. Every runtime must be deterministic, finite, bounded,
  and within the trusted Python timeout.
- Preserve P01-P33, the source gitlink and source evidence, all other courses, generic platform behavior, dependencies, workflows,
  and deployment artifacts byte-identically.
- End with 42 Controls/GNC platform modules and a five-course catalog of 152 modules, all interactive. P43-P68 remain unimplemented;
  curriculum_covered and capstone_integrated remain partial, learner_validated remains not_run, and issue 439 remains open.
- Record exact local verification. Hosted CI is not a completion gate by owner direction; do not claim a hosted result that
  was not run. Keep MATLAB, browser/accessibility, learner, physical HIL/hardware, certification, release, deployment, credentials/settings,
  and production evidence explicitly unperformed.
validation:
  local:
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py
    apps/api/tests/test_gnc_course.py apps/api/tests/test_course_caliber_status.py
  - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest
    -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_conversion_framework.py
    apps/api/tests/test_robotics_course.py
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
  - .venv/bin/ruff check apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py courses/controls-gnc
  - git diff --check
  - test -z "$(git status --short -- courses/controls-gnc-learning courses/controls-gnc/modules/{01..33}-* courses/dsp-radar
    courses/robotics-autonomy courses/demo-radar courses/platform-showcase)"
  focused_tests_to_add:
  - Validate batch membership, distinct governing equations, prerequisite closure, and Python-first provenance.
  - Execute and compare five finite scenarios per module through independent and production paths.
  - Assert topic-specific teaching invariants, physical axes/units, deterministic behavior, and exact baseline recovery.
  required_ci: []
risk:
  class: high
  hazards:
  - a renamed shared template substitutes for the named governing models
  - an independent oracle silently imports or derives from production behavior
  - sign, frame, timing, discretization, covariance, constraint, or stability conventions are subtly wrong
  - the batch prematurely claims later competencies, capstone integration, learner validation, or physical evidence
  stop_conditions:
  - exact target, control, source, map, or worktree identity drifts
  - an independent method needs production code/output or a perturbed production value
  - any focused, cumulative, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
  - work requires source mutation, generic runtime/UI changes, a dependency, unbounded compute, or unsupported evidence
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; do not rewrite
    source or prior batches.
evidence:
  output:
  - docs/evidence/ELP-GNC-STATE-DIGITAL-P34-P42-2026-09-22.md
  - per-item model, oracle, five-scenario, invariant, tolerance, axis, limitation, and residual-risk review
  - focused, regression, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
  - one target squash merge and explicit unperformed evidence
  claim_boundary: This batch implements only P34, P35, P36, P37, P38, P39, P40, P41, P42 at a deterministic software-only
    boundary. P43-P68 remain unimplemented; curriculum_covered and capstone_integrated remain partial, learner_validated remains
    not_run, and issue 439 remains open. It does not execute MATLAB, validate learners or browser accessibility, operate physical
    HIL/hardware, certify safety, or authorize release, deployment, credentials/settings, or production use.
