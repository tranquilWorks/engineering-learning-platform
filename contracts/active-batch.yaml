  focused_tests_to_add:
    - Validate exact P25-P52 native membership, reviewed-map P44-P52 identities and prerequisite closure, native provenance, expansion-ledger transition, distinct governing-equation fingerprints, and absence of P53 or later folders.
    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every new module.
    - Assert topic-specific torque/traction envelopes, reflected inertia and launch energy, differential wheel capacities, gear/shift bounds, dynamic brake allocation, ABS slip dynamics, brake thermal balance/fade, aero balance/ride height, coupled stint constraints, teaching invariants, limiting cases, and exact recovery.
    - Compare P44-P52 against analytic, invariant, or separately formulated numerical references without importing or deriving from production experiments.
    - Validate the six-course, 275-module, 275-interactive catalog and regress every retained course.
