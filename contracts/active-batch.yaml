schema_version: 1
batch:
  id: ELP-ORG-IDENTITY
  title: Normalize TranquilWorks repository identities after organization transfer
  goal: Replace stale kpbianco repository identities with canonical tranquilWorks identities across the platform, its 13 submodule declarations, imported-course provenance closure, tests, governance, current documentation, and retained transfer evidence without changing course content or behavior.
sources:
  product: products/engineering-learning-platform/product.yaml
  requirements:
    - products/engineering-learning-platform/automation.json#ELP-ORG-IDENTITY
    - products/engineering-learning-platform/CODEX_HANDOFF.md
    - products/engineering-learning-platform/roadmap.yaml#authorized_org_identity_lane
  baseline_commit: 923a86ab79893bd939d88d275bdcb12a5a1ddad6
  baseline_tree: ebb16887a492d4327d0fbda4b58e933ed5645dfa
  control_plane_repository: tranquilWorks/portfolio-control
  target_repository: tranquilWorks/engineering-learning-platform
dependencies:
  - ELP-GNC-P01-P24
scope:
  allowed_paths:
    - .gitmodules
    - .portfolio-harness.json
    - README.md
    - scripts/publish_github.sh
    - contracts/active-batch.yaml
    - contracts/profile-requirements.yaml
    - contracts/repo-profile.yaml
    - contracts/verification.yaml
    - apps/api/tests/test_dsp_conversion_framework.py
    - apps/api/tests/test_gnc_conversion_framework.py
    - courses/dsp-radar/AUTHORING.md
    - courses/dsp-radar/source-map.yaml
    - courses/dsp-radar/conversion-manifest.yaml
    - courses/dsp-radar/coverage.yaml
    - courses/dsp-radar/modules/*/conversion.yaml
    - courses/controls-gnc/source-map.yaml
    - courses/controls-gnc/conversion-manifest.yaml
    - courses/controls-gnc/coverage.yaml
    - courses/controls-gnc/modules/*/conversion.yaml
    - docs/PORTFOLIO_CONTROL.md
    - docs/PORTFOLIO_ONBOARDING_REQUEST.md
    - docs/CURRENT_STATE.md
    - docs/HANDOFF.md
    - docs/ROADMAP.md
    - docs/evidence/*.md
  forbidden_paths:
    - courses/*-learning
    - courses/*-learning/**
    - courses/dsp-radar/course.yaml
    - courses/dsp-radar/modules/*/module.yaml
    - courses/dsp-radar/modules/*/lesson.md
    - courses/dsp-radar/modules/*/experiment.py
    - courses/dsp-radar/modules/*/evidence/**
    - courses/controls-gnc/course.yaml
    - courses/controls-gnc/modules/*/module.yaml
    - courses/controls-gnc/modules/*/lesson.md
    - courses/controls-gnc/modules/*/experiment.py
    - courses/controls-gnc/modules/*/evidence/**
    - courses/demo-radar/**
    - courses/platform-showcase/**
    - apps/api/src/**
    - apps/web/**
    - packages/**
    - .github/**
    - Dockerfile
    - compose.yaml
    - package.json
    - package-lock.json
    - apps/api/pyproject.toml
    - apps/web/package.json
    - apps/web/package-lock.json
acceptance:
  - Begin from exact clean target main 923a86ab79893bd939d88d275bdcb12a5a1ddad6, tree ebb16887a492d4327d0fbda4b58e933ed5645dfa, after this exact control contract merges. Any target or control drift stops implementation.
  - Canonical control, target, and all 13 source-course repository names and URLs resolve under tranquilWorks. No current platform-owned provenance field or clone/publish/submodule instruction names kpbianco as repository owner.
  - All 13 gitlink SHAs, every source commit/tree/curriculum/file hash, the complete 84-item DSP and 24-item GNC mappings, and every source-course byte remain unchanged.
  - Only source-map repository identity and its mechanically derived digest bindings may change inside imported native courses. Every course.yaml, module.yaml, lesson.md, experiment.py, and expected/actual numeric evidence JSON file remains byte-identical.
  - Generic API/UI/schema/runtime, dependencies, workflows, deployment files, examples, and unfinished courses remain byte-identical. No course, module, conversion, or learner behavior is added.
  - DSP/Radar coverage remains 84 converted and Controls/GNC coverage remains 24 converted with zero pending, blocked, or placeholder entries. Catalog remains exactly four courses, 110 modules, and 110 interactive modules.
  - One target branch, one implementation commit, and one target PR contain the entire identity normalization. Exact-head hosted backend, frontend, and Linux/amd64 container jobs pass before human merge.
validation:
  local:
    - test "$(git rev-parse HEAD)" = 923a86ab79893bd939d88d275bdcb12a5a1ddad6 && test "$(git rev-parse origin/main)" = 923a86ab79893bd939d88d275bdcb12a5a1ddad6
    - test "$(git rev-parse HEAD^{tree})" = ebb16887a492d4327d0fbda4b58e933ed5645dfa
    - git diff --check
    - python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_gnc_conversion_framework.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - test -z "$(git diff --raw 923a86ab79893bd939d88d275bdcb12a5a1ddad6 -- courses/*-learning)"
    - test -z "$(git diff --name-only 923a86ab79893bd939d88d275bdcb12a5a1ddad6 -- 'courses/*/modules/*/lesson.md' 'courses/*/modules/*/module.yaml' 'courses/*/modules/*/experiment.py' 'courses/*/modules/*/evidence/**')"
  required_ci:
    - Existing exact-head GitHub Actions backend, frontend, and Linux/amd64 container jobs pass without skips or waivers.
risk:
  class: medium
  hazards:
    - stale owner strings leave mixed canonical identity
    - source-map repository rename breaks derived digest closure
    - a gitlink or course payload changes during a mechanical migration
    - unfinished course work enters an administrative batch
  stop_conditions:
    - any target/control drift or unavailable canonical repository
    - any gitlink, source hash, lesson, module manifest, experiment, numeric evidence, runtime, UI, dependency, workflow, deployment, or catalog change
    - any new course/module/conversion or failed/skipped verification
rollback:
  strategy: Before merge discard the isolated branch. After merge revert the one target identity-normalization commit; external GitHub transfer redirects remain independent and no course/source content is rewritten.
evidence:
  output:
    - docs/evidence/ELP-ORG-IDENTITY-2026-08-27.md
    - canonical repository URL matrix and stale-identity audit
    - gitlink/source/course-payload immutability hashes
    - source-map and derived provenance digest closure
    - complete local and exact-head hosted verification
  claim_boundary: Repository identity and provenance normalization only. No new course content, MATLAB parity, learner/browser/accessibility acceptance, physical HIL/HWIL, release, deployment, credentials/settings, or production operation.
