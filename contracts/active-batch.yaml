risk:
  class: high
  hazards:
    - a plausible visualization hides a wrong range-noise model, extrinsic-frame convention, odometry integration, EKF covariance update, particle-weight normalization, SLAM gauge constraint, A-star heuristic, randomized-planner collision check, moving-obstacle prediction, behavior-tree status, mission transition, deadline model, safety-monitor priority, or HIL fault verdict
    - randomized algorithms are nondeterministic, numerically fragile, under-bounded, or verified by the same implementation path
    - scaffold identity is misrepresented as implemented MATLAB behavior or Python agreement is mislabeled MATLAB parity
    - expected and actual evidence share an implementation path, use fabricated values, exceed tolerance, omit units/limiting cases, or mask algorithmic failure with loose thresholds
    - generic platform, completed courses, source gitlink, dependencies, workflows, or deployment change to accommodate Robotics
  stop_conditions:
    - exact target/control/source identities or source cleanliness differ
    - any item requires source mutation, generic renderer/runtime/schema/type changes, a new dependency, unsupported result primitive, unbounded solver, placeholder, semantic duplication, or bypass of its individual gate
    - any independent correctness case, focused/cumulative test, full verification, deterministic catalog run, lint, source-cleanliness check, or exact-head CI fails or is skipped
    - any MATLAB, browser/accessibility, learner, physical robot/HIL, bench, field, release, deployment, credential/settings, or production claim exceeds retained evidence
rollback:
  strategy: Before merge, close or discard the isolated P11-P24 target branch and pull request 13. After merge, revert the one P11-P24 implementation commit, removing only Robotics P11-P24 plus their tests/evidence and restoring merged P01-P10 with catalog 5/120/120 while leaving the source repository and completed courses untouched.
evidence:
  output:
    - docs/evidence/ELP-ROB-P01-P24-2026-09-21.md
    - exact target/control/source identities and source cleanliness
    - one P01-P24 row per internal gate, with P11-P24 explicitly recorded as fourteen work items including design equations, reference method, coverage transition, default/two-sweep/broken-recovery/resource/determinism/comparison results, tolerances, residual risks, and unperformed checks
    - complete focused, source-course regression, contract, quick, full, deterministic catalog, lint, diff, source-cleanliness, and exact-head hosted-CI results
    - one final target commit, one target PR, rollback path, and explicit MATLAB/browser/accessibility/learner/physical/release/deployment/production dispositions
  claim_boundary: Twenty-four catalog-visible, Python-verified Robotics and Autonomy software lessons at pinned curriculum identity f8807640258f1a6c1c77f1dcc9e61734551c585b. P01 is checked against its implemented source design; P02-P24 are Python-first native designs verified against independent references. P24 provides software-only HIL methodology and simulation, not physical HIL evidence. No MATLAB runtime comparison, learner effectiveness, browser/accessibility acceptance, physical robot/HIL, bench, field, release, deployment, or production result is implied.
