acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main c14c2d3d7376a2f06cb12c55e91ad8bb98ae8088, tree 3959fa6915484ed8e3d8563c7dc4a3f7c1448183; any target, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly reviewed-map P25-P33 in order: measure body/path/wheel frames; quantify tire load sensitivity; fit longitudinal force versus slip ratio; fit lateral force versus slip angle and camber; combine longitudinal and lateral slip; model tire relaxation and transient force; track tire temperature, pressure, and grip; accumulate tire work and thermal energy; validate a tire model with uncertainty.
  - Preserve the source-bound P01-P24 inventory, source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed competency map, source map, fixtures, conversion manifest, coverage ledger, and source-bound reference byte-identically. P25-P33 are competency-derived Python-first native designs and claim neither source implementation nor MATLAB-runtime equivalence.
  - Treat all nine IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate and sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use a course-owned independent reference implementation that imports no production experiment, consumes no production result, and perturbs no production value. Retain origin, inputs, fields and units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P25 must transform deterministic planar motion among inertial, path, body, and steered-wheel frames, expose round-trip and norm invariants, compute wheel-frame longitudinal/lateral velocity and slip angle, and make a degrees-versus-radians or inverse-rotation defect explicitly invalid.
  - P26 must model sublinear peak tire force versus normal load, distinguish friction coefficient from force capacity, quantify load-transfer loss for equal-total-load split pairs, and make a linear-load assumption visibly violate the load-sensitivity invariant.
  - P27 must fit a bounded saturating longitudinal-force law from deterministic synthetic offline slip-ratio data with separate fit and validation samples, expose stiffness, peak force, residuals and identifiability, and reject a percent-versus-ratio or collapsed-excitation defect.
  - P28 must fit a bounded lateral force law versus slip angle and camber from deterministic synthetic offline data, expose cornering stiffness, camber stiffness, saturation and residuals, and reject an angle-unit or sign-convention defect.
  - P29 must enforce a combined-slip friction-circle or friction-ellipse constraint, expose pure and combined force demands, utilization, scale factor and constraint residual, and make independent uncapped longitudinal/lateral saturation explicitly invalid.
  - P30 must model first-order tire-force relaxation in distance or time with explicit speed, relaxation length, steady-state target, transient force, 63-percent response and bounded integration; its broken case must expose an omitted speed conversion or nonphysical relaxation parameter.
  - P31 must track a bounded synthetic tire thermal state, absolute pressure relation, and temperature/pressure-dependent grip with explicit Celsius/Kelvin boundaries, heat input and cooling; its broken case must expose Celsius used as an absolute temperature or an omitted loss path.
  - P32 must integrate longitudinal and lateral slip power into cumulative tire work, heat storage and loss, expose energy-balance residual and temperature rise, and make a sign, unit, or missing-loss defect explicitly invalid.
  - P33 must validate a tire model on held-out deterministic synthetic data with explicit observation uncertainty, residual bias, RMSE, normalized residuals and prediction-interval coverage; its broken case must expose training/validation leakage or deliberately underreported uncertainty.
  - Validate inputs before allocation; cap samples, searches, and integration horizon; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install or import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Add a competency expansion ledger that declares 24 source-bound modules, all 67 reviewed planned modules, exactly P25-P33 implemented natively, and P34-P67 pending. Keep source-bound conversion and coverage totals at total=24, converted=24, pending=0, blocked=0, placeholder=0.
  - End with exactly six courses, 256 modules, and 256 interactive modules. Update only retained catalog-total assertions needed for this authorized nine-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
