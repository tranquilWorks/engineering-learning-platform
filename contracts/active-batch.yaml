acceptance:
- Owner authorizes this scoped continuation and content-only merge. Publish the matching Control contract,
  preserve all other course bytes and source pins. No arbitrary inventory expansion.
- Audit all 69 numerical mechanisms and independent evidence. Replace native signature lookup fixtures
  with independently formulated references. Repair any claimed mechanisms found to be absent or inconsistent,
  retaining runtime limits/control identities and documenting changed native numerical evidence separately
  from historical conversions.
- Provide 69 individually authored browser-embedded formative assessments with actual controls, two sweeps,
  equations/units, worked reasoning, fault/recovery and limits. Preserve existing checkpoints and extend
  missing scopes without erasing prior reviewed prose.
- Bind all actual native identities, competencies, acyclic prerequisites, cumulative portfolios and two
  capstones. Capstone integration claims must describe executed models, not broader absent algorithms.
  No authentic full SLAM/manipulation or physical HIL claim from simplified capstones.
- Freshly replay five independently originated scenarios for every lesson, retaining unchanged tolerances
  and original oracle provenance; verify physical invariants, selected full arrays, off-grid and degenerate
  cases. Reconcile referenced markdown content identities via actual catalog.
- Exercise all Robotics lessons and checkpoints through real desktop/mobile browser and HTTP entry points,
  control/fault/recovery/reset and drawn plots. Run required contract/quick/full gates sequentially and
  distinguish host verification from baked read-only nonroot Docker delivery.
- Promote only evidence-supported software numerical/curriculum/capstone stages. Keep learner, manual
  screen-reader, MATLAB, hardware, production and concurrent capacity not run. Preserve DSP and Controls
  dispositions and Vehicle aggregate blocks.
- Publish exact evidence and reviewable development PR. Merge only after required verification; preserve
  failures and environment blockers without weakening assertions or claiming a completed acceptance gate.
- 'Owner continuation from accepted Controls: content-only review at DSP authored/software rigor, push
  and merge after evidence. Docker delivery is deferred and must remain not_run until performed; learner,
  MATLAB, hardware and production remain separate.'
- Update only the active-contract assertions in three historical DSP fidelity test files to recognize
  this succeeding approved batch; preserve every DSP source-prefix, oracle, numerical and learner-boundary
  assertion. Historical Robotics conversion manifest/schema remain immutable; validate added referenced
  assessment files through a separate compatible assessment verification schema.
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_robotics_aggregate_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-robotics-assessments.py
  - npm run test:web
  - npm run test:browser
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  - ./scripts/verify-robotics-host.sh
  focused_tests_to_add:
  - Independent full mechanisms, live assessment bindings, exact unchanged source/course preservation,
    singular and off-grid inputs, capstone stage/requirement evidence.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; named local gates remain required except baked
    Docker delivery explicitly deferred by the owner for this content-only merge.
risk:
  class: high
  hazards:
  - Copied reference equations masking incorrect physics.
  - Misleading dimensions, unavailable/singular values or empirical-model claims.
  - Host storage/resource contention disrupting long verification.
  stop_conditions:
  - Need generic runtime/schema/source pin or other course changes.
  - Cannot establish credible numerical/browser evidence.
  - Need physical hardware, learner data or production access.
rollback:
  strategy: Revert isolated Robotics revision to PR63; no schema or learner-data migration.
evidence:
  output:
  - docs/evidence/ELP-ROB-AGGREGATE-QUALITY-01-2026-11-04.md
  - docs/course-quality/robotics-aggregate-review.json
  - courses/robotics-autonomy/assessment-map.json
  claim_boundary: Authored curriculum and independently verified synthetic software; no Docker, learner,
    MATLAB, hardware or production claim from host evidence.
