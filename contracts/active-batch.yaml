acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 8b9f93a1efa279edad6914afbf28283ee0007ee6, tree 38ec2b37002f95ad2fac5c21549f650dc77a592f; any target, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly reviewed-map P53-P60 in order: replay and decode GR86 CAN/BLE telemetry; align clocks, rates, and dropped packets; calibrate sensors and transform measured axes; reconstruct a driven trajectory; estimate sideslip and vehicle state; identify vehicle parameters with validation splits; quantify identifiability, residuals, and uncertainty; diagnose and recover corrupt telemetry.
  - Preserve P01-P52, source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed competency map, native-design schema, source map, fixtures, conversion manifest, coverage ledger, and source-bound reference byte-identically. P53-P60 are competency-derived Python-first native designs and claim neither source implementation nor MATLAB-runtime equivalence.
  - Treat all eight IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate and sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use the course-owned independent reference implementation, extended without importing a production experiment, consuming a production result, or perturbing a production value. Retain origin, inputs, fields and units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P53 must replay the immutable synthetic GR86 CAN and RaceChrono BLE fixture protocol without writing it, validate sequence/timestamp/payload parity, decode bounded declared signals from raw bytes, expose record or frame counts, decoded engineering values, provenance/parity status, and decode residual; its broken case must use wrong endianness/scaling or omit the BLE framing boundary.
  - P54 must align deterministic asynchronous clocks and rates, expose source offset, dropped samples, aligned sample count, maximum gap, reconstruction error, and time-grid residual; its broken case must ignore clock offset, interpolate across an invalid gap, or silently hide a dropped packet.
  - P55 must apply deterministic sensor bias/scale calibration and an explicit sensor-to-body axis transform with declared degree/radian and sign boundaries, expose calibrated components, transform closure, and calibration residual; its broken case must omit bias, reverse an axis, or use degrees directly in trigonometry.
  - P56 must integrate bounded speed and yaw-rate telemetry into a planar trajectory and apply deterministic position correction, expose final position/heading, path length, endpoint error, and kinematic closure; its broken case must misuse yaw units, timestamp spacing, or body/inertial rotation.
  - P57 must estimate sideslip, yaw rate, and at least one supporting vehicle state with a bounded deterministic observer or filter, expose state error, covariance or innovation behavior, observability or stability, and estimator residual; its broken case must reverse a force/measurement sign or omit the measurement correction.
  - P58 must identify at least two meaningful vehicle parameters from deterministic synthetic observations with an explicit chronological training/validation split, expose parameter estimates, train and held-out errors, sample counts, and split or prediction residual; its broken case must leak validation data, fit an invalid unit, or report training error as validation.
  - P59 must quantify excitation-conditioned identifiability, residual structure, parameter covariance or confidence, and empirical uncertainty coverage with bounded deterministic observations, expose condition number or singular value, residual metric, parameter uncertainty, coverage, and uncertainty residual; its broken case must invert an ill-conditioned normal matrix without checks, understate noise, or hide correlated residuals.
  - P60 must diagnose deterministic missing, duplicate, out-of-order, and malformed telemetry records against the immutable synthetic fault plan, recover only valid ordered records, expose each fault count, recovered record count, provenance verdict, and recovery residual; its broken case must trust corrupt packets, silently reorder without diagnosis, or count malformed data as valid.
  - Validate inputs before allocation or fixture read; cap records, samples, interpolation grids, integrations, matrix sizes, searches, and recovery horizons; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install or import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update the competency expansion ledger to declare 24 source-bound modules, all 67 reviewed planned modules, exactly P25-P60 implemented natively, and P61-P67 pending. Keep source-bound conversion and coverage totals at total=24, converted=24, pending=0, blocked=0, placeholder=0.
  - End with exactly six courses, 283 modules, and 283 interactive modules. Update only retained catalog-total assertions needed for this authorized eight-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
