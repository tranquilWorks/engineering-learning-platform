    - one P34-P43 row per work item with governing relation, provenance, scenarios, teaching invariant, tolerance, axes and units, limitation, and residual risk
    - focused, retained-course, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target squash merge, exact resulting commit and tree, and explicit unperformed evidence
  claim_boundary: This batch implements and independently verifies ten deterministic software-only Vehicle Dynamics chassis lessons. P34-P43 are Python-first native designs derived from the reviewed competency map and deterministic synthetic parameters. No source or MATLAB-runtime equivalence, measured damper, suspension, rig, track, or vehicle validation, browser/accessibility or learner validation, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, or production use is implied.
