acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main e33d1356f15f88c876fb41a482bb3882dcb20783, tree 607ddefbbe9dc2fdabd9b01bed60a47f5131379f; any target, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly reviewed-map P44-P52 in order: convert engine torque into a traction envelope; model rotating inertia and launch dynamics; compare open and limited-slip differentials; optimize gear ratios and shift strategy; allocate brake bias with dynamic load transfer; simulate ABS slip control and wheel lockup; predict brake temperature, fade, and cooling; map aero balance and ride-height sensitivity; couple downforce, drag, tires, and stint limits.
  - Preserve P01-P43, source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed competency map, native-design schema, source map, fixtures, conversion manifest, coverage ledger, and source-bound reference byte-identically. P44-P52 are competency-derived Python-first native designs and claim neither source implementation nor MATLAB-runtime equivalence.
  - Treat all nine IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate and sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use the course-owned independent reference implementation, extended without importing a production experiment, consuming a production result, or perturbing a production value. Retain origin, inputs, fields and units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P44 must map a bounded engine torque curve through selected gear, final drive, efficiency, and tire radius into wheel force versus road speed; expose engine-limited force, tire capacity, delivered force, utilization, and governing-envelope residual; its broken case must omit radius/efficiency or ignore the tire boundary.
  - P45 must reflect engine, clutch, gearbox, shaft, and wheel inertia to an equivalent translational mass, integrate a bounded traction-limited launch, and expose acceleration, time or speed, inertia contribution, energy or force residual; its broken case must reflect inertia through the wrong ratio direction or omit it.
  - P46 must compare open and torque-biasing limited-slip differential delivery on deterministic split-friction wheel capacities, expose wheel torques, total delivered force, unused capacity, bias ratio, and capacity residual; its broken case must exceed a wheel capacity or apply torque-bias ratio backward.
  - P47 must evaluate bounded gear/final-drive candidates and a deterministic shift strategy using wheel-force crossovers, engine-speed limits, and shift interruption; expose selected ratios or shift speeds, acceleration envelope, zero-to-speed time, and strategy residual; its broken case must ignore crossover, redline, or shift delay.
  - P48 must compute dynamic front/rear normal load under deceleration, axle friction capacities, ideal and selected brake bias, achievable deceleration, axle utilization, and force/load closure; its broken case must use static load or exceed one axle capacity.
  - P49 must simulate bounded wheel-slip dynamics with explicit vehicle/wheel speed, tire force, brake torque, sample interval, and deterministic ABS modulation; expose target tracking, peak slip, stopping distance or speed reduction, lockup verdict, and dynamic residual; its broken case must disable modulation or use the wrong slip sign and lock the wheel.
  - P50 must integrate brake thermal energy over deterministic repeated stops and cooling intervals, expose peak/final temperature, convective rejection, fade factor, and energy-balance residual; its broken case must omit cooling, use an invalid thermal unit, or hide fade.
  - P51 must map front/rear downforce, total drag, aerodynamic balance, pitch moment, and ride-height sensitivity with explicit speed and millimeter/meter boundaries; its broken case must misuse ride-height units or omit an axle contribution.
  - P52 must couple speed-dependent downforce and drag with tire load sensitivity, propulsion/brake demand, thermal or energy accumulation, and a bounded stint limit; expose force balance, usable acceleration or speed, energy per lap, limiting lap count, and constraint residual; its broken case must double-count downforce, ignore drag, or exceed a tire/thermal boundary.
  - Validate inputs before allocation; cap samples, time steps, searches, gear candidates, stops, and stint horizon; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install or import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update the competency expansion ledger to declare 24 source-bound modules, all 67 reviewed planned modules, exactly P25-P52 implemented natively, and P53-P67 pending. Keep source-bound conversion and coverage totals at total=24, converted=24, pending=0, blocked=0, placeholder=0.
  - End with exactly six courses, 275 modules, and 275 interactive modules. Update only retained catalog-total assertions needed for this authorized nine-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
