  focused_tests_to_add:
    - Validate exact P25-P60 native membership, reviewed-map P53-P60 identities and prerequisite closure, native provenance, expansion-ledger transition, distinct governing-equation fingerprints, and absence of P61 or later folders.
    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every new module.
    - Assert topic-specific raw CAN/BLE decode parity, clock/rate alignment, calibration and axis transforms, trajectory closure, sideslip/state estimation, chronological identification splits, identifiability and uncertainty, corruption diagnosis/recovery, teaching invariants, limiting cases, and exact recovery.
    - Compare P53-P60 against analytic, invariant, or separately formulated numerical references without importing or deriving from production experiments.
    - Validate the six-course, 283-module, 283-interactive catalog and regress every retained course.
