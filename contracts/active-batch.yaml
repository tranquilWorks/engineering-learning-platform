acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main a917fc6174d18a845f9658ce881ba9138c660c76, tree 0b935a289b8d73aa95fd4d20cf49ced6847fbe37; any target, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly reviewed-map P61-P67 in order: build track geometry and curvature; construct a speed-dependent g-g-v envelope; optimize a racing line under coupled constraints; run a forward-backward lap-time simulation; compare setups with designed experiments; validate a vehicle model from telemetry; calibrate and predict with a GR86 digital twin.
  - Preserve P01-P60, source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed competency map, native-design schema, source map, fixtures, conversion manifest, coverage ledger, and source-bound reference byte-identically. P61-P67 are competency-derived Python-first native designs and claim neither source implementation nor MATLAB-runtime equivalence.
  - Treat all seven IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate and sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use the course-owned independent reference implementation, extended without importing a production experiment, consuming a production result, or perturbing a production value. Retain origin, inputs, fields and units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P61 must construct a closed deterministic track from bounded segment geometry, compute arc length, heading, signed curvature, closure error, and a curvature-integral invariant; its broken case must confuse degrees/radians, omit closure, or use a wrong curvature sign.
  - P62 must build a speed-dependent longitudinal/lateral acceleration envelope from tire, powertrain, brake, aero, load, and friction constraints; expose acceleration bounds, lateral capacity, utilization, and constraint residual; its broken case must combine limits independently, omit drag/downforce, or exceed the friction boundary.
  - P63 must optimize a bounded racing-line offset against curvature, track width, and the P62 coupled envelope; expose line length, peak curvature, minimum speed, objective improvement, boundary margin, and feasibility residual; its broken case must leave the track, ignore coupling, or optimize an invalid signed distance.
  - P64 must execute a deterministic forward/backward speed pass and lap-time integration with acceleration, braking, curvature, power, tire, and thermal/energy constraints; expose lap time, speed extrema, energy or thermal budget, pass-closure residual, and active constraints; its broken case must use only a forward pass, violate braking reachability, or double-count available force.
  - P65 must compare at least two setup factors with a balanced designed experiment, expose main and interaction effects, replicate or residual error, ranking, and a held-out or finite-difference consistency check; its broken case must confound factors, omit an interaction, or compare one-at-a-time changes as causal effects.
  - P66 must be a cumulative telemetry-validation capstone with signed requirements covering provenance replay, clock alignment, calibration, trajectory and state reconstruction, chronological identification/validation, identifiability/uncertainty, corrupt-data diagnosis, and exact recovery. Expose requirement pass count, held-out residual, uncertainty or coverage, fault count, and trace residual; its broken case must inject one cumulative data/model fault and fail named requirements.
  - P67 must be a cumulative GR86 digital-twin capstone with signed requirements covering calibrated tire, handling, chassis, propulsion, brake, aero, track, racing-line, lap, uncertainty, and setup-comparison behavior. Expose requirement pass count, lap prediction, uncertainty bound, setup delta, coupled constraint residual, and recovery verdict; its broken case must inject an integrated coupling failure and recovery must restore every traced requirement.
  - Validate inputs before allocation; cap geometry points, envelope grid, optimization candidates, integration steps, experiment cells, capstone requirements, and horizons; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install or import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update the competency expansion ledger to declare 24 source-bound modules, all 67 reviewed planned modules, exactly P25-P67 implemented natively, and no pending native modules. Keep source-bound conversion and coverage totals at total=24, converted=24, pending=0, blocked=0, placeholder=0.
  - End with exactly six courses, 290 modules, and 290 interactive modules. Update only retained catalog-total assertions needed for this authorized seven-module increase; preserve every completed course and source gitlink byte-identically.
  - Mark Vehicle Dynamics `platform_converted`, `numerically_verified`, `curriculum_covered`, and `capstone_integrated` passed only if P61-P67 and both reviewed capstone traces pass. Keep `learner_validated` not_run.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle or rig data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
