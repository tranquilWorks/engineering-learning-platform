acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 7188d370b52dd9812634ae431fa652525d081634, tree 3953708c5c04c18a53ede4adda021f0612874aba; any target, control, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly P01-P08 in source order: steering/speed to path; acceleration to tire force; longitudinal load transfer; friction-circle allocation; longitudinal slip ratio; lateral slip angle; the linear bicycle model; and understeer versus oversteer.
  - Preserve exact source identities, titles, guiding questions, prerequisite order, and read-only gitlink. P01-P02 retain implemented-source provenance and separately formulated source-behavior comparisons; P03-P08 retain scaffold provenance and are labeled Python-first native designs, not source or MATLAB equivalence.
  - Treat all eight IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate/sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use a course-owned independent reference implementation that imports no production experiment, consumes no production result, and perturbs no production value. Retain origin, inputs, fields/units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P01 must expose curvature, yaw rate, lateral acceleration, and a friction-limited path boundary. P02 must close force balance through tractive force, rolling resistance, aerodynamic drag, acceleration, and a tire-force limit. P03 must conserve total axle load while showing acceleration, center-of-mass height, and wheelbase effects.
  - P04 must enforce the combined longitudinal/lateral friction boundary and expose utilization. P05 and P06 must define slip-ratio and slip-angle sign conventions, low-slip stiffness, saturation, and zero-slip limits. P07 must expose linear-bicycle yaw/sideslip dynamics and its low-angle boundary. P08 must derive understeer gradient, characteristic or critical speed behavior, and a recoverable unstable/invalid setup.
  - Validate inputs before allocation; cap samples and integration horizon; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install/import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update conversion and coverage ledgers to total=24, pending=16, converted=8, blocked=0, placeholder=0 with exact content digests and closed per-item verification records. Do not create P09-P24 target folders or placeholders.
  - End with exactly six courses, 231 modules, and 231 interactive modules. Update only the retained GNC/Robotics catalog-total assertions needed for this authorized eight-module increase; preserve all completed course content and every other source gitlink byte-identically.
  - Preserve the reviewed map, source map, synthetic GR86 CAN/BLE fixture package, generic platform behavior, dependencies, workflows, and deployment artifacts byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
validation:
  local:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_course_caliber_status.py
    - ELP_DSP_SOURCE_ROOT=courses/dsp-radar-learning PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_dsp_course.py
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_gnc_expansion.py apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_gnc_course.py apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B scripts/validate_courses.py --execute --deterministic --json
    - .venv/bin/ruff check apps/api/tests/test_vehicle_dynamics_framework.py apps/api/tests/test_vehicle_dynamics_course.py apps/api/tests/test_dsp_conversion_framework.py apps/api/tests/test_course_caliber_status.py courses/vehicle-dynamics/modules courses/vehicle-dynamics/reference_cases.py
    - .venv/bin/ruff check --ignore UP038 apps/api/tests/test_gnc_conversion_framework.py apps/api/tests/test_robotics_conversion_framework.py
    - git diff --check
    - test -z "$(git status --short -- courses/controls-gnc courses/dsp-radar courses/robotics-autonomy courses/demo-radar courses/platform-showcase courses/vehicle-dynamics/fixtures)"
    - test -z "$(git -C courses/vehicle-dynamics-learning status --porcelain=v1 --untracked-files=all)"
  focused_tests_to_add:
    - Validate exact P01-P08 membership, source/map identity, prerequisite closure, provenance classification, coverage transition, content digests, and absence of later modules.
    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every module.
    - Assert topic-specific equations, sign/frame conventions, teaching invariants, limiting cases, physical boundaries, formative checks, and exact recovery.
    - Compare P01-P02 against separately formulated implemented-source behavior and P03-P08 against analytic, invariant, or separately formulated numerical references without relabeling source scaffolds as executed designs.
    - Validate the six-course, 231-module, 231-interactive catalog and regress every retained course.
  required_ci: []
risk:
  class: high
  hazards:
    - a shared vehicle template substitutes for eight distinct governing models
    - a sign, frame, wheelbase split, load-transfer direction, friction utilization, slip definition, cornering-stiffness convention, or understeer-gradient unit is subtly wrong
    - an independent oracle imports or derives from production behavior
    - source scaffolds are mislabeled as implemented MATLAB or source-equivalent behavior
    - an invalid or unstable setup yields plausible finite plots instead of an explicit broken/recovery verdict
  stop_conditions:
    - exact target, control, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code/output or a perturbed production value
    - work requires source mutation, fixture mutation, generic runtime/UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only Vehicle Dynamics P01-P08, their independent reference/tests/evidence, and their ledger/documentation transitions while retaining the governed prep state.
evidence:
  output:
    - docs/evidence/ELP-VEHICLE-P01-P08-2026-09-23.md
    - one P01-P08 row per work item with governing relation, source/native provenance, scenarios, teaching invariant, tolerance, axes/units, limitation, and residual risk
    - focused, retained-course, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target squash merge, exact resulting commit/tree, and explicit unperformed evidence
  claim_boundary: This batch implements and independently verifies eight deterministic software-only Vehicle Dynamics lessons. P01-P02 retain implemented-source comparisons; P03-P08 are Python-first native designs derived from source identities and reviewed competencies. No MATLAB runtime comparison, browser/accessibility or learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, or production use is implied.
