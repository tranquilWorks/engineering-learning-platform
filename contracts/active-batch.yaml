acceptance:
  - Start from exact clean target main ce2c130fd25571913f427d5ae3ad5d6c1b64e585, tree 8c50b323b82abdb8d0c96dd500f97f1e63e08d9a, after this exact control contract is merged.
  - Mirror the reviewed control-plane map byte-for-byte and validate it against the retained competency-map schema.
  - Record a module-specific depth disposition for every retained P01-P24 lesson before editing any retained lesson.
  - Prove that the 69 module identities are ordered, all references close, all ten batches contain at most ten items, and two cumulative capstones integrate at least five competencies each.
  - Preserve every module, executable, source-bound record, source gitlink, other course, platform path, dependency, workflow, and deployment artifact byte-identically.
  - Do not claim implementation of P25-P69, completion of any depth pass, MATLAB parity, browser/accessibility, learner, physical HIL/hardware, certification, release, deployment, or production evidence.
validation:
  local:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=apps/api/src python3 -B -m pytest -q apps/api/tests/test_robotics_expansion.py apps/api/tests/test_robotics_conversion_framework.py apps/api/tests/test_robotics_course.py
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - git diff --check
    - test -z "$(git status --short -- courses/robotics-autonomy-learning courses/robotics-autonomy/modules courses/controls-gnc courses/dsp-radar courses/demo-radar courses/platform-showcase)"
  focused_tests_to_add:
    - Validate the reviewed map schema, count derivation, prerequisite/reference closure, batch bound, and capstone breadth.
    - Validate one planned, module-specific depth disposition for every retained P01-P24 item.
  required_ci: []
risk:
  class: medium
  hazards:
    - a count is selected independently of the competency graph
    - a prerequisite, assessment, evidence, or batch reference is dangling
    - a generic depth template replaces module-specific review
    - target content is edited before the reviewed boundary is committed
  stop_conditions:
    - target, control, source, competency-map, or worktree identity drifts
    - a batch exceeds ten work items or the count no longer equals len(modules)
    - any focused, regression, contract, quick, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its single squash commit; no lesson or runtime rollback is required.
evidence:
  output:
    - docs/evidence/ELP-ROB-COMPETENCY-MAP-2026-09-22.md
    - map schema, graph closure, count derivation, batch-bound, capstone-breadth, depth-disposition, regression, and scope results
    - one target squash merge and explicit unperformed evidence
  claim_boundary: This batch records the reviewed course boundary and depth work plan only. It implements no new module, edits no retained lesson, executes no MATLAB or hardware, and does not validate browser accessibility, learners, certification, release, deployment, credentials/settings, or production use.
