acceptance:
- Owner request authorizes scoped development implementation. Publish this new contract in Portfolio Control;
  retain exact target baseline and all other course bytes/source pins. No inventory expansion or breadth roadmap
  activation.
- Audit all 68 numerical mechanisms and independent evidence. Replace native signature lookup fixtures with
  independently formulated references. Repair any claimed mechanisms found to be absent or inconsistent, retaining
  runtime limits/control identities and documenting changed native numerical evidence separately from historical
  conversions.
- Provide 68 individually authored browser-embedded formative assessments with actual controls, two sweeps,
  equations/units, worked reasoning, fault/recovery and limits. Preserve existing checkpoints and extend missing
  scopes without erasing prior reviewed prose.
- Bind all actual native identities, competencies, acyclic prerequisites, cumulative portfolios and three capstones.
  Capstone integration claims must describe executed models, not broader absent algorithms. No authentic full
  GNSS/INS or physical HIL claim from simplified capstones.
- Freshly replay five independently originated scenarios for every lesson, retaining unchanged tolerances and
  original oracle provenance; verify physical invariants, selected full arrays, off-grid and degenerate cases.
  Reconcile referenced markdown content identities via actual catalog.
- Exercise all Controls lessons and checkpoints through real desktop/mobile browser and HTTP entry points,
  control/fault/recovery/reset and drawn plots. Run required contract/quick/full gates sequentially and distinguish
  host verification from baked read-only nonroot Docker delivery.
- Promote only evidence-supported software numerical/curriculum/capstone stages. Keep learner, manual screen-reader,
  MATLAB, hardware, production and concurrent capacity not run. Preserve DSP disposition and Robotics/Vehicle
  aggregate blocks.
- Publish exact evidence and reviewable development PR. Merge only after required verification; preserve failures
  and environment blockers without weakening assertions or claiming a completed acceptance gate.
- 'Owner 2026-11-03: content-only completion at DSP authored/software rigor; Docker delivery is deferred
  and does not block this content acceptance or the explicitly authorized push and merge. No container,
  learner, hardware or production pass is inferred.'
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_gnc_aggregate_quality.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-gnc-assessments.py
  - npm run test:web
  - npm run test:browser
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - ./scripts/verify-course-delivery.sh
  - git diff --check
  focused_tests_to_add:
  - Independent full mechanisms, live assessment bindings, exact unchanged source/course preservation, singular
    and off-grid inputs, capstone stage/requirement evidence.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; named local gates remain required except baked Docker delivery explicitly deferred by the owner for this content-only merge.
risk:
  class: high
  hazards:
  - Copied reference equations masking incorrect physics.
  - Misleading dimensions, unavailable/singular values or empirical-model claims.
  - Host storage/resource contention disrupting long verification.
  stop_conditions:
  - Need generic runtime/schema/source pin or other course changes.
  - Cannot establish credible numerical/browser evidence.
  - Need physical hardware, learner data or production access.
rollback:
  strategy: Revert the isolated Controls revision to PR61; no schema or learner-data migration.
evidence:
  output:
  - docs/evidence/ELP-GNC-AGGREGATE-QUALITY-01-2026-11-03.md
  - docs/course-quality/gnc-aggregate-review.json
  - courses/controls-gnc/assessment-map.json
  claim_boundary: Authored curriculum and independently verified synthetic software only; host and baked-container
    levels are separate. No learner, MATLAB, hardware or production claim.
