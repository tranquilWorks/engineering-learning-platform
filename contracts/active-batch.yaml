risk:
  class: high
  hazards:
    - a shared vehicle template substitutes for eight distinct governing or computational models
    - byte order, time alignment, angle units, regression conditioning, racing-line feasibility, braking constraints, paired comparisons, or digital-twin interfaces are subtly wrong
    - synthetic data is mislabeled as a real drive, measured vehicle evidence, source behavior, or physical GR86 validation
    - an independent oracle imports or derives from production behavior
    - invalid setups yield plausible finite plots instead of explicit broken/recovery verdicts
  stop_conditions:
    - exact target, control, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code/output or a perturbed production value
    - work requires source mutation, fixture mutation, generic runtime/UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only Vehicle Dynamics P17-P24, their independent reference/tests/evidence, and their ledger/documentation transitions while retaining P01-P16.
evidence:
  output:
    - docs/evidence/ELP-VEHICLE-P17-P24-2026-09-24.md
    - one P17-P24 row per work item with governing relation, provenance, scenarios, teaching invariant, tolerance, axes/units, limitation, and residual risk
    - focused, retained-course, contract, quick, full, deterministic catalog, lint, diff, scope, and source-cleanliness results
    - one target squash merge, exact resulting commit/tree, and explicit unperformed evidence
  claim_boundary: This batch implements and independently verifies eight deterministic software-only Vehicle Dynamics lessons. P17-P24 are Python-first native designs derived from source identities and reviewed competencies. P20 uses synthetic offline data despite its retained source title, and P24 is a software-only baseline integration rather than physical GR86 validation. No MATLAB runtime comparison, browser/accessibility or learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, or production use is implied.
