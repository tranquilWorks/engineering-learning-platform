schema_version: 1
batch:
  id: ELP-G-ONBOARDING-HOLD
  title: Hold implementation during Portfolio Control onboarding
  goal: Formally close the local B000 implementation authority and prevent target work until the separately reviewed Portfolio Control plan, managed harness, pointer, and post-harness baseline gate are complete.
sources:
  requirements:
    - docs/PORTFOLIO_CONTROL.md
    - docs/evidence/B000-2026-08-13.md
  baseline_commit: 940350eaed93aef00fc3cb58c9abbc78599b0735
  baseline_role: audited_seed_provenance_only
scope:
  allowed_paths:
    - __read_only_no_target_writes__
  forbidden_paths:
    - apps/**
    - courses/**
    - packages/**
    - scripts/**
    - docs/**
    - contracts/**
    - .github/**
    - .codex/**
    - .agents/**
    - AGENTS.md
    - README.md
    - package.json
    - package-lock.json
    - Makefile
    - Dockerfile
    - compose.yaml
    - .dockerignore
    - .gitignore
    - .env.example
acceptance:
  - B000 source and retained evidence remain immutable history; this hold does not claim its previously unperformed frontend, container, browser, accessibility, corporate, MATLAB, physical, release, deployment, or production validation.
  - No target path is writable and no target-owned implementation or validation command is authorized by this hold.
  - Human review is required for this governance transition and for the later Portfolio Control planning, managed-harness, and pointer changes.
  - The control-owned post-harness baseline verifier must pass before a fresh implementation contract may be materialized against the then-current exact clean target main.
validation:
  local:
    - git diff --check HEAD^
    - git status --short --branch
risk:
  class: blocking
  hazards:
    - the superseded B000 contract is treated as continuing implementation authority
    - a governance hold is mistaken for product, environment, or release evidence
  stop_conditions:
    - any product source, course, harness, implementation, dependency, credential, release, deployment, production, MATLAB, or physical action is requested
    - any successor is proposed before the exact merged control and target baselines are independently attested
rollback:
  strategy: Revert this governance-only PR under human review only if onboarding is abandoned; do not restore B000 as active implementation authority without a separately reviewed contract.
evidence:
  output:
    - human-reviewed governance-transition PR identity and exact target revision
  claim_boundary: This contract only removes stale target implementation authority during onboarding. It proves no platform behavior, environment capability, content right, release readiness, deployment, production state, MATLAB equivalence, or physical/operational result.
