acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main 8e5ff391f75f39218e51ed98aac8bcdb092550a0, tree bebb8579d33090a64201a7f2c8c4ad86595ada02; any target, control, source, map, fixture, index, or worktree drift stops implementation.
  - Advance only the read-only courses/vehicle-dynamics-learning gitlink from 916c3e6a9cbbc9e1c4ede821e894132b13c3b9c8 to exact source commit 57264b3ffeb517ee5eb73e8957b9cd190d022457, tree d9e7267ba02c8d3d836c0ae481b80e91233eb81a, and retain its exact 150-file source map and aggregate digest. Do not edit source repository bytes.
  - Mirror the reviewed 67-module control-plane competency map byte-for-byte at SHA-256 87dae868d7e3a0181062a4fd42ff316513b0f6f35c053cb56b5d73b9c56bde6d and validate its schema, count derivation, graph/reference closure, ordered eight-batch partition, assessment references, and two capstones.
  - Install a platform-owned Vehicle Dynamics course shell and exact P01-P24 conversion records with total=24, converted=0, remaining=24, blocked=0, placeholder=0. Record P01 and P02 as implemented in the pinned source and P03-P24 as source scaffolds without converting, deepening, or authoring any module.
  - Install the exact deterministic synthetic GR86 CAN and RaceChrono BLE fixture set. Prove 309 CAN records map one-to-one and byte-exactly to 309 BLE notifications, independently decode documented signals with separately formulated equations, and deterministically diagnose the declared drop, duplicate, reorder, and truncation faults.
  - Preserve the fixture claim boundary: synthetic protocol fixture, measured_vehicle_data=false, no VIN, driver, real location, precise route, or vehicle capture. Record exact telemetry repository/file provenance without claiming execution on firmware, BLE radio, bench, vehicle, track, physical HIL, or measured hardware.
  - Preserve all 223 existing modules and interactive experiments byte-identically. The prep catalog is exactly six courses, 223 modules, and 223 interactive modules; Vehicle Dynamics remains empty and unavailable as a completed curriculum until a separate first-batch authorization merges.
  - Update only the generic gitlink expectation needed for the authorized Vehicle Dynamics source-pin advance and the retained GNC/Robotics catalog course-count assertions from five to six. Preserve every other source gitlink, completed course, module, executable, generic platform behavior, dependency, workflow, and deployment artifact byte-identically.
  - Do not implement P01-P08 or any lesson in this batch. A separate exact-baseline control contract is required before the first coherent batch begins.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, physical HIL/hardware, firmware/radio execution, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
