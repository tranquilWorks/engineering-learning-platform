acceptance:
  - Start only after the exact control commit containing this contract is merged. Use exact clean target main d7486da7a0207cebcee17de2825879495bce66d8, tree f700ddc5fbb9b392a06db7a818d84e7406ac3492; any target, source, map, fixture, index, or worktree drift stops implementation.
  - Implement exactly reviewed-map P34-P43 in order: derive the dynamic bicycle state model; analyze yaw and sideslip frequency response; measure understeer gradient and characteristic speed; test nonlinear limit handling and stability; partition lateral load transfer; couple heave, pitch, and roll modes; predict road-input ride transmissibility; shape digressive damper force-velocity response; trace suspension kinematics and compliance; evaluate anti-dive and anti-squat geometry.
  - Preserve the source-bound P01-P24 inventory and P25-P33 tire-depth batch, source identities, titles, guiding questions, prerequisite order, read-only gitlink, reviewed competency map, source map, fixtures, conversion manifest, coverage ledger, source-bound reference, and native-design schema byte-identically. P34-P43 are competency-derived Python-first native designs and claim neither source implementation nor MATLAB-runtime equivalence.
  - Treat all ten IDs as separately reviewed work items. Every module must include a complete learner lesson, unique bounded executable model, default baseline, two useful one-variable sweeps, one named broken behavior, exact recovery, limiting cases, coordinate and sign conventions, physical quantities and units, common mistakes, formative checks, and teach-back completion.
  - Use the course-owned independent reference implementation, extended without importing a production experiment, consuming a production result, or perturbing a production value. Retain origin, inputs, fields and units, tolerances, and finite expected versus actual evidence for baseline, sweep_1, sweep_2, broken, and recovery.
  - P34 must formulate the linear dynamic bicycle beta/yaw-rate state equations from mass, yaw inertia, axle distances, speed, and axle cornering stiffness; expose the state matrix, steady response, eigenvalue stability, and force/moment residuals; its broken case must expose a force-sign or angle-unit defect.
  - P35 must compute bounded complex frequency response of yaw rate and sideslip to steering from the P34 state-space model; expose DC gains, bandwidth or peak, phase, and complex-equation residual; its broken case must expose hertz-versus-radian-frequency misuse or an omitted dynamic term.
  - P36 must derive understeer gradient from axle loads and cornering stiffness, distinguish understeer, neutral steer, and oversteer, compute characteristic speed only in its valid domain, and retain steer-versus-lateral-acceleration evidence; its broken case must expose stiffness/load placement or unit misuse.
  - P37 must couple nonlinear bounded axle tire forces to lateral/yaw equilibrium, expose front and rear utilization, yaw-moment or equilibrium residual, a stability slope or margin, and a recoverable limit-handling verdict; its broken case must extend an uncapped linear force or otherwise violate the tire-capacity boundary.
  - P38 must partition total lateral load transfer into geometric and elastic front/rear contributions with explicit track, center-of-gravity and roll-center geometry, roll stiffness distribution, exact closure, and tire-load-sensitivity consequence; its broken case must omit or double-count a transfer path.
  - P39 must assemble and solve a bounded coupled heave/pitch/roll mass and stiffness eigenproblem, expose natural frequencies, modal participation or orthogonality, and eigen-equation residual; its broken case must erase physical coupling or misuse inertia/angle units.
  - P40 must map bounded road spatial frequency and speed to temporal excitation, evaluate sprung-mass transmissibility and acceleration near and away from resonance, and expose equation and limiting-case checks; its broken case must confuse hertz with radians per second or omit base-motion forcing.
  - P41 must implement a continuous odd-symmetric digressive damper force-velocity law, expose low- and high-speed slopes, knee behavior, bounded cyclic dissipated energy, and symmetry/continuity residuals; its broken case must expose a velocity-unit or asymmetric-law defect.
  - P42 must combine bounded suspension bump kinematics and lateral-force compliance for camber, toe, and motion or wheel-rate response with explicit millimeter, meter, degree, and force boundaries; its broken case must expose a millimeter-versus-meter or sign-convention defect.
  - P43 must derive anti-dive and anti-squat percentages from bounded side-view geometry and force lines, partition pitch load transfer into suspension and spring-supported paths, expose moment closure, and keep geometry within a stated non-lifting validity range; its broken case must expose angle-unit or double-counting behavior.
  - Validate inputs before allocation; cap samples, frequency grids, eigenproblems, searches, and integration horizons; return finite deterministic Plotly-compatible results; perform no network, source write, subprocess, dynamic install or import, eval, learner-code execution, wall-clock dependence, or shared mutable state.
  - Update the competency expansion ledger to declare 24 source-bound modules, all 67 reviewed planned modules, exactly P25-P43 implemented natively, and P44-P67 pending. Keep source-bound conversion and coverage totals at total=24, converted=24, pending=0, blocked=0, placeholder=0.
  - End with exactly six courses, 266 modules, and 266 interactive modules. Update only retained catalog-total assertions needed for this authorized ten-module increase; preserve every completed course and source gitlink byte-identically.
  - Record exact local verification. Hosted CI is not a completion gate by owner direction; keep MATLAB comparison, browser/accessibility, learner validation, measured vehicle data, firmware/radio/bench/vehicle/track execution, physical HIL/hardware, certification, release, deployment, credentials/settings, and production evidence explicitly unperformed.
