    - Extend the item-filterable suite through P24, exercising every module's defaults, two sweeps, broken/recovery behavior, independent oracle comparisons, invalid/resource inputs, finite deterministic serialization, stable result references, lessons, records, content digests, and catalog visibility.
    - Prove the final catalog exposes and executes Robotics P01-P24 plus the retained 110 modules, with no skips, xfails, count waivers, source writes, or generic runtime/schema changes.
  required_ci:
