    - .agents/skills/engineering-learning-platform-delivery/SKILL.md
    - apps/api/src/elp_api/catalog.py
    - apps/api/src/elp_api/main.py
    - apps/api/src/elp_api/models.py
    - apps/api/src/elp_api/runtime.py
    - apps/api/src/elp_api/serialization.py
    - apps/api/tests/**
    - apps/web/src/**
    - contracts/active-batch.yaml
    - contracts/verification.yaml
    - docs/ARCHITECTURE.md
    - docs/COMPONENT_MODEL.md
    - docs/COURSE_AUTHORING.md
    - docs/CURRENT_STATE.md
    - docs/HANDOFF.md
    - docs/ROADMAP.md
    - docs/SECURITY.md
