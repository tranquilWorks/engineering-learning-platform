  focused_tests_to_add:
    - Validate exact P17-P24 membership, prerequisite closure, scaffold provenance, coverage transition, content digests, and absence of later modules.
    - Execute baseline, two one-variable sweeps, broken, recovery, invalid-input, resource-bound, finite, deterministic, axis/unit, and evidence-independence checks for every new module.
    - Assert topic-specific equations, frames, timestamp and unit conventions, teaching invariants, limiting cases, physical boundaries, formative checks, and exact recovery.
    - Compare P17-P24 against analytic, invariant, or separately formulated numerical references without relabeling source scaffolds as executed designs.
    - Validate the six-course, 247-module, 247-interactive catalog and regress every retained course.
