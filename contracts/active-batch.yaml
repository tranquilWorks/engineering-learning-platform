  caliber/competency and cumulative-assessment review. Issue441 remains open. Catalog remains6courses/290modules/290interactive;
  no arbitrary inventory expansion.
- All mandatory local focused DSP,backend,contract,quick/full,deterministic catalog,lint,frontend typecheck/build,service
