risk:
  class: high
  hazards:
    - a shared telemetry template substitutes for eight distinct governing or computational models
    - byte order, scaling, BLE framing, timestamp units, interpolation gaps, axis signs, yaw units, estimator correction, split leakage, covariance conditioning, or recovery accounting is subtly wrong
    - immutable synthetic protocol observations are mislabeled as measured drive or vehicle evidence
    - an independent oracle imports or derives from production behavior
    - corrupt or invalid inputs yield plausible finite plots instead of explicit diagnosis and recovery verdicts
  stop_conditions:
    - exact target, source, map, fixture, index, or worktree identity drifts
    - an independent reference needs production code, production output, or a perturbed production value
    - work requires prior-module mutation, source-bound ledger mutation, source or fixture mutation, generic runtime or UI changes, a dependency, network access, or unsupported evidence
    - any focused, retained-course, contract, quick, full, deterministic, lint, scope, or source-cleanliness gate fails or is skipped
rollback:
  strategy: Before merge, close the isolated target pull request. After merge, revert its one squash commit; this removes only the Vehicle Dynamics P53-P60 native telemetry expansion, independent reference additions, tests, evidence, and ledger transition while retaining P01-P52.
