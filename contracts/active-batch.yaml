acceptance:
  - The implementation branch starts from exact origin/main; audited baseline 60c1b68797743616d08eb1ad34ee96f98d3bc36a remains its ancestor and every committed intervening change is a merged governed harness synchronization limited to managed harness files. Before product edits the only uncommitted paths are runner-owned `contracts/active-batch.yaml` and `contracts/repo-profile.yaml` overlays whose contents bind the exact human-merged control revision containing DR-001 and this batch; that control revision is proven against fetched control origin/main rather than an unrelated stale local checkout. Product scope and cleanliness checks exclude only those exact activation overlays.
  - CourseManifest and ModuleManifest require the integer schema_version value 1 rather than defaulting it; missing, boolean, string, zero, negative, older, and future versions fail closed with stable file- and version-aware diagnostics.
  - Unknown structural fields fail at every typed course/module, runtime, control, lesson-block, widget-property, request, and result-envelope boundary. Markdown/text bodies and explicitly documented Plotly-compatible payload values remain content carriers, but do not permit unknown surrounding structure, undeclared renderer/control types, missing units/labels where required, or dangling plot/table/result references.
  - The accepted renderer vocabulary remains generic and subject-independent. Course fixtures may demonstrate requirements but no DSP, radar, controls, RF, MATLAB, or other course-specific equation or semantic branch is added to platform models, API, or React components.
  - Catalog validation computes a deterministic content digest from the exact validated course/module contract inputs, reports source Git commit identity when available, explicitly reports its absence for non-Git mounts, and exposes content, schema, and platform/runtime identities through API documents, run results, and learner-visible diagnostics.
  - Schema and TypeScript derivatives are generated from the accepted executable contract in one deterministic command, committed, and checked for drift. They carry no independent compatibility promise and represent exactly the current platform contract.
  - Semantic validation rejects duplicate identities, invalid conditional-control references, path escape, undeclared widgets, and missing referenced plot/table/result outputs with stable diagnostics before a course integration is accepted.
  - No path under courses/ or any mounted/sibling course repository changes. Validation uses synthetic or existing read-only fixtures; any later dsp-radar-learning or other course retrofit requires its own course-owned branch, CI, review, and release decision.
  - Git pin/revert fixtures demonstrate recovery to the last reviewed platform/course pair. No in-place source mutation, historical reader, compatibility window, database migration, quarantine service, release, deployment, or production mechanism is introduced or claimed.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - git diff --check
  focused_tests_to_add:
    - Exact version-one acceptance plus missing, boolean, string, zero, negative, older, and future schema-version rejection for course and module manifests.
    - Unknown top-level and nested structural field rejection alongside accepted Markdown/text and documented Plotly payload content-carrier fixtures.
    - Semantic fixtures for duplicate IDs, conditional-control references, path containment, widget properties, units/labels, and declared plot/table/result references.
    - Deterministic content digest, Git-backed revision, non-Git revision absence, runtime revision propagation, stable reload, and learner/API diagnostic tests.
    - Generated JSON Schema and TypeScript byte-for-byte repeatability and drift rejection.
    - Read-only source-course immutability plus Git pin/revert recovery fixtures.
  required_ci:
    - Existing GitHub Actions verification must run the repository-local full profile on the exact target PR commit with no course-source writes, credentials, service deployment, or production access.
    - The target PR may merge only after exact-scope review, focused strict-contract/revision tests, full deterministic verification, generated-artifact drift checks, and the retained evidence record pass.
  manual:
    - A human reviews the target diff for generic platform behavior, exact DR-001 semantics, free-form content boundaries, course-repository immutability, and absence of subject-specific logic before merge.
    - No course conversion, MATLAB comparison, browser universality, release, deployment, or production validation is authorized or required by this batch.
risk:
  class: high
  hazards:
    - a defaulted or loosely coerced schema version silently accepts malformed or future content
    - a free-form content carrier leaks openness into renderer/control structure and causes a broken or misleading lesson page
    - revision identity omits a validated input or changes nondeterministically across identical content
    - a course-specific requirement becomes hard-coded platform behavior rather than an explicit generic primitive
    - generated Python, JSON Schema, TypeScript, API, and UI contracts drift
    - validation or generation writes a canonical course repository
  stop_conditions:
    - target HEAD is not exact origin/main before product edits, audited baseline 60c1b68797743616d08eb1ad34ee96f98d3bc36a is not its ancestor, a committed intervening change is not a merged governed harness synchronization or includes a non-managed path, the worktree contains any pre-implementation change outside the exact runner-owned active-contract/profile overlays, or the branch is diverged
    - the runner-owned active contract and managed profile do not both bind the exact merged control revision containing DR-001 and this contract, that revision is not an ancestor of fetched control origin/main, or validation relies on an unrelated stale local control checkout
    - implementation requires a field, renderer, widget, runtime, or content semantic not approved by DR-001 and the current generic contract
    - completing the batch requires changing any course path, mounted/sibling course repository, dependency manifest/lockfile, workflow, managed harness identity, deployment file, credential, or production system
    - strict schema, semantic-reference, generated-drift, revision-identity, read-only-source, Git recovery, quick, or full verification cannot pass
rollback:
  strategy: Revert the single ELP-B010-01 target change or pin the platform to its last reviewed governed harness revision and each course to its last reviewed course revision. Preserve audited pre-activation anchor 60c1b68797743616d08eb1ad34ee96f98d3bc36a. This batch performs no in-place course/data migration and needs no bespoke runtime rollback service.
  data_migration: none
  course_repository_write: none
  release_action: none
evidence:
  output:
    - docs/evidence/ELP-B010-01-<date>.md
    - exact target baseline, target candidate, merged control activation, platform/runtime revision, and fixture course Git/content identities
    - focused strict-version, unknown-structure, explicit-content-carrier, semantic-reference, generated-drift, revision-identity, read-only-source, and Git recovery results
    - contract, quick, full, and git diff --check commands with exit results
    - changed and preserved invariants, acceptance mapping, residual risks, and all unperformed validation
  claim_boundary: Repository-static and hosted-CI evidence for the exact DR-001 software contract only. It does not establish compatibility with uninspected or historical courses, a completed dsp-radar-learning conversion, MATLAB equivalence, learner effectiveness, accessibility universality, security accreditation, hardware/HIL/bench/field/real-time behavior, release, deployment, production, or permission to mutate any course repository.
