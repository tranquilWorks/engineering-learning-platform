acceptance:
- Activate only after this control contract merges, from target PR58 merge 607c716993be14e7b782897ab054a7f8478f5dc0,
  tree fb4226161d8df721b42f28f1ed2913310b76a9b0. Repair exactly existing Vehicle P01-P12. Preserve 290 identities,
  all source pins and prerequisite/competency graph, all unselected module bytes and P13-P24 reference definitions
  and retained outputs; preserve every earlier course repair.
- Replace generic SI signature charts with actual physical relationships and consistently dimensioned traces.
  Every trace declares its quantity/unit and every axis names its variable/unit. Keep unlike quantities separate;
  show status or explicit unavailable semantics at singular/invalid cases rather than invent finite physical
  results. Preserve the four existing output identifiers and controls/ranges; improve labels and accurately
  narrow titles where necessary.
- 'P01: plot the actual constant-curvature path and check yaw=V*kappa and ay=V*yaw. Distinguish demanded kinematics
  from grip-feasible motion. Replace the arbitrary lateral-acceleration multiplier with a declared actual modeling
  fault such as bypassing steering ratio. Preserve the correct nominal relation and show zero-steer/sign/speed
  limits.'
- 'P02: expose applied traction, rolling resistance, drag and net acceleration with Newton balance. Existing
  0..9000 N requests never reach the declared traction limit, so replace the inert saturation-bypass fault
  with an executed omission of road loads. Explain the constant rolling-resistance low-speed approximation,
  including zero speed; do not claim stopped-vehicle dynamics.'
- 'P03: show axle normal loads and longitudinal moment balance, including load sum, acceleration-sign reversal
  and wheel-lift limits. An injected CG/load-distribution error must have a measured balance residual; do not
  label negative contact loads physically achievable.'
- 'P04-P06: execute radial friction-circle projection and signed saturating longitudinal/lateral tire laws.
  Show force-plane geometry and force-slip curves with explicit conventions. Check zero slip, odd symmetry,
  initial slope, force capacity, projection direction and limit cases. Faults alter the actual projection or
  sign convention; zero excitation may make a fault benign.'
- 'P07: correct the inconsistent speed factors in the steady bicycle equations. Compute sideslip, yaw, both
  axle slips and forces; directly verify Fy_front+Fy_rear=m*V*r and lf*Fy_front-lr*Fy_rear=0. Use a separately
  derived reference, preferably solving force/moment balance before tire compatibility. A fault may reproduce
  the old inconsistent equations with explicit residuals; preserve selected steering/speed, and distinguish
  small-angle validity from equilibrium correctness.'
- 'P08: show understeer coefficient and the actual speed-dependent steering relation with units; distinguish
  understeer, neutral steer, oversteer and the critical-speed boundary. Do not present zero as a physical critical
  speed for understeer. Replace a default-benign mode flag with an executed omission of the tire-compliance
  term, retaining genuinely benign neutral limits and honest near-singular/unstable interpretation.'
- 'P09: derive wheel rate from the stated displacement motion ratio and virtual work; verify static deflection,
  ride frequency and ratio-squared scaling. Compare an executed single-ratio fault using the same controls.'
- 'P10: render a true bounded second-order transient from its ODE/state transition. Cover underdamped, critical,
  overdamped and negative-damping behavior; correctly label pole/time-scale approximations and unavailable
  settling rather than claiming a universal four-over-zeta-omega settling time. Independently verify response
  and dynamics across regimes.'
- 'P11: show roll angle, axle transfer and moment closure from physical roll stiffness. Handle singular/negative
  effective stiffness honestly or use a nonsingular but measurable omission fault. Check total moment, load-transfer
  convention and stiffness-distribution limits; do not silently return zero angle as a solution of a singular
  balance.'
- 'P12: bound the lesson to the executed camber-thrust/toe-scrub model, with angle conversion, force and power
  units, sign conventions, zero-angle limits and a real degree/radian fault. Do not imply full suspension kinematics
  from a linear empirical thrust approximation.'
- Author twelve substantial lesson-specific portable explanations and embedded Course checkpoints with equations/units,
  worked calculations, predictions, two one-variable sweeps, causal fault/recovery, limits and reasoning rubrics.
  Avoid repeated generic prose. Match live explanations and chart interpretation to selected controls. Preserve
  inventory and graph; original conversion/source evidence stays historical rather than implying unchanged
  source equivalence for revised native faults.
- Retain five independently formulated cases per lesson at the existing 1e-10 absolute/relative tolerance and
  three-second runtime. Expected evidence must never import production or consume its output; compare full
  mechanisms/arrays and independent physical identities beyond scalar signatures. Run all 96 runtime-control
  corners, including zero/critical/degenerate limits where appropriate. Update only selected expected/actual/verification
  evidence and selected coverage records/digests; original source pins, mappings, fixtures and unselected coverage
  fields remain unchanged.
- Anchor the preceding Robotics perception scope/reference preservation guards to their exact historical PR57-to-PR58
  trees while preserving all live numerical and prior prose-preservation checks. Add current-baseline Vehicle
  preservation guards. Update only obsolete selected assertions and active-contract bindings; no tolerance,
  runtime or source-protection weakening.
- Close the twelve selected findings only after independent and selected baked browser checks pass. Final read-only
  nonroot delivery verifies 290 HTTP modules, 580 desktop/mobile pages, all existing plus twelve checkpoints,
  all revised control/fault/recovery/reset and drawn-plot sequences, actual SVG text/legend layout checks,
  290 matching host/baked identities and sixty independent HTTP comparisons. Inspect lesson plot grids on mobile
  and representative desktop pages. Then run mandatory contract, quick and full gates sequentially. Hosted
  CI remains separately reported/nonmandatory.
- 'After verified closure retain four named findings: Controls 0, Robotics 0, Vehicle 4 (P13-P16). All three
  non-DSP aggregate numerical/curriculum/capstone reassessments remain blocked, including zero-finding courses.
  Preserve DSP aggregate disposition. No representative-learner, manual-screen-reader, MATLAB, measured vehicle,
  hardware, concurrent-capacity or production claims.'
- Publish exact evidence and complete a normal exact-head development merge under standing owner authorization,
  then reconcile Portfolio Control. Continue the already-authorized P13-P16 group only after this verified
  merge and a fresh exact-baseline successor contract. Do not expand inventory or activate aggregate acceptance.
  Preserve hosted/local discrepancies and account limits without changing workflows, protections or billing.
validation:
  local:
  - PYTHONPATH=apps/api/src .venv/bin/python -m pytest -q apps/api/tests/test_vehicle_foundations_quality.py
    apps/api/tests/test_vehicle_dynamics_course.py
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/verify-vehicle-foundations-quality.py
  - npm run typecheck
  - npm run build
  - npm run test:web
  - npm run test:browser
  - PYTHONPATH=apps/api/src .venv/bin/python scripts/audit_course_quality.py
  - ./scripts/verify-course-delivery.sh
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - ./scripts/agent-verify.sh full
  - git diff --check
  focused_tests_to_add:
  - Independent solutions, full dimensional curves and physical invariants for each lesson.
  - All 96 runtime corners; zero-slip/steering, force/moment balance, grip, critical and damping regimes.
  - Exact unselected preservation, twelve embedded checkpoints and real readable browser plots.
  required_ci:
  - Hosted CI nonmandatory under retained owner direction; all named local gates mandatory.
risk:
  class: high
  hazards:
  - Copied reference equations masking incorrect physics.
  - Misleading dimensions, unavailable/singular values or empirical-model claims.
  - Host storage/resource contention disrupting long verification.
  stop_conditions:
  - Need to change source pins, public schemas, generic runtime or unrelated lesson payloads.
  - Independent numerical or browser/container validation cannot be made credible.
  - Need learner personal data, actual vehicle/hardware or production access.
rollback:
  strategy: Revert this isolated group to target PR58 merge and rebuild the prior image; no schema or persisted-data
    migration.
evidence:
